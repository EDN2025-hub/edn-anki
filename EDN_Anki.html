        stem:"Un homme de 62 ans est traité par amikacine IV en association à la pipéracilline-tazobactam pour une pneumonie sévère à bacille Gram négatif documentée. Son DFG de base est à 72 mL/min. L'interne vous demande quels éléments de surveillance sont nécessaires pendant ce traitement. Parmi les propositions suivantes concernant la surveillance d'un patient sous aminoside, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La créatinine et la clairance rénale doivent être dosées régulièrement"},{id:"B",text:"Le dosage de la concentration résiduelle plasmatique est indiqué pour évaluer le risque de toxicité"},{id:"C",text:"Les signes vestibulaires (vertiges, instabilité à la marche) doivent être recherchés"},{id:"D",text:"L'association aux AINS ou à la ciclosporine majore le risque de néphrotoxicité"},{id:"E",text:"Un audiogramme de contrôle est recommandé en cas de traitement prolongé ou d'antécédent de surdité"}],
        correct:["A","B","C","D","E"],
        explanations:{
          A:{v:true,t:"VRAI. La néphrotoxicité tubulaire est la principale toxicité organique réversible des aminosides. La créatinine et la clairance rénale doivent être surveillées régulièrement (toutes les 48-72 heures en pratique selon la durée du traitement). Une élévation de la créatinine impose une réévaluation posologique immédiate ou l'arrêt selon l'évolution."},
          B:{v:true,t:"VRAI. Le dosage de la concentration résiduelle (creux) guide le risque de toxicité rénale et permet d'espacer les doses si nécessaire. Chez ce patient avec DFG à 72 mL/min, la clairance rénale est déjà modérément réduite, rendant ce dosage d'autant plus important pour éviter l'accumulation."},
          C:{v:true,t:"VRAI. Les signes vestibulaires (vertiges, instabilité, nausées positionnelles) doivent être activement recherchés car la toxicité cochléovestibulaire des aminosides est IRRÉVERSIBLE. La détection précoce de signes vestibulaires doit conduire à une réévaluation du rapport bénéfice/risque. L'atteinte peut être cochléaire (surdité) et/ou vestibulaire."},
          D:{v:true,t:"VRAI. Les AINS, la ciclosporine, la vancomycine et les produits de contraste iodés sont listés parmi les médicaments dont l'association aux aminosides majore le risque de néphrotoxicité. Cette interaction impose soit de suspendre le médicament néphrotoxique associé, soit d'intensifier la surveillance rénale si l'association est inévitable."},
          E:{v:true,t:"VRAI. Un audiogramme de contrôle est recommandé en cas de traitement prolongé (> 5 à 7 jours) ou chez les patients ayant un antécédent de surdité préexistante. La toxicité cochléaire débute dans les fréquences aiguës (4 000-8 000 Hz) avant d'affecter les fréquences conversationnelles — seul l'audiogramme permet une détection précoce. ATTENTION : toutes les propositions de cette question sont VRAIES — ne pas en omettre une par réflexe de méfiance."}
        }
      }
    ]
  }

  {
    id:"151",label:"Item 151",title:"Méningites / Méningoencéphalites / Abcès cérébral",subtitle:"Adulte, enfant, nouveau-né",
    questions:[
      {
        id:"151-dp01",type:"QCU",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.",
        stem:"Quel germe évoquez-vous en priorité devant ce tableau de rhombencéphalite chez un patient immunodéprimé ?",
        choices:[{id:"A",text:"Neisseria meningitidis"},{id:"B",text:"Streptococcus pneumoniae"},{id:"C",text:"Listeria monocytogenes"},{id:"D",text:"Haemophilus influenzae"},{id:"E",text:"Herpes simplex virus 1"}],
        correct:["C"],
        explanations:{A:{v:false,t:"FAUX. Neisseria meningitidis donne habituellement un début brutal, chez un sujet jeune sans terrain particulier, avec purpura possible. Ici début progressif sur 4 jours, immunodéprimé, atteinte du tronc cérébral — pas le profil d'un méningocoque."},B:{v:false,t:"FAUX. Le pneumocoque provoque un syndrome méningé d'installation brutale avec signes de localisation fréquents, mais l'atteinte isolée du tronc cérébral (diplopie, dysphagie, ataxie = rhombencéphalite) est caractéristique de Listeria, non du pneumocoque."},C:{v:true,t:"VRAI. Listeria monocytogenes est le diagnostic évident ici. Trois arguments concordants : 1) Terrain à risque — immunodéprimé sous méthotrexate, âge 66 ans > 50 ans. 2) Début progressif sur 4 jours (vs brutal pour méningocoque/pneumocoque). 3) Rhombencéphalite — atteinte du tronc cérébral avec paires crâniennes (VI = diplopie horizontale, IX-X = dysphagie), ataxie cérébelleuse. Ce tableau de rhombencéphalite chez un immunodéprimé doit faire évoquer Listeria en priorité absolue."},D:{v:false,t:"FAUX. Haemophilus influenzae est rare chez l'adulte vacciné et ne donne pas ce tableau de rhombencéphalite. Il touche préférentiellement les nourrissons non vaccinés ou les adultes aspléni."},E:{v:false,t:"FAUX. HSV1 provoque une méningo-encéphalite à localisation temporale (hallucinations olfactives, troubles mnésiques, syndrome frontal/temporal) — pas une rhombencéphalite. Le LCS serait lymphocytaire normoglycorrachique, non panaché comme ici."}}
      },
      {
        id:"151-dp02",type:"QCU",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.",
        stem:"Concernant la réalisation de la ponction lombaire chez ce patient, quelle proposition est correcte ?",
        choices:[{id:"A",text:"La PL peut être réalisée immédiatement car le Glasgow est supérieur à 12"},{id:"B",text:"La PL est définitivement contre-indiquée en raison des signes de souffrance du tronc cérébral"},{id:"C",text:"Le scanner cérébral doit précéder la PL, mais l'antibiothérapie doit être débutée immédiatement sans attendre aucun résultat"},{id:"D",text:"Il faut attendre les résultats du scanner cérébral avant de débuter tout traitement antibiotique"},{id:"E",text:"La PL est contre-indiquée en raison du traitement par méthotrexate"}],
        correct:["C"],
        explanations:{A:{v:false,t:"FAUX. Le Glasgow à 13 n'est pas la seule CI neurologique à la PL. La LiSA liste explicitement les signes de souffrance du tronc cérébral parmi les CI. Ce patient présente une diplopie (VI), une dysphagie et une ataxie — signes clairs de souffrance du tronc cérébral. Un scanner cérébral doit précéder la PL."},B:{v:false,t:"FAUX. La CI n'est pas définitive. La PL doit être réalisée dès que la CI neurologique est levée — après le scanner si normal. Le but est d'obtenir un diagnostic microbiologique qui guidera le traitement."},C:{v:true,t:"VRAI. C'est la séquence correcte face à une CI neurologique à la PL. Règle LiSA : 1) Hémocultures immédiates. 2) Dexaméthasone + antibiothérapie IMMÉDIATEMENT sans attendre scanner ni PL. 3) Scanner cérébral. 4) PL dès que la CI est levée. Ne jamais retarder l'antibiothérapie pour attendre les examens — chaque heure sans ATB aggrave le pronostic."},D:{v:false,t:"FAUX. Erreur thérapeutique grave. Retarder l'antibiothérapie pour attendre les résultats d'imagerie est formellement interdit. L'ATB doit être débutée immédiatement après les hémocultures, parallèlement au scanner."},E:{v:false,t:"FAUX. Le méthotrexate n'est pas une contre-indication à la PL. Les CI sont : instabilité hémodynamique, troubles de l'hémostase, infection au site de ponction, signe de focalisation, Glasgow < 12, signes de souffrance du tronc cérébral, état de mal convulsif, signes d'engagement cérébral."}}
      },
      {
        id:"151-dp03",type:"QRM",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.\n\nLe scanner cérébral est normal. La ponction lombaire est immédiatement réalisée : aspect trouble, leucocytes 340/mm³ (65% polynucléaires, 35% lymphocytes), protéinorachie 2,1 g/L, glycorachie 1,6 mmol/L pour une glycémie simultanée à 7,2 mmol/L. Examen direct : bacille à Gram positif.",
        stem:"Quelles sont les 3 molécules de votre traitement initial ? (trois réponses attendues)",
        choices:[{id:"A",text:"Amoxicilline IV à forte dose"},{id:"B",text:"Gentamicine IV"},{id:"C",text:"Dexaméthasone IV"},{id:"D",text:"Ceftriaxone IV à forte dose"},{id:"E",text:"Vancomycine IV"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. Bacille à Gram positif = Listeria monocytogenes — l'amoxicilline IV est le traitement de référence. C'est le seul antibiotique cité dans la LiSA pour traiter Listeria dans ce contexte. Dose adulte : 200 mg/kg/j en perfusion continue ou 4 fois/j pendant 21 jours minimum."},B:{v:true,t:"VRAI. La gentamicine IV est associée à l'amoxicilline pour son effet synergique bactéricide sur Listeria monocytogenes. Cette association est explicitement recommandée par la LiSA (table OIC-151-16-A) pour les bacilles à Gram positif. Durée d'association : 7 à 14 jours selon les recommandations."},C:{v:true,t:"VRAI. La dexaméthasone est indiquée car l'examen direct est positif. LiSA OIC-151-16-A : dexaméthasone associée à l'ATB si CI à la PL, LCS trouble, ou examen direct positif (CG+ ou CG-). Ici bacille Gram+ = ED positif → dexaméthasone IV avant ou avec la première injection d'ATB."},D:{v:false,t:"FAUX. La ceftriaxone n'est PAS indiquée quand l'examen direct montre un bacille à Gram positif identifiable comme Listeria. La LiSA est précise sur ce point : bacille Gram positif → amoxicilline + gentamicine. Les C3G n'ont pas d'activité clinique sur Listeria monocytogenes."},E:{v:false,t:"FAUX. La vancomycine couvre les bactéries à Gram positif (staphylocoques, entérocoques) mais n'a pas d'indication dans la méningite à Listeria. Son usage ici constituerait un surtraitement sans bénéfice pour Listeria, qui est sensible à l'amoxicilline."}}
      },
      {
        id:"151-dp04",type:"QRM",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.\n\nLe scanner cérébral est normal. La ponction lombaire est immédiatement réalisée : aspect trouble, leucocytes 340/mm³ (65% polynucléaires, 35% lymphocytes), protéinorachie 2,1 g/L, glycorachie 1,6 mmol/L pour une glycémie simultanée à 7,2 mmol/L. Examen direct : bacille à Gram positif.\n\nÀ J2, les cultures du LCS confirment Listeria monocytogenes, sensible à l'amoxicilline. Votre traitement antibiotique est adapté en conséquence.",
        stem:"Parmi les éléments suivants, lesquels constituent des facteurs favorisants de méningite à Listeria chez ce patient ?",
        choices:[{id:"A",text:"Le traitement par méthotrexate"},{id:"B",text:"L'âge de 66 ans"},{id:"C",text:"La polyarthrite rhumatoïde en elle-même, indépendamment du traitement"},{id:"D",text:"Le sexe masculin"},{id:"E",text:"Une hypertension artérielle traitée"}],
        correct:["A","B"],
        explanations:{A:{v:true,t:"VRAI. Le méthotrexate est un immunosuppresseur (inhibition de la prolifération lymphocytaire via la dihydrofolate réductase) qui altère l'immunité cellulaire T, notamment les lymphocytes CD4 essentiels à la défense contre Listeria. L'immunodépression est le principal facteur favorisant de listériose invasive listé par la LiSA."},B:{v:true,t:"VRAI. L'âge supérieur à 50 ans est explicitement listé par la LiSA comme facteur favorisant des méningites à Listeria. Ce seuil justifie l'ajout systématique de l'amoxicilline à la C3G en probabiliste chez tout sujet > 50 ans hospitalisé pour méningite bactérienne."},C:{v:false,t:"FAUX. La polyarthrite rhumatoïde en elle-même ne figure pas dans les facteurs favorisants LiSA pour Listeria. C'est le traitement immunosuppresseur (ici le MTX) qui constitue le facteur de risque, pas la maladie auto-immune per se."},D:{v:false,t:"FAUX. Le sexe masculin n'est pas un facteur favorisant de méningite à Listeria. Les FDR LiSA sont : âge > 50 ans, éthylisme chronique, dénutrition, immunodépression (quelle qu'en soit la cause), grossesse."},E:{v:false,t:"FAUX. L'hypertension artérielle traitée n'est pas un facteur favorisant de listériose. Elle ne modifie pas l'immunité anti-Listeria de façon significative. Seuls les facteurs altérant l'immunité cellulaire constituent de vrais FDR."}}
      },
      {
        id:"151-dp05",type:"QCU",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.\n\nLe scanner cérébral est normal. La ponction lombaire est immédiatement réalisée : aspect trouble, leucocytes 340/mm³ (65% polynucléaires, 35% lymphocytes), protéinorachie 2,1 g/L, glycorachie 1,6 mmol/L pour une glycémie simultanée à 7,2 mmol/L. Examen direct : bacille à Gram positif.\n\nÀ J2, les cultures du LCS confirment Listeria monocytogenes, sensible à l'amoxicilline. Votre traitement antibiotique est adapté en conséquence.\n\nÀ J10, l'évolution est favorable : apyrexie depuis J5, régression franche de la raideur de nuque, amélioration de la diplopie. Le syndrome inflammatoire biologique est en cours de normalisation.",
        stem:"Quel examen est systématiquement indiqué avant la sortie d'hospitalisation dans le cadre de cette méningite bactérienne ?",
        choices:[{id:"A",text:"IRM cérébrale de contrôle"},{id:"B",text:"Audiométrie"},{id:"C",text:"Électroencéphalogramme"},{id:"D",text:"Fond d'œil"},{id:"E",text:"Électromyogramme"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. L'IRM de contrôle n'est pas systématique avant la sortie d'une méningite bactérienne d'évolution favorable. Elle est indiquée en cas de complication suspectée (hydrocéphalie, abcès, empyème, thrombophlébite) ou d'évolution atypique."},B:{v:true,t:"VRAI. L'audiométrie AVANT la sortie d'hospitalisation est une recommandation de rang A après toute méningite bactérienne. La surdité de perception est la complication séquellaire la plus fréquente — par destruction des cellules ciliées de l'oreille interne par l'inflammation méningée. La LiSA précise explicitement : 'ORL = audiométrie AVANT la sortie d'hospitalisation en cas de méningite bactérienne'. Une surdité non détectée peut compromettre la réhabilitation."},C:{v:false,t:"FAUX. L'EEG n'est pas systématique avant la sortie en cas d'évolution favorable. Il est indiqué en cas de suspicion d'encéphalite, de crises convulsives persistantes ou d'épilepsie séquellaire."},D:{v:false,t:"FAUX. Le fond d'œil n'est pas systématique avant la sortie. Il peut être utile en cas d'hypertension intracrânienne suspectée ou de névrite optique, mais ne fait pas partie de la surveillance systématique pré-sortie."},E:{v:false,t:"FAUX. L'électromyogramme n'a pas d'indication systématique dans les suites d'une méningite bactérienne. Une atteinte neuropathique périphérique secondaire à la méningite est exceptionnelle."}}
      },
      {
        id:"151-dp06",type:"QCU",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.\n\nLe scanner cérébral est normal. La ponction lombaire est immédiatement réalisée : aspect trouble, leucocytes 340/mm³ (65% polynucléaires, 35% lymphocytes), protéinorachie 2,1 g/L, glycorachie 1,6 mmol/L pour une glycémie simultanée à 7,2 mmol/L. Examen direct : bacille à Gram positif.\n\nÀ J2, les cultures du LCS confirment Listeria monocytogenes, sensible à l'amoxicilline. Votre traitement antibiotique est adapté en conséquence.\n\nÀ J10, l'évolution est favorable : apyrexie depuis J5, régression franche de la raideur de nuque, amélioration de la diplopie. Le syndrome inflammatoire biologique est en cours de normalisation.\n\nLe diagnostic de méningite à Listeria monocytogenes est définitivement confirmé. Vous souhaitez informer l'entourage du patient des mesures à prendre.",
        stem:"Concernant les mesures de santé publique vis-à-vis de l'entourage, quelle proposition est exacte ?",
        choices:[{id:"A",text:"Une déclaration obligatoire nominative à l'ARS est requise"},{id:"B",text:"Des précautions complémentaires type gouttelettes sont maintenues 24 heures après le début de l'ATB"},{id:"C",text:"Une antibioprophylaxie des contacts rapprochés est indiquée, identique à celle du méningocoque"},{id:"D",text:"Aucune mesure de prophylaxie des contacts ni déclaration obligatoire n'est requise pour Listeria"},{id:"E",text:"Une vaccination des contacts rapprochés contre Listeria est recommandée dans les 10 jours"}],
        correct:["D"],
        explanations:{A:{v:false,t:"FAUX. La listériose est bien une maladie à déclaration obligatoire en France — mais uniquement les cas de listériose invasive (septicémie, méningite) notifiés à l'ARS. Toutefois, la déclaration nominative ne génère pas de mesures de prophylaxie des contacts, contrairement au méningocoque."},B:{v:false,t:"FAUX. Les précautions gouttelettes sont spécifiques au méningocoque (transmission respiratoire par gouttelettes nasopharyngées). Listeria se transmet par voie alimentaire (contamination par des aliments crus : charcuterie, fromages à pâte molle, poissons fumés). Pas de transmission interhumaine directe — pas de précautions gouttelettes."},C:{v:false,t:"FAUX. C'est un piège classique. L'antibioprophylaxie des contacts est réservée au méningocoque invasif, pas à Listeria. Listeria ne se transmet pas d'une personne à l'autre, contrairement au méningocoque. Aucun antibiotique prophylactique n'est recommandé pour les contacts d'un cas de listériose."},D:{v:true,t:"VRAI. Pour Listeria monocytogenes : aucune mesure de prophylaxie des contacts n'est indiquée. La transmission est strictement alimentaire. En revanche, la déclaration obligatoire à l'ARS doit être effectuée (listériose invasive = DO en France), car elle permet une investigation épidémiologique pour identifier une source alimentaire commune. Aucune antibioprophylaxie ni vaccination des contacts."},E:{v:false,t:"FAUX. Il n'existe pas de vaccin contre Listeria monocytogenes disponible en pratique courante. La prévention repose sur les mesures hygiéno-diététiques (éviter les aliments à risque) chez les personnes immunodéprimées et les femmes enceintes."}}
      },
      {
        id:"151-kfp01",type:"QCU",isKfp:true,
        vignette:"Un homme de 22 ans est amené par les pompiers en salle de déchocage. Son colocataire rapporte une fièvre brutale à 40°C et des céphalées intenses apparues 2 heures auparavant. À l'arrivée, vous constatez un purpura pétéchial initialement localisé aux membres inférieurs, désormais extensif avec 4 éléments nécrotiques de plus de 3 mm sur les membres et le tronc, apparus depuis le domicile. Pression artérielle : 78/44 mmHg. Fréquence cardiaque : 134/min. Température : 40,1°C. Saturation : 94% en air ambiant. Score de Glasgow : 13. Raideur de nuque. Vous reconnaissez immédiatement un purpura fulminans.",
        stem:"Vous reconnaissez immédiatement un purpura fulminans. Quelle est la première mesure thérapeutique à réaliser sur place ? (une seule réponse attendue)",
        choices:[{id:"A",text:"Poser une voie veineuse périphérique et prélever des hémocultures"},{id:"B",text:"Réaliser une ponction lombaire en urgence avant tout traitement"},{id:"C",text:"Injecter la ceftriaxone 1 g IV ou IM immédiatement, sur place"},{id:"D",text:"Appeler le réanimateur pour intubation orotrachéale"},{id:"E",text:"Administrer la dexaméthasone IV en priorité"},{id:"F",text:"Réaliser un scanner cérébral en urgence"},{id:"G",text:"Débuter un remplissage vasculaire avant tout antibiotique"},{id:"H",text:"Attendre les résultats des hémocultures avant toute ATB"},{id:"I",text:"Administrer de l'amoxicilline 3 g IV immédiatement"},{id:"J",text:"Effectuer un bilan de coagulation avant tout traitement"}],
        correct:["C"],
        explanations:{A:{v:false,t:"FAUX. Les hémocultures sont importantes mais ne constituent PAS la priorité absolue. La LiSA est formelle : dans le purpura fulminans, l'antibiothérapie est administrée immédiatement sur place dès que le purpura est reconnu. Les hémocultures sont prélevées si elles ne retardent pas l'ATB de plus de quelques minutes."},B:{v:false,t:"FAUX. La PL est formellement CONTRE-INDIQUÉE dans le purpura fulminans. C'est une urgence absolue avec choc septique — l'instabilité hémodynamique constitue une CI à la PL. De plus, la PL n'est pas nécessaire pour le diagnostic ni pour le traitement dans cette situation."},C:{v:true,t:"VRAI. C'est la première mesure, la plus urgente, la seule qui change immédiatement le pronostic. LiSA OIC-151-14-A : 'Injection immédiate IV ou IM d'une céphalosporine de 3e génération : Ceftriaxone (1g chez l'adulte) ou à défaut Céfotaxime, dès que le purpura fulminans est reconnu, sur place, même avant les hémocultures si elles retardent l'ATB.' C'est le réflexe de survie de cet item."},D:{v:false,t:"FAUX. L'intubation peut être nécessaire secondairement si l'état neurologique se dégrade, mais n'est pas la première mesure. La priorité absolue est l'antibiothérapie immédiate."},E:{v:false,t:"FAUX. La dexaméthasone n'est pas prioritaire dans le purpura fulminans. La LiSA ne la mentionne pas spécifiquement dans la prise en charge du purpura fulminans (contrairement à la méningite purulente documentée). La ceftriaxone passe en premier."},F:{v:false,t:"FAUX. Le scanner n'a aucune place en urgence immédiate dans le purpura fulminans — la PL étant contra-indiquée, le scanner ne changerait pas la prise en charge. La priorité est l'ATB et le traitement du choc."},G:{v:false,t:"FAUX. Le remplissage vasculaire est nécessaire (PA 78/44 mmHg = choc septique) mais n'est pas la PREMIÈRE mesure. L'antibiothérapie passe avant le remplissage selon la séquence LiSA pour le purpura fulminans."},H:{v:false,t:"FAUX. Attendre les résultats biologiques avant d'administrer les ATB est une faute grave dans le purpura fulminans. Chaque minute sans ATB aggrave la mortalité par choc et CIVD."},I:{v:false,t:"FAUX. L'amoxicilline ne couvre pas Neisseria meningitidis de façon optimale et n'est pas listée dans la LiSA comme ATB de référence dans le purpura fulminans. La ceftriaxone (C3G) est la molécule de référence."},J:{v:false,t:"FAUX. Le bilan de coagulation (CIVD fréquente dans le purpura fulminans) est important mais ne doit jamais retarder l'antibiothérapie. Il sera prélevé simultanément à la pose de la voie veineuse, après l'injection de ceftriaxone."}}
      },
      {
        id:"151-kfp02",type:"QRM",isKfp:true,
        vignette:"Un homme de 22 ans est amené par les pompiers en salle de déchocage. Son colocataire rapporte une fièvre brutale à 40°C et des céphalées intenses apparues 2 heures auparavant. À l'arrivée, vous constatez un purpura pétéchial initialement localisé aux membres inférieurs, désormais extensif avec 4 éléments nécrotiques de plus de 3 mm sur les membres et le tronc, apparus depuis le domicile. Pression artérielle : 78/44 mmHg. Fréquence cardiaque : 134/min. Température : 40,1°C. Saturation : 94% en air ambiant. Score de Glasgow : 13. Raideur de nuque. Vous reconnaissez immédiatement un purpura fulminans.\n\nVous avez injecté immédiatement la ceftriaxone 1 g IV.",
        stem:"Parmi les mesures suivantes, quelles sont les 4 que vous réalisez dans les 30 premières minutes ? (quatre réponses attendues)",
        choices:[{id:"A",text:"Hémocultures sur veine périphérique (2 paires)"},{id:"B",text:"Ponction lombaire immédiate"},{id:"C",text:"Bilan de coagulation : TP, TCA, fibrinogène, D-dimères"},{id:"D",text:"Remplissage vasculaire par cristalloïdes en débit libre"},{id:"E",text:"Mise en place de précautions complémentaires respiratoires type gouttelettes"},{id:"F",text:"Scanner cérébral en urgence"},{id:"G",text:"Myélogramme pour évaluation médullaire"},{id:"H",text:"Électroencéphalogramme"},{id:"I",text:"Appel du 15 SAMU pour transport médicalisé"},{id:"J",text:"Prophylaxie antibiotique des contacts immédiats"},{id:"K",text:"Radiographie thoracique de face"},{id:"L",text:"Pose d'une sonde urinaire pour surveillance diurèse"}],
        correct:["A","C","D","E"],
        explanations:{A:{v:true,t:"VRAI. Les hémocultures sont indispensables pour identifier le germe (Neisseria meningitidis suspecté ici) et adapter secondairement l'ATB. Elles doivent être prélevées immédiatement sur veine périphérique, sans retarder l'ATB déjà administrée."},B:{v:false,t:"FAUX. La PL est formellement CONTRE-INDIQUÉE dans le purpura fulminans. LiSA OIC-151-14-A : 'PL non nécessaire et contre-indiquée en urgence.' Double CI ici : instabilité hémodynamique (PA 78/44) + purpura extensif (CIVD probable)."},C:{v:true,t:"VRAI. Le bilan de coagulation (TP, TCA, fibrinogène, D-dimères) est indispensable dans les 30 premières minutes. Le purpura fulminans se complique fréquemment de CIVD (coagulation intravasculaire disséminée) qui aggrave le pronostic et peut nécessiter l'administration de plasma frais congelé ou de fibrinogène."},D:{v:true,t:"VRAI. Le remplissage vasculaire par cristalloïdes (sérum salé 0,9% ou Ringer lactate) est une mesure urgente face à ce choc septique (PA 78/44 mmHg, FC 134/min). Objectif : restaurer une pression de perfusion tissulaire et corriger le choc avant d'aggraver la défaillance d'organe."},E:{v:true,t:"VRAI. Les précautions complémentaires respiratoires de type gouttelettes sont indiquées dans le purpura fulminans à méningocoque (transmission par gouttelettes nasopharyngées). LiSA OIC-151-14-A les liste explicitement. Elles sont maintenues jusqu'à 24h après le début d'une ATB efficace."},F:{v:false,t:"FAUX. Le scanner n'a pas d'indication immédiate dans le purpura fulminans — la PL étant CI, le scanner ne change pas la conduite. Le temps est précieux : priorité à l'ATB, hémocultures, remplissage."},G:{v:false,t:"FAUX. Le myélogramme n'a aucune indication dans ce contexte de purpura fulminans infectieux. Il serait indiqué en cas de suspicion de leucémie aiguë ou de myélodysplasie devant un purpura thrombopénique."},H:{v:false,t:"FAUX. L'EEG n'a pas d'indication immédiate dans le purpura fulminans sans crise convulsive documentée. Il sera discuté secondairement en cas d'évolution neurologique défavorable."},I:{v:false,t:"FAUX. Ce patient est déjà aux urgences (amené par les pompiers). L'appel du 15 concerne la prise en charge PRÉ-HOSPITALIÈRE. En intra-hospitalier, la priorité est la réanimation sur place, puis transfer en réanimation si disponible."},J:{v:false,t:"FAUX. La prophylaxie antibiotique des contacts est indiquée ultérieurement (dans les 24-48h) mais n'est pas une mesure des 30 premières minutes. La priorité est la survie du patient."},K:{v:false,t:"FAUX. La radiographie thoracique peut être utile secondairement (bilan lésionnel) mais n'est pas parmi les 4 priorités des 30 premières minutes dans un purpura fulminans."},L:{v:false,t:"FAUX. La pose d'une sonde urinaire est utile pour la surveillance de la diurèse dans le choc, mais n'est pas parmi les 4 mesures prioritaires des 30 premières minutes."}}
      },
      {
        id:"151-kfp03",type:"QRM",isKfp:true,
        vignette:"Un homme de 22 ans est amené par les pompiers en salle de déchocage. Son colocataire rapporte une fièvre brutale à 40°C et des céphalées intenses apparues 2 heures auparavant. À l'arrivée, vous constatez un purpura pétéchial initialement localisé aux membres inférieurs, désormais extensif avec 4 éléments nécrotiques de plus de 3 mm sur les membres et le tronc, apparus depuis le domicile. Pression artérielle : 78/44 mmHg. Fréquence cardiaque : 134/min. Température : 40,1°C. Saturation : 94% en air ambiant. Score de Glasgow : 13. Raideur de nuque. Vous reconnaissez immédiatement un purpura fulminans.\n\nLa ceftriaxone a été administrée immédiatement et la prise en charge initiale a permis de stabiliser le patient. 48 heures plus tard, l'agent pathogène est identifié : Neisseria meningitidis sérogroupe C. Son colocataire (25 ans, en parfaite santé) et sa sœur (20 ans, enceinte de 14 semaines) sont identifiés comme cas contacts proches.",
        stem:"Parmi les mesures suivantes, lesquelles sont indiquées ? (deux réponses attendues)",
        choices:[{id:"A",text:"Rifampicine per os 600 mg x2/j pendant 2 jours pour le colocataire"},{id:"B",text:"Ciprofloxacine 500 mg monodose per os pour la sœur enceinte"},{id:"C",text:"Ceftriaxone 250 mg IM monodose pour la sœur enceinte"},{id:"D",text:"Aucune antibioprophylaxie car le patient a déjà reçu de la ceftriaxone"},{id:"E",text:"Antibioprophylaxie réservée aux contacts ayant partagé un repas"},{id:"F",text:"Vaccination méningococcique C recommandée pour les contacts"},{id:"G",text:"Déclaration obligatoire à l'ARS avant toute autre mesure"},{id:"H",text:"Vancomycine monodose pour la sœur enceinte"},{id:"I",text:"Rifampicine contre-indiquée chez la sœur enceinte au 2e trimestre"},{id:"J",text:"Prophylaxie uniquement pour les contacts vivant sous le même toit"}],
        correct:["A","C"],
        explanations:{A:{v:true,t:"VRAI. La rifampicine per os (600 mg x2/j pendant 2 jours chez l'adulte) est l'antibiotique de référence pour la chimioprophylaxie des cas contacts de méningite à méningocoque. Elle éradique le portage nasopharyngé et protège contre le développement d'une méningite secondaire dans les 10 jours suivants."},B:{v:false,t:"FAUX. La ciprofloxacine est contre-indiquée pendant la grossesse (fluoroquinolones = CI absolue). Utiliser la ciprofloxacine chez la sœur enceinte de 14 semaines constitue une faute thérapeutique. L'alternative pour la femme enceinte est la ceftriaxone 250 mg IM monodose."},C:{v:true,t:"VRAI. Chez la femme enceinte, ni la ciprofloxacine (CI grossesse) ni la rifampicine (déconseillée, surtout au 1er trimestre) ne sont recommandées. La ceftriaxone 250 mg IM monodose est l'alternative de référence pour la chimioprophylaxie chez la femme enceinte. Elle élimine efficacement le portage nasopharyngé."},D:{v:false,t:"FAUX. La ceftriaxone administrée au patient traite l'infection mais n'éradique pas systématiquement le portage nasopharyngé chez les contacts. La prophylaxie des contacts est indiquée indépendamment du traitement du cas index."},E:{v:false,t:"FAUX. La définition du cas contact pour méningocoque n'est pas limitée aux personnes ayant partagé un repas. Elle inclut tout contact intime dans les 10 jours précédents : vie sous le même toit, contact direct avec les sécrétions oro-pharyngées, contact face-à-face prolongé (> 1h à moins d'1m)."},F:{v:false,t:"FAUX. La vaccination méningococcique C peut être proposée aux contacts comme mesure complémentaire à la prophylaxie antibiotique, mais elle ne constitue pas une réponse parmi les 2 réponses attendues ici (qui portent sur l'antibioprophylaxie spécifique selon le terrain)."},G:{v:false,t:"FAUX. La déclaration obligatoire à l'ARS doit certes être effectuée (méningocoque = DO), mais elle n'est pas une mesure de prophylaxie individuelle pour les contacts. Elle permet l'investigation épidémiologique et la coordination des mesures collectives."},H:{v:false,t:"FAUX. La vancomycine n'a pas d'indication en chimioprophylaxie de méningite à méningocoque. Elle n'élimine pas le portage nasopharyngé à méningocoque."},I:{v:false,t:"FAUX. La rifampicine est déconseillée au 1er trimestre mais peut être utilisée au 2e trimestre dans certains contextes. Cependant, chez la femme enceinte, la ceftriaxone IM reste l'option préférée pour la prophylaxie anti-méningococcique, en raison de l'efficacité prouvée et du profil de sécurité."},J:{v:false,t:"FAUX. La prophylaxie n'est pas limitée aux cohabitants. Tout contact intime (défini ci-dessus) dans les 10 jours précédents est concerné, qu'il vive ou non sous le même toit."}}
      },

      {
        id:"151-qi01",type:"QCU",
        stem:"Vous êtes médecin de garde dans un cabinet de médecine générale. Un homme de 19 ans se présente pour fièvre à 40°C et céphalées intenses depuis 2 heures. En l'examinant, vous constatez un purpura pétéchial apparu depuis 30 minutes sur les membres inférieurs avec 2 éléments ecchymotiques évolutifs. Le patient est conscient et stable. Quelle est votre première mesure thérapeutique ?",
        choices:[{id:"A",text:"Appeler le 15 SAMU pour demander le transfert"},{id:"B",text:"Injecter la ceftriaxone 1 g IV ou IM immédiatement, sur place"},{id:"C",text:"Réaliser une ponction lombaire avant de débuter tout traitement"},{id:"D",text:"Adresser en urgence aux Urgences sans administrer de traitement"},{id:"E",text:"Réaliser des hémocultures puis débuter l'antibiothérapie"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. L'appel du 15 est indiqué APRÈS l'injection de ceftriaxone, pas avant. Dans la prise en charge pré-hospitalière du purpura fulminans, la LiSA est explicite : injection antibiotique immédiate sur place PUIS appel du 15 pour transport médicalisé. Chaque minute compte."},B:{v:true,t:"VRAI. C'est le réflexe absolu face à un purpura fulminans. LiSA OIC-151-14-A : injection immédiate IV ou IM de ceftriaxone 1g sur place, dès que le tableau est reconnu. Aucun bilan, aucun examen, aucun autre geste ne doit précéder cette injection. Le purpura fulminans tue en quelques heures — chaque minute sans ATB augmente la mortalité et le risque d'amputation."},C:{v:false,t:"FAUX. La PL est formellement CONTRE-INDIQUÉE dans le purpura fulminans selon la LiSA. Le diagnostic est clinique — l'antibiothérapie immédiate prime sur tout autre geste. Réaliser une PL avant l'ATB constitue une faute médicale grave."},D:{v:false,t:"FAUX. Transférer un patient avec un purpura fulminans sans antibiothérapie au préalable est une faute grave. Le patient peut décéder ou perdre des membres pendant le transport. L'ATB doit être administrée avant le transfert."},E:{v:false,t:"FAUX. Les hémocultures ne doivent pas retarder l'antibiothérapie dans le purpura fulminans. Si les hémocultures peuvent être prélevées simultanément à la pose de la VVP, très bien — mais si elles retardent l'ATB, on injecte d'abord la ceftriaxone."}}
      },
      {
        id:"151-qi02",type:"QRM",
        stem:"Une femme de 52 ans est hospitalisée pour fièvre à 39,5°C, céphalées intenses et raideur de nuque. Elle est traitée par rivaroxaban 20 mg/j pour une fibrillation atriale et par aspirine 100 mg/j pour une coronaropathie. La NFS retrouve des plaquettes à 38 G/L. Il n'existe pas de lésion cutanée au site potentiel de ponction. Le score de Glasgow est à 14. Il n'existe pas de signe de focalisation neurologique. Parmi les éléments suivants, lequel ou lesquels constitue ou constituent une contre-indication à la réalisation immédiate de la PL ?",
        choices:[{id:"A",text:"La prise d'aspirine 100 mg/j"},{id:"B",text:"La prise de rivaroxaban 20 mg/j à dose curative"},{id:"C",text:"Les plaquettes à 38 G/L"},{id:"D",text:"Le score de Glasgow à 14"},{id:"E",text:"L'absence de signe de focalisation neurologique"}],
        correct:["B","C"],
        explanations:{A:{v:false,t:"FAUX. C'est le piège fondamental de cet item. Les antiagrégants plaquettaires (aspirine, clopidogrel) NE CONSTITUENT PAS une contre-indication à la PL selon la LiSA. Cette notion est essentielle : un patient sous aspirine peut recevoir une PL sans arrêt préalable. Ne pas retarder le diagnostic pour une aspirine."},B:{v:true,t:"VRAI. Le rivaroxaban est un anticoagulant oral direct (anti-Xa) à dose curative (20 mg/j = dose curative pour FA). La LiSA liste explicitement 'traitement anticoagulant à dose efficace' comme contre-indication à la PL d'emblée. Un anticoagulant curatif expose à un hématome épidural spinal potentiellement compressif si PL immédiate."},C:{v:true,t:"VRAI. Les plaquettes à 38 G/L constituent un trouble de l'hémostase (thrombopénie sévère < 50 G/L). La LiSA cite 'troubles de l'hémostase suspecté cliniquement ou connu' comme CI à la PL d'emblée. En pratique, une thrombopénie < 50 G/L impose une correction (transfusion plaquettaire) avant la PL."},D:{v:false,t:"FAUX. Le Glasgow à 14 n'est pas une CI à la PL. La LiSA précise : CI neurologique si Glasgow < 12. À 14, la PL est réalisable en l'absence d'autres CI neurologiques (pas de signe de focalisation, pas d'engagement)."},E:{v:false,t:"FAUX. L'absence de signe de focalisation est une caractéristique favorable — elle indique que la PL est neurologiquement réalisable. C'est la PRÉSENCE de signes de focalisation qui constitue une CI, pas leur absence."}}
      },
      {
        id:"151-qi03",type:"QRM",
        stem:"Vous interprétez le résultat d'une PL chez un patient de 58 ans hospitalisé pour syndrome méningé fébrile à 39,8°C. Le LCS est d'aspect trouble. Résultats : leucocytes 8 400/mm³, 92% polynucléaires neutrophiles, protéinorachie 3,2 g/L, glycorachie 1,2 mmol/L pour une glycémie à 6,8 mmol/L, lactatorachie 4,9 mmol/L. Parmi les propositions suivantes concernant l'interprétation de ce LCS, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La pléiocytose à 8 400/mm³ est en faveur d'une méningite bactérienne"},{id:"B",text:"La prédominance des polynucléaires neutrophiles à 92% oriente vers une méningite bactérienne"},{id:"C",text:"Le rapport glycorachie/glycémie à 0,18 est en faveur d'une méningite bactérienne"},{id:"D",text:"La lactatorachie à 4,9 mmol/L est en faveur d'une méningite bactérienne"},{id:"E",text:"Un LCS clair d'emblée exclut définitivement une méningite bactérienne"}],
        correct:["A","B","C","D"],
        explanations:{A:{v:true,t:"VRAI. Une pléiocytose > 1000 leucocytes/mm³ oriente fortement vers une méningite bactérienne. À 8 400/mm³, c'est un signe majeur en faveur d'une étiologie bactérienne. Pour comparaison, les méningites virales ont typiquement < 1000 éléments/mm³."},B:{v:true,t:"VRAI. La prédominance polynucléaire (> 80% PN) est le critère cytoformulaire clé de la méningite bactérienne. Elle traduit la réaction inflammatoire aiguë à prédominance neutrophilique caractéristique des infections bactériennes."},C:{v:true,t:"VRAI. Le rapport glycorachie/glycémie à 0,18 (norme > 0,6) indique une hypoglycorrachie franche en faveur d'une méningite bactérienne. Le seuil discriminant est 0,4 : en dessous = bactérien (ou tuberculeux). Les bactéries consomment le glucose du LCS."},D:{v:true,t:"VRAI. La lactatorachie à 4,9 mmol/L est élevée (normale < 2,1 mmol/L; seuil bactérien > 3,2 mmol/L). L'acide lactique dans le LCS est produit par les leucocytes et les bactéries en anaérobiose relative. Une lactatorachie > 3,2 mmol/L est hautement prédictive d'une méningite bactérienne."},E:{v:false,t:"FAUX. Un LCS clair d'emblée N'EXCLUT PAS une méningite bactérienne. En tout début d'évolution (< 6h), ou dans certaines formes à Listeria (LCS souvent panaché mais parfois clair), le LCS peut être de clareté normale. La LiSA précise : 'LCS clair et glycorachie ≤ 0,4 x glycémie = présumée bactérienne'. Tout syndrome méningé fébrile justifie une PL, même en l'absence de syndrome inflammatoire."}}
      },
      {
        id:"151-qi04",type:"QRM",
        stem:"Un homme de 45 ans est hospitalisé pour un tableau de méningite bactérienne aiguë. Parmi les situations suivantes, dans laquelle ou lesquelles la dexaméthasone doit-elle être associée à l'antibiothérapie selon la LiSA ?",
        choices:[{id:"A",text:"LCS d'aspect trouble à la PL"},{id:"B",text:"Examen direct positif à cocci à Gram positif (pneumocoque probable)"},{id:"C",text:"Examen direct positif à cocci à Gram négatif (méningocoque probable)"},{id:"D",text:"LCS clair avec cellularité lymphocytaire prédominante et glycorachie normale"},{id:"E",text:"Contre-indication neurologique à la PL d'emblée"}],
        correct:["A","B","C","E"],
        explanations:{A:{v:true,t:"VRAI. LCS trouble = présumée bactérienne → dexaméthasone systématique. La LiSA OIC-151-16-A est précise : 'Association à dexaméthasone si CI à la PL, si LCS trouble, ou ED positif à CG+ ou CG-'."},B:{v:true,t:"VRAI. Examen direct positif à cocci à Gram positif (pneumocoque) → dexaméthasone. C'est l'indication la plus classique — la corticothérapie adjuvante réduit la mortalité et les séquelles auditives dans les méningites à pneumocoque."},C:{v:true,t:"VRAI. Examen direct positif à cocci à Gram négatif (méningocoque) → dexaméthasone également. La LiSA liste 'ED positif à CG+' ET 'ED positif à CG-' comme indications. La dexaméthasone est administrée avant ou avec la première injection d'antibiotique."},D:{v:false,t:"FAUX. LCS clair + lymphocytose + glycorachie normale = méningite virale probable. Dans ce cas, la dexaméthasone n'est PAS indiquée. Elle est réservée aux méningites présumées bactériennes. Administrer de la dexaméthasone pour une méningite virale est inutile et expose aux effets secondaires des corticoïdes."},E:{v:true,t:"VRAI. En cas de CI neurologique à la PL, la LiSA préconise : hémocultures + dexaméthasone + antibiothérapie immédiatement, SANS attendre la PL. La dexaméthasone est donc administrée même sans résultat de LCS, car une méningite bactérienne est présumée en cas de CI neurologique dans un contexte fébrile méningé."}}
      },
      {
        id:"151-qi05",type:"QCU",
        stem:"Un homme de 38 ans est traité depuis 48 heures par céfotaxime IV pour une méningite bactérienne. L'antibiogramme est disponible : Streptococcus pneumoniae, sensible à la pénicilline G (CMI oxacilline disc ≥ 5 mm, CMI pénicilline G < 0,064 mg/L), sensible à toutes les bêtalactamines testées. L'évolution clinique est favorable à J2. Quel traitement prescrivez-vous à partir de ce résultat ?",
        choices:[{id:"A",text:"Maintien du céfotaxime aux mêmes doses jusqu'à la fin du traitement"},{id:"B",text:"Ajout de vancomycine au céfotaxime"},{id:"C",text:"Désescalade vers l'amoxicilline IV à forte dose"},{id:"D",text:"Relais per os par amoxicilline-acide clavulanique"},{id:"E",text:"Maintien du céfotaxime et ajout de rifampicine en synergie"}],
        correct:["C"],
        explanations:{A:{v:false,t:"FAUX. Maintenir le céfotaxime en traitement documenté pour un pneumocoque péni-S constitue un sur-traitement. La désescalade vers l'amoxicilline est recommandée dès que la sensibilité à la pénicilline est confirmée — c'est un principe fondamental du bon usage des ATB."},B:{v:false,t:"FAUX. La vancomycine n'a aucune indication ici. Elle est réservée au pneumocoque de haut niveau de résistance aux C3G, ce qui n'est pas le cas (souche péni-S et sensible à toutes les bêtalactamines)."},C:{v:true,t:"VRAI. Pneumocoque péni-S documenté → désescalade vers l'amoxicilline IV (200 mg/kg/j en 4 à 6 administrations ou perfusion continue). C'est la règle de désescalade antibiotique : une fois le germe identifié et sa sensibilité confirmée, on utilise l'antibiotique le plus ciblé. L'amoxicilline a une excellente pénétration méningée pour le pneumocoque péni-S et est moins écologiquement coûteuse que les C3G."},D:{v:false,t:"FAUX. La méningite bactérienne nécessite un traitement IV. Le relais per os par amoxicilline-acide clavulanique n'est pas adapté — biodisponibilité insuffisante et dosages per os insuffisants pour atteindre des concentrations bactéricides dans le LCS."},E:{v:false,t:"FAUX. La rifampicine n'est pas indiquée en association dans les méningites à pneumocoque péni-S. Elle peut être discutée dans certains protocoles de méningites à pneumocoque très résistantes ou en cas d'abcès associé, mais pas dans ce contexte documenté péni-S."}}
      },
      {
        id:"151-qi06",type:"QRM",
        stem:"Un homme de 52 ans est hospitalisé pour fièvre à 38,5°C, céphalées intenses, confusion et une crise convulsive tonico-clonique survenue 2 heures avant l'admission. L'examen retrouve un syndrome méningé, des troubles mnésiques récents et des hallucinations olfactives. La PL montre un LCS clair, leucocytes 280/mm³ (85% lymphocytes), protéinorachie 0,9 g/L, glycorachie normale. Concernant la prise en charge immédiate, laquelle ou lesquelles des propositions est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'aciclovir IV doit être débuté immédiatement sans attendre le résultat de l'IRM cérébrale"},{id:"B",text:"L'IRM cérébrale doit être réalisée avant de débuter l'aciclovir afin de confirmer l'atteinte temporale"},{id:"C",text:"La PCR HSV dans le LCS permettra de confirmer le diagnostic"},{id:"D",text:"L'IRM cérébrale retrouvera typiquement un hypersignal T2 des régions temporales internes et insulaires"},{id:"E",text:"Une antibiothérapie probabiliste par C3G doit être débutée d'emblée car le LCS est inflammatoire"}],
        correct:["A","C","D"],
        explanations:{A:{v:true,t:"VRAI. C'est la règle absolue pour l'encéphalite herpétique. LiSA OIC-151-18-A : 'En cas de suspicion d'encéphalite herpétique, la réalisation de l'examen d'imagerie ne doit pas retarder la mise en route du traitement par aciclovir intraveineux.' Aciclovir 10 mg/kg x3/j IV dès la suspicion clinique, sans attendre aucun résultat d'imagerie ni de biologie."},B:{v:false,t:"FAUX. C'est exactement l'inverse de la recommandation LiSA. L'IRM ne doit PAS retarder l'aciclovir. Chaque heure sans aciclovir aggrave le pronostic neurologique de l'encéphalite herpétique (mortalité 70% sans traitement, séquelles cognitives majeures). L'IRM est réalisée après l'initiation du traitement."},C:{v:true,t:"VRAI. La PCR HSV (HSV-1 et HSV-2) dans le LCS est l'examen de référence pour confirmer l'encéphalite herpétique. Sa sensibilité est > 95% en phase aiguë. Un résultat négatif précoce (< 48h d'évolution) n'exclut pas le diagnostic — la PCR peut être négative dans les premières heures."},D:{v:true,t:"VRAI. L'IRM retrouve typiquement un hypersignal T2/FLAIR des lobes temporaux internes (hippocampe, amygdale) et des régions insulaires, souvent bilatéral et asymétrique. Ces localisations expliquent la sémiologie : hallucinations olfactives (cortex piriforme), troubles mnésiques (hippocampe), crises temporales."},E:{v:false,t:"FAUX. Le tableau clinique avec LCS lymphocytaire normoglycorrachique oriente vers une méningite/méningo-encéphalite virale — pas bactérienne. La C3G n'est pas indiquée ici. La priorité est l'aciclovir IV. Une antibiothérapie probabiliste serait à discuter seulement si le diagnostic bactérien ne peut être formellement exclu, mais ici le contexte est clairement en faveur d'une encéphalite herpétique."}}
      },
      {
        id:"151-qi07",type:"QRM",
        stem:"Un nourrisson de 8 mois est amené aux urgences pour une fièvre à 39,8°C depuis 12 heures, avec pleurs incessants et refus du biberon. À l'examen : fontanelle antérieure bombante et tendue à la palpation, hypotonie axiale globale, regard fixe. Parmi les propositions suivantes concernant la sémiologie méningée chez le nourrisson, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La raideur de nuque est typiquement absente ou peu marquée chez le nourrisson de moins de 12 mois"},{id:"B",text:"Le bombement de la fontanelle antérieure est un signe d'hypertension intracrânienne évocateur de méningite"},{id:"C",text:"L'hypotonie axiale peut orienter vers une méningite chez le nourrisson"},{id:"D",text:"La photophobie est le signe cardinal et toujours présent avant l'âge de 1 an"},{id:"E",text:"La raideur de nuque est obligatoire pour poser le diagnostic de méningite chez le nourrisson"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. C'est une particularité fondamentale de la sémiologie pédiatrique. La LiSA le précise explicitement pour la méningite du nourrisson : 'la raideur de nuque est souvent absente ou peu marquée'. Le syndrome méningé classique (céphalées + photophobie + raideur de nuque) n'est présent qu'à partir de 2-3 ans. Avant, il faut rechercher les équivalents."},B:{v:true,t:"VRAI. La fontanelle antérieure est normalement plate et souple chez le nourrisson couché. Son bombement et sa tension témoignent d'une hypertension intracrânienne, fortement évocatrice de méningite ou d'encéphalite. Ce signe doit être évalué systématiquement dans le bilan d'un nourrisson fébrile."},C:{v:true,t:"VRAI. L'hypotonie axiale, les troubles de conscience, l'irritabilité ou au contraire l'apathie, le refus du biberon et les vomissements sont les équivalents méningés du nourrisson. Ces signes non spécifiques doivent alerter et conduire à une PL."},D:{v:false,t:"FAUX. La photophobie est difficile à objectiver avant l'âge de 2 ans et n'est certainement pas 'toujours présente'. Elle n'est pas le signe cardinal du nourrisson. Le signe cardinal en pédiatrie jeune est le bombement de la fontanelle, associé à la fièvre et aux signes généraux."},E:{v:false,t:"FAUX. La raideur de nuque est souvent ABSENTE chez le nourrisson. Attendre sa présence pour évoquer une méningite constituerait une erreur diagnostique grave. La LiSA précise que les signes méningés classiques sont inconstants chez le nourrisson et ne doivent pas être requis pour poser l'indication de PL."}}
      },
      {
        id:"151-qi08",type:"QRM",
        stem:"Une femme de 24 ans est hospitalisée pour méningite à Neisseria meningitidis sérogroupe C confirmée. Son compagnon (26 ans), son colocataire (28 ans) et sa mère (52 ans) sont identifiés comme cas contacts proches. Parmi les mesures suivantes, laquelle ou lesquelles doivent être systématiquement mises en place ?",
        choices:[{id:"A",text:"Déclaration obligatoire nominative à l'Agence Régionale de Santé"},{id:"B",text:"Précautions complémentaires respiratoires de type gouttelettes pendant les 24 premières heures d'antibiothérapie efficace"},{id:"C",text:"Antibioprophylaxie des cas contacts rapprochés par rifampicine ou ciprofloxacine"},{id:"D",text:"Vaccination des contacts par vaccin méningococcique conjugué C"},{id:"E",text:"Isolement du patient en chambre à flux laminaire jusqu'à la guérison"}],
        correct:["A","B","C","D"],
        explanations:{A:{v:true,t:"VRAI. Neisseria meningitidis (méningocoque) = infection invasive à méningocoque = déclaration obligatoire (DO) nominative à l'ARS. Cette déclaration déclenche l'investigation épidémiologique pour identifier les contacts et organiser les mesures de prévention collective."},B:{v:true,t:"VRAI. Des précautions complémentaires de type gouttelettes sont indiquées dès l'admission (méningocoque se transmettant par gouttelettes oro-nasales), et peuvent être levées après 24 heures d'antibiothérapie efficace. Cette mesure protège le personnel soignant et les autres patients."},C:{v:true,t:"VRAI. L'antibioprophylaxie des contacts rapprochés est obligatoire pour Neisseria meningitidis. Molécules : rifampicine per os (600 mg x2/j, 2 jours) = référence ; ciprofloxacine 500 mg monodose = alternative. La prophylaxie doit être administrée dans les 24-48 heures suivant le diagnostic."},D:{v:true,t:"VRAI. Pour les sérogroupes vaccinaux (A, C, Y, W-135), la vaccination des contacts proches est recommandée en complément de l'antibioprophylaxie. Pour le sérogroupe C ici, le vaccin méningococcique conjugué C est recommandé pour les contacts rapprochés non immunisés."},E:{v:false,t:"FAUX. La chambre à flux laminaire est réservée aux patients immunodéprimés (aplasie médullaire, greffe) pour les protéger des infections environnementales. Elle n'a aucune indication dans la méningite à méningocoque, qui nécessite des précautions gouttelettes classiques."}}
      },
      {
        id:"151-qi09",type:"QRM",
        stem:"Un homme de 43 ans est hospitalisé pour céphalées progressives depuis 3 semaines, fièvre à 38,2°C et hémiparésie droite apparue depuis 48 heures. L'IRM cérébrale montre une lésion arrondie de 3 cm en région frontale gauche, avec un centre nécrotique hyposignal T1, une paroi épaisse réhaussée en anneau après injection de gadolinium, et un œdème périlésionnel en T2. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Ce tableau est évocateur d'un abcès cérébral (image en cocarde)"},{id:"B",text:"Une infection dentaire ou une origine ORL est la porte d'entrée la plus fréquente des abcès cérébraux"},{id:"C",text:"Les streptocoques oraux et les anaérobies sont les principaux germes impliqués dans les abcès d'origine dentaire ou ORL"},{id:"D",text:"Le scanner cérébral est l'examen de référence pour le diagnostic d'abcès cérébral"},{id:"E",text:"L'antibiothérapie seule sans drainage constitue le traitement de référence dans cette situation"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. L'image en cocarde (centre nécrotique hypointense, capsule réhaussée en anneau par le gadolinium, œdème périlésionnel) est pathognomonique de l'abcès cérébral en IRM. C'est la description classique que tout étudiant doit avoir en mémoire."},B:{v:true,t:"VRAI. Les abcès cérébraux par contiguité depuis un foyer ORL ou dentaire représentent environ 50% des étiologies. Les portes d'entrée principales sont : sinusite frontale/ethmoïdale → abcès frontal, otite/mastoïdite → abcès temporal ou cérébelleux, abcès dentaire → abcès frontal."},C:{v:true,t:"VRAI. Dans les abcès d'origine ORL ou dentaire par contiguité, les germes dominants sont les streptocoques oraux du groupe Milleri (Streptococcus anginosus, constellatus, intermedius) et les anaérobies (Peptostreptococcus, Fusobacterium). Cette infection est souvent POLYMICROBIENNE."},D:{v:false,t:"FAUX. L'IRM cérébrale (avec injection de gadolinium) est l'examen de RÉFÉRENCE pour le diagnostic d'abcès cérébral. La LiSA est explicite : 'L'IRM cérébrale est l'examen clé d'imagerie en cas de suspicion d'abcès cérébral'. Elle est supérieure au scanner pour la détection des abcès débutants, des lésions de petite taille et des abcès de la fosse postérieure."},E:{v:false,t:"FAUX. Le traitement de l'abcès cérébral repose sur l'association drainage chirurgical + antibiothérapie prolongée. L'antibiothérapie seule peut être discutée pour les abcès < 2,5 cm ou multiples et non accessibles, mais pour un abcès de 3 cm avec effet de masse (hémiparésie), le drainage est indiqué. L'antibiothérapie seule expose à l'évolution vers l'encéphalocèle et l'augmentation de taille."}}
      },
      {
        id:"151-qi10",type:"QRM",
        stem:"Un nouveau-né de 4 jours présente une fièvre à 38,4°C, des apnées et une mauvaise tolérance alimentaire. La ponction lombaire confirme une méningite bactérienne. Parmi les germes suivants, lesquels sont les plus fréquemment impliqués dans les méningites bactériennes néonatales précoces (< 7 jours de vie) ?",
        choices:[{id:"A",text:"Streptococcus agalactiae (streptocoque du groupe B)"},{id:"B",text:"Escherichia coli (notamment souche K1)"},{id:"C",text:"Neisseria meningitidis"},{id:"D",text:"Streptococcus pneumoniae"},{id:"E",text:"Staphylococcus aureus"}],
        correct:["A","B"],
        explanations:{A:{v:true,t:"VRAI. Streptococcus agalactiae (SGB, streptocoque du groupe B) est le premier germe des méningites néonatales précoces en France. La contamination est périnatale (portage vaginal maternel). La prévention repose sur le dépistage maternel à 35 SA et l'antibioprophylaxie perpartum si portage positif."},B:{v:true,t:"VRAI. Escherichia coli, notamment la souche à capsule K1, est le deuxième germe des méningites néonatales. Cette souche possède une capsule polysaccharidique qui lui confère une résistance à la phagocytose. La contamination est également périnatale (flore digestive/vaginale maternelle)."},C:{v:false,t:"FAUX. Neisseria meningitidis est exceptionnel en période néonatale. Le méningocoque touche préférentiellement les nourrissons au-delà de 3 mois (avant les vaccinations) et les jeunes adultes. La méningite néonatale à méningocoque est un cas rare."},D:{v:false,t:"FAUX. Streptococcus pneumoniae est rare avant l'âge de 3 mois. Les méningites à pneumocoque surviennent plutôt chez le nourrisson > 3 mois et l'enfant, avec un pic avant 2 ans pour la prévention vaccinale."},E:{v:false,t:"FAUX. Staphylococcus aureus est un germe des méningites post-chirurgicales (post-neurochirugie) ou hématogènes, pas des méningites néonatales précoces. En néonatal, les méningites à Staphylococcus sont plutôt post-procédurales (pose de cathéter, neurochirurgie)."}}
      },
      {
        id:"151-qi11",type:"QCU",
        stem:"Un patient de 34 ans est hospitalisé pendant 14 jours pour une méningite à pneumocoque traitée efficacement. À J14, l'évolution est favorable : apyrexie, régression du syndrome méningé, bilan normal. Il est asymptomatique et prêt à sortir. Quel examen doit être systématiquement réalisé avant la sortie selon les recommandations ?",
        choices:[{id:"A",text:"IRM cérébrale avec injection de gadolinium"},{id:"B",text:"Audiométrie"},{id:"C",text:"Électroencéphalogramme de veille"},{id:"D",text:"Bilan immunologique complet"},{id:"E",text:"Fond d'œil bilatéral"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. L'IRM de contrôle n'est pas systématique avant la sortie d'une méningite bactérienne d'évolution favorable. Elle est réservée aux complications suspectées (hydrocéphalie, empyème, thrombophlébite, vascularite, abcès)."},B:{v:true,t:"VRAI. La LiSA OIC-151 précise explicitement : 'ORL = audiométrie AVANT la sortie d'hospitalisation en cas de méningite bactérienne'. La surdité de perception est la complication séquellaire la plus fréquente des méningites bactériennes (5-15% des cas). Elle résulte de l'inflammation labyrinthique et de la destruction des cellules ciliées cochléaires. Une surdité non détectée à la sortie peut compromettre la réhabilitation auditive (prothèse, implant cochléaire)."},C:{v:false,t:"FAUX. L'EEG n'est pas systématique avant la sortie d'une méningite bactérienne non compliquée. Il est indiqué en cas de crises convulsives persistantes ou de suspicion d'épilepsie séquellaire."},D:{v:false,t:"FAUX. Le bilan immunologique n'est pas systématique à la sortie pour un premier épisode. Il est indiqué en cas de méningite récidivante ou de terrain évocateur d'un déficit immunitaire."},E:{v:false,t:"FAUX. Le fond d'œil est utile en cas d'hypertension intracrânienne persistante ou de névrite optique, mais n'est pas recommandé systématiquement avant la sortie d'une méningite bactérienne d'évolution favorable."}}
      },
      {
        id:"151-qi12",type:"QRM",
        stem:"Un jeune homme de 22 ans est hospitalisé pour fièvre à 38,8°C, céphalées et raideur de nuque. La PL montre : LCS clair, leucocytes 360/mm³ (80% lymphocytes), protéinorachie 0,7 g/L, glycorachie 2,8 mmol/L pour une glycémie à 5,4 mmol/L. CRP 22 mg/L. Examen direct négatif. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Ce profil cytochimique est compatible avec une méningite d'origine virale"},{id:"B",text:"Une antibiothérapie probabiliste par C3G doit être débutée immédiatement"},{id:"C",text:"Le rapport glycorachie/glycémie à 0,52 n'oriente pas vers une méningite bactérienne"},{id:"D",text:"La prédominance lymphocytaire oriente vers une étiologie virale ou une méningite tuberculeuse"},{id:"E",text:"Une protéinorachie à 0,7 g/L est incompatible avec une méningite virale"}],
        correct:["A","C","D"],
        explanations:{A:{v:true,t:"VRAI. LCS clair + leucocytose modérée (360/mm³) + lymphocytose prédominante (80%) + glycorachie normale (rapport 0,52 > 0,4) = profil compatible avec une méningite virale. Les entérovirus (échovirus, coxsackievirus) et les oreillons en sont les causes les plus fréquentes."},B:{v:false,t:"FAUX. Ce profil LCS est typiquement viral — antibiothérapie non indiquée. La LiSA OIC-151-17-B précise : 'Une méningite infectieuse d'origine virale sans encéphalite associée se traite de manière symptomatique.' Administrer des C3G sans indication expose aux effets indésirables et contribue à la résistance bactérienne."},C:{v:true,t:"VRAI. Le rapport glycorachie/glycémie à 0,52 est normal (norme > 0,6 selon certaines références, mais > 0,4 exclut une hypoglycorrachie significative). Ce rapport n'oriente pas vers une méningite bactérienne (qui aurait un rapport < 0,4). La normoglycorrachie est un argument fort en faveur d'une étiologie virale."},D:{v:true,t:"VRAI. La prédominance lymphocytaire (> 50%) oriente vers une méningite virale (étiologie la plus fréquente) mais aussi vers une méningite tuberculeuse (hypoglycorrachique), une méningite à Listeria (LCS panaché), ou une méningite décapitée par antibiothérapie. La formule lymphocytaire n'est pas spécifique d'une étiologie."},E:{v:false,t:"FAUX. Une protéinorachie à 0,7 g/L est modérément élevée mais compatible avec une méningite virale. Les méningites virales s'accompagnent d'une hyperprotéinorachie modérée (< 1 g/L en général). Ce n'est pas un critère d'exclusion. Une protéinorachie > 2 g/L oriente davantage vers une étiologie bactérienne."}}
      },
      {
        id:"151-qi13",type:"QRM",
        stem:"Un homme de 72 ans, sous prednisone 20 mg/j pour une vascularite, est hospitalisé pour syndrome méningé fébrile. La PL retrouve un LCS trouble. L'examen direct est négatif. Quelles sont les 3 molécules de l'antibiothérapie probabiliste que vous prescrivez ? (trois réponses attendues)",
        choices:[{id:"A",text:"Céfotaxime ou ceftriaxone IV à forte dose"},{id:"B",text:"Amoxicilline IV à forte dose"},{id:"C",text:"Gentamicine IV"},{id:"D",text:"Vancomycine IV"},{id:"E",text:"Métronidazole IV"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. La C3G injectable (céfotaxime ou ceftriaxone) est la base du traitement probabiliste de toute méningite bactérienne présumée. Elle couvre méningocoque, pneumocoque (y compris les souches de sensibilité diminuée à la pénicilline), streptocoques et la plupart des BGN."},B:{v:true,t:"VRAI. L'amoxicilline IV est indispensable ici car ce patient est âgé de 72 ans ET immunodéprimé (prednisone = immunosuppression cellulaire). Ces deux facteurs constituent des arguments forts pour suspecter une Listeria monocytogenes — le seul germe couvert par l'amoxicilline et non par les C3G. La LiSA : 'si Listeria suspectée → C3G + amoxicilline IV + gentamicine IV'."},C:{v:true,t:"VRAI. La gentamicine est associée à l'amoxicilline pour son effet synergique bactéricide sur Listeria monocytogenes. Cette trithérapie (C3G + amoxicilline + gentamicine) est le traitement probabiliste recommandé quand Listeria est suspectée (terrain : > 50 ans, immunodéprimé, grossesse)."},D:{v:false,t:"FAUX. La vancomycine n'est pas indiquée en probabiliste standard pour une méningite bactérienne de l'adulte sans résistance documentée. Elle serait discutée si le direct montre un pneumocoque de haut niveau de résistance aux C3G, ce qui n'est pas le cas ici (direct négatif)."},E:{v:false,t:"FAUX. Le métronidazole couvre les anaérobies (abcès cérébraux d'origine ORL/dentaire notamment) mais n'a pas d'indication en probabiliste dans une méningite bactérienne aiguë. Il est actif sur les anaérobies mais pas sur les germes habituellement responsables des méningites communautaires."}}
      },
      {
        id:"151-qi14",type:"QCU",
        stem:"Un homme de 28 ans est hospitalisé en service de maladies infectieuses pour méningite à Neisseria meningitidis sérogroupe B confirmée par hémocultures et culture du LCS. Il a reçu une première injection de ceftriaxone 2 g IV à l'admission, poursuivie à raison de 2 g toutes les 12 heures. À H+24 de la première injection, l'évolution clinique est favorable : apyrexie obtenue, régression du syndrome méningé, hémodynamique stable. Les précautions complémentaires respiratoires de type gouttelettes ont été instaurées dès l'admission. Concernant la levée de ces précautions, quelle proposition est exacte ?",
        choices:[{id:"A",text:"Les précautions sont maintenues jusqu'à la guérison clinique complète, soit en pratique 7 à 10 jours d'antibiothérapie"},{id:"B",text:"Les précautions peuvent être levées dès H+24 de l'antibiothérapie efficace"},{id:"C",text:"Les précautions sont automatiquement levées dès l'instauration de l'antibiothérapie efficace, sans délai supplémentaire"},{id:"D",text:"Les précautions doivent être renforcées en précautions aériennes (masque FFP2, chambre en pression négative) jusqu'à la guérison"},{id:"E",text:"Les précautions sont levées 48 heures après l'obtention de l'apyrexie"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. Le critère de levée des précautions gouttelettes n'est pas la guérison clinique mais la durée d'antibiothérapie efficace. Une C3G injectable à dose méningée éradique le portage nasopharyngé de Neisseria meningitidis en moins de 24 heures par sa concentration tissulaire élevée. Au-delà de cette fenêtre, le patient n'est plus contagieux par voie aérienne — même s'il reste fébrile, douloureux ou symptomatique. Maintenir l'isolement 7 à 10 jours serait une utilisation inappropriée des chambres d'isolement et alourdirait inutilement la prise en charge soignante. Contre-exemple : si la question avait porté sur l'isolement d'un patient atteint de tuberculose pulmonaire bacillifère, la réponse aurait été vraie — les précautions aériennes y sont maintenues jusqu'à négativation des examens microbiologiques, soit en pratique 15 jours minimum d'antituberculeux efficaces."},B:{v:true,t:"VRAI. Les précautions complémentaires respiratoires de type gouttelettes peuvent être levées après 24 heures d'antibiothérapie efficace par C3G injectable (ceftriaxone ou céfotaxime à dose méningée). Mécanisme : la ceftriaxone diffuse rapidement dans les sécrétions rhinopharyngées et éradique Neisseria meningitidis du portage nasopharyngé en moins de 24 heures. Au-delà, la transmission interhumaine par gouttelettes oro-nasopharyngées de plus de 5 μm devient impossible — le patient n'est plus à risque contagieux pour son entourage soignant ou familial. Point important souvent oublié : avant la sortie d'hospitalisation, le patient doit recevoir une dose d'antibiotique éradiquant le portage rhinopharyngé (rifampicine ou ceftriaxone IM monodose) car la C3G IV en traitement méningé ne garantit pas toujours une éradication complète à long terme du portage rhinopharyngé asymptomatique. Contre-exemple : si la question avait porté sur la levée des précautions chez un patient traité par amoxicilline seule, la réponse aurait été plus nuancée — l'amoxicilline n'éradique pas systématiquement le portage rhinopharyngé, et une fenêtre plus longue ou une éradication active par rifampicine serait préférable avant la levée."},C:{v:false,t:"FAUX. L'instauration de l'antibiothérapie ne dispense pas des précautions gouttelettes pendant les premières 24 heures. Le piège est subtil : ce n'est pas la prescription qui compte, mais la durée écoulée depuis l'injection efficace. Pendant les premières heures qui suivent la première dose, le portage nasopharyngé reste actif et le patient demeure contagieux. Lever les précautions immédiatement exposerait les soignants, les visiteurs et les autres patients hospitalisés à un risque résiduel de transmission par gouttelettes — particulièrement préoccupant chez les personnes immunodéprimées ou les nourrissons éventuellement présents dans le service. Contre-exemple : si la question avait été formulée 'les précautions peuvent être levées 24 heures après l'instauration d'une antibiothérapie efficace', elle aurait été vraie. La nuance entre 'à l'instauration' (immédiatement) et '24 heures après l'instauration' (délai de 24h) est exactement ce que teste le jury — vigilance absolue sur la temporalité dans les questions de précautions complémentaires."},D:{v:false,t:"FAUX. Les précautions aériennes (chambre individuelle en pression négative, masque FFP2 pour tout entrant) sont réservées aux infections à transmission aéroportée sur particules fines de moins de 5 μm en suspension dans l'air, c'est-à-dire : tuberculose pulmonaire bacillifère, rougeole, varicelle, zona disséminé ou ophtalmique, certaines fièvres hémorragiques virales, et en contexte épidémique le SARS-CoV-2 ou le SRAS lors d'aérosolisation. Neisseria meningitidis se transmet exclusivement par gouttelettes respiratoires de plus de 5 μm qui sédimentent à moins d'un mètre du patient — un masque chirurgical à distance suffit. Renforcer en précautions aériennes constituerait un sur-isolement disproportionné et inutile, mobilisant des ressources critiques (chambres en pression négative limitées) au détriment de patients qui en ont réellement besoin. Contre-exemple : si le patient avait développé concomitamment une pneumonie tuberculeuse bacillifère, les précautions aériennes (FFP2 + pression négative) auraient été indiquées pendant 15 jours minimum, indépendamment de la prise en charge du méningocoque."},E:{v:false,t:"FAUX. L'apyrexie n'est pas un critère décisionnel pour la levée des précautions gouttelettes dans la méningite à méningocoque. Le critère unique est la durée d'antibiothérapie efficace (24 heures). Mécanisme : la fièvre traduit la réponse inflammatoire systémique de l'hôte à l'infection, pas l'activité bactérienne dans le rhinopharynx. Un patient peut rester fébrile pendant 48-72 heures malgré une éradication efficace du portage (réponse inflammatoire prolongée) — il n'est plus contagieux pour autant. Inversement, un patient en apyrexie précoce après antipyrétiques pourrait théoriquement rester contagieux si l'ATB n'a pas encore eu le temps d'agir sur le portage rhinopharyngé. Contre-exemple : si la question avait porté sur la sortie d'hospitalisation, la résolution clinique complète (apyrexie stable, absence de syndrome méningé, syndrome inflammatoire en régression) serait évidemment requise — mais ces critères concernent l'évolution de la maladie, pas la transmissibilité de la bactérie qui est éradiquée bien avant la guérison clinique complète."}}
      },
      {
        id:"151-qi15",type:"QRM",
        stem:"Une femme de 46 ans est hospitalisée pour fièvre à 38,4°C, céphalées, confusion progressive et une crise convulsive partielle temporale survenue à domicile. L'examen retrouve des hallucinations olfactives, des troubles de la mémoire récente et un syndrome frontal. La PL montre : LCS clair, lymphocytes 240/mm³, protéinorachie 0,8 g/L, glycorachie normale. Concernant l'imagerie cérébrale indiquée dans cette situation, laquelle ou lesquelles des propositions est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'IRM cérébrale est l'examen de référence devant ce tableau d'encéphalite"},{id:"B",text:"L'IRM retrouvera un hypersignal T2-FLAIR des régions temporales internes, insulaires et du gyrus cingulaire"},{id:"C",text:"Le scanner cérébral sans injection est l'examen de première intention devant une suspicion d'encéphalite herpétique"},{id:"D",text:"L'IRM doit être réalisée avant de débuter l'aciclovir afin de guider la décision thérapeutique"},{id:"E",text:"Un scanner cérébral normal exclut formellement une encéphalite herpétique"}],
        correct:["A","B"],
        explanations:{A:{v:true,t:"VRAI. L'IRM cérébrale est l'examen clé pour le diagnostic de méningo-encéphalite. La LiSA OIC-151-11-A : 'L'IRM cérébrale est l'examen clé d'imagerie en cas de suspicion d'abcès cérébral ou de méningo-encéphalite.' Elle est supérieure au scanner pour détecter les anomalies temporales précoces caractéristiques de l'encéphalite herpétique."},B:{v:true,t:"VRAI. L'encéphalite herpétique (HSV-1) touche préférentiellement les régions temporales internes (hippocampe, amygdale), les régions insulaires et le gyrus cingulaire. L'IRM montre un hypersignal T2-FLAIR dans ces territoires, souvent bilatéral et asymétrique, avec restriction en diffusion (DWI) en phase aiguë."},C:{v:false,t:"FAUX. Le scanner cérébral n'est pas l'examen de référence pour l'encéphalite herpétique. Il peut être normal au stade précoce (premières 48h). L'IRM est beaucoup plus sensible pour détecter les anomalies temporales précoces."},D:{v:false,t:"FAUX. C'est exactement l'inverse de la recommandation. La LiSA OIC-151-11-A précise : 'En cas de suspicion d'encéphalite herpétique, la réalisation de l'examen d'imagerie ne doit pas retarder la mise en route du traitement par aciclovir intraveineux.' L'aciclovir est débuté immédiatement, l'IRM peut être réalisée après."},E:{v:false,t:"FAUX. Un scanner cérébral normal n'exclut pas une encéphalite herpétique — il peut être totalement normal dans les premières 48 à 72 heures. L'absence d'anomalie au scanner ne dispense pas de l'aciclovir si le tableau clinique est évocateur."}}
      },
      {
        id:"151-qi16",type:"QRM",
        stem:"Un homme de 38 ans, originaire du Mali, est hospitalisé pour altération de l'état général progressive depuis 3 semaines, fièvre modérée à 38,2°C et céphalées. Il est séropositif pour le VIH avec CD4 à 65/mm³ non traité. La PL retrouve : leucocytes 140/mm³ (90% lymphocytes), protéinorachie 1,1 g/L, glycorachie 1,9 mmol/L/glycémie 5,8 mmol/L, lactatorachie 3,5 mmol/L. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le profil cytochimique du LCS est compatible avec une méningite tuberculeuse"},{id:"B",text:"Une méningite cryptococcique doit être évoquée dans ce contexte"},{id:"C",text:"Une PCR Mycobacterium tuberculosis dans le LCS doit être demandée"},{id:"D",text:"La corticothérapie est systématiquement contre-indiquée dans la méningite tuberculeuse"},{id:"E",text:"Un traitement probabiliste par quadrithérapie antituberculeuse doit être débuté immédiatement avant tout résultat"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. Le profil est typique d'une méningite à évolution lente lymphocytaire hypoglycorrachique : lymphocytose prédominante (90%), hypoglycorrachie (rapport 0,33 < 0,4), hyperprotéinorachie et lactatorachie élevée. Ce profil est compatible avec une méningite tuberculeuse, mais aussi une méningite cryptococcique (très fréquente dans ce contexte VIH avec CD4 < 100)."},B:{v:true,t:"VRAI. La méningite cryptococcique (Cryptococcus neoformans) est une infection opportuniste majeure chez les patients VIH avec CD4 < 100/mm³. Elle se présente comme une méningite lymphocytaire hypoglycorrachique d'évolution insidieuse — exactement ce tableau. La recherche d'antigène cryptococcique dans le LCS (et le sérum) et l'encre de Chine doivent être demandées systématiquement."},C:{v:true,t:"VRAI. La PCR Mycobacterium tuberculosis dans le LCS est un examen clé pour le diagnostic de méningite tuberculeuse. Elle peut être réalisée sur le LCS même si la quantité de mycobactéries est faible. L'IGRA sanguin (Quantiféron) et l'IDR peuvent orienter mais sont moins spécifiques."},D:{v:false,t:"FAUX. C'est l'inverse. La dexaméthasone est RECOMMANDÉE dans la méningite tuberculeuse de stade II ou III (avec altération de conscience ou signes neurologiques focaux), selon les recommandations OMS et les études cliniques (dont l'étude de Thwaites, NEJM 2004). Elle réduit la mortalité et les séquelles neurologiques."},E:{v:false,t:"FAUX. Le traitement probabiliste par quadrithérapie antituberculeuse sans documentation est discuté mais ne doit pas être débuté 'immédiatement avant tout résultat' si l'état clinique permet d'attendre un minimum de bilan. La méningite cryptococcique (aussi probable ici) nécessite un traitement totalement différent (amphotéricine B + flucytosine). Un diagnostic différentiel entre tuberculose et cryptococcose est indispensable avant de débuter."}}
      },
      {
        id:"151-qi17",type:"QRM",
        stem:"Un étudiant de 20 ans, non vacciné contre le méningocoque, est hospitalisé pour fièvre à 40,2°C d'installation brutale, céphalées intenses, vomissements et raideur de nuque. À l'examen, un purpura pétéchial des membres inférieurs est présent. Parmi les propositions suivantes concernant les caractéristiques de la méningite à méningocoque, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le méningocoque est un diplocoque à Gram négatif encapsulé"},{id:"B",text:"L'homme est le seul réservoir du méningocoque"},{id:"C",text:"Des signes de localisation neurologique focaux sont fréquents dans la méningite à méningocoque"},{id:"D",text:"Le début clinique est typiquement brutal avec syndrome septicémique associé au syndrome méningé"},{id:"E",text:"La méningite à méningocoque survient préférentiellement chez le sujet jeune non immunisé"}],
        correct:["A","B","D","E"],
