<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDN Anki — Entraînement FSRS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f5f5f7;color:#1a1a2e;min-height:100vh;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 24px;border-bottom:2px solid #e0e0e0;position:sticky;top:0;z-index:100;}
.header-left{display:flex;align-items:center;gap:16px;}
.logo{font-size:22px;font-weight:800;color:#1b2a4a;letter-spacing:-0.5px;}
.logo span{color:#e84670;}
.user-info{display:flex;align-items:center;gap:8px;color:#555;font-size:13px;}
.user-icon{width:28px;height:28px;border-radius:50%;background:#1b2a4a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
.header-center{display:flex;align-items:center;gap:16px;}
.progress-pill{background:#1b2a4a;color:#fff;padding:6px 20px;border-radius:20px;font-size:13px;font-weight:600;}
.timer{text-align:right;font-size:12px;color:#e84670;line-height:1.4;}
.timer .label{color:#999;font-size:11px;}
.btn-end{background:#e84670;color:#fff;border:none;padding:10px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-end:hover{background:#d13560;}

/* LAYOUT */
.main-layout{display:flex;max-width:1300px;margin:0 auto;padding:20px 24px;gap:24px;}
.content-area{flex:1;min-width:0;}
.sidebar{width:260px;flex-shrink:0;}

/* QUESTION HEADER */
.qi-banner{background:#1b2a4a;color:#fff;padding:12px 20px;font-size:18px;font-weight:700;border-radius:6px 6px 0 0;margin-bottom:0;}
.question-card{background:#fff;border-radius:0 0 6px 6px;padding:28px 32px;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin-bottom:20px;}
.question-type{color:#e84670;font-weight:700;font-size:15px;margin-bottom:6px;}
.question-meta{color:#888;font-size:13px;margin-bottom:16px;}
.question-stem{font-size:15px;line-height:1.65;color:#222;margin-bottom:24px;}

/* PROPOSITIONS - style annales papier */
.propositions{display:flex;flex-direction:column;gap:12px;margin-bottom:28px;}
.prop-block{border:1px solid #d0d0d0;border-radius:4px;overflow:hidden;cursor:pointer;transition:border-color 0.15s;}
.prop-block:hover{border-color:#1b2a4a;}
.prop-block.selected{border-color:#1b2a4a;border-width:2px;}
.prop-header{background:#ededed;padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;}
.prop-header input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#1b2a4a;}
.prop-body{padding:10px 14px 12px 40px;font-size:14px;line-height:1.5;color:#333;}

/* CORRECTION STYLES */
.prop-block.correct-yes{border-color:#2ecc71;border-width:2px;background:#f0fdf4;}
.prop-block.correct-no{border-color:#e74c3c;border-width:2px;background:#fef2f2;}
.prop-block.missed{border-color:#f39c12;border-width:2px;background:#fffbeb;}
.correction-text{padding:8px 14px 12px 40px;font-size:13px;line-height:1.55;color:#444;border-top:1px solid #e5e5e5;background:#fafafa;}
.correction-text .verdict{font-weight:700;margin-right:4px;}
.verdict.true{color:#2ecc71;}
.verdict.false{color:#e74c3c;}

/* VALIDATE BUTTON */
.btn-validate{display:block;margin:0 auto;background:#e84670;color:#fff;border:none;padding:14px 48px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px;}
.btn-validate:hover{background:#d13560;transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,70,112,0.3);}
.btn-validate:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none;}

/* FSRS BUTTONS */
.fsrs-buttons{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap;}
.fsrs-btn{padding:12px 24px;border:2px solid;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;min-width:110px;text-align:center;}
.fsrs-btn.easy{border-color:#2ecc71;color:#2ecc71;background:#f0fdf4;}
.fsrs-btn.easy:hover{background:#2ecc71;color:#fff;}
.fsrs-btn.correct{border-color:#3498db;color:#3498db;background:#eff6ff;}
.fsrs-btn.correct:hover{background:#3498db;color:#fff;}
.fsrs-btn.medium{border-color:#f39c12;color:#f39c12;background:#fffbeb;}
.fsrs-btn.medium:hover{background:#f39c12;color:#fff;}
.fsrs-btn.wrong{border-color:#e74c3c;color:#e74c3c;background:#fef2f2;}
.fsrs-btn.wrong:hover{background:#e74c3c;color:#fff;}
.fsrs-interval{display:block;font-size:11px;font-weight:400;margin-top:3px;opacity:0.7;}

/* SCORE DISPLAY */
.score-display{text-align:center;background:#fff;padding:20px;border-radius:8px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.score-display .score-value{font-size:36px;font-weight:800;color:#1b2a4a;}
.score-display .score-label{font-size:13px;color:#888;margin-top:4px;}

/* SIDEBAR */
.sidebar-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:16px;}
.sidebar-card h3{font-size:14px;font-weight:700;color:#1b2a4a;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #eee;}
.sidebar-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid #e8e8e8;border-radius:6px;margin-bottom:6px;font-size:13px;cursor:pointer;transition:background 0.1s;}
.sidebar-item:hover{background:#f0f4ff;}
.sidebar-item.active{background:#1b2a4a;color:#fff;border-color:#1b2a4a;}
.sidebar-item.locked{opacity:0.45;cursor:not-allowed;}
.sidebar-item.locked:hover{background:#fff;color:inherit;}

/* HISTORIQUE DES SESSIONS */
.history-section{max-width:700px;margin:40px auto 0;}
.history-section h2{font-size:18px;color:#1b2a4a;margin-bottom:14px;font-weight:700;}
.history-grid{display:flex;flex-direction:column;gap:10px;}
.history-card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:14px 18px;transition:all 0.15s;}
.history-card:hover{border-color:#1b2a4a;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
.history-meta{flex:1;min-width:0;}
.history-date{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.5px;}
.history-item-label{font-size:14px;color:#1b2a4a;font-weight:600;margin-top:2px;}
.history-stats{display:flex;flex-direction:column;align-items:flex-end;min-width:60px;}
.history-score{font-size:16px;font-weight:700;color:#1b2a4a;}
.history-rate{font-size:12px;color:#666;}
.history-actions{display:flex;gap:6px;}
.btn-history-view{background:#1b2a4a;color:#fff;border:none;padding:7px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;}
.btn-history-view:hover{background:#253a5e;}
.btn-history-del{background:none;border:1px solid #ddd;color:#999;width:28px;height:28px;border-radius:5px;font-size:16px;cursor:pointer;line-height:1;}
.btn-history-del:hover{border-color:#e74c3c;color:#e74c3c;}

/* CARTE ANCRAGES */
.ancrages-card{background:linear-gradient(135deg,#1b2a4a 0%,#253a5e 100%);border-color:#1b2a4a;}
.ancrages-card .item-label,.ancrages-card .item-title,.ancrages-card .item-count,.ancrages-card .item-due{color:#fff;}
.ancrages-card .item-count{color:#e84670;font-weight:800;}
.ancrages-card:hover{box-shadow:0 4px 14px rgba(27,42,74,0.3);}

/* BOUTONS DU BAS — Historique + Gérer la progression */
.btn-bottom{background:#fff;border:1px solid #d0d5dd;color:#1b2a4a;padding:11px 22px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:all 0.15s;}
.btn-bottom:hover{background:#1b2a4a;color:#fff;border-color:#1b2a4a;}
.btn-bottom:hover .btn-bottom-count{background:#fff;color:#1b2a4a;}
.btn-bottom-count{background:#1b2a4a;color:#fff;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;min-width:18px;text-align:center;}
.btn-bottom-warn{color:#8a6000;border-color:#f0d060;background:#fffbeb;}
.btn-bottom-warn:hover{background:#8a6000;color:#fff;border-color:#8a6000;}

/* MENU MODE DE SESSION (item-menu) */
.mode-grid{display:flex;flex-direction:column;gap:12px;}
.mode-card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #d0d5dd;border-radius:8px;padding:18px 22px;cursor:pointer;transition:all 0.15s;}
.mode-card:hover{border-color:#1b2a4a;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.mode-info{flex:1;}
.mode-title{font-size:15px;color:#1b2a4a;font-weight:700;}
.mode-sub{font-size:12px;color:#666;margin-top:4px;}
.mode-count{font-size:24px;font-weight:800;color:#e84670;min-width:50px;text-align:right;}
.mode-practice{background:#fffbeb;border-color:#f0d060;}
.mode-practice .mode-count{color:#8a6000;}
.mode-practice:hover{border-color:#8a6000;}

/* POSTPONE — Décaler une question */
.postpone-row{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
.postpone-row button{flex:1;min-width:42px;background:#f5f5f7;border:1px solid #d0d5dd;color:#1b2a4a;padding:6px 8px;font-size:12px;font-weight:600;border-radius:4px;cursor:pointer;}
.postpone-row button:hover{background:#1b2a4a;color:#fff;border-color:#1b2a4a;}

/* BOUTON PAUSE ACTIF */
.btn-bottom-pause-on{background:#8a6000;color:#fff;border-color:#8a6000;}
.btn-bottom-pause-on:hover{background:#a87800;}
.sidebar-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.badge-due{background:#fef2f2;color:#e74c3c;}
.badge-done{background:#f0fdf4;color:#2ecc71;}
.badge-new{background:#eff6ff;color:#3498db;}

/* NOTES */
.note-toggle{display:inline-flex;align-items:center;background:#fff;border:1px solid #1b2a4a;padding:8px 18px;border-radius:4px;font-size:11px;font-weight:700;color:#1b2a4a;cursor:pointer;margin-top:18px;letter-spacing:0.5px;text-transform:uppercase;transition:all 0.15s;}
.note-toggle:hover{background:#1b2a4a;color:#fff;}
.note-toggle svg{margin-right:7px;}
.note-editor{margin-top:12px;display:none;}
.note-editor.open{display:block;}
.note-editor textarea{width:100%;min-height:90px;border:1px solid #ccc;border-radius:4px;padding:12px;font-size:13px;font-family:inherit;resize:vertical;}
.note-editor .note-actions{display:flex;gap:8px;margin-top:8px;}
.note-saved{background:#f5f5f7;border-left:3px solid #1b2a4a;border-radius:0;padding:12px 16px;font-size:13px;margin-top:14px;line-height:1.6;color:#333;font-style:italic;white-space:pre-wrap;}

/* REVIEW SESSION */
.review-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding:16px;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.review-nav button{padding:10px 24px;}
.review-nav button:disabled{opacity:0.4;cursor:not-allowed;}
.session-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px;}
.btn-secondary{background:#666;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-secondary:hover{background:#555;}
.graded-status{text-align:center;margin-top:18px;padding:10px 16px;background:#f0fdf4;border:1px solid #a7f3d0;border-radius:6px;color:#065f46;font-size:13px;font-weight:600;}

/* HOME */
.home-hero{text-align:center;padding:48px 20px;}
.home-hero h1{font-size:28px;font-weight:800;color:#1b2a4a;margin-bottom:8px;}
.home-hero p{color:#666;font-size:15px;margin-bottom:32px;}
.item-grid{display:flex;flex-direction:column;gap:12px;max-width:700px;margin:0 auto;}
.item-card{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:18px 24px;cursor:pointer;transition:all 0.15s;}
.item-card:hover{border-color:#1b2a4a;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.item-card .item-label{font-weight:700;color:#1b2a4a;font-size:15px;}
.item-card .item-title{color:#555;font-size:13px;margin-top:2px;}
.item-card .item-stats{text-align:right;}
.item-card .item-count{font-size:22px;font-weight:800;color:#e84670;}
.item-card .item-due{font-size:12px;color:#888;}

/* DONE SCREEN */
.done-screen{text-align:center;padding:60px 20px;}
.done-screen h2{font-size:24px;font-weight:800;color:#1b2a4a;margin-bottom:12px;}
.done-screen p{color:#666;margin-bottom:24px;}
.btn-home{background:#1b2a4a;color:#fff;border:none;padding:12px 32px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
.btn-home:hover{background:#253a5e;}

/* RESET */
.btn-reset{background:none;border:1px solid #e74c3c;color:#e74c3c;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;margin-top:12px;}
.btn-reset:hover{background:#e74c3c;color:#fff;}

/* DP / KFP VIGNETTE BOX */
.dp-vignette-box{background:#f0f4ff;border:2px solid #1b2a4a;border-radius:8px;padding:16px 20px;margin-bottom:16px;}
.dp-badge{font-size:11px;font-weight:800;color:#1b2a4a;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;opacity:0.7;}
.dp-vignette-text{font-size:14px;line-height:1.7;color:#1a1a2e;}
.kfp-vignette-box{background:#fff8f0;border:2px solid #e84670;border-radius:8px;padding:16px 20px;margin-bottom:16px;}
.kfp-badge{font-size:11px;font-weight:800;color:#e84670;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.xl-note{background:#fffbeb;border:1px solid #f0d060;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;color:#8a6000;margin-bottom:12px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">EDN <span>Anki</span></div>
    <div class="user-info"><div class="user-icon">EK</div><div>Eddi<br>Karadag</div></div>
  </div>
  <div class="header-center">
    <div class="progress-pill" id="progressPill">Progression : 0%</div>
    <div class="timer">
      <div class="label">Durée écoulée :</div>
      <div id="timerDisplay">00:00</div>
    </div>
  </div>
  <div>
    <button class="btn-end" onclick="goHome()">Terminer l'épreuve</button>
  </div>
</div>

<div class="main-layout">
  <div class="content-area" id="contentArea"></div>
  <div class="sidebar" id="sidebarArea"></div>
</div>

<script>
const ITEMS=[
  {
    id:"177",label:"Item 177",title:"Anti-infectieux",subtitle:"Prescription et surveillance",
    questions:[
      {
        id:"177-01",type:"QCU",
        stem:"Un homme de 48 ans, sans allergie connue, est hospitalisé pour fièvre à 39,8°C avec frissons. Quatre flacons d'hémocultures reviennent positifs pour des cocci à Gram positif en amas. L'antibiogramme du lendemain confirme Staphylococcus aureus méticilline-sensible, sensible à toutes les bêtalactamines testées. Parmi les antibiotiques suivants, lequel est le plus approprié pour le traitement par voie parentérale ?",
        choices:[{id:"A",text:"Amoxicilline-acide clavulanique IV"},{id:"B",text:"Cloxacilline IV"},{id:"C",text:"Vancomycine IV"},{id:"D",text:"Daptomycine IV"},{id:"E",text:"Lévofloxacine per os"}],
        correct:["B"],
        explanations:{
          A:{v:false,t:"FAUX. L'amoxicilline-acide clavulanique n'est pas la référence pour les bactériémies à SASM. La cloxacilline lui est supérieure en termes de bactéricidie et de données cliniques dans les infections graves à staphylocoques méticilline-sensibles."},
          B:{v:true,t:"VRAI. La cloxacilline (pénicilline M) est l'antibiotique de référence pour toutes les infections graves à SASM chez un patient non allergique. Résistante à la pénicillinase staphylococcique, elle atteint des concentrations bactéricides bien supérieures à celles de la vancomycine sur le SASM."},
          C:{v:false,t:"FAUX. La vancomycine est INFÉRIEURE à la cloxacilline pour traiter un SASM : bactéricidie plus lente, pénétration tissulaire moindre, toxicité rénale et ototoxique. Elle est réservée au SARM ou aux allergies graves aux pénicillines M. Prescrire la vancomycine sur un SASM sans allergie constitue une faute thérapeutique sanctionnée par le jury."},
          D:{v:false,t:"FAUX. La daptomycine est une alternative dans certaines infections à SARM ou en cas d'allergie, mais n'est pas indiquée en première ligne sur un SASM chez un patient non allergique. La cloxacilline reste la référence."},
          E:{v:false,t:"FAUX. Les fluoroquinolones sont utilisées préférentiellement après documentation et ne sont pas indiquées en monothérapie probabiliste ni documentée en première intention dans les bactériémies à SASM. De plus, les staphylocoques développent rapidement des résistances aux fluoroquinolones."}
        }
      },
      {
        id:"177-02",type:"QRM",
        stem:"Une femme de 55 ans épileptique traitée par valproate consulte aux urgences pour une exacerbation de BPCO surinfectée. Elle rapporte une tendinopathie du tendon d'Achille droit survenue il y a 18 mois sous lévofloxacine. Son DFG est à 52 mL/min. L'ECG retrouve un QT mesuré à 460 ms. Parmi les propositions suivantes concernant la prescription d'une fluoroquinolone chez cette patiente, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'épilepsie représente une contre-indication absolue"},{id:"B",text:"L'antécédent de tendinopathie sous quinolone représente une contre-indication absolue"},{id:"C",text:"Le QT à 460 ms représente une contre-indication absolue"},{id:"D",text:"L'insuffisance rénale stade 3 représente une contre-indication absolue"},{id:"E",text:"Une adaptation posologique à la fonction rénale serait nécessaire"}],
        correct:["A","B","E"],
        explanations:{
          A:{v:true,t:"VRAI. L'épilepsie est une contre-indication absolue aux fluoroquinolones, indépendamment de l'équilibre du traitement antiépileptique en cours. Mécanisme : inhibition des récepteurs GABA-A, abaissant le seuil épileptogène. Chez cette patiente, même sous valproate équilibré, le risque de décompensation est réel."},
          B:{v:true,t:"VRAI. Un antécédent de tendinopathie sous quinolone est une contre-indication absolue. La récidive en cas de réexposition est quasi-systématique avec risque de rupture tendineuse irréversible, particulièrement au niveau du tendon d'Achille."},
          C:{v:false,t:"FAUX. L'allongement du QT n'est pas une contre-indication absolue listée pour les fluoroquinolones — c'est un effet indésirable documenté qui impose une précaution et une surveillance. La fiche LiSA liste comme CI absolues : épilepsie, ATCD tendinopathie, enfants/ados en croissance, grossesse/allaitement."},
          D:{v:false,t:"FAUX. L'insuffisance rénale stade 3 (DFG 30-60 mL/min) n'est pas une contre-indication absolue. Elle impose une adaptation posologique mais pas une contre-indication de prescription."},
          E:{v:true,t:"VRAI. Les fluoroquinolones ont une élimination urinaire prédominante. Un DFG à 52 mL/min impose une adaptation posologique pour éviter l'accumulation et la neurotoxicité. C'est rendu nécessaire par le DFG de la vignette — dans ce contexte précis."}
        }
      },
      {
        id:"177-03",type:"QRM",
        stem:"Une patiente de 54 ans est en réanimation pour un choc septique sur pyélonéphrite. Une antibiothérapie par ceftriaxone 2 g IV et amikacine est débutée. Son DFG de base est à 85 mL/min. Parmi les propositions suivantes concernant la prescription de l'amikacine, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'activité bactéricide de l'amikacine est temps-dépendante"},{id:"B",text:"L'administration en dose unique journalière est à privilégier"},{id:"C",text:"La toxicité cochléovestibulaire est réversible à l'arrêt du traitement"},{id:"D",text:"La toxicité rénale induite est le plus souvent réversible"},{id:"E",text:"Le pic plasmatique guide le risque de toxicité rénale"}],
        correct:["B","D"],
        explanations:{
          A:{v:false,t:"FAUX. L'activité bactéricide des aminosides est CONCENTRATION-dépendante (et non temps-dépendante comme les bêtalactamines). Leur efficacité est corrélée au ratio pic plasmatique/CMI. C'est le fondement pharmacodynamique de l'administration en dose unique journalière."},
          B:{v:true,t:"VRAI. L'administration en dose unique journalière (DUJ) optimise le pic de concentration pour l'efficacité bactéricide tout en limitant l'accumulation tissulaire responsable des toxicités rénale et auditive. C'est le schéma recommandé pour les infections graves en dehors de l'endocardite."},
          C:{v:false,t:"FAUX. La toxicité cochléovestibulaire des aminosides est IRRÉVERSIBLE — destruction définitive des cellules ciliées de l'organe de Corti et du vestibule, qui ne se régénèrent pas. C'est la notion de rang A la plus régulièrement piégée. En revanche, la néphrotoxicité est réversible."},
          D:{v:true,t:"VRAI. Les aminosides provoquent une nécrose tubulaire aiguë par toxicité tubulaire directe. Cette toxicité rénale régresse à l'arrêt du traitement dans la plupart des cas si la prise en charge est précoce, contrairement à la toxicité cochléovestibulaire irréversible."},
          E:{v:false,t:"FAUX. C'est la confusion classique : le PIC plasmatique évalue l'EFFICACITÉ thérapeutique (ratio pic/CMI cible > 8-10). C'est la concentration RÉSIDUELLE (creux) qui évalue le risque de toxicité rénale et guide l'espacement des doses."}
        }
      },
      {
        id:"177-04",type:"QRM",
        stem:"Un homme de 42 ans présente une pyélonéphrite aiguë droite. L'ECBU retrouve un E. coli sensible à l'amoxicilline, la ciprofloxacine, le cotrimoxazole, le céfixime et l'amoxicilline-acide clavulanique. Apyrétique à J3 sous ceftriaxone IV, vous discutez du relais oral. Vous souhaitez prescrire la molécule au plus faible impact écologique. Parmi les options suivantes, laquelle ou lesquelles est ou sont générateur ou générateurs de résistances bactériennes ?",
        choices:[{id:"A",text:"Amoxicilline"},{id:"B",text:"Ciprofloxacine"},{id:"C",text:"Cotrimoxazole"},{id:"D",text:"Amoxicilline-acide clavulanique"},{id:"E",text:"Céfixime"}],
        correct:["B","D","E"],
        explanations:{
          A:{v:false,t:"FAUX. L'amoxicilline n'est pas classée parmi les générateurs majeurs de résistances bactériennes. Son spectre étroit et son mécanisme d'action limitent la pression sélective sur les entérobactéries productrices de résistances. Ici elle n'est pas le premier choix pour une pyélonéphrite (mauvaise diffusion), mais son impact écologique est faible."},
          B:{v:true,t:"VRAI. Les fluoroquinolones sont des générateurs majeurs de résistances. Des mutations des gènes gyrA/parC sont sélectionnées dès la première cure. Une fluoroquinolone prescrite pour une pyélonéphrite peut sélectionner une entérobactérie multirésistante dans le microbiote intestinal — effet collatéral sur la résistance communautaire."},
          C:{v:false,t:"FAUX. Le cotrimoxazole ne figure pas dans la liste des générateurs majeurs de résistances à l'échelon collectif. Rendu sensible ici, c'est une option de relais oral avec un impact écologique raisonnable pour cette pyélonéphrite."},
          D:{v:true,t:"VRAI. L'amoxicilline-acide clavulanique est classée comme générateur de résistances. L'acide clavulanique sélectionne les entérobactéries hyperproductrices de céphalosporinase et favorise l'émergence d'EBLSE dans la communauté, même lors d'un usage ambulatoire bref."},
          E:{v:true,t:"VRAI. Les C3G orales (céfixime, cefpodoxime) ont un impact écologique disproportionné. Elles exercent une pression sélective sur le microbiote digestif, favorisant les EBLSE. Leur usage doit être restreint aux situations sans alternative thérapeutique."}
        }
      },
      {
        id:"177-05",type:"QRM",
        stem:"Un homme de 78 ans, grabataire en EHPAD, colonisé à E. coli EBLSE dans les urines depuis 8 mois, est hospitalisé pour fièvre à 38,7°C, ébranlement lombaire droit douloureux, frissons. À l'admission : PA 78/42 mmHg, FC 122/min, Glasgow 13/15. L'ECBU retrouve des bacilles à Gram négatif en grande abondance. Parmi les propositions suivantes concernant l'antibiothérapie probabiliste, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'amoxicilline-acide clavulanique est indiquée en probabiliste"},{id:"B",text:"Un carbapénème est justifié en probabiliste dans cette situation"},{id:"C",text:"Il faut attendre l'antibiogramme avant de débuter tout antibiotique"},{id:"D",text:"Un carbapénème probabiliste n'est justifié qu'en cas de choc septique ET facteur de risque d'EBLSE réunis"},{id:"E",text:"Une fluoroquinolone en probabiliste est une alternative au carbapénème dans ce tableau"}],
        correct:["B","D"],
        explanations:{
          A:{v:false,t:"FAUX. L'amoxicilline-acide clavulanique est inactif sur les entérobactéries EBLSE par définition. Ce patient est porteur connu d'un E. coli EBLSE, résistant à toutes les pénicillines et aux C3G. Prescrire cette molécule constitue une faute thérapeutique grave."},
          B:{v:true,t:"VRAI. Les deux conditions requises pour un carbapénème probabiliste sont réunies : choc septique (PA 78/42 mmHg) ET facteur de risque d'EBLSE connu (portage documenté depuis 8 mois). Cette situation est exactement l'indication validée du carbapénème probabiliste."},
          C:{v:false,t:"FAUX. Attendre l'antibiogramme avant tout antibiotique dans un choc septique est une erreur médicale grave. Chaque heure de retard à l'antibiothérapie dans un choc septique augmente la mortalité. L'antibiothérapie probabiliste doit être débutée dans l'heure suivant le diagnostic."},
          D:{v:true,t:"VRAI. C'est la règle absolue : les carbapénèmes en probabiliste ne sont justifiés que lorsque choc septique (ou dysfonction d'organe menaçant le pronostic vital) ET facteur de risque d'EBLSE sont SIMULTANÉMENT présents. Ici les deux conditions sont réunies."},
          E:{v:false,t:"FAUX. Les fluoroquinolones sont souvent inefficaces sur les souches EBLSE — la résistance aux fluoroquinolones est fréquemment associée au phénotype EBLSE (co-résistances plasmidiques). De plus, ce patient est en choc, justifiant un traitement bactéricide à spectre adapté."}
        }
      },
      {
        id:"177-06",type:"QRM",
        stem:"Une patiente de 32 ans, allaitant un nourrisson de 5 semaines, consulte pour une infection urinaire basse documentée à E. coli sensible au cotrimoxazole. Elle a un déficit en G6PD connu. Son DFG est à 68 mL/min. Son bilan hépatique est normal. Parmi les propositions suivantes, laquelle ou lesquelles représente ou représentent une contre-indication à la prescription de cotrimoxazole chez cette patiente ?",
        choices:[{id:"A",text:"L'allaitement d'un nourrisson de 5 semaines"},{id:"B",text:"Le déficit en G6PD"},{id:"C",text:"Le DFG à 68 mL/min"},{id:"D",text:"La normalité du bilan hépatique"},{id:"E",text:"L'âge de 32 ans"}],
        correct:["A","B"],
        explanations:{
          A:{v:true,t:"VRAI. L'allaitement est une contre-indication explicite au cotrimoxazole. Le sulfaméthoxazole passe dans le lait maternel et expose le nourrisson de 5 semaines au risque d'ictère nucléaire par déplacement de la bilirubine de l'albumine — particulièrement grave avant 6 semaines en raison de l'immaturité de la barrière hémato-encéphalique."},
          B:{v:true,t:"VRAI. Le déficit en G6PD est une contre-indication absolue. Le sulfaméthoxazole est un agent oxydant qui génère des corps de Heinz dans les érythrocytes déficients en G6PD, incapables de régénérer le NADPH protecteur. Résultat : hémolyse aiguë potentiellement sévère, comme avec la nitrofurantoïne ou la dapsone."},
          C:{v:false,t:"FAUX. Un DFG à 68 mL/min correspond à une insuffisance rénale modérée stade 3a. La contre-indication du cotrimoxazole concerne l'insuffisance rénale SÉVÈRE. À 68 mL/min, une adaptation posologique peut être envisagée mais ce n'est pas une contre-indication formelle."},
          D:{v:false,t:"FAUX. La normalité du bilan hépatique n'est pas une contre-indication — c'est au contraire rassurant. C'est l'atteinte hépatique sévère (cirrhose décompensée, hépatite fulminante) qui contre-indique le cotrimoxazole."},
          E:{v:false,t:"FAUX. L'âge de 32 ans n'est pas une contre-indication. Les contre-indications liées à l'âge concernent les nourrissons de moins de 6 semaines (risque d'ictère nucléaire), pas les adultes."}
        }
      },
      {
        id:"177-07",type:"QRM",
        stem:"Un patient de 52 ans est traité par vancomycine IV pour une spondylodiscite à SARM. Dix-huit minutes après le début de la première perfusion, une infirmière vous appelle : érythème diffus du visage, du cou et du tronc avec prurit intense. Pression artérielle 118/72 mmHg, fréquence cardiaque 92/min. Pas d'œdème facial, pas de bronchospasme. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Ce tableau évoque un red man syndrome par perfusion trop rapide"},{id:"B",text:"Cet épisode impose l'arrêt définitif de la vancomycine"},{id:"C",text:"Il est possible de reprendre la vancomycine en ralentissant la vitesse de perfusion"},{id:"D",text:"La vancomycine expose à une ototoxicité irréversible"},{id:"E",text:"Ce tableau est une anaphylaxie IgE-médiée"}],
        correct:["A","C","D"],
        explanations:{
          A:{v:true,t:"VRAI. Le red man syndrome (flush, érythème diffus du visage et du tronc, prurit) survient en cas de perfusion trop rapide de vancomycine par libération non immunologique d'histamine par les mastocytes. La stabilité hémodynamique et l'absence d'urticaire ou d'œdème facial orientent contre une anaphylaxie vraie."},
          B:{v:false,t:"FAUX. Le red man syndrome n'impose pas l'arrêt définitif de la vancomycine. Il n'est pas immunologique — c'est une réaction pharmacologique liée à la vitesse de perfusion. La vancomycine peut être reprise en ralentissant la durée de perfusion, avec éventuellement une prémédication antihistaminique."},
          C:{v:true,t:"VRAI. La conduite à tenir est d'interrompre transitoirement la perfusion, puis de la reprendre à une vitesse réduite (durée minimale recommandée : 60 minutes, idéalement 90-120 minutes). Une prémédication par antihistaminique avant les perfusions suivantes peut être proposée."},
          D:{v:true,t:"VRAI. L'ototoxicité de la vancomycine est irréversible, comme celle des aminosides. Elle touche les cellules ciliées cochléaires et est favorisée par les surdosages et l'association aux aminosides. La néphrotoxicité, elle, est réversible à l'arrêt."},
          E:{v:false,t:"FAUX. Le red man syndrome est une réaction NON immunologique (histamine-médiée sans sensibilisation préalable). L'anaphylaxie IgE-médiée se manifeste par une urticaire, un œdème laryngé, un bronchospasme et une hypotension — absents ici. La confusion entre ces deux entités est un piège classique."}
        }
      },
      {
        id:"177-08",type:"QCU",
        stem:"Un enfant de 7 ans est pris en charge pour une infection ostéoarticulaire du genou à Staphylococcus aureus méticilline-sensible. Après 10 jours de traitement IV avec bonne évolution clinique et biologique, vous souhaitez effectuer un relais oral. L'enfant n'a aucune allergie connue. Parmi les propositions de relais oral suivantes, laquelle est contre-indiquée en raison de l'âge de cet enfant ?",
        choices:[{id:"A",text:"Amoxicilline"},{id:"B",text:"Clindamycine"},{id:"C",text:"Doxycycline"},{id:"D",text:"Cotrimoxazole"},{id:"E",text:"Rifampicine"}],
        correct:["C"],
        explanations:{
          A:{v:false,t:"FAUX. L'amoxicilline n'est pas contre-indiquée chez l'enfant de 7 ans. C'est un antibiotique de première intention en pédiatrie, sans risque lié à la croissance."},
          B:{v:false,t:"FAUX. La clindamycine n'est pas contre-indiquée chez l'enfant de 7 ans. Elle est même fréquemment utilisée en relais oral des infections ostéoarticulaires à staphylocoques en pédiatrie grâce à son excellente diffusion osseuse."},
          C:{v:true,t:"VRAI. Les cyclines (doxycycline, tétracycline) sont contre-indiquées chez l'enfant de moins de 8 ans. Mécanisme : chélation du calcium dans les dents en formation, entraînant des colorations permanentes jaune-brun irréversibles des dents définitives. Cet enfant de 7 ans est encore dans la fenêtre de contre-indication."},
          D:{v:false,t:"FAUX. Le cotrimoxazole est contre-indiqué uniquement chez les nourrissons de moins de 6 semaines (risque d'ictère nucléaire) et en cas de déficit en G6PD. À 7 ans sans ces facteurs, il n'est pas contre-indiqué."},
          E:{v:false,t:"FAUX. La rifampicine n'est pas contre-indiquée chez l'enfant de 7 ans. Elle est utilisée en association dans les infections ostéoarticulaires à staphylocoques, avec les mises en garde habituelles sur les interactions médicamenteuses (inducteur enzymatique)."}
        }
      },
      {
        id:"177-09",type:"QRM",
        stem:"Un homme de 41 ans transplanté rénal depuis 3 ans sous tacrolimus présente une fièvre à 38,6°C depuis 10 jours. La virémie CMV revient à 8 500 UI/mL. Le bilan retrouve : hémoglobine 10,2 g/dL, leucocytes 2,8 G/L, plaquettes 98 G/L. Parmi les propositions suivantes concernant le traitement de cette réactivation CMV, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le ganciclovir IV est le traitement de référence des formes graves à CMV"},{id:"B",text:"L'aciclovir per os peut traiter cette réactivation CMV"},{id:"C",text:"Le valganciclovir per os peut être utilisé dans cette situation"},{id:"D",text:"La myélotoxicité du traitement peut aggraver les cytopénies préexistantes"},{id:"E",text:"La ribavirine est l'alternative recommandée en cas de résistance au ganciclovir"}],
        correct:["A","C","D"],
        explanations:{
          A:{v:true,t:"VRAI. Le ganciclovir IV est le traitement de référence des formes graves à CMV (rétinite, colite, pneumopathie, encéphalite). Il inhibe l'ADN polymérase virale après phosphorylation par la kinase virale UL97. En cas de virémie élevée avec cytopénies associées, la forme IV permet une exposition plasmatique maximale."},
          B:{v:false,t:"FAUX. L'aciclovir est actif sur HSV-1, HSV-2 et VZV mais n'a PAS d'efficacité clinique sur le CMV. L'affinité de l'aciclovir pour la kinase UL97 du CMV est insuffisante pour atteindre des concentrations thérapeutiques intracellulaires. C'est une confusion de classe très fréquente."},
          C:{v:true,t:"VRAI. Le valganciclovir per os (prodrogue du ganciclovir, biodisponibilité orale 60%) atteint des concentrations plasmatiques équivalentes au ganciclovir IV et peut être utilisé dans les formes modérées ou en relais de la phase IV après stabilisation clinique et virologique."},
          D:{v:true,t:"VRAI. La myélotoxicité (neutropénie, thrombopénie, anémie) est l'effet indésirable majeur du ganciclovir/valganciclovir. Chez ce patient déjà cytopénique (leucocytes 2,8 G/L, Hb 10,2, plaquettes 98), le traitement peut aggraver ces anomalies — ce contexte précis rend cette proposition vraie."},
          E:{v:false,t:"FAUX. En cas de résistance au ganciclovir (mutations UL97 ou UL54), les alternatives sont le FOSCARNET (inhibiteur direct de l'ADN polymérase virale, sans nécessiter de phosphorylation) ou le CIDOFOVIR. La ribavirine est utilisée pour le VRS, le VHC et certaines fièvres hémorragiques virales — pas pour le CMV résistant."}
        }
      },
      {
        id:"177-10",type:"QRM",
        stem:"Un homme de 68 ans traité par colchicine 1 mg/j pour goutte chronique, atorvastatine 40 mg/j, bisoprolol 5 mg/j et warfarine pour une FA valvulaire (INR cible 2-3) reçoit de la clarithromycine pour une bronchite bactérienne documentée. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'association clarithromycine-colchicine est contre-indiquée"},{id:"B",text:"L'atorvastatine doit être suspendue pendant le traitement"},{id:"C",text:"La clarithromycine est un inducteur enzymatique du CYP3A4"},{id:"D",text:"La clarithromycine expose à un allongement de l'espace QT"},{id:"E",text:"La warfarine est sans interaction avec la clarithromycine"}],
        correct:["A","B","D"],
        explanations:{
          A:{v:true,t:"VRAI. L'association clarithromycine-colchicine est une contre-indication absolue. Les macrolides inhibent le CYP3A4 et la P-glycoprotéine, entraînant une accumulation de colchicine potentiellement mortelle (rhabdomyolyse, neuropathie, défaillance multiviscérale). Plusieurs décès ont été rapportés avec cette association. Chez ce patient, la colchicine doit être arrêtée ou la clarithromycine remplacée."},
          B:{v:true,t:"VRAI. L'atorvastatine est métabolisée par le CYP3A4. L'inhibition enzymatique par la clarithromycine entraîne une accumulation d'atorvastatine pouvant provoquer une myopathie ou une rhabdomyolyse. La statine doit être suspendue pendant la durée du traitement par macrolide."},
          C:{v:false,t:"FAUX. La clarithromycine est un puissant INHIBITEUR enzymatique du CYP3A4 — et non un inducteur. Les inducteurs (rifampicine, phénobarbital, carbamazépine) accélèrent le métabolisme et RÉDUISENT l'efficacité des substrats co-prescrits. La clarithromycine fait l'inverse : elle augmente les concentrations des substrats."},
          D:{v:true,t:"VRAI. L'allongement de l'espace QT est un effet indésirable de classe des macrolides par blocage des canaux IKr (canal HERG). Ce patient est déjà porteur d'une FA valvulaire — surveiller l'ECG et potentiellement éviter l'association avec d'autres allongeurs du QT."},
          E:{v:false,t:"FAUX. La warfarine est metabolisée par le CYP2C9 et le CYP3A4. La clarithromycine inhibe ces enzymes, augmentant les concentrations de warfarine et potentialisant son effet anticoagulant. L'INR doit être contrôlé 3-4 jours après introduction de la clarithromycine chez ce patient."}
        }
      },
      {
        id:"177-11",type:"QRM",
        stem:"Un homme de 74 ans diabétique de type 2, sans allergie connue, est admis pour fièvre à 39,5°C, céphalées intenses et raideur de nuque d'apparition brutale. Le scanner cérébral est normal. La ponction lombaire montre : leucocytes 8 400/mm³ (92% polynucléaires), protéinorachie à 3,1 g/L, glycorachie à 1,2 mmol/L pour une glycémie à 6,8 mmol/L. L'examen direct retrouve des diplocoques à Gram positif. Quelles sont les deux molécules que vous prescrivez en urgence ?",
        choices:[{id:"A",text:"Amoxicilline à fortes doses"},{id:"B",text:"Céfotaxime à fortes doses"},{id:"C",text:"Gentamicine à fortes doses"},{id:"D",text:"Vancomycine à fortes doses"},{id:"E",text:"Dexaméthasone"}],
        correct:["B","E"],
        explanations:{
          A:{v:false,t:"FAUX. L'amoxicilline n'est pas indiquée ici en probabiliste. Les diplocoques à Gram positif évoquent un pneumocoque — l'amoxicilline serait indiquée en relais documenté si la souche est pénicilline-sensible, ou en probabiliste si Listeria est suspectée (sujet âgé > 50 ans, immunodéprimé). Ce patient a 74 ans + diabète, ce qui représente un facteur de risque de Listeria — certains ajouteraient l'amoxicilline en association. Mais ici, l'examen direct est positif pour diplocoques Gram+ et la question demande les deux molécules principales — céfotaxime + dexaméthasone."},
          B:{v:true,t:"VRAI. La méningite purulente à diplocoques Gram positif (pneumocoque probable) impose une C3G injectable (céfotaxime ou ceftriaxone) à fortes doses en probabiliste. La C3G couvre le pneumocoque y compris les souches de sensibilité diminuée à la pénicilline."},
          C:{v:false,t:"FAUX. La gentamicine n'a pas d'indication dans les méningites bactériennes communautaires standards. Elle est indiquée en association à l'amoxicilline pour les méningites à Listeria monocytogenes. Ici l'examen direct montre des diplocoques Gram+ — pas de Listeria."},
          D:{v:false,t:"FAUX. La vancomycine peut être ajoutée en cas de suspicion de pneumocoque de très haut niveau de résistance aux C3G, mais ce n'est pas la prescription probabiliste standard. Elle ne fait pas partie des deux molécules de première intention dans ce tableau."},
          E:{v:true,t:"VRAI. La dexaméthasone (corticothérapie adjuvante) doit être administrée avant ou avec le premier antibiotique dans toute méningite bactérienne présumée de l'adulte. Elle réduit la mortalité et les séquelles neurologiques, notamment la surdité dans les méningites à pneumocoque."}
        }
      },
      {
        id:"177-12",type:"QRM",
        stem:"Un homme de 38 ans, allergie à l'amoxicilline documentée (urticaire généralisée survenue à l'âge adulte), est pris en charge pour une arthrite septique du genou à Staphylococcus aureus méticilline-sensible confirmée par ponction articulaire. Après 10 jours de traitement IV avec bonne évolution, vous envisagez un relais oral par clindamycine. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La clindamycine est une alternative justifiée dans ce contexte d'allergie aux pénicillines"},{id:"B",text:"La clindamycine a une excellente diffusion osseuse et articulaire"},{id:"C",text:"La clindamycine expose à un risque de colite à Clostridioides difficile"},{id:"D",text:"La clindamycine est contre-indiquée en cas d'allergie documentée aux pénicillines"},{id:"E",text:"La clindamycine couvre Pseudomonas aeruginosa"}],
        correct:["A","B","C"],
        explanations:{
          A:{v:true,t:"VRAI. La clindamycine (lincosamide) est une alternative validée aux bêtalactamines en cas d'allergie documentée, avec une activité sur S. aureus méticilline-sensible, les streptocoques et les anaérobies. Pas de cross-réactivité avec les pénicillines."},
          B:{v:true,t:"VRAI. La clindamycine présente une excellente pénétration dans les tissus osseux et articulaires (ratio tissu osseux/plasma élevé), ce qui justifie son utilisation préférentielle dans les infections ostéoarticulaires. C'est une propriété pharmacocinétique essentielle pour le relais oral des IOA."},
          C:{v:true,t:"VRAI. La colite pseudomembraneuse à C. difficile est un effet indésirable majeur de la clindamycine — historiquement la molécule la plus impliquée dans les colites à C. difficile. Le risque persiste même après une courte cure per os. Le patient doit être informé de consulter en cas de diarrhée abondante."},
          D:{v:false,t:"FAUX. La clindamycine (lincosamide) et les pénicillines (bêtalactamines) appartiennent à deux familles chimiques et mécanistiques totalement différentes. Il n'existe aucune cross-réactivité entre ces deux classes. La clindamycine est précisément recommandée comme alternative en cas d'allergie aux pénicillines."},
          E:{v:false,t:"FAUX. Pseudomonas aeruginosa (BGN aérobie strict) est totalement hors spectre de la clindamycine. La clindamycine couvre les cocci Gram positifs (staphylocoques méti-S, streptocoques) et les anaérobies — pas les bacilles Gram négatifs aérobies."}
        }
      },
      {
        id:"177-13",type:"QRM",
        stem:"Une patiente de 44 ans séropositive pour le VIH avec CD4 à 110/mm³ est hospitalisée pour un abcès hépatique unique de 6 cm, à contenu liquidien hétérogène. La sérologie amibienne revient positive avec un titre élevé. Son médecin instaure un traitement par métronidazole. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le métronidazole est le traitement de référence de l'amibiase invasive"},{id:"B",text:"Le métronidazole est actif sur l'ensemble des bactéries anaérobies"},{id:"C",text:"L'association à l'alcool expose à un effet antabuse"},{id:"D",text:"Le métronidazole est actif sur Actinomyces"},{id:"E",text:"Le métronidazole potentialise l'effet des anticoagulants antivitamine K"}],
        correct:["A","C","E"],
        explanations:{
          A:{v:true,t:"VRAI. Le métronidazole est le traitement de référence de l'amibiase invasive (abcès hépatique amibien, colite amibienne invasive) et de la giardiose. Sa diffusion tissulaire excellente lui permet d'atteindre des concentrations bactéricides dans le foie, ce qui est essentiel pour traiter l'abcès amibien."},
          B:{v:false,t:"FAUX. Le métronidazole est actif sur la quasi-totalité des anaérobies STRICTES, mais avec deux exceptions importantes : Actinomyces et Cutibacterium (ex-Propionibacterium acnes) sont naturellement résistants. C'est le piège fondamental de cet item, régulièrement testé."},
          C:{v:true,t:"VRAI. L'effet antabuse (flush, nausées, vomissements, tachycardie lors de l'ingestion d'alcool) est un effet indésirable documenté du métronidazole par inhibition de l'aldéhyde déshydrogénase avec accumulation d'acétaldéhyde. Le patient doit être informé d'éviter tout alcool pendant ET dans les 48 heures suivant la fin du traitement."},
          D:{v:false,t:"FAUX. Actinomyces est une bactérie anaérobie naturellement RÉSISTANTE au métronidazole — c'est précisément l'exception clé à connaître. Le traitement de référence de l'actinomycose est l'amoxicilline à forte dose sur plusieurs mois."},
          E:{v:true,t:"VRAI. Le métronidazole potentialise l'effet anticoagulant des AVK (warfarine, acénocoumarol) par inhibition de leur métabolisme hépatique (CYP2C9). Cette interaction est explicitement listée dans la fiche LiSA. Bien que cette patiente ne soit pas sous AVK selon la vignette, c'est une propriété vraie du métronidazole, testable en proposition générale."}
        }
      },
      {
        id:"177-14",type:"QRM",
        stem:"Une femme de 34 ans découvre sa séropositivité VIH lors d'un bilan pré-nuptial. Elle est asymptomatique. La biologie retrouve des CD4 à 540/mm³ et une charge virale plasmatique à 18 000 copies/mL. Elle n'a aucune co-infection. Parmi les propositions suivantes concernant le traitement antirétroviral, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le traitement ARV est recommandé uniquement si les CD4 descendent sous 350/mm³"},{id:"B",text:"Le traitement ARV doit être instauré immédiatement"},{id:"C",text:"L'objectif virologique est d'obtenir une charge virale inférieure à 50 copies/mL"},{id:"D",text:"Une charge virale indétectable supprime le risque de transmission sexuelle du VIH"},{id:"E",text:"Le traitement ARV permettra d'éliminer le virus des réservoirs lymphocytaires"}],
        correct:["B","C","D"],
        explanations:{
          A:{v:false,t:"FAUX. Cette stratégie d'attente est abandonnée depuis les essais START et TEMPRANO (2015). Le traitement ARV est désormais recommandé immédiatement, quel que soit le taux de CD4, pour bénéficier des effets préventifs (complications non-sida cardiovasculaires, rénales, neurocognitives) et réduire la transmission."},
          B:{v:true,t:"VRAI. Le traitement ARV doit être instauré immédiatement quel que soit le taux de CD4 et la charge virale, selon les recommandations actuelles. Cette recommandation universelle s'applique même à cette patiente asymptomatique avec CD4 à 540/mm³."},
          C:{v:true,t:"VRAI. L'objectif virologique est la charge virale plasmatique inférieure à 50 copies/mL (indétectable). Ce seuil permet la reconstruction immunitaire progressive, réduit le risque de complications non-sida et est atteint dans la majorité des cas en 3 à 6 mois sous traitement bien conduit."},
          D:{v:true,t:"VRAI. Principe U=U (Undetectable = Untransmissable), validé par les études PARTNER et HPTN-052. Une patiente sous traitement ARV avec charge virale durablement indétectable ne transmet pas le VIH par voie sexuelle. Ce message est crucial pour cette patiente en âge de procréer, avant le mariage."},
          E:{v:false,t:"FAUX. Le traitement ARV inhibe la réplication virale mais ne permet pas l'élimination du virus archivé dans les réservoirs (lymphocytes T CD4 mémoires en latence profonde, macrophages). L'arrêt du traitement entraîne systématiquement un rebond virologique. La guérison du VIH reste impossible en pratique courante."}
        }
      },
      {
        id:"177-15",type:"QRM",
        stem:"Une femme de 33 ans est hospitalisée à J10 d'une chimiothérapie aplasiante (FOLFOX) pour un cancer colorectal. Elle présente une fièvre à 40,2°C avec frissons. La NFS retrouve des polynucléaires neutrophiles à 0,15 G/L. Elle a quelques brûlures mictionnelles et une douleur lombaire gauche. La pression artérielle est à 115/70 mmHg. Quels sont les deux éléments à mettre en œuvre sans délai ?",
        choices:[{id:"A",text:"Prescription d'un antipyrétique seul en attendant les résultats"},{id:"B",text:"Prélèvement d'hémocultures aérobies et anaérobies"},{id:"C",text:"Antibiothérapie probabiliste IV à large spectre active sur les bacilles à Gram négatif"},{id:"D",text:"Attente des résultats de l'ECBU avant de débuter l'antibiothérapie"},{id:"E",text:"Myélogramme en urgence pour évaluation de la moelle"}],
        correct:["B","C"],
        explanations:{
          A:{v:false,t:"FAUX. Prescrire uniquement un antipyrétique et attendre dans une neutropénie fébrile est une erreur médicale grave. Toute neutropénie fébrile (PN < 500/mm³) avec température ≥ 38,5°C ou deux fois ≥ 38°C constitue une urgence infectieuse nécessitant un bilan microbiologique immédiat ET une antibiothérapie dans l'heure."},
          B:{v:true,t:"VRAI. Les hémocultures (aérobies et anaérobies, 2 paires minimum) doivent être prélevées AVANT l'antibiothérapie pour maximiser les chances d'isoler le germe et adapter secondairement le traitement. Elles ne doivent pas retarder l'antibiothérapie."},
          C:{v:true,t:"VRAI. L'antibiothérapie probabiliste IV active sur les bacilles à Gram négatif (BGN) doit être débutée dans l'heure suivant le diagnostic. Les BGN sont les principaux germes impliqués dans les bactériémies du neutropénique. La pipéracilline-tazobactam, la ceftazidime ou le céfépime sont les options habituelles selon le profil de résistance local."},
          D:{v:false,t:"FAUX. Attendre les résultats de l'ECBU avant l'antibiothérapie est inacceptable dans une neutropénie fébrile. Les résultats microbiologiques guideront l'adaptation thérapeutique secondaire — ils ne doivent pas retarder la mise en route d'une antibiothérapie empirique dans l'heure."},
          E:{v:false,t:"FAUX. Le myélogramme n'est pas indiqué en urgence dans ce tableau de neutropénie post-chimiothérapie prévisible (J10 de FOLFOX). Il serait discuté en cas de suspicion d'aplasie médullaire primitive ou de myélodysplasie, pas dans ce contexte."}
        }
      },
      {
        id:"177-16",type:"QCU",
        stem:"Un homme de 52 ans consulte pour des brûlures mictionnelles, une pollakiurie et une fièvre à 39,1°C depuis 48 heures. Il décrit des douleurs périnéales intenses et un inconfort à la défécation. Le toucher rectal retrouve une prostate tendue et exquisément douloureuse. La bandelette urinaire est positive pour leucocytes et nitrites. L'ECBU est prélevé. Quelle antibiothérapie probabiliste prescrivez-vous en première intention ? (une seule réponse attendue)",
        choices:[{id:"A",text:"Amoxicilline per os"},{id:"B",text:"Cotrimoxazole per os"},{id:"C",text:"Ciprofloxacine per os"},{id:"D",text:"Ceftriaxone IV"},{id:"E",text:"Amoxicilline-acide clavulanique per os"}],
        correct:["C"],
        explanations:{
          A:{v:false,t:"FAUX. L'amoxicilline a une mauvaise diffusion dans le tissu prostatique et n'est pas indiquée dans les prostatites aiguës. Son faible ratio prostate/plasma la rend inefficace comme traitement probabiliste de ce tableau."},
          B:{v:false,t:"FAUX. Le cotrimoxazole a une bonne diffusion prostatique mais n'est PAS indiqué en probabiliste — il est réservé au traitement documenté après antibiogramme. La fiche LiSA liste les infections urinaires masculines parmi les exceptions d'utilisation probabiliste des FLUOROQUINOLONES, pas du cotrimoxazole."},
          C:{v:true,t:"VRAI. Les infections urinaires masculines (prostatites aiguës) constituent l'une des deux seules exceptions d'utilisation probabiliste des fluoroquinolones, avec les pyélonéphrites. Justification : excellente diffusion prostatique (ratio prostate/plasma > 3) permettant des concentrations bactéricides dans la prostate même sans documentation microbiologique préalable. Ciprofloxacine 500 mg x2/j per os pendant 14 jours."},
          D:{v:false,t:"FAUX. La ceftriaxone IV n'est pas indiquée en première intention dans une prostatite aiguë non compliquée. Son faible ratio de diffusion prostatique par rapport aux fluoroquinolones la rend suboptimale dans cette indication. Elle peut être discutée en cas de contre-indication aux fluoroquinolones."},
          E:{v:false,t:"FAUX. L'amoxicilline-acide clavulanique a une diffusion prostatique insuffisante pour traiter une prostatite aiguë en probabiliste. De plus, il est classé générateur de résistances bactériennes — son utilisation injustifiée augmente la pression sélective."}
        }
      },
      {
        id:"177-17",type:"QRM",
        stem:"Les parents d'un garçon de 3 ans vous consultent. Il présente depuis 48 heures une rhinorrhée mucopurulente, une fièvre à 38,4°C et une toux. L'otoscopie est normale. L'état général est conservé. Les parents vous montrent l'ordonnance de leur médecin de ville prescrivant de l'amoxicilline 80 mg/kg/j et demandent votre avis. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La rhinopharyngite aiguë justifie une antibiothérapie"},{id:"B",text:"Cette prescription d'amoxicilline n'est pas justifiée dans cette situation"},{id:"C",text:"Les antibiotiques sont inefficaces sur les infections virales"},{id:"D",text:"Cette antibiothérapie expose cet enfant à une perturbation de son microbiote"},{id:"E",text:"La persistance de la fièvre à 48 heures impose une antibiothérapie systématique"}],
        correct:["B","C","D"],
        explanations:{
          A:{v:false,t:"FAUX. La rhinopharyngite aiguë est d'étiologie virale quasi exclusive (rhinovirus, coronavirus, adénovirus, VRS). Elle ne justifie aucune antibiothérapie. C'est la première cause de prescription antibiotique injustifiée en pédiatrie en France."},
          B:{v:true,t:"VRAI. Cette prescription n'est pas justifiée. La rhinopharyngite aiguë sans complication (pas d'otite, pas de signes de sinusite bactérienne, pas de fièvre > 3 jours) ne nécessite pas d'antibiotique. L'évolution est spontanément favorable en 7 à 10 jours avec traitement symptomatique (paracétamol, lavage nasal)."},
          C:{v:true,t:"VRAI. Les antibiotiques sont inactifs sur les virus. Prescrire des antibiotiques pour une infection virale n'en accélère pas la guérison, ne prévient pas les surinfections bactériennes, et expose à des effets indésirables. L'information parentale sur ce point est fondamentale pour réduire les prescriptions injustifiées."},
          D:{v:true,t:"VRAI. L'impact sur le microbiote intestinal est d'autant plus important que l'enfant est jeune. Une antibiothérapie chez un enfant de 3 ans perturbe le microbiote en cours de constitution, avec des conséquences potentielles à long terme sur le risque d'allergies, d'asthme et d'obésité selon les données épidémiologiques actuelles."},
          E:{v:false,t:"FAUX. La persistance de la fièvre à 48 heures impose une RÉÉVALUATION CLINIQUE (recherche d'une otite, d'une sinusite ou d'une autre complication) — pas une antibiothérapie systématique. Si l'examen clinique reste normal, l'abstention thérapeutique est maintenue."}
        }
      },
      {
        id:"177-18",type:"QRM",
        stem:"Un homme de 62 ans traité par méthotrexate 10 mg/semaine pour une polyarthrite rhumatoïde et par acénocoumarol pour une FA non valvulaire (INR cible 2-3) consulte pour une infection urinaire basse documentée à E. coli sensible au cotrimoxazole, à la fosfomycine et au pivmécillinam. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'association cotrimoxazole-méthotrexate expose à une majoration de la toxicité hématologique"},{id:"B",text:"Le cotrimoxazole inhibe la sécrétion tubulaire rénale du méthotrexate"},{id:"C",text:"L'association cotrimoxazole-acénocoumarol est sans risque chez ce patient"},{id:"D",text:"La fosfomycine trométamol monodose est une alternative à envisager dans cette situation"},{id:"E",text:"Le cotrimoxazole peut être prescrit sans précaution particulière chez ce patient"}],
        correct:["A","B","D"],
        explanations:{
          A:{v:true,t:"VRAI. Double mécanisme de toxicité hématologique : 1) Le triméthoprime inhibe la dihydrofolate réductase, la même enzyme que le méthotrexate → effet antifolique additif entraînant pancytopénie et mucite. 2) Accumulation du MTX par réduction de son élimination rénale. Cette interaction est grave quelle que soit la dose de MTX — y compris à 10 mg/semaine en rhumatologie."},
          B:{v:true,t:"VRAI. Le cotrimoxazole inhibe la sécrétion tubulaire rénale active du méthotrexate par compétition sur le transporteur OAT. Cette réduction de l'élimination entraîne une accumulation plasmatique du MTX et majore sa toxicité hématologique et muqueuse. Plusieurs cas de pancytopénies graves ont été rapportés avec cette association à faibles doses hebdomadaires."},
          C:{v:false,t:"FAUX. L'association cotrimoxazole-acénocoumarol n'est pas sans risque. Le cotrimoxazole potentialise l'effet anticoagulant des AVK par inhibition du CYP2C9 responsable de leur métabolisme, exposant au risque hémorragique. L'INR doit être contrôlé 3 à 4 jours après introduction du cotrimoxazole chez ce patient anticoagulé."},
          D:{v:true,t:"VRAI. La fosfomycine trométamol monodose per os est une alternative à privilégier dans cette situation car elle n'a pas d'interaction documentée avec le méthotrexate ni avec les AVK. La souche est sensible selon la vignette — c'est le traitement de choix ici pour éviter les interactions."},
          E:{v:false,t:"FAUX. Le cotrimoxazole est à proscrire ou utiliser avec une extrême prudence chez ce patient : 1) Interaction grave avec le méthotrexate (toxicité hématologique cumulée). 2) Interaction avec l'acénocoumarol (potentialisation anticoagulante). La combinaison des deux interactions rend cette prescription particulièrement dangereuse sans surveillance rapprochée."}
        }
      },
      {
        id:"177-19",type:"QRM",
        stem:"Une femme de 35 ans, sans allergie, vous consulte avant un séjour professionnel de 6 semaines au Cameroun. Elle n'est pas enceinte. Les seules chimioprophylaxies disponibles sont l'atovaquone-proguanil et la doxycycline. Pour des raisons financières, vous lui prescrivez la doxycycline. Parmi les informations suivantes à transmettre à la patiente, lesquelles sont exactes ?",
        choices:[{id:"A",text:"Prise quotidienne"},{id:"B",text:"À débuter 1 mois avant le départ"},{id:"C",text:"À poursuivre 4 semaines après le retour"},{id:"D",text:"À arrêter si survenue d'une grossesse"},{id:"E",text:"À associer à la méfloquine du fait du séjour prolongé"}],
        correct:["A","C","D"],
        explanations:{
          A:{v:true,t:"VRAI. La doxycycline est prescrite en prise quotidienne (100 mg/j) tout au long du séjour et pendant les 4 semaines suivant le retour. C'est une prise orale unique par jour, de préférence le soir au cours d'un repas, pour limiter les effets digestifs et réduire le risque d'ulcérations œsophagiennes."},
          B:{v:false,t:"FAUX. C'est le piège de cet item, testé à l'EDN P2 2023. La doxycycline est débutée 1 à 2 JOURS avant le départ (et non 1 mois). C'est la méfloquine qui nécessite un délai de 10 jours avant le départ pour évaluer la tolérance neuropsychique. L'atovaquone-proguanil, quant à lui, est débuté 1 à 2 jours avant."},
          C:{v:true,t:"VRAI. La doxycycline doit être poursuivie pendant 4 semaines après le retour du séjour en zone d'endémie. Cela couvre l'incubation du paludisme à P. falciparum (jusqu'à 3 semaines) et des autres espèces. L'arrêt prématuré expose à un accès palustre post-retour."},
          D:{v:true,t:"VRAI. La doxycycline est une cycline, contre-indiquée en cas de grossesse (CI à partir du 2e trimestre pour le risque de coloration des dents et d'atteinte osseuse fœtale, et dès le 1er trimestre par précaution). La patiente doit être informée d'arrêter immédiatement et de consulter si elle découvre une grossesse pendant le traitement."},
          E:{v:false,t:"FAUX. La doxycycline ne doit PAS être associée à la méfloquine. Ces deux molécules ont des indications alternatives — on choisit L'UNE OU L'AUTRE, jamais les deux. De plus, la méfloquine n'est pas indiquée en extension pour les séjours longs si la doxycycline est déjà prescrite."}
        }
      },
      {
        id:"177-20",type:"QRM",
        stem:"Une femme de 82 ans, grabataire et démente, est hospitalisée pour une diarrhée profuse. La recherche de toxines A et B de Clostridioides difficile dans les selles est positive. Elle occupe une chambre double. Parmi les propositions suivantes concernant la prévention de la transmission croisée, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Une friction hydro-alcoolique seule est suffisante pour l'hygiène des mains"},{id:"B",text:"Un lavage des mains à l'eau et au savon est requis après tout soin"},{id:"C",text:"Les précautions complémentaires de type « contact » doivent être mises en place"},{id:"D",text:"Une chambre en pression négative est indispensable"},{id:"E",text:"Le port de gants est recommandé dès l'entrée dans la chambre"}],
        correct:["B","C","E"],
        explanations:{
          A:{v:false,t:"FAUX. C'est le piège fondamental de cet item, testé à l'EDN P2 2023 et à l'ECNi juin 2024 P2. Les spores de C. difficile sont RÉSISTANTES à l'alcool des solutions hydro-alcooliques. La friction SHA seule est donc INSUFFISANTE pour éliminer les spores des mains. Un lavage à l'eau et au savon est obligatoire, car le savon décroche mécaniquement les spores."},
          B:{v:true,t:"VRAI. Le lavage des mains à l'eau et au savon est la mesure clé pour C. difficile, car il permet l'élimination mécanique des spores résistantes à l'alcool. La friction hydro-alcoolique peut être ajoutée après le lavage mais ne remplace pas celui-ci."},
          C:{v:true,t:"VRAI. Les précautions complémentaires de type « contact » sont obligatoires pour C. difficile : chambre individuelle si possible, port de gants et de surblouse pour tout soin, matériel dédié. Ces précautions visent à éviter la transmission des spores par contact direct ou indirect (mains, surfaces)."},
          D:{v:false,t:"FAUX. La chambre en pression négative est réservée aux infections à transmission aérienne (tuberculose, varicelle, rougeole). C. difficile se transmet par voie fécale-orale et par contact avec les spores environnementales — pas par voie aérienne. Les précautions contact suffisent."},
          E:{v:true,t:"VRAI. Le port de gants dès l'entrée dans la chambre est recommandé pour C. difficile. Les spores persistent longtemps sur les surfaces et peuvent contaminer les mains à l'occasion de tout contact. Le port de surblouse est également recommandé pour protéger les vêtements."}
        }
      },
      {
        id:"177-21",type:"QCU",
        stem:"Une femme de 28 ans, sans antécédent médical, consulte en médecine générale pour des brûlures mictionnelles et une pollakiurie depuis 24 heures. Elle n'a pas de fièvre. Elle n'a pas de douleur lombaire. Sa contraception est par pilule oestroprogestative. La bandelette urinaire réalisée au cabinet est positive pour leucocytes et nitrites. Que prescrivez-vous en première intention ? (une seule réponse attendue)",
        choices:[{id:"A",text:"Amoxicilline-acide clavulanique per os"},{id:"B",text:"Fosfomycine trométamol monodose"},{id:"C",text:"Pivmécillinam per os 5 jours"},{id:"D",text:"Ciprofloxacine per os"},{id:"E",text:"Ceftriaxone IV"}],
        correct:["B"],
        explanations:{
          A:{v:false,t:"FAUX. L'amoxicilline-acide clavulanique n'est pas recommandée dans les cystites aiguës simples : faible activité sur E. coli du fait de la résistance plasmidique à l'amoxicilline (>50% des souches), impact écologique important (sélection d'EBLSE), et ce n'est pas dans les recommandations HAS pour la cystite simple."},
          B:{v:true,t:"VRAI. La fosfomycine trométamol 3 g per os en dose unique est le traitement de première intention des cystites aiguës simples selon les recommandations HAS/SPILF. Avantages : dose unique favorisant l'observance, bon spectre sur E. coli, faible impact écologique, disponible sans antibiogramme. Cette question est directement issue du QI 21 EDN P3 2023."},
          C:{v:false,t:"FAUX. Le pivmécillinam (200 mg x3/j pendant 5 jours) est une alternative de première intention selon les recommandations HAS mais n'est PAS le traitement de choix en première intention. La fosfomycine trométamol monodose est préférée pour sa simplicité d'administration. Le pivmécillinam n'est d'ailleurs pas toujours disponible en France."},
          D:{v:false,t:"FAUX. La ciprofloxacine est une fluoroquinolone utilisée préférentiellement après documentation microbiologique. Elle n'est pas indiquée en probabiliste pour une cystite aiguë simple — les seules exceptions probabilistes des fluoroquinolones sont la pyélonéphrite et les infections urinaires masculines."},
          E:{v:false,t:"FAUX. La ceftriaxone IV n'a aucune indication dans une cystite aiguë simple non compliquée chez une femme jeune sans signe de gravité. Elle est réservée aux formes graves nécessitant une hospitalisation ou aux situations documentées sans alternative orale."}
        }
      },
      {
        id:"177-22",type:"QRM",
        stem:"Un patient de 48 ans porteur d'une prothèse valvulaire mitrale mécanique, anticoagulé par acénocoumarol, consulte son chirurgien-dentiste pour une extraction de la dent 46. Il n'a aucune allergie médicamenteuse connue. Parmi les propositions suivantes concernant la prophylaxie de l'endocardite infectieuse, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Ce patient est à haut risque d'endocardite infectieuse"},{id:"B",text:"Une prophylaxie antibiotique est indiquée avant ce geste"},{id:"C",text:"L'amoxicilline 2 g per os 30 à 60 minutes avant le geste est le traitement de référence"},{id:"D",text:"La prophylaxie est contre-indiquée en présence d'un traitement anticoagulant"},{id:"E",text:"La prophylaxie antibiotique est indiquée pour tous les gestes dentaires y compris la radiographie"}],
        correct:["A","B","C"],
        explanations:{
          A:{v:true,t:"VRAI. Les porteurs de prothèses valvulaires mécaniques sont classés dans le groupe à haut risque d'endocardite infectieuse, au même titre que les patients ayant un antécédent d'endocardite ou certaines cardiopathies congénitales cyanogènes. Dans ce groupe, la prophylaxie antibiotique avant les gestes dentaires à risque est recommandée."},
          B:{v:true,t:"VRAI. L'extraction dentaire est un geste dentaire à risque d'endocardite (effraction muqueuse avec bactériémie transitoire à streptocoques oraux). Chez ce patient à haut risque, la prophylaxie antibiotique est indiquée. Attention : la prophylaxie n'est pas indiquée pour tous les gestes dentaires mais uniquement ceux avec effraction muqueuse."},
          C:{v:true,t:"VRAI. L'amoxicilline 2 g per os en dose unique, administrée 30 à 60 minutes avant le geste, est le traitement de référence de la prophylaxie de l'endocardite infectieuse selon les recommandations de la Société Française de Cardiologie. En cas d'allergie à l'amoxicilline : clindamycine 600 mg per os."},
          D:{v:false,t:"FAUX. Le traitement anticoagulant n'est pas une contre-indication à la prophylaxie de l'endocardite infectieuse. L'amoxicilline per os peut parfaitement être prescrite chez un patient anticoagulé. La gestion de l'anticoagulation péri-opératoire est une problématique distincte de la prophylaxie antibiotique."},
          E:{v:false,t:"FAUX. La prophylaxie antibiotique est réservée aux gestes dentaires nécessitant une manipulation de la gencive, de la région péri-apicale ou une effraction muqueuse buccale. La radiographie dentaire, l'ajustement d'une prothèse amovible ou un simple examen clinique sans effraction ne justifient pas de prophylaxie antibiotique."}
        }
      },
      {
        id:"177-23",type:"QRM",
        stem:"Un nouveau-né est prématuré à 32 semaines d'aménorrhée, pèse 1 650 g. À 48 heures de vie, il présente un ictère avec bilirubinémie totale à 192 µmol/L. Une infection bactérienne précoce est suspectée. Le néonatologiste discute du choix antibiotique. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La ceftriaxone est déconseillée chez ce prématuré présentant un ictère"},{id:"B",text:"La ceftriaxone est contre-indiquée chez tous les nouveau-nés de moins de 28 jours"},{id:"C",text:"L'élimination biliaire de la ceftriaxone expose au risque de déplacement de la bilirubine de l'albumine"},{id:"D",text:"Le céfotaxime est une alternative adaptée à la place de la ceftriaxone dans cette situation"},{id:"E",text:"Ce risque est spécifique à la prématurité et ne s'applique pas en cas d'ictère chez un nouveau-né à terme"}],
        correct:["A","C","D"],
        explanations:{
          A:{v:true,t:"VRAI. La fiche LiSA est explicite : l'utilisation de la ceftriaxone est déconseillée chez le prématuré OU en cas d'ictère. Ce nouveau-né cumule les deux facteurs de risque, rendant la ceftriaxone particulièrement inappropriée. La prématurité seule ou l'ictère seul suffisent chacun à déconseiller son usage."},
          B:{v:false,t:"FAUX. La contre-indication ne concerne pas tous les nouveau-nés de moins de 28 jours mais spécifiquement les prématurés et les nouveau-nés présentant un ictère. Un nouveau-né à terme, sans ictère, peut recevoir de la ceftriaxone si indiqué, bien que le céfotaxime soit souvent préféré en néonatologie pour d'autres raisons pratiques."},
          C:{v:true,t:"VRAI. La ceftriaxone a une élimination biliaire importante (40-60% de la dose) et se lie fortement à l'albumine. Chez un nouveau-né ictérique, elle peut déplacer la bilirubine de ses sites de liaison à l'albumine, libérant de la bilirubine libre non conjuguée capable de franchir la barrière hémato-encéphalique — risque d'ictère nucléaire (kernictère), irréversible."},
          D:{v:true,t:"VRAI. Le céfotaxime est la C3G injectable de choix en néonatologie car il n'a pas d'élimination biliaire significative et ne déplace pas la bilirubine. Il est utilisé en association à l'ampicilline pour les infections néonatales précoces."},
          E:{v:false,t:"FAUX. L'ictère chez un nouveau-né à terme constitue également une raison de déconseiller la ceftriaxone. La fiche LiSA mentionne explicitement les deux situations comme indépendantes : prématurité ET/OU ictère. Ce n'est pas un risque exclusif à la prématurité."}
        }
      },
      {
        id:"177-24",type:"QRM",
        stem:"Un homme de 22 ans est hospitalisé pour méningite à Neisseria meningitidis sérogroupe C confirmée par la biologie. Sa petite amie, enceinte de 10 semaines, et son colocataire sont identifiés comme cas contacts proches. Parmi les propositions suivantes concernant l'antibioprophylaxie des cas contacts, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La rifampicine per os est l'antibiotique de référence pour la prophylaxie"},{id:"B",text:"La ciprofloxacine monodose per os est une alternative validée à la rifampicine"},{id:"C",text:"La prophylaxie doit être débutée dans les 24 à 48 heures suivant le diagnostic"},{id:"D",text:"La ciprofloxacine est le traitement de choix chez la petite amie enceinte de 10 semaines"},{id:"E",text:"La prophylaxie est réservée aux sujets ayant partagé un repas avec le cas index"}],
        correct:["A","B","C"],
        explanations:{
          A:{v:true,t:"VRAI. La rifampicine per os est l'antibiotique de référence pour la chimioprophylaxie des cas contacts de méningite à méningocoque. Schéma adulte : rifampicine 600 mg x2/j pendant 2 jours. Elle éradique le portage nasopharyngé du méningocoque et protège les contacts contre le développement d'une méningite secondaire."},
          B:{v:true,t:"VRAI. La ciprofloxacine 500 mg per os en dose unique est une alternative validée, utilisée notamment quand la rifampicine est contre-indiquée (grossesse, interactions médicamenteuses importantes) ou non disponible. Elle est efficace sur le méningocoque et a l'avantage d'une prise unique."},
          C:{v:true,t:"VRAI. L'efficacité de la chimioprophylaxie est maximale si elle est administrée dans les 24 à 48 heures suivant le diagnostic du cas index. Au-delà de 10 jours, la prophylaxie n'est plus justifiée. La rapidité est essentielle car le risque de méningite secondaire est maximal dans les premiers jours."},
          D:{v:false,t:"FAUX. La ciprofloxacine est contre-indiquée pendant la grossesse (fluoroquinolones CI : risque d'arthropathies fœtales). La rifampicine peut être utilisée avec précaution mais présente également des risques tératogènes (à éviter si possible au 1er trimestre). Chez la femme enceinte, la ceftriaxone 250 mg IM en dose unique est recommandée comme alternative."},
          E:{v:false,t:"FAUX. La prophylaxie ne se limite pas aux personnes ayant partagé un repas. Elle concerne tout sujet ayant eu un contact étroit avec le cas (< 1 mètre de distance, face à face, pendant plus d'une heure) dans les 10 jours précédant l'hospitalisation, ou ayant dormi dans la même pièce, ou ayant eu un contact direct avec les sécrétions orales du patient."}
        }
      },
      {
        id:"177-25",type:"QRM",
        stem:"Un homme de 58 ans, diabétique de type 2 traité par metformine, reçoit depuis 10 jours de la lévofloxacine pour une prostatite chronique documentée. Il consulte pour des douleurs des deux talons apparues à J7, une photosensibilisation cutanée nette et des épisodes de confusion nocturne. L'ECG retrouve un QTc à 492 ms. Parmi les propositions suivantes concernant les effets indésirables des fluoroquinolones, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Les tendinopathies avec risque de rupture tendineuse sont un effet indésirable de classe"},{id:"B",text:"Les troubles neuropsychiques incluant la confusion sont possibles, notamment chez le diabétique"},{id:"C",text:"La phototoxicité impose une protection solaire stricte pendant le traitement"},{id:"D",text:"L'allongement de l'intervalle QT expose au risque de torsades de pointes"},{id:"E",text:"La néphrotoxicité tubulaire directe est l'effet rénal principal des fluoroquinolones"}],
        correct:["A","B","C","D"],
        explanations:{
          A:{v:true,t:"VRAI. Les tendinopathies (douleur des deux talons à J7 dans la vignette) sont un effet indésirable de classe des fluoroquinolones explicitement listé par la LiSA. Mécanisme : inhibition de la synthèse du collagène et cytotoxicité directe sur les tendinoblastes. Le risque est majoré par : l'âge > 60 ans, les corticoïdes, l'insuffisance rénale, le diabète. La rupture tendineuse peut survenir jusqu'à plusieurs semaines après l'arrêt."},
          B:{v:true,t:"VRAI. Les troubles neuropsychiques (convulsions, confusion, agitation, insomnie) sont listés dans les effets indésirables des fluoroquinolones. Ils sont favorisés par l'âge avancé, le diabète et l'insuffisance rénale qui augmentent les concentrations plasmatiques. Ce patient diabétique avec confusion nocturne est un tableau typique d'effet neuropsychique aux fluoroquinolones."},
          C:{v:true,t:"VRAI. La phototoxicité est un effet indésirable cutané explicitement listé pour les fluoroquinolones. Elle nécessite une photoprotection stricte (vêtements couvrants, écran solaire) pendant toute la durée du traitement et quelques jours après. Ce n'est pas une allergie mais une réaction pharmacologique dose-dépendante déclenchée par les UV."},
          D:{v:true,t:"VRAI. L'allongement de l'intervalle QT (QTc 492 ms dans la vignette) est un effet indésirable de classe des fluoroquinolones par blocage des canaux IKr (HERG). Il expose aux torsades de pointes et à la fibrillation ventriculaire. Le risque est majoré par l'hypokaliémie, les cardiopathies préexistantes et les associations avec d'autres allongeurs du QT."},
          E:{v:false,t:"FAUX. La néphrotoxicité tubulaire directe est l'effet rénal principal des AMINOSIDES — pas des fluoroquinolones. Les FQ peuvent provoquer une néphrite interstitielle allergique, mais ce n'est pas leur toxicité rénale principale. La confusion entre ces deux classes est un piège classique : aminosides = néphrotoxicité tubulaire ET ototoxicité irréversible ; fluoroquinolones = troubles neuropsychiques, tendinopathies, QT."}
        }
      },
      {
        id:"177-26",type:"QRM",
        stem:"Un interne de garde vous présente plusieurs patients pour validation de ses prescriptions de ceftriaxone IV. Parmi les situations cliniques suivantes, laquelle ou lesquelles constitue ou constituent une indication validée des céphalosporines de 3e génération injectables ?",
        choices:[{id:"A",text:"Homme de 23 ans, purpura pétéchial fébrile avec extension rapide des lésions en moins d'une heure"},{id:"B",text:"Patient de 55 ans, sepsis sur obstacle urologique, ECBU positif à Klebsiella pneumoniae"},{id:"C",text:"Homme de 40 ans, maladie de Lyme avec paralysie faciale périphérique isolée confirmée"},{id:"D",text:"Femme de 30 ans, cystite aiguë simple, apyrétique, bandelette positive, aucun signe de gravité"},{id:"E",text:"Enfant de 7 ans, J5 d'une chimiothérapie, fièvre à 39,5°C, polynucléaires neutrophiles à 0,12 G/L"}],
        correct:["A","B","C","E"],
        explanations:{
          A:{v:true,t:"VRAI. Un purpura pétéchial fébrile en extension rapide constitue une suspicion de purpura fulminans (méningococcémie) — urgence absolue. La ceftriaxone (ou céfotaxime) est explicitement listée par la LiSA dans cette indication : « suspicion clinique de purpura fulminans ». Elle doit être administrée immédiatement, avant même la ponction lombaire, sans attendre la confirmation microbiologique."},
          B:{v:true,t:"VRAI. Les formes graves des infections localisées ou systémiques à bacilles à Gram négatif sont une indication explicite des C3G injectables dans la LiSA. Un sepsis sur obstacle urologique à Klebsiella constitue une forme grave d'infection à BGN nécessitant une C3G IV."},
          C:{v:true,t:"VRAI. La maladie de Lyme aux phases secondaire et tertiaire est une indication explicite de la ceftriaxone dans la LiSA. La phase secondaire neurologique (méningite lymphocytaire, paralysie faciale, radiculopathies) nécessite une C3G IV pendant 14 à 21 jours selon les recommandations."},
          D:{v:false,t:"FAUX. Une cystite aiguë simple sans complication chez une femme de 30 ans apyrétique ne justifie pas de ceftriaxone IV. Le traitement de première intention est la fosfomycine trométamol monodose per os (ou pivmécillinam 5 jours). Prescrire une C3G IV pour une cystite simple constitue une faute dans le bon usage des antibiotiques : surtraitement, voie IV injustifiée, impact écologique important."},
          E:{v:true,t:"VRAI. La fièvre chez le neutropénique est une indication explicite et urgente des C3G injectables dans la LiSA. Polynucléaires à 0,12 G/L avec fièvre à 39,5°C = neutropénie fébrile sévère (PN < 500/mm³). L'antibiothérapie IV à large spectre doit être débutée dans l'heure — la ceftazidime ou le céfépime sont préférés si risque de Pseudomonas."}
        }
      },
      {
        id:"177-27",type:"QRM",
