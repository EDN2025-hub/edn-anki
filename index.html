<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDN Anki — Entraînement FSRS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f5f5f7;color:#1a1a2e;min-height:100vh;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 24px;border-bottom:2px solid #e0e0e0;position:sticky;top:0;z-index:100;}
.header-left{display:flex;align-items:center;gap:16px;}
.logo{font-size:22px;font-weight:800;color:#1b2a4a;letter-spacing:-0.5px;}
.logo span{color:#e84670;}
.user-info{display:flex;align-items:center;gap:8px;color:#555;font-size:13px;}
.user-icon{width:28px;height:28px;border-radius:50%;background:#1b2a4a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
.header-center{display:flex;align-items:center;gap:16px;}
.progress-pill{background:#1b2a4a;color:#fff;padding:6px 20px;border-radius:20px;font-size:13px;font-weight:600;}
.timer{text-align:right;font-size:12px;color:#e84670;line-height:1.4;}
.timer .label{color:#999;font-size:11px;}
.btn-end{background:#e84670;color:#fff;border:none;padding:10px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-end:hover{background:#d13560;}

/* LAYOUT */
.main-layout{display:flex;max-width:1300px;margin:0 auto;padding:20px 24px;gap:24px;}
.content-area{flex:1;min-width:0;}
.sidebar{width:260px;flex-shrink:0;}

/* QUESTION HEADER */
.qi-banner{background:#1b2a4a;color:#fff;padding:12px 20px;font-size:18px;font-weight:700;border-radius:6px 6px 0 0;margin-bottom:0;}
.question-card{background:#fff;border-radius:0 0 6px 6px;padding:28px 32px;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin-bottom:20px;}
.question-type{color:#e84670;font-weight:700;font-size:15px;margin-bottom:6px;}
.question-meta{color:#888;font-size:13px;margin-bottom:16px;}
.question-stem{font-size:15px;line-height:1.65;color:#222;margin-bottom:24px;}

/* PROPOSITIONS - style annales papier */
.propositions{display:flex;flex-direction:column;gap:12px;margin-bottom:28px;}
.prop-block{border:1px solid #d0d0d0;border-radius:4px;overflow:hidden;cursor:pointer;transition:border-color 0.15s;}
.prop-block:hover{border-color:#1b2a4a;}
.prop-block.selected{border-color:#1b2a4a;border-width:2px;}
.prop-header{background:#ededed;padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;}
.prop-header input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#1b2a4a;}
.prop-body{padding:10px 14px 12px 40px;font-size:14px;line-height:1.5;color:#333;}

/* CORRECTION STYLES */
.prop-block.correct-yes{border-color:#2ecc71;border-width:2px;background:#f0fdf4;}
.prop-block.correct-no{border-color:#e74c3c;border-width:2px;background:#fef2f2;}
.prop-block.missed{border-color:#f39c12;border-width:2px;background:#fffbeb;}
.correction-text{padding:8px 14px 12px 40px;font-size:13px;line-height:1.55;color:#444;border-top:1px solid #e5e5e5;background:#fafafa;}
.correction-text .verdict{font-weight:700;margin-right:4px;}
.verdict.true{color:#2ecc71;}
.verdict.false{color:#e74c3c;}

/* VALIDATE BUTTON */
.btn-validate{display:block;margin:0 auto;background:#e84670;color:#fff;border:none;padding:14px 48px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px;}
.btn-validate:hover{background:#d13560;transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,70,112,0.3);}
.btn-validate:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none;}

/* FSRS BUTTONS */
.fsrs-buttons{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap;}
.fsrs-btn{padding:12px 24px;border:2px solid;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;min-width:110px;text-align:center;}
.fsrs-btn.easy{border-color:#2ecc71;color:#2ecc71;background:#f0fdf4;}
.fsrs-btn.easy:hover{background:#2ecc71;color:#fff;}
.fsrs-btn.correct{border-color:#3498db;color:#3498db;background:#eff6ff;}
.fsrs-btn.correct:hover{background:#3498db;color:#fff;}
.fsrs-btn.medium{border-color:#f39c12;color:#f39c12;background:#fffbeb;}
.fsrs-btn.medium:hover{background:#f39c12;color:#fff;}
.fsrs-btn.wrong{border-color:#e74c3c;color:#e74c3c;background:#fef2f2;}
.fsrs-btn.wrong:hover{background:#e74c3c;color:#fff;}
.fsrs-interval{display:block;font-size:11px;font-weight:400;margin-top:3px;opacity:0.7;}

/* SCORE DISPLAY */
.score-display{text-align:center;background:#fff;padding:20px;border-radius:8px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.score-display .score-value{font-size:36px;font-weight:800;color:#1b2a4a;}
.score-display .score-label{font-size:13px;color:#888;margin-top:4px;}

/* SIDEBAR */
.sidebar-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:16px;}
.sidebar-card h3{font-size:14px;font-weight:700;color:#1b2a4a;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #eee;}
.sidebar-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid #e8e8e8;border-radius:6px;margin-bottom:6px;font-size:13px;cursor:pointer;transition:background 0.1s;}
.sidebar-item:hover{background:#f0f4ff;}
.sidebar-item.active{background:#1b2a4a;color:#fff;border-color:#1b2a4a;}
.sidebar-item.locked{opacity:0.45;cursor:not-allowed;}
.sidebar-item.locked:hover{background:#fff;color:inherit;}

/* HISTORIQUE DES SESSIONS */
.history-section{max-width:700px;margin:40px auto 0;}
.history-section h2{font-size:18px;color:#1b2a4a;margin-bottom:14px;font-weight:700;}
.history-grid{display:flex;flex-direction:column;gap:10px;}
.history-card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:14px 18px;transition:all 0.15s;}
.history-card:hover{border-color:#1b2a4a;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
.history-meta{flex:1;min-width:0;}
.history-date{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.5px;}
.history-item-label{font-size:14px;color:#1b2a4a;font-weight:600;margin-top:2px;}
.history-stats{display:flex;flex-direction:column;align-items:flex-end;min-width:60px;}
.history-score{font-size:16px;font-weight:700;color:#1b2a4a;}
.history-rate{font-size:12px;color:#666;}
.history-actions{display:flex;gap:6px;}
.btn-history-view{background:#1b2a4a;color:#fff;border:none;padding:7px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;}
.btn-history-view:hover{background:#253a5e;}
.btn-history-del{background:none;border:1px solid #ddd;color:#999;width:28px;height:28px;border-radius:5px;font-size:16px;cursor:pointer;line-height:1;}
.btn-history-del:hover{border-color:#e74c3c;color:#e74c3c;}

/* CARTE ANCRAGES */
.ancrages-card{background:linear-gradient(135deg,#1b2a4a 0%,#253a5e 100%);border-color:#1b2a4a;}
.ancrages-card .item-label,.ancrages-card .item-title,.ancrages-card .item-count,.ancrages-card .item-due{color:#fff;}
.ancrages-card .item-count{color:#e84670;font-weight:800;}
.ancrages-card:hover{box-shadow:0 4px 14px rgba(27,42,74,0.3);}

/* BOUTONS DU BAS — Historique + Gérer la progression */
.btn-bottom{background:#fff;border:1px solid #d0d5dd;color:#1b2a4a;padding:11px 22px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:all 0.15s;}
.btn-bottom:hover{background:#1b2a4a;color:#fff;border-color:#1b2a4a;}
.btn-bottom:hover .btn-bottom-count{background:#fff;color:#1b2a4a;}
.btn-bottom-count{background:#1b2a4a;color:#fff;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;min-width:18px;text-align:center;}
.btn-bottom-warn{color:#8a6000;border-color:#f0d060;background:#fffbeb;}
.btn-bottom-warn:hover{background:#8a6000;color:#fff;border-color:#8a6000;}

/* MENU MODE DE SESSION (item-menu) */
.mode-grid{display:flex;flex-direction:column;gap:12px;}
.mode-card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #d0d5dd;border-radius:8px;padding:18px 22px;cursor:pointer;transition:all 0.15s;}
.mode-card:hover{border-color:#1b2a4a;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.mode-info{flex:1;}
.mode-title{font-size:15px;color:#1b2a4a;font-weight:700;}
.mode-sub{font-size:12px;color:#666;margin-top:4px;}
.mode-count{font-size:24px;font-weight:800;color:#e84670;min-width:50px;text-align:right;}
.mode-practice{background:#fffbeb;border-color:#f0d060;}
.mode-practice .mode-count{color:#8a6000;}
.mode-practice:hover{border-color:#8a6000;}

/* POSTPONE — Décaler une question */
.postpone-row{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
.postpone-row button{flex:1;min-width:42px;background:#f5f5f7;border:1px solid #d0d5dd;color:#1b2a4a;padding:6px 8px;font-size:12px;font-weight:600;border-radius:4px;cursor:pointer;}
.postpone-row button:hover{background:#1b2a4a;color:#fff;border-color:#1b2a4a;}

/* BOUTON PAUSE ACTIF */
.btn-bottom-pause-on{background:#8a6000;color:#fff;border-color:#8a6000;}
.btn-bottom-pause-on:hover{background:#a87800;}
.sidebar-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.badge-due{background:#fef2f2;color:#e74c3c;}
.badge-done{background:#f0fdf4;color:#2ecc71;}
.badge-new{background:#eff6ff;color:#3498db;}

/* NOTES */
.note-toggle{display:inline-flex;align-items:center;background:#fff;border:1px solid #1b2a4a;padding:8px 18px;border-radius:4px;font-size:11px;font-weight:700;color:#1b2a4a;cursor:pointer;margin-top:18px;letter-spacing:0.5px;text-transform:uppercase;transition:all 0.15s;}
.note-toggle:hover{background:#1b2a4a;color:#fff;}
.note-toggle svg{margin-right:7px;}
.note-editor{margin-top:12px;display:none;}
.note-editor.open{display:block;}
.note-editor textarea{width:100%;min-height:90px;border:1px solid #ccc;border-radius:4px;padding:12px;font-size:13px;font-family:inherit;resize:vertical;}
.note-editor .note-actions{display:flex;gap:8px;margin-top:8px;}
.note-saved{background:#f5f5f7;border-left:3px solid #1b2a4a;border-radius:0;padding:12px 16px;font-size:13px;margin-top:14px;line-height:1.6;color:#333;font-style:italic;white-space:pre-wrap;}

/* REVIEW SESSION */
.review-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding:16px;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.review-nav button{padding:10px 24px;}
.review-nav button:disabled{opacity:0.4;cursor:not-allowed;}
.session-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px;}
.btn-secondary{background:#666;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-secondary:hover{background:#555;}
.graded-status{text-align:center;margin-top:18px;padding:10px 16px;background:#f0fdf4;border:1px solid #a7f3d0;border-radius:6px;color:#065f46;font-size:13px;font-weight:600;}

/* HOME */
.home-hero{text-align:center;padding:48px 20px;}
.home-hero h1{font-size:28px;font-weight:800;color:#1b2a4a;margin-bottom:8px;}
.home-hero p{color:#666;font-size:15px;margin-bottom:32px;}
.item-grid{display:flex;flex-direction:column;gap:12px;max-width:700px;margin:0 auto;}
.item-card{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:18px 24px;cursor:pointer;transition:all 0.15s;}
.item-card:hover{border-color:#1b2a4a;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.item-card .item-label{font-weight:700;color:#1b2a4a;font-size:15px;}
.item-card .item-title{color:#555;font-size:13px;margin-top:2px;}
.item-card .item-stats{text-align:right;}
.item-card .item-count{font-size:22px;font-weight:800;color:#e84670;}
.item-card .item-due{font-size:12px;color:#888;}

/* DONE SCREEN */
.done-screen{text-align:center;padding:60px 20px;}
.done-screen h2{font-size:24px;font-weight:800;color:#1b2a4a;margin-bottom:12px;}
.done-screen p{color:#666;margin-bottom:24px;}
.btn-home{background:#1b2a4a;color:#fff;border:none;padding:12px 32px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
.btn-home:hover{background:#253a5e;}

/* RESET */
.btn-reset{background:none;border:1px solid #e74c3c;color:#e74c3c;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;margin-top:12px;}
.btn-reset:hover{background:#e74c3c;color:#fff;}

/* DP / KFP VIGNETTE BOX */
.dp-vignette-box{background:#f0f4ff;border:2px solid #1b2a4a;border-radius:8px;padding:16px 20px;margin-bottom:16px;}
.dp-badge{font-size:11px;font-weight:800;color:#1b2a4a;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;opacity:0.7;}
.dp-vignette-text{font-size:14px;line-height:1.7;color:#1a1a2e;}
.kfp-vignette-box{background:#fff8f0;border:2px solid #e84670;border-radius:8px;padding:16px 20px;margin-bottom:16px;}
.kfp-badge{font-size:11px;font-weight:800;color:#e84670;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.xl-note{background:#fffbeb;border:1px solid #f0d060;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;color:#8a6000;margin-bottom:12px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">EDN <span>Anki</span></div>
    <div class="user-info"><div class="user-icon">EK</div><div>Eddi<br>Karadag</div></div>
  </div>
  <div class="header-center">
    <div class="progress-pill" id="progressPill">Progression : 0%</div>
    <div class="timer">
      <div class="label">Durée écoulée :</div>
      <div id="timerDisplay">00:00</div>
    </div>
  </div>
  <div>
    <button class="btn-end" onclick="goHome()">Terminer l'épreuve</button>
  </div>
</div>

<div class="main-layout">
  <div class="content-area" id="contentArea"></div>
  <div class="sidebar" id="sidebarArea"></div>
</div>

<script>
const ITEMS=[
  {
    id:"177",label:"Item 177",title:"Anti-infectieux",subtitle:"Prescription et surveillance",
    questions:[
      {
        id:"177-01",type:"QCU",
        stem:"Un homme de 48 ans, sans allergie connue, est hospitalisé pour fièvre à 39,8°C avec frissons. Quatre flacons d'hémocultures reviennent positifs pour des cocci à Gram positif en amas. L'antibiogramme du lendemain confirme Staphylococcus aureus méticilline-sensible, sensible à toutes les bêtalactamines testées. Parmi les antibiotiques suivants, lequel est le plus approprié pour le traitement par voie parentérale ?",
        choices:[{id:"A",text:"Amoxicilline-acide clavulanique IV"},{id:"B",text:"Cloxacilline IV"},{id:"C",text:"Vancomycine IV"},{id:"D",text:"Daptomycine IV"},{id:"E",text:"Lévofloxacine per os"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. L'amoxicilline-acide clavulanique n'est pas le traitement de référence d'une infection à Staphylococcus aureus méticillino-sensible (SASM). Mécanisme : si l'acide clavulanique inhibe les bêta-lactamases produites par certains staphylocoques sensibles à la méticilline (donc activité maintenue), il s'agit d'un traitement à spectre élargi inutile dans cette situation. Le principe de bon usage des antibiotiques impose la molécule la plus étroite et spécifique. De plus, son administration peut être moins commode (voie IV plus complexe) par rapport à la cloxacilline. Contre-exemple : si l'infection avait été polymicrobienne aérobie/anaérobie d'origine cutanée (érysipèle compliqué, plaie infectée avec contamination de la flore mixte), l'amoxicilline-acide clavulanique aurait été une bonne option couvrant à la fois SASM et anaérobies."},B:{v:true,t:"VRAI. La cloxacilline IV (ou l'oxacilline) est le traitement de référence des infections graves à SASM, notamment les infections profondes osseuses, articulaires, endocarditiques ou septicémiques. Mécanisme : la cloxacilline est une pénicilline M (méticilline-like), résistante aux pénicillinases staphylococciques par sa chaîne latérale isoxazolyle. Elle a une activité bactéricide puissante sur le SASM, une bonne diffusion tissulaire (sauf SNC où elle est limitée), et un coût modéré. Posologie usuelle : 150-200 mg/kg/j IV en 4-6 administrations, à adapter selon la sévérité et la fonction rénale. C'est le pilier du traitement antistaphylococcique en France et dans toutes les recommandations internationales. Contre-exemple : si l'antibiogramme avait montré un SARM (Staphylococcus aureus méticillino-résistant) avec mutation du gène mecA codant la PLP2a, la cloxacilline serait totalement inefficace — il faudrait recourir à la vancomycine, à la daptomycine ou au linézolide."},C:{v:false,t:"FAUX. La vancomycine n'est pas le traitement de première intention d'une infection à SASM. Mécanisme : la vancomycine est un glycopeptide bactéricide de référence dans les infections à SARM (SAMR) — staphylocoque doré méticillino-résistant. Elle est moins active que la cloxacilline sur SASM (CMI plus élevée, vitesse de bactéricidie plus lente), expose à plus d'effets indésirables (néphrotoxicité, ototoxicité, red man syndrome) et nécessite des dosages plasmatiques. La règle du bon usage impose l'antibiotique le plus spécifique dès que la sensibilité est documentée. Contre-exemple : devant une endocardite à SARM (méticillino-résistant), la vancomycine deviendrait au contraire le traitement de référence, parfois associée à la rifampicine ou la gentamicine en synergie selon le contexte."},D:{v:false,t:"FAUX. La daptomycine n'est pas le traitement de première intention d'un SASM. Mécanisme : la daptomycine est un lipopeptide cyclique réservé aux situations particulières — infections de la peau et des tissus mous compliquées à SARM, bactériémies à SARM, endocardites du cœur droit à SARM. Elle est inactive dans le poumon (inactivation par le surfactant), donc inutile pour une pneumonie. Elle est plus coûteuse et moins maniable que la cloxacilline. En l'absence de résistance à la méticilline ou de CI à la cloxacilline, elle n'a pas sa place ici. Contre-exemple : pour une bactériémie persistante à SARM avec échec de la vancomycine ou CMI vancomycine > 1 mg/L (vancomycine intermediate-resistant SAMR), la daptomycine deviendrait une option à privilégier."},E:{v:false,t:"FAUX. La lévofloxacine per os n'est pas le traitement de première intention d'une infection à SASM. Mécanisme : 1) Les fluoroquinolones ont une activité antistaphylococcique mais moindre que la cloxacilline (CMI plus élevée), et exposent à un risque de sélection rapide de résistance par mutation des gènes gyr et par sur-expression de pompes d'efflux ; 2) La voie per os, même si la biodisponibilité est excellente, est inadaptée aux infections graves (préférer IV initial avec relais per os secondaire) ; 3) Les fluoroquinolones ont de nombreux effets indésirables (tendinopathies, neuropsychiques, allongement QT) qui les réservent aux situations sans alternative. Contre-exemple : dans une prostatite aiguë à SASM documentée chez un patient sans CI aux fluoroquinolones, la lévofloxacine per os pourrait être un traitement de seconde intention en relais de l'IV — bonne diffusion prostatique."}}
      },
      {
        id:"177-02",type:"QRM",
        stem:"Une femme de 55 ans épileptique traitée par valproate consulte aux urgences pour une exacerbation de BPCO surinfectée. Elle rapporte une tendinopathie du tendon d'Achille droit survenue il y a 18 mois sous lévofloxacine. Son DFG est à 52 mL/min. L'ECG retrouve un QT mesuré à 460 ms. Parmi les propositions suivantes concernant la prescription d'une fluoroquinolone chez cette patiente, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'épilepsie représente une contre-indication absolue"},{id:"B",text:"L'antécédent de tendinopathie sous quinolone représente une contre-indication absolue"},{id:"C",text:"Le QT à 460 ms représente une contre-indication absolue"},{id:"D",text:"L'insuffisance rénale stade 3 représente une contre-indication absolue"},{id:"E",text:"Une adaptation posologique à la fonction rénale serait nécessaire"}],
        correct:["A","B","E"],
        explanations:{A:{v:true,t:"VRAI. L'épilepsie représente une contre-indication ABSOLUE à la prescription de fluoroquinolones. Mécanisme : les fluoroquinolones (ciprofloxacine, lévofloxacine, ofloxacine, moxifloxacine) ont une activité GABAergique antagoniste — elles inhibent la liaison du GABA à ses récepteurs neuronaux, abaissant le seuil épileptogène. Chez un patient épileptique, même équilibré sous antiépileptique, le risque de crise est majoré significativement. Cette CI est listée explicitement dans toutes les recommandations et constitue un piège classique : il faut systématiquement rechercher des antécédents épileptiques avant prescription. Contre-exemple : si le patient avait eu un antécédent de convulsions fébriles simples de l'enfance résolues depuis (situation distincte de l'épilepsie), la prescription n'aurait pas été formellement CI mais avec prudence et surveillance."},B:{v:true,t:"VRAI. L'antécédent de tendinopathie sous quinolone constitue une CI ABSOLUE à toute nouvelle prescription de fluoroquinolone. Mécanisme : les fluoroquinolones inhibent la synthèse du collagène tendineux et favorisent la cytotoxicité directe sur les tendinoblastes via une chélation des ions magnésium. Le risque de rupture tendineuse (tendon d'Achille particulièrement) est majoré chez : sujets > 60 ans, sportifs intensifs, traitement par corticoïdes concomitants, insuffisance rénale, diabète. Un antécédent de tendinopathie traduit une susceptibilité individuelle — réutilisation = risque très élevé de récidive, parfois jusqu'à la rupture. Le risque persiste plusieurs semaines après l'arrêt. Contre-exemple : un antécédent de tendinopathie d'épaule liée à un sport mécanique (tendinopathie de la coiffe des rotateurs sans lien quinolone) ne serait pas une CI à une prescription ultérieure de fluoroquinolone — il faut bien distinguer l'origine."},C:{v:false,t:"FAUX. Un QT à 460 ms n'est pas une CI absolue. Mécanisme : les fluoroquinolones (surtout moxifloxacine > lévofloxacine > ciprofloxacine) allongent le QT par blocage des canaux potassiques hERG. Les seuils d'alerte sont : QTc > 500 ms (CI relative à discuter) ou allongement > 60 ms par rapport au baseline. Un QT à 460 ms est dans les limites supérieures de la normale (norme < 440-450 ms selon le sexe), constituant une situation de précaution avec surveillance ECG mais pas une CI absolue. Toujours associer l'évaluation du risque global : co-prescription d'autres médicaments allongeant le QT, troubles électrolytiques (hypokaliémie, hypomagnésémie), bradycardie. Contre-exemple : si le QT avait été à 530 ms avec hypokaliémie associée et co-prescription d'amiodarone, on aurait alors une CI quasi absolue par cumul de risque torsadogène."},D:{v:false,t:"FAUX. L'insuffisance rénale stade 3 (DFG 30-59 mL/min/1.73m²) n'est pas une CI absolue mais impose une adaptation posologique. Mécanisme : la ciprofloxacine et la lévofloxacine ont une élimination majoritairement rénale — l'IR ralentit leur élimination, augmente les concentrations plasmatiques et le risque d'effets indésirables (neurotoxicité notamment). Adaptation : réduction de la posologie de 50% si DFG < 50, espacement des doses, surveillance clinique rapprochée. La moxifloxacine étant essentiellement éliminée par voie hépatique, elle ne nécessite pas d'adaptation rénale. Contre-exemple : un DFG < 10 mL/min sans dialyse aurait constitué une CI relative à discuter — l'accumulation serait majeure et le risque d'effets indésirables central neurologique très significatif."},E:{v:true,t:"VRAI. Une adaptation posologique à la fonction rénale serait nécessaire en cas d'insuffisance rénale (DFG stade 3, soit 30-59 mL/min). Mécanisme : pour la ciprofloxacine et la lévofloxacine, élimination essentiellement rénale ; la concentration plasmatique s'élève en cas d'IR et le risque d'effets indésirables (neurotoxiques, allongement QT) augmente. La règle est : adapter la posologie en fonction de la clairance de la créatinine selon les fiches AMM (réduction de dose ou espacement des prises). Contre-exemple : pour une infection à entérobactéries résistantes documentée chez un patient en hémodialyse, la lévofloxacine pourrait être utilisée avec adaptation post-dialyse (administration après chaque séance) — pas formellement CI mais avec surveillance étroite."}}
      },
      {
        id:"177-03",type:"QRM",
        stem:"Une patiente de 54 ans est en réanimation pour un choc septique sur pyélonéphrite. Une antibiothérapie par ceftriaxone 2 g IV et amikacine est débutée. Son DFG de base est à 85 mL/min. Parmi les propositions suivantes concernant la prescription de l'amikacine, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'activité bactéricide de l'amikacine est temps-dépendante"},{id:"B",text:"L'administration en dose unique journalière est à privilégier"},{id:"C",text:"La toxicité cochléovestibulaire est réversible à l'arrêt du traitement"},{id:"D",text:"La toxicité rénale induite est le plus souvent réversible"},{id:"E",text:"Le pic plasmatique guide le risque de toxicité rénale"}],
        correct:["B","D"],
        explanations:{A:{v:false,t:"FAUX. L'activité bactéricide de l'amikacine (comme tous les aminosides : gentamicine, tobramycine, nétilmicine) est CONCENTRATION-DÉPENDANTE, pas temps-dépendante. Mécanisme : les aminosides inhibent la synthèse protéique bactérienne en se fixant à la sous-unité ribosomale 30S. Leur effet bactéricide est d'autant plus puissant que le pic plasmatique (Cmax) est élevé — d'où le principe d'administration en dose unique journalière forte. La pharmacodynamie idéale vise un rapport Cmax/CMI > 8-10. Cette propriété s'oppose à celle des bêta-lactamines (temps-dépendantes : efficacité liée au temps passé au-dessus de la CMI, justifiant les administrations fractionnées ou perfusions continues). Contre-exemple : la pénicilline G est l'archétype d'antibiotique temps-dépendant — son efficacité dépend du temps passé au-dessus de la CMI (T>CMI), justifiant des administrations fractionnées (4-6/j) ou en perfusion continue."},B:{v:true,t:"VRAI. L'administration en dose unique journalière (DUJ) est à privilégier pour l'amikacine et les aminosides en général. Mécanisme : 1) Activité concentration-dépendante — un pic plus élevé augmente la bactéricidie ; 2) Effet post-antibiotique prolongé des aminosides (effet bactéricide persistant après chute des concentrations sous la CMI) ; 3) Toxicité tubulaire rénale liée au temps de contact prolongé avec les cellules — l'administration en DUJ réduit la durée d'exposition et donc la néphrotoxicité ; 4) Praticité d'administration en pratique. Posologie usuelle adulte : amikacine 15-25 mg/kg/j en DUJ, gentamicine 5-7 mg/kg/j en DUJ. Contre-exemple : pour l'endocardite à streptocoque avec gentamicine en synergie, les recommandations classiques préconisaient l'administration en plusieurs prises pour maintenir des concentrations actives en synergie — mais les recommandations récentes tendent vers la DUJ aussi."},C:{v:false,t:"FAUX. La toxicité cochléovestibulaire des aminosides est généralement IRRÉVERSIBLE, pas réversible. Mécanisme : les aminosides s'accumulent dans les cellules ciliées externes de la cochlée et dans les cellules sensorielles vestibulaires, où ils provoquent une apoptose cellulaire par génération de radicaux libres et activation de cascades pro-apoptotiques. Les cellules ciliées ne se régénèrent pas chez l'humain — les lésions sont définitives. L'atteinte cochléaire entraîne une surdité de perception (souvent bilatérale, sur les hautes fréquences au début), l'atteinte vestibulaire des vertiges et une instabilité posturale (oscillopsie, dysmétrie). Surveillance : audiogramme avant et pendant traitement prolongé, recherche d'antécédent de surdité familiale (mutations m.1555A>G augmentant la susceptibilité). Contre-exemple : la néphrotoxicité tubulaire des aminosides est en revanche le plus souvent RÉVERSIBLE à l'arrêt — récupération en quelques semaines à mois si pas de lésion structurelle irréversible (insuffisance rénale chronique préexistante par exemple)."},D:{v:true,t:"VRAI. La toxicité rénale des aminosides est le plus souvent réversible à l'arrêt. Mécanisme : les aminosides s'accumulent dans les cellules tubulaires proximales (transport actif par les transporteurs mégaline-cubiline) où ils provoquent une nécrose tubulaire aiguë par dysfonction lysosomale, génération de radicaux libres et apoptose. L'atteinte est limitée aux cellules tubulaires (pas glomérulaire), elle se manifeste par une élévation progressive de la créatinine, une oligurie modérée, parfois une protéinurie tubulaire. La récupération est habituelle en 1-4 semaines après l'arrêt, sauf chez patients ayant : insuffisance rénale chronique préexistante, traitement prolongé > 14 jours, doses cumulées élevées, co-prescription d'autres néphrotoxiques. Contre-exemple : la toxicité ototoxique cochléovestibulaire est elle irréversible — l'arrêt de l'aminoside stoppe la progression mais ne récupère pas les cellules ciliées détruites."},E:{v:false,t:"FAUX. C'est la concentration RÉSIDUELLE (Cmin, taux pré-dose) qui guide le risque de toxicité rénale, pas le pic. Mécanisme : la toxicité rénale est liée au temps de contact prolongé des aminosides avec les cellules tubulaires. Une résiduelle élevée signifie que la concentration n'a pas suffisamment chuté entre deux doses, favorisant l'accumulation rénale. Cibles thérapeutiques pour la gentamicine en DUJ : pic 16-24 mg/L (efficacité), résiduelle < 1 mg/L (sécurité rénale). Surveillance des dosages plasmatiques systématique pour traitements > 5 jours. À l'inverse, le pic guide l'efficacité (rapport Cmax/CMI > 8-10) — il faut viser un pic élevé sans risque de surdosage car la toxicité est conditionnée par la résiduelle. Contre-exemple : pour la vancomycine, c'est aussi la résiduelle qui guide la toxicité rénale (cible 15-20 mg/L selon indication), avec un piège : un AUC trop élevé est néphrotoxique — d'où la préférence actuelle pour la surveillance par AUC plutôt que résiduelle seule."}}
      },
      {
        id:"177-04",type:"QRM",
        stem:"Un homme de 42 ans présente une pyélonéphrite aiguë droite. L'ECBU retrouve un E. coli sensible à l'amoxicilline, la ciprofloxacine, le cotrimoxazole, le céfixime et l'amoxicilline-acide clavulanique. Apyrétique à J3 sous ceftriaxone IV, vous discutez du relais oral. Vous souhaitez prescrire la molécule au plus faible impact écologique. Parmi les options suivantes, laquelle ou lesquelles est ou sont générateur ou générateurs de résistances bactériennes ?",
        choices:[{id:"A",text:"Amoxicilline"},{id:"B",text:"Ciprofloxacine"},{id:"C",text:"Cotrimoxazole"},{id:"D",text:"Amoxicilline-acide clavulanique"},{id:"E",text:"Céfixime"}],
        correct:["B","D","E"],
        explanations:{A:{v:false,t:"FAUX. L'amoxicilline n'est pas adaptée au traitement d'une pyélonéphrite aiguë communautaire en probabiliste. Mécanisme : E. coli (germe le plus fréquent des PNA, 70-80%) présente une résistance à l'amoxicilline d'environ 40-50% en France (résistance acquise par production de bêta-lactamases plasmidiques type TEM-1 ou OXA-1). L'amoxicilline est donc à éviter en probabiliste — réservée au traitement documenté après antibiogramme confirmant la sensibilité. La règle française est : pas d'amoxicilline en probabiliste pour les infections urinaires communautaires. Contre-exemple : pour une infection urinaire à entérocoque documenté sur ECBU (Enterococcus faecalis sensible), l'amoxicilline serait au contraire le traitement de référence — l'entérocoque est intrinsèquement résistant aux céphalosporines."},B:{v:true,t:"VRAI. La ciprofloxacine per os est une option valide pour le traitement ambulatoire d'une pyélonéphrite aiguë non compliquée chez la femme jeune (sous réserve d'absence de CI aux fluoroquinolones et d'épisodes récents de fluoroquinolones). Mécanisme : la ciprofloxacine a une excellente biodisponibilité per os, une bonne diffusion rénale et urinaire (concentrations élevées dans les urines et le parenchyme), et reste active sur la majorité des E. coli communautaires (résistance ~10-15%). Posologie : 500 mg x2/j pendant 7 jours. Surveillance des effets indésirables (tendinopathies, neuropsychiques, allergie). Contre-exemple : si la patiente avait été enceinte (CI absolue des fluoroquinolones pendant la grossesse), la ciprofloxacine aurait été remplacée par une C3G injectable (ceftriaxone) en première intention."},C:{v:false,t:"FAUX. Le cotrimoxazole (triméthoprime-sulfaméthoxazole) n'est pas recommandé en probabiliste pour la pyélonéphrite aiguë communautaire en France. Mécanisme : taux de résistance d'E. coli au triméthoprime > 20% en France, jugé trop élevé pour un usage probabiliste fiable. Il reste cependant une option en traitement documenté (relais après antibiogramme confirmant la sensibilité) ou dans certains pays où la résistance est moindre. Pour la cystite aiguë simple, il garde sa place en deuxième intention après fosfomycine et pivmécillinam selon les recommandations françaises. Contre-exemple : pour une cystite simple chez une femme avec contre-indication à la fosfomycine et au pivmécillinam, le cotrimoxazole serait acceptable en attente d'antibiogramme."},D:{v:true,t:"VRAI. L'amoxicilline-acide clavulanique est une option per os possible pour le traitement ambulatoire d'une pyélonéphrite aiguë non compliquée. Mécanisme : l'acide clavulanique inhibe les bêta-lactamases plasmidiques d'E. coli, restaurant l'activité de l'amoxicilline. Activité sur ~70-80% des E. coli communautaires. Bonne diffusion urinaire et rénale, biodisponibilité per os correcte. Limites : ne couvre pas les EBLSE (Entérobactéries productrices de bêta-lactamases à spectre élargi). Contre-exemple : pour une pyélonéphrite à EBLSE documentée (CTX-M producteur, par exemple chez un patient sous prophylaxie antibiotique récente), l'amoxicilline-acide clavulanique serait inefficace — il faudrait passer à un carbapénème (ertapénem, méropénème)."},E:{v:true,t:"VRAI. Le céfixime per os (C3G orale) est une option pour le traitement ambulatoire d'une pyélonéphrite aiguë non compliquée chez la femme. Mécanisme : C3G orale active sur la majorité des E. coli communautaires (résistance < 10%), bonne diffusion urinaire et rénale, biodisponibilité per os correcte. Posologie : 200 mg x2/j pendant 7-10 jours. Spectre étroit par rapport aux carbapénèmes. Réservée aux infections urinaires sans signe de gravité. Contre-exemple : pour une pyélonéphrite avec sepsis sévère (hyperthermie > 39.5°C, hypotension, marbrures), la voie per os serait insuffisante — il faudrait passer aux C3G injectables (ceftriaxone IV) en hospitalisation."}}
      },
      {
        id:"177-05",type:"QRM",
        stem:"Un homme de 78 ans, grabataire en EHPAD, colonisé à E. coli EBLSE dans les urines depuis 8 mois, est hospitalisé pour fièvre à 38,7°C, ébranlement lombaire droit douloureux, frissons. À l'admission : PA 78/42 mmHg, FC 122/min, Glasgow 13/15. L'ECBU retrouve des bacilles à Gram négatif en grande abondance. Parmi les propositions suivantes concernant l'antibiothérapie probabiliste, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'amoxicilline-acide clavulanique est indiquée en probabiliste"},{id:"B",text:"Un carbapénème est justifié en probabiliste dans cette situation"},{id:"C",text:"Il faut attendre l'antibiogramme avant de débuter tout antibiotique"},{id:"D",text:"Un carbapénème probabiliste n'est justifié qu'en cas de choc septique ET facteur de risque d'EBLSE réunis"},{id:"E",text:"Une fluoroquinolone en probabiliste est une alternative au carbapénème dans ce tableau"}],
        correct:["B","D"],
        explanations:{A:{v:false,t:"FAUX. L'amoxicilline-acide clavulanique n'est pas indiquée en probabiliste devant cette suspicion d'infection à EBLSE (entérobactérie productrice de bêta-lactamase à spectre élargi). Mécanisme : les EBLSE produisent des enzymes (CTX-M, SHV-ESBL, TEM-ESBL) qui hydrolysent toutes les céphalosporines (y compris C3G et C4G) et la majorité des pénicillines, mais aussi l'amoxicilline-acide clavulanique dans un nombre significatif de cas (résistance ~50% in vitro même avec inhibiteur de bêta-lactamase). L'AAC n'est donc pas fiable en probabiliste face à un risque d'EBLSE. Contre-exemple : pour une infection urinaire communautaire chez une femme jeune sans facteur de risque d'EBLSE, l'AAC per os serait un traitement probabiliste tout à fait acceptable — la probabilité d'E. coli sensible étant élevée."},B:{v:true,t:"VRAI. Un carbapénème (ertapénem, méropénème, imipénème) est justifié en probabiliste dans une situation de sepsis SÉVÈRE associée à des facteurs de risque d'EBLSE. Mécanisme : les carbapénèmes restent les antibiotiques de dernier recours pour les EBLSE — ils résistent à l'hydrolyse par les bêta-lactamases à spectre élargi (sauf carbapénèmases : KPC, NDM, OXA-48 dont la prévalence est encore faible en France). Indication probabiliste : sepsis grave/choc septique + facteur de risque d'EBLSE (séjour hospitalier récent, antibiothérapie large spectre récente, voyage en zone d'endémie, infections urinaires récurrentes, portage connu). Contre-exemple : devant un sepsis grave sans facteur de risque d'EBLSE, les C3G (ceftriaxone) suffisent en probabiliste — pas besoin de carbapénème par excès systématique."},C:{v:false,t:"FAUX. Il NE FAUT PAS attendre l'antibiogramme avant de débuter une antibiothérapie devant un sepsis. Mécanisme : le sepsis grave est une urgence vitale avec mortalité majorée de 5-10% par heure de retard à l'antibiothérapie adaptée (étude de Kumar 2006 — Crit Care Med). Les hémocultures sont prélevées immédiatement AVANT antibiotique (dans la mesure du possible, sans retarder de plus de 45 minutes), puis l'antibiothérapie probabiliste à large spectre est débutée empiriquement, réadaptée secondairement selon l'antibiogramme (désescalade ou modification). Contre-exemple : pour une infection urinaire basse non compliquée (cystite simple) chez une femme jeune, l'attente de l'ECBU peut éventuellement être discutée (24-48h) — la situation est moins urgente et le risque vital absent."},D:{v:true,t:"VRAI. Le carbapénème probabiliste est justifié UNIQUEMENT si choc septique ET facteur de risque d'EBLSE réunis. Mécanisme : c'est la règle de bon usage des carbapénèmes (épargne des dernières lignes thérapeutiques) — ces antibiotiques de dernier recours doivent être utilisés avec parcimonie pour éviter l'émergence de carbapénèmases (KPC, NDM, OXA-48). Pour un sepsis sans signe de gravité (sans hypotension, sans hyperlactatémie, sans dysfonction d'organe), les C3G + aminoside en probabiliste sont suffisantes même chez patient à risque d'EBLSE — désescalade si EBLSE non confirmée. Contre-exemple : pour un choc septique sans facteur de risque d'EBLSE (patient sans antécédent particulier, première hospitalisation, pas d'antibiothérapie récente), les C3G + aminoside suffisent en probabiliste — pas besoin de carbapénème par excès."},E:{v:false,t:"FAUX. Une fluoroquinolone en probabiliste n'est PAS une alternative au carbapénème dans un tableau de sepsis à risque d'EBLSE. Mécanisme : les EBLSE ont fréquemment des co-résistances aux fluoroquinolones (résistance croisée par mécanismes plasmidiques associés, sur-expression de pompes d'efflux), avec un taux de résistance > 50% chez les EBLSE. Les fluoroquinolones ne sont donc pas fiables en probabiliste face à un risque d'EBLSE. Elles peuvent être utilisées en relais per os après antibiogramme si la souche est sensible. Contre-exemple : devant une prostatite aiguë non sévère chez un patient sans facteur de risque d'EBLSE, la fluoroquinolone reste l'option de référence en probabiliste — bonne diffusion prostatique et activité acceptable sur les E. coli communautaires."}}
      },
      {
        id:"177-06",type:"QRM",
        stem:"Une patiente de 32 ans, allaitant un nourrisson de 5 semaines, consulte pour une infection urinaire basse documentée à E. coli sensible au cotrimoxazole. Elle a un déficit en G6PD connu. Son DFG est à 68 mL/min. Son bilan hépatique est normal. Parmi les propositions suivantes, laquelle ou lesquelles représente ou représentent une contre-indication à la prescription de cotrimoxazole chez cette patiente ?",
        choices:[{id:"A",text:"L'allaitement d'un nourrisson de 5 semaines"},{id:"B",text:"Le déficit en G6PD"},{id:"C",text:"Le DFG à 68 mL/min"},{id:"D",text:"La normalité du bilan hépatique"},{id:"E",text:"L'âge de 32 ans"}],
        correct:["A","B"],
        explanations:{A:{v:true,t:"VRAI. L'allaitement d'un nourrisson de 5 semaines constitue une CI relative au cotrimoxazole. Mécanisme : le triméthoprime et le sulfaméthoxazole passent dans le lait maternel à des concentrations significatives. Chez le nourrisson de moins de 2 mois, plusieurs risques : 1) Risque d'ictère néonatal par déplacement de la bilirubine de l'albumine (compétition pour les sites de liaison) — risque accru d'ictère nucléaire chez le prématuré ou nouveau-né ictérique ; 2) Risque hématologique (anémie hémolytique par déficit en G6PD non encore connu chez le nourrisson) ; 3) Immaturité hépatique et rénale du nouveau-né. La règle est : éviter le cotrimoxazole pendant l'allaitement d'un nouveau-né < 2 mois sauf nécessité absolue sans alternative. Contre-exemple : chez une femme allaitant un nourrisson de 8 mois sans déficit en G6PD connu, le cotrimoxazole pourrait être prescrit avec précaution — le risque pour le nourrisson est bien moindre."},B:{v:true,t:"VRAI. Le déficit en G6PD (glucose-6-phosphate déshydrogénase) constitue une CI au cotrimoxazole. Mécanisme : le sulfaméthoxazole est un sulfamide oxydant qui peut déclencher une crise d'hémolyse aiguë chez les patients ayant un déficit en G6PD. Le mécanisme implique l'inactivation du système antioxydant des globules rouges (glutathion réduit) qui ne peut plus protéger l'hémoglobine de l'oxydation — formation de corps de Heinz, hémolyse intravasculaire, anémie hémolytique aiguë avec ictère, urines foncées, parfois insuffisance rénale aiguë. Plus fréquent chez les sujets d'origine méditerranéenne, africaine, du Moyen-Orient ou d'Asie du Sud-Est. La recherche d'un déficit en G6PD doit être systématique avant prescription de sulfamides chez les sujets à risque. Contre-exemple : la dapsone (utilisée en prophylaxie de Pneumocystis chez le VIH) est également contre-indiquée en cas de déficit en G6PD — même mécanisme oxydant."},C:{v:false,t:"FAUX. Un DFG à 68 mL/min n'est pas une contre-indication au cotrimoxazole. Mécanisme : le triméthoprime et le sulfaméthoxazole ont une élimination essentiellement rénale, mais une fonction rénale modérément altérée (stade 2-3) n'est pas une CI absolue — adaptation posologique possible (réduction de dose ou espacement des prises). À un DFG entre 30 et 60 mL/min, on adapte la dose. Contre-exemple : à un DFG < 15 mL/min sans dialyse, le cotrimoxazole devient une contre-indication relative — risque d'accumulation et d'hyperkaliémie par effet épargneur potassique (le triméthoprime bloque les canaux sodium tubulaires, réduisant l'élimination du potassium)."},D:{v:false,t:"FAUX. La normalité du bilan hépatique n'est pas une CI au cotrimoxazole — c'est même une condition favorable à sa prescription. Mécanisme : le cotrimoxazole peut entraîner une hépatite toxique (cholestase, hépatite cytolytique aiguë, rares cas d'hépatite fulminante). Un bilan hépatique normal avant prescription permet de surveiller l'évolution éventuelle pendant le traitement. La présence d'une hépatopathie sévère préexistante (cirrhose Child C) serait au contraire une CI. Contre-exemple : une hépatopathie cholestatique active (transaminases à 5N, cholestase à 3N) constituerait une CI relative au cotrimoxazole — risque d'aggravation hépatique."},E:{v:false,t:"FAUX. L'âge de 32 ans n'est pas une CI au cotrimoxazole. Aucune restriction d'âge ne s'applique entre 2 mois et la fin de vie pour cette molécule, en dehors des CI absolues (allergie sulfamides, déficit en G6PD, grossesse au 1er trimestre, allaitement < 2 mois). Contre-exemple : chez un nourrisson de moins de 6 semaines, le cotrimoxazole est CI absolue en raison de l'immaturité hépatique et du risque d'ictère nucléaire — l'âge est alors un critère décisif."}}
      },
      {
        id:"177-07",type:"QRM",
        stem:"Un patient de 52 ans est traité par vancomycine IV pour une spondylodiscite à SARM. Dix-huit minutes après le début de la première perfusion, une infirmière vous appelle : érythème diffus du visage, du cou et du tronc avec prurit intense. Pression artérielle 118/72 mmHg, fréquence cardiaque 92/min. Pas d'œdème facial, pas de bronchospasme. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Ce tableau évoque un red man syndrome par perfusion trop rapide"},{id:"B",text:"Cet épisode impose l'arrêt définitif de la vancomycine"},{id:"C",text:"Il est possible de reprendre la vancomycine en ralentissant la vitesse de perfusion"},{id:"D",text:"La vancomycine expose à une ototoxicité irréversible"},{id:"E",text:"Ce tableau est une anaphylaxie IgE-médiée"}],
        correct:["A","C","D"],
        explanations:{A:{v:true,t:"VRAI. Ce tableau (érythème, flush facial et thoracique, prurit, parfois hypotension modérée) survenant pendant la perfusion de vancomycine est caractéristique du red man syndrome (syndrome de l'homme rouge). Mécanisme : il s'agit d'une réaction anaphylactoïde NON IgE-médiée — la vancomycine provoque une libération directe d'histamine par les mastocytes par un mécanisme pseudo-allergique (activation indépendante des IgE). Le déclencheur principal est la VITESSE de perfusion trop rapide (< 60 minutes pour 1 g). Diagnostic clinique sur la temporalité (apparition pendant la perfusion ou juste après) et la résolution rapide (quelques heures) à l'arrêt. Contre-exemple : une réaction de type Stevens-Johnson sous vancomycine (éruption cutanée bulleuse avec décollement, fièvre, atteinte des muqueuses) serait une réaction d'hypersensibilité retardée à mécanisme immunologique — radicalement différente, imposant l'arrêt définitif et CI à vie."},B:{v:false,t:"FAUX. Cet épisode N'IMPOSE PAS l'arrêt définitif de la vancomycine. Mécanisme : le red man syndrome n'est pas une allergie vraie (pas d'IgE spécifique, pas de mémoire immunologique) — il s'agit d'une réaction anaphylactoïde dose- et vitesse-dépendante. Il suffit de ralentir la perfusion (vitesse maximale 10 mg/min, soit 1 g sur 1 heure minimum, voire 2 heures pour les premières doses chez patients sensibles) et éventuellement de pré-médication par antihistaminique (hydroxyzine 25 mg per os 30 minutes avant). La reprise du traitement est tout à fait possible et même recommandée si la vancomycine est indispensable (infection à SARM par exemple). Contre-exemple : une anaphylaxie vraie IgE-médiée (œdème de Quincke, bronchospasme, choc anaphylactique) imposerait l'arrêt définitif de la vancomycine et la contre-indication à vie — situation radicalement différente."},C:{v:true,t:"VRAI. La reprise de la vancomycine est possible en ralentissant la vitesse de perfusion. Mécanisme : en respectant une vitesse maximale de 10 mg/min (1 g sur 1 heure minimum), la libération mastocytaire d'histamine reste sous le seuil symptomatique. Pour les patients très sensibles, on peut allonger à 2 heures pour les premières doses puis revenir à 1 heure si bien toléré. Pré-médication par antihistaminique H1 (hydroxyzine, cétirizine) en cas de récidive. Cette stratégie permet de poursuivre un traitement souvent indispensable (infections à SARM, allergie aux bêta-lactamines). Contre-exemple : si un véritable test cutané avait été positif (réaction IgE-médiée à la vancomycine), la reprise même lente serait contre-indiquée — alternative obligatoire (daptomycine, linézolide, ceftaroline selon contexte)."},D:{v:true,t:"VRAI. La vancomycine expose à une ototoxicité (cochléaire et vestibulaire) qui peut être IRRÉVERSIBLE. Mécanisme : effet dose-dépendant et concentration-dépendant ; toxicité majorée par : doses élevées, traitements prolongés, association à d'autres ototoxiques (aminosides, furosémide), résiduelle plasmatique > 30 mg/L. Surveillance : audiogramme avant traitement prolongé, dosages plasmatiques systématiques (résiduelle 15-20 mg/L). L'atteinte cochléaire (surdité de perception sur les hautes fréquences) est typiquement irréversible — les cellules ciliées ne se régénèrent pas. L'atteinte vestibulaire peut être unilatérale (compensation possible) ou bilatérale (instabilité posturale chronique). Contre-exemple : la néphrotoxicité de la vancomycine est en revanche généralement RÉVERSIBLE à l'arrêt — récupération en quelques semaines à mois, sauf si insuffisance rénale chronique préexistante."},E:{v:false,t:"FAUX. Le tableau décrit n'est PAS une anaphylaxie IgE-médiée. Mécanisme : différencier les deux est crucial : 1) Red man syndrome = pseudo-allergie, libération histaminique directe par les mastocytes, déclenchée par la vitesse de perfusion, dose-dépendant, sans mémoire immunologique, reproductible si vitesse rapide ; 2) Anaphylaxie IgE-médiée = vraie allergie, médiation par IgE spécifiques fixées sur les mastocytes, déclenchée par la dose même minime, indépendant de la vitesse, avec mémoire immunologique, reproductible à chaque administration. Symptomatologie souvent plus sévère dans l'anaphylaxie vraie (œdème de Quincke, bronchospasme, choc). Confondre les deux entraînerait une contre-indication injustifiée de la vancomycine. Contre-exemple : un test cutané (intradermo-réaction) positif pour la vancomycine signerait une véritable allergie IgE-médiée — la reprise serait alors strictement CI, contrairement au red man syndrome."}}
      },
      {
        id:"177-08",type:"QCU",
        stem:"Un enfant de 7 ans est pris en charge pour une infection ostéoarticulaire du genou à Staphylococcus aureus méticilline-sensible. Après 10 jours de traitement IV avec bonne évolution clinique et biologique, vous souhaitez effectuer un relais oral. L'enfant n'a aucune allergie connue. Parmi les propositions de relais oral suivantes, laquelle est contre-indiquée en raison de l'âge de cet enfant ?",
        choices:[{id:"A",text:"Amoxicilline"},{id:"B",text:"Clindamycine"},{id:"C",text:"Doxycycline"},{id:"D",text:"Cotrimoxazole"},{id:"E",text:"Rifampicine"}],
        correct:["C"],
        explanations:{A:{v:false,t:"FAUX. L'amoxicilline n'est pas le traitement de référence des rickettsioses (typhus murin, fièvre boutonneuse méditerranéenne, fièvre Q par exemple). Mécanisme : les rickettsies sont des bactéries intracellulaires obligatoires (multiplient à l'intérieur des cellules endothéliales vasculaires). L'amoxicilline n'a aucune activité intracellulaire significative — elle ne pénètre pas dans les cellules. Aucune indication dans les rickettsioses. Contre-exemple : pour une amygdalite à streptocoque bêta-hémolytique du groupe A, l'amoxicilline serait au contraire le traitement de référence — bactérie extracellulaire avec excellent profil de réponse aux pénicillines."},B:{v:false,t:"FAUX. La clindamycine n'est pas le traitement de référence des rickettsioses. Mécanisme : la clindamycine est un macrolide-like (apparenté aux lincosamides) avec activité antibactérienne sur staphylocoques, streptocoques et anaérobies. Elle a une activité limitée et incomplète sur les rickettsies. Elle est utilisée dans certains contextes (allergie aux tétracyclines, contre-indication, alternative en pédiatrie pour quelques rickettsioses très limitées). Contre-exemple : pour une infection ostéoarticulaire à staphylocoque doré méticillino-sensible chez un patient allergique aux bêta-lactamines, la clindamycine serait un traitement de choix — excellente diffusion osseuse et activité antistaphylococcique."},C:{v:true,t:"VRAI. La doxycycline (tétracycline) est le traitement de référence des rickettsioses (typhus, fièvre boutonneuse méditerranéenne, fièvre des montagnes Rocheuses, ehrlichiose, anaplasmose) ET de la fièvre Q (Coxiella burnetii). Mécanisme : la doxycycline pénètre largement dans les cellules eucaryotes (excellente diffusion intracellulaire) — indispensable pour atteindre les rickettsies multiplicatives dans les cellules endothéliales. Elle inhibe la synthèse protéique en se fixant à la sous-unité ribosomale 30S. Posologie : 200 mg/j en 1 ou 2 prises pendant 5-7 jours pour la plupart des rickettsioses, plus long pour la fièvre Q chronique. Excellente biodisponibilité per os. Contre-indication majeure : grossesse (dyschromie dentaire fœtale) et enfants < 8 ans (coloration dentaire et risque osseux). Contre-exemple : chez une femme enceinte avec rickettsiose grave, l'azithromycine peut être proposée comme alternative en raison de la CI de la doxycycline pendant la grossesse — efficacité inférieure mais sécurité fœtale prioritaire."},D:{v:false,t:"FAUX. Le cotrimoxazole n'est pas le traitement de référence des rickettsioses. Mécanisme : le cotrimoxazole a une activité limitée sur les rickettsies et est même DÉCONSEILLÉ dans certaines rickettsioses car il pourrait aggraver la maladie (mécanisme mal compris, mais constaté dans certaines études cliniques). C'est notamment le cas pour la fièvre Q où le cotrimoxazole est inefficace voire potentiellement délétère. Contre-exemple : le cotrimoxazole serait au contraire le traitement de référence de la pneumocystose à Pneumocystis jirovecii (anciennement P. carinii) — infection opportuniste du VIH/SIDA et des immunodéprimés."},E:{v:false,t:"FAUX. La rifampicine n'est pas le traitement de première intention des rickettsioses chez l'adulte. Mécanisme : elle a une activité limitée et inconstante sur les rickettsies. Elle peut être utilisée en seconde ligne ou en association dans certains cas particuliers. Contre-exemple : la rifampicine est en revanche le traitement de référence en association pour la maladie de Whipple (Tropheryma whipplei) en phase d'entretien, ou dans certaines infections ostéoarticulaires à staphylocoque doré en synergie."}}
      },
      {
        id:"177-09",type:"QRM",
        stem:"Un homme de 41 ans transplanté rénal depuis 3 ans sous tacrolimus présente une fièvre à 38,6°C depuis 10 jours. La virémie CMV revient à 8 500 UI/mL. Le bilan retrouve : hémoglobine 10,2 g/dL, leucocytes 2,8 G/L, plaquettes 98 G/L. Parmi les propositions suivantes concernant le traitement de cette réactivation CMV, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le ganciclovir IV est le traitement de référence des formes graves à CMV"},{id:"B",text:"L'aciclovir per os peut traiter cette réactivation CMV"},{id:"C",text:"Le valganciclovir per os peut être utilisé dans cette situation"},{id:"D",text:"La myélotoxicité du traitement peut aggraver les cytopénies préexistantes"},{id:"E",text:"La ribavirine est l'alternative recommandée en cas de résistance au ganciclovir"}],
        correct:["A","C","D"],
        explanations:{A:{v:true,t:"VRAI. Le ganciclovir IV est le traitement de référence des formes graves d'infection à CMV (cytomégalovirus). Mécanisme : analogue nucléosidique (analogue de la guanosine) qui inhibe la DNA polymérase virale du CMV après phosphorylation par la kinase virale UL97. Activité bactéricide sur le CMV avec excellente pénétration tissulaire. Indications principales : 1) Rétinite à CMV chez le VIH+ avec CD4 bas ; 2) Pneumopathie ou colite à CMV chez l'immunodéprimé (transplanté, allogreffe) ; 3) Réactivations CMV symptomatiques avec atteinte d'organe (encéphalite, hépatite). Posologie d'attaque : 5 mg/kg x2/j IV pendant 14-21 jours. Surveillance : myélotoxicité (neutropénie, thrombopénie) — premier effet indésirable limitant. Contre-exemple : pour une infection à HSV (Herpes simplex), l'aciclovir IV serait le traitement de référence — molécule différente, spectre antiviral plus étroit (HSV/VZV mais activité moindre sur CMV)."},B:{v:false,t:"FAUX. L'aciclovir per os n'est pas adapté au traitement d'une réactivation CMV. Mécanisme : l'aciclovir a une faible activité sur le CMV (CMI environ 100 fois plus élevée que sur HSV) — il n'est pas efficace cliniquement. Le valaciclovir (prodrogue de l'aciclovir) à très haute dose pourrait avoir une activité prophylactique sur le CMV chez certains patients transplantés, mais pas en curatif d'une infection établie. Contre-exemple : pour une primo-infection à HSV-1 (gingivostomatite herpétique grave) ou une infection herpétique récurrente sévère, l'aciclovir per os ou IV serait le traitement de référence — activité spectaculaire sur HSV."},C:{v:true,t:"VRAI. Le valganciclovir per os peut être utilisé dans cette situation. Mécanisme : prodrogue du ganciclovir avec biodisponibilité orale d'environ 60% (versus 6% pour le ganciclovir per os direct) — permet d'atteindre des concentrations plasmatiques comparables à la voie IV. Utilisé : 1) En relais du ganciclovir IV après contrôle de l'infection ; 2) En traitement de la rétinite CMV légère à modérée chez le VIH ; 3) En prophylaxie CMV chez le greffé de rein, foie, cœur, moelle osseuse. Posologie : 900 mg x2/j en curatif, 900 mg/j en prophylaxie. Effets indésirables similaires au ganciclovir (myélotoxicité +++). Contre-exemple : pour une rétinite CMV avec menace immédiate de la macula (zone 1 de la rétine), on préférerait le ganciclovir IV initial pour une concentration tissulaire maximale rapide — relais par valganciclovir secondaire."},D:{v:true,t:"VRAI. La myélotoxicité du ganciclovir et du valganciclovir peut aggraver des cytopénies préexistantes. Mécanisme : ces analogues nucléosidiques ne sont pas spécifiques uniquement de l'ADN polymérase virale — ils peuvent aussi être incorporés dans l'ADN des cellules en division rapide (moelle osseuse), bloquant la prolifération hématopoïétique. Effets indésirables typiques : neutropénie (40% des patients, parfois sévère < 0.5 G/L imposant arrêt), thrombopénie, anémie. Surveillance NFS quotidienne en initiation, hebdomadaire ensuite. Chez patient déjà cytopénique (hémopathie, chimiothérapie récente), le risque est cumulé — utilisation prudente, parfois avec G-CSF de soutien. Contre-exemple : le foscarnet, alternative au ganciclovir en cas de résistance ou de myélotoxicité majeure, n'a PAS de myélotoxicité significative — mais il est néphrotoxique et électrolytopénique (hypocalcémie, hypomagnésémie, hypokaliémie)."},E:{v:false,t:"FAUX. La ribavirine n'est pas l'alternative recommandée en cas de résistance au ganciclovir pour le CMV. Mécanisme : la ribavirine est un analogue nucléosidique à large spectre antiviral (VHC, VRS, fièvres hémorragiques virales) mais avec activité limitée et incertaine sur le CMV — pas d'indication clinique validée. Les alternatives reconnues en cas de résistance au ganciclovir sont : 1) Le foscarnet IV (mécanisme différent : inhibition directe de l'ADN polymérase sans nécessiter de phosphorylation préalable, donc actif sur souches résistantes par mutation UL97) ; 2) Le cidofovir IV (analogue acyclique de la cytidine, néphrotoxique majeur) ; 3) Le maribavir (nouvelle molécule récente). Contre-exemple : pour une infection à VRS sévère chez un enfant, la ribavirine en aérosol serait une option discutée (efficacité débattue) — c'est dans ce contexte qu'elle a sa place principale."}}
      },
      {
        id:"177-10",type:"QRM",
        stem:"Un homme de 68 ans traité par colchicine 1 mg/j pour goutte chronique, atorvastatine 40 mg/j, bisoprolol 5 mg/j et warfarine pour une FA valvulaire (INR cible 2-3) reçoit de la clarithromycine pour une bronchite bactérienne documentée. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'association clarithromycine-colchicine est contre-indiquée"},{id:"B",text:"L'atorvastatine doit être suspendue pendant le traitement"},{id:"C",text:"La clarithromycine est un inducteur enzymatique du CYP3A4"},{id:"D",text:"La clarithromycine expose à un allongement de l'espace QT"},{id:"E",text:"La warfarine est sans interaction avec la clarithromycine"}],
        correct:["A","B","D"],
        explanations:{A:{v:true,t:"VRAI. L'association clarithromycine-colchicine est CONTRE-INDIQUÉE — interaction médicamenteuse grave avec risque vital. Mécanisme : la clarithromycine est un inhibiteur puissant du CYP3A4 et de la P-glycoprotéine intestinale. La colchicine est métabolisée par le CYP3A4 et est un substrat de la P-gp. L'association entraîne une accumulation massive de colchicine avec risque de toxicité gravissime : diarrhées profuses, déshydratation, pancytopénie (aplasie médullaire), atteinte multiviscérale, parfois décès. Plusieurs cas mortels ont été rapportés. La clarithromycine doit être substituée (azithromycine si possible, qui inhibe moins le CYP3A4) ou la colchicine arrêtée pendant le traitement antibiotique. Contre-exemple : la spiramycine (autre macrolide) n'inhibe pas le CYP3A4 — elle n'est pas contre-indiquée avec la colchicine, et peut être une alternative dans certaines indications."},B:{v:true,t:"VRAI. L'atorvastatine doit être suspendue pendant le traitement par clarithromycine. Mécanisme : l'atorvastatine et la simvastatine sont des substrats majeurs du CYP3A4. L'inhibition du CYP3A4 par la clarithromycine entraîne une accumulation des statines avec risque de toxicité musculaire (myalgies, myosite, voire rhabdomyolyse avec insuffisance rénale aiguë). La rhabdomyolyse est l'effet indésirable grave à craindre. La règle est donc de suspendre l'atorvastatine pendant la durée du traitement antibiotique macrolide (5-10 jours) et de la reprendre 1-2 jours après l'arrêt — pas de perte de chance significative pour la prévention cardiovasculaire. Contre-exemple : la pravastatine et la rosuvastatine, qui sont moins métabolisées par le CYP3A4, ne nécessitent pas de suspension systématique — alternative pour les patients devant rester sous statine durant l'antibiothérapie."},C:{v:false,t:"FAUX. La clarithromycine n'est PAS un inducteur enzymatique du CYP3A4 — c'est exactement l'INVERSE. Elle est un INHIBITEUR puissant du CYP3A4 (avec l'érythromycine, le kétoconazole, le ritonavir). Distinction fondamentale : un inhibiteur enzymatique AUGMENTE les concentrations des médicaments substrats (interactions par accumulation), alors qu'un inducteur DIMINUE leurs concentrations (perte d'efficacité). Confondre les deux conduit à des erreurs thérapeutiques majeures. Les inducteurs principaux sont : rifampicine, anticonvulsivants (phénytoïne, carbamazépine, phénobarbital), millepertuis. Contre-exemple : si l'antibiotique avait été la rifampicine (inducteur enzymatique puissant), l'effet sur les substrats du CYP3A4 aurait été inverse — diminution des concentrations d'atorvastatine, de colchicine, mais aussi de contraceptifs oraux, AVK, immunosuppresseurs..."},D:{v:true,t:"VRAI. La clarithromycine expose à un allongement de l'intervalle QT. Mécanisme : les macrolides (clarithromycine > érythromycine > azithromycine) bloquent les canaux potassiques hERG cardiaques, ralentissant la repolarisation ventriculaire et allongeant le QT. Risque : torsades de pointes, mort subite cardiaque. Facteurs de risque cumulés : hypokaliémie, hypomagnésémie, bradycardie, IC, IDM récent, allongement QT congénital, co-prescription d'autres médicaments allongeant le QT (antiarythmiques de classe IA et III, neuroleptiques, antihistaminiques H1 de 1ère génération, certains antidépresseurs). Surveillance ECG recommandée si facteurs de risque. Contre-exemple : la spiramycine et la josamycine sont des macrolides à moindre risque d'allongement QT — alternatives pour patients à risque cardiaque."},E:{v:false,t:"FAUX. La warfarine N'EST PAS sans interaction avec la clarithromycine — au contraire, l'interaction est majeure. Mécanisme : la warfarine est métabolisée par le CYP3A4 et le CYP2C9. L'inhibition du CYP3A4 par la clarithromycine augmente les concentrations de warfarine et son effet anticoagulant, avec risque hémorragique majeur. L'INR doit être surveillé étroitement (contrôle à 48-72h après introduction de l'antibiotique), avec adaptation posologique généralement à la baisse pendant le traitement antibiotique. Contre-exemple : la fluindione (autre AVK), bien que moins métabolisée par le CYP3A4 que la warfarine, présente aussi des interactions significatives avec les macrolides — la surveillance INR reste indispensable."}}
      },
      {
        id:"177-11",type:"QRM",
        stem:"Un homme de 74 ans diabétique de type 2, sans allergie connue, est admis pour fièvre à 39,5°C, céphalées intenses et raideur de nuque d'apparition brutale. Le scanner cérébral est normal. La ponction lombaire montre : leucocytes 8 400/mm³ (92% polynucléaires), protéinorachie à 3,1 g/L, glycorachie à 1,2 mmol/L pour une glycémie à 6,8 mmol/L. L'examen direct retrouve des diplocoques à Gram positif. Quelles sont les deux molécules que vous prescrivez en urgence ?",
        choices:[{id:"A",text:"Amoxicilline à fortes doses"},{id:"B",text:"Céfotaxime à fortes doses"},{id:"C",text:"Gentamicine à fortes doses"},{id:"D",text:"Vancomycine à fortes doses"},{id:"E",text:"Dexaméthasone"}],
        correct:["B","E"],
        explanations:{A:{v:false,t:"FAUX. L'amoxicilline à fortes doses n'est pas adaptée en probabiliste devant ce tableau de méningite chez l'adulte âgé. Mécanisme : à 78 ans, le terrain impose de couvrir Listeria monocytogenes (sensible à l'amoxicilline mais résistante à toutes les céphalosporines) ET pneumocoque (germe le plus fréquent à cet âge, sensible aux C3G mais parfois de sensibilité diminuée à la pénicilline). L'amoxicilline seule ne couvre pas le pneumocoque de sensibilité diminuée et n'a pas l'avantage de la C3G pour la pénétration méningée. Le traitement probabiliste de référence chez l'adulte > 50 ans est : C3G + amoxicilline + gentamicine (pour synergie sur Listeria) + dexaméthasone. Contre-exemple : devant une méningite à Listeria DOCUMENTÉE (examen direct positif à bacille Gram+), l'amoxicilline à forte dose deviendrait au contraire le traitement principal — la C3G serait arrêtée car inefficace sur Listeria."},B:{v:true,t:"VRAI. Le céfotaxime à fortes doses (200-300 mg/kg/j IV) ou la ceftriaxone (2 g x2/j IV) est la base de l'antibiothérapie probabiliste de la méningite bactérienne communautaire à tout âge. Mécanisme : la C3G couvre les principaux germes communautaires (pneumocoque, méningocoque, Haemophilus, entérobactéries) avec excellente diffusion méningée et bactéricidie rapide. Posologie à forte dose obligatoire en raison de la pénétration limitée par la BHM même inflammée. C'est le pilier de l'antibiothérapie probabiliste recommandé par la SPILF, l'ESCMID et l'IDSA. Contre-exemple : pour une méningite post-neurochirurgicale avec suspicion de Pseudomonas aeruginosa, la ceftazidime (C3G antipyocyanique) aurait été préférée à la ceftriaxone — spectre adapté aux germes hospitaliers."},C:{v:false,t:"FAUX. La gentamicine seule ne suffit pas et n'est pas le traitement de la méningite bactérienne en probabiliste. Elle est associée à l'amoxicilline en cas de suspicion de Listeria (synergie bactéricide), mais sa diffusion méningée est limitée même à fortes doses. Mécanisme : les aminosides traversent peu la BHM (passage < 10% du sérum), et ne sont jamais utilisés en monothérapie pour traiter une méningite. Leur rôle dans l'arsenal est strictement synergique avec une bêta-lactamine adaptée au germe. Posologie : 3-5 mg/kg/j en DUJ, durée limitée 7-14 jours pour limiter la toxicité. Contre-exemple : pour une méningococcie pure (méningococcémie sans méningite documentée), la gentamicine pourrait être associée au C3G en synergie initialement — son rôle reste cependant adjuvant et non principal."},D:{v:false,t:"FAUX. La vancomycine à fortes doses n'est pas indiquée en probabiliste pour cette méningite communautaire. Mécanisme : la vancomycine est réservée aux pneumocoques de haut niveau de résistance aux C3G (CMI ceftriaxone > 0.5 mg/L, exceptionnel en France < 1% des souches), aux méningites post-neurochirurgicales (suspicion MRSA), ou en cas d'allergie sévère aux bêta-lactamines. Ajoutée d'emblée chez tous les patients, elle expose à une néphrotoxicité et ototoxicité inutiles. Contre-exemple : pour une méningite chez un patient au retour d'un séjour aux États-Unis (où les pneumocoques de haut niveau de résistance sont plus fréquents) avec direct positif à cocci Gram+ en chaînettes, l'ajout de vancomycine au céfotaxime serait à discuter en attendant l'antibiogramme."},E:{v:true,t:"VRAI. La dexaméthasone IV est indiquée dans cette situation. Mécanisme : la dexaméthasone (10 mg toutes les 6h pendant 4 jours) doit être administrée avant ou simultanément à la première dose d'antibiotique en cas de : 1) LCS trouble (purulent) à la PL ; 2) Examen direct positif à cocci Gram+ (pneumocoque le plus probable) ; 3) CI à la PL d'emblée avec antibiothérapie probabiliste empirique. Elle réduit la mortalité de 6% (étude De Gans van de Beek, NEJM 2002) et le risque de surdité séquellaire de 50% dans les méningites à pneumocoque. La fenêtre thérapeutique est étroite — toute administration après l'antibiothérapie initiale a beaucoup moins d'efficacité car le pic inflammatoire post-lyse bactérienne est déjà installé. Contre-exemple : pour une méningite virale claire avec lymphocytose et normoglycorrachie, la dexaméthasone serait CONTRE-INDIQUÉE — pas de bénéfice démontré, risques propres aux corticoïdes."}}
      },
      {
        id:"177-12",type:"QRM",
        stem:"Un homme de 38 ans, allergie à l'amoxicilline documentée (urticaire généralisée survenue à l'âge adulte), est pris en charge pour une arthrite septique du genou à Staphylococcus aureus méticilline-sensible confirmée par ponction articulaire. Après 10 jours de traitement IV avec bonne évolution, vous envisagez un relais oral par clindamycine. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La clindamycine est une alternative justifiée dans ce contexte d'allergie aux pénicillines"},{id:"B",text:"La clindamycine a une excellente diffusion osseuse et articulaire"},{id:"C",text:"La clindamycine expose à un risque de colite à Clostridioides difficile"},{id:"D",text:"La clindamycine est contre-indiquée en cas d'allergie documentée aux pénicillines"},{id:"E",text:"La clindamycine couvre Pseudomonas aeruginosa"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. La clindamycine est une alternative justifiée dans ce contexte d'allergie aux pénicillines pour une infection ostéo-articulaire (IOA) à staphylocoque. Mécanisme : la clindamycine est un antibiotique de la classe des lincosamides (apparentés aux macrolides), inhibiteur de la synthèse protéique en se fixant à la sous-unité ribosomale 50S. Elle a une excellente activité antistaphylococcique (sauf cas de SARM résistant — antibiogramme essentiel) et une remarquable diffusion osseuse, articulaire et tissulaire. Elle est l'alternative recommandée dans les IOA en cas d'allergie aux bêta-lactamines, à condition que la souche soit sensible (test D obligatoire pour vérifier l'absence de résistance inductible MLSb). Posologie : 600-900 mg x3/j IV ou per os. Biodisponibilité orale excellente, ce qui permet un relais oral rapide. Contre-exemple : devant un SARM avec résistance MLSb constitutive sur l'antibiogramme, la clindamycine serait inefficace — il faudrait recourir à la vancomycine, daptomycine ou linézolide."},B:{v:true,t:"VRAI. La clindamycine a une excellente diffusion osseuse et articulaire. Mécanisme : la clindamycine est lipophile, elle pénètre largement les tissus osseux (concentrations osseuses 25-40% des concentrations sériques, soit largement au-dessus des CMI sur staphylocoque), articulaires, abcédés. C'est une propriété pharmacocinétique remarquable qui en fait un antibiotique de choix dans les infections ostéo-articulaires staphylococciques. Elle pénètre aussi bien les abcès cérébraux (mais pas comme premier choix car couverture limitée), les ostéo-arthrites, les spondylodiscites, les infections sur matériel prothétique. Contre-exemple : la vancomycine, en comparaison, a une diffusion osseuse moindre (10-20% des concentrations sériques) — d'où la difficulté thérapeutique parfois dans les IOA à SARM, parfois besoin de doses élevées."},C:{v:true,t:"VRAI. La clindamycine expose à un risque de colite à Clostridioides difficile (anciennement Clostridium difficile). Mécanisme : la clindamycine, par son large spectre antibactérien anaérobie, perturbe profondément le microbiote intestinal. Cette perturbation favorise la prolifération de C. difficile (anaérobie sporulé) qui produit ses toxines A et B responsables de la colite pseudomembraneuse. C'est l'antibiotique le plus historiquement associé à cette complication (avec les fluoroquinolones et les céphalosporines plus récemment). Symptômes : diarrhée profuse, fièvre, douleurs abdominales, hyperleucocytose, parfois mégacôlon toxique. Diagnostic : recherche de toxines A et B dans les selles. Traitement : arrêt de l'antibiotique en cause, métronidazole per os (formes légères-modérées) ou vancomycine per os (formes sévères ou récidives), fidaxomicine pour les formes complexes. Contre-exemple : la ciprofloxacine et l'amoxicilline-acide clavulanique sont aussi des antibiotiques à risque élevé de colite à C. difficile — la prudence est requise dans toute prescription antibiotique chez le sujet âgé hospitalisé."},D:{v:false,t:"FAUX. La clindamycine n'est PAS contre-indiquée en cas d'allergie aux pénicillines. Mécanisme : il n'y a pas de réactivité croisée immunologique entre la clindamycine (lincosamide) et les bêta-lactamines (pénicillines, céphalosporines). Les patients allergiques aux pénicillines (même réactions sévères type anaphylaxie) peuvent recevoir la clindamycine sans risque allergique croisé. C'est précisément l'intérêt de cette molécule comme alternative chez l'allergique aux bêta-lactamines pour les infections à cocci Gram+. Contre-exemple : entre l'amoxicilline (pénicilline) et la ceftriaxone (céphalosporine), il existe en revanche une réactivité croisée d'environ 1-3% — donc une allergie sévère aux pénicillines impose une vigilance avec les céphalosporines."},E:{v:false,t:"FAUX. La clindamycine ne couvre PAS Pseudomonas aeruginosa. Mécanisme : son spectre est étroit, limité aux cocci à Gram positif (staphylocoque, streptocoque) et aux anaérobies (Bacteroides, Fusobacterium, Peptostreptococcus, Prevotella). Elle est inactive sur les bactéries à Gram négatif aérobies, incluant Pseudomonas aeruginosa. Cette caractéristique impose une association à un antibiotique anti-Gram négatif (C3G, fluoroquinolone, aminoside) en cas de suspicion d'infection mixte ou de Gram négatif. Contre-exemple : pour une infection à Pseudomonas aeruginosa documentée, les antibiotiques actifs sont : pipéracilline-tazobactam, ceftazidime, céfépime, méropénème, fluoroquinolones antipyocyaniques (ciprofloxacine), aminosides — la clindamycine n'a aucune place."}}
      },
      {
        id:"177-13",type:"QRM",
        stem:"Une patiente de 44 ans séropositive pour le VIH avec CD4 à 110/mm³ est hospitalisée pour un abcès hépatique unique de 6 cm, à contenu liquidien hétérogène. La sérologie amibienne revient positive avec un titre élevé. Son médecin instaure un traitement par métronidazole. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le métronidazole est le traitement de référence de l'amibiase invasive"},{id:"B",text:"Le métronidazole est actif sur l'ensemble des bactéries anaérobies"},{id:"C",text:"L'association à l'alcool expose à un effet antabuse"},{id:"D",text:"Le métronidazole est actif sur Actinomyces"},{id:"E",text:"Le métronidazole potentialise l'effet des anticoagulants antivitamine K"}],
        correct:["A","C","E"],
        explanations:{A:{v:true,t:"VRAI. Le métronidazole est le traitement de référence de l'amibiase invasive (Entamoeba histolytica), notamment l'amibiase hépatique. Mécanisme : le métronidazole est un dérivé nitro-imidazolé activé en condition anaérobie ou microaérophile par réduction de son groupement nitro. Le radical libre formé endommage l'ADN parasitaire et bactérien. E. histolytica étant un parasite microaérophile, le métronidazole y est très actif. Posologie : 1.5-2 g/j per os ou IV pendant 7-10 jours, suivi systématiquement d'un amœbicide de contact (tiliquinol-tilbroquinol — Intetrix) pendant 10 jours pour éradiquer le portage colique. Contre-exemple : pour une amibiase asymptomatique (portage de kystes d'E. histolytica chez un sujet asymptomatique), le métronidazole n'est pas nécessaire — le traitement repose sur l'amœbicide de contact seul (tiliquinol-tilbroquinol)."},B:{v:false,t:"FAUX. Le métronidazole n'est PAS actif sur l'ensemble des bactéries anaérobies. Mécanisme : le métronidazole a une excellente activité sur les anaérobies Gram-négatifs (Bacteroides, Fusobacterium, Prevotella) et certains anaérobies Gram-positifs (Clostridium, Peptostreptococcus). En revanche, il N'EST PAS actif sur Actinomyces (bacille filamenteux Gram+ anaérobie facultatif, traité par amoxicilline) ni sur Propionibacterium (Cutibacterium acnes) ni certains Lactobacillus. Cette distinction est cruciale pour le choix de l'antibiothérapie probabiliste. Contre-exemple : pour une infection à Actinomyces (actinomycose cervico-faciale ou pulmonaire), le métronidazole serait inefficace — le traitement repose sur l'amoxicilline ou la pénicilline G à fortes doses et long terme (3-6 mois)."},C:{v:true,t:"VRAI. L'association métronidazole-alcool expose à un effet antabuse (réaction antabuse de type disulfirame). Mécanisme : le métronidazole inhibe l'aldéhyde déshydrogénase hépatique, enzyme du métabolisme de l'alcool. L'éthanol n'est plus dégradé efficacement et l'acétaldéhyde s'accum
