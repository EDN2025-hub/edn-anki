ydrocéphalie — pas d'exsudat inflammatoire suffisant pour obstruer les voies du LCS."},C:{v:true,t:"VRAI. L'épilepsie séquellaire post-méningitique est une complication classique, touchant 5-20% des patients. Mécanisme : cicatrices gliales corticales secondaires à la souffrance inflammatoire et aux infarctus vasculitiques entraînent un foyer épileptogène focal. Les crises peuvent être généralisées tonico-cloniques ou partielles selon la localisation des cicatrices. Plus fréquente après méningite à pneumocoque (atteinte corticale plus marquée). Le traitement antiépileptique au long cours est généralement requis. La survenue de crises convulsives PENDANT la phase aiguë de la méningite est en revanche fréquente (10-30%) et ne signifie pas obligatoirement épilepsie séquellaire — elles peuvent être transitoires. Contre-exemple : les crises convulsives fébriles simples de l'enfant (3-5 ans, fébriles, généralisées, brèves, sans déficit post-critique) ne sont pas une épilepsie séquellaire et n'évoluent pas vers l'épilepsie — elles n'ont pas de lien causal avec une éventuelle méningite ultérieure."},D:{v:true,t:"VRAI. Les troubles cognitifs séquellaires (mémoire, attention, fonctions exécutives, vitesse de traitement de l'information) sont des complications fréquentes, surtout après méningite à pneumocoque chez l'adulte (jusqu'à 30% selon les études). Mécanisme : œdème cérébral aigu, infarctus vasculitiques cortico-sous-corticaux, encéphalopathie inflammatoire aiguë avec lésions séquellaires. Chez l'enfant, l'atteinte cognitive peut compromettre les apprentissages scolaires (lecture, écriture, calcul) et le développement intellectuel global — d'où l'importance d'un suivi neuropsychologique longitudinal. La prise en charge précoce par neuropsychologue, orthophoniste et ergothérapeute peut limiter l'impact fonctionnel. Contre-exemple : une méningite virale d'évolution simple chez un adulte ne donne quasiment jamais de troubles cognitifs séquellaires — le pronostic neurologique est généralement excellent avec restitution ad integrum."},E:{v:false,t:"FAUX. La sclérose en plaques (SEP) n'est pas une complication des méningites bactériennes. Mécanisme : la SEP est une maladie auto-immune démyélinisante du système nerveux central, d'origine multifactorielle (prédisposition génétique, facteurs environnementaux, hypothèse virale EBV). Il n'existe pas de lien causal établi entre une méningite bactérienne antérieure et le développement ultérieur d'une SEP. Confondre les complications d'une méningite bactérienne avec une pathologie démyélinisante autoimmune serait une erreur diagnostique majeure. Contre-exemple : l'encéphalomyélite aiguë disséminée (ADEM) peut au contraire faire suite à une infection virale (souvent dans les 2-4 semaines après) — pathologie démyélinisante post-infectieuse, distincte de la SEP, généralement monophasique avec bon pronostic."}}
      },
      {
        id:"151-qi19",type:"QRM",
        stem:"Un homme de 35 ans est hospitalisé pour un deuxième épisode de méningite à pneumocoque en 3 ans. Le bilan étiologique du premier épisode n'avait pas été réalisé. Parmi les explorations suivantes, lesquelles doivent être systématiquement réalisées dans ce contexte de méningite récidivante ?",
        choices:[{id:"A",text:"Bilan du complément (CH50, C3, C4, facteurs du complément terminal)"},{id:"B",text:"Dosage des immunoglobulines sériques (IgG, IgA, IgM)"},{id:"C",text:"Recherche d'une asplénie anatomique ou fonctionnelle"},{id:"D",text:"Exploration virologique systématique (VIH, VHC, CMV, EBV)"},{id:"E",text:"Myélogramme systématique pour éliminer une hémopathie"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. Le bilan du complément (CH50, C3, C4, et facteurs du complément terminal C5-C9) doit être systématiquement réalisé devant des méningites bactériennes récidivantes ou des méningococcies récurrentes. Mécanisme : les déficits en complément terminal (C5, C6, C7, C8, C9) ou en properdine prédisposent spécifiquement aux infections invasives à méningocoque récurrentes — la voie alterne du complément avec le complexe d'attaque membranaire (MAC) est essentielle pour la bactéricidie sur Neisseria, bactérie à structure de paroi particulière. Un déficit en complément terminal multiplie le risque de méningococcie par un facteur 600-1000. Le déficit en C3 (complément central) prédispose plus largement aux infections à germes encapsulés (pneumocoque, méningocoque, Haemophilus). La recherche se fait par dosage fonctionnel (CH50, AP50) et antigénique (C3, C4 quantitatifs). Contre-exemple : un déficit en lectine se liant au mannose (MBL) entraînerait également un risque accru d'infections, mais l'exploration est plus spécialisée et moins systématique en pratique de premier recours."},B:{v:true,t:"VRAI. Le dosage des immunoglobulines sériques (IgG, IgA, IgM) est systématique pour rechercher un déficit immunitaire humoral. Mécanisme : les déficits en immunoglobulines (déficit immunitaire commun variable DICV, agammaglobulinémie liée à l'X de Bruton, déficits en sous-classes d'IgG) prédisposent aux infections à germes encapsulés (pneumocoque, Haemophilus, méningocoque) qui nécessitent l'opsonisation par les anticorps spécifiques pour leur élimination. Une hypogammaglobulinémie franche (IgG < 5 g/L par exemple) ou un déficit d'une sous-classe d'IgG (IgG2 notamment, importante pour les polysaccharides bactériens) justifie une supplémentation par immunoglobulines IV ou sous-cutanées pour prévenir les récidives. Contre-exemple : un déficit immunitaire CELLULAIRE (lymphocytes T) prédispose plutôt aux infections opportunistes intracellulaires (Pneumocystis, mycobactéries atypiques, CMV) — pas aux méningites bactériennes récidivantes classiques."},C:{v:true,t:"VRAI. La recherche d'une asplénie anatomique (post-chirurgicale, post-traumatique) ou fonctionnelle (drépanocytose homozygote SS, drépanocytose SC, thrombocytémie essentielle splénectomie partielle, maladie cœliaque, cirrhose avancée, lupus avec asplénie auto-immune) doit être systématique. Mécanisme : la rate est l'organe clé pour la clairance des bactéries encapsulées (pneumocoque, méningocoque, Haemophilus) par les macrophages spléniques et la production d'anticorps anti-polysaccharidiques par les lymphocytes B de la zone marginale. L'asplénie multiplie par 50-100 le risque d'infection invasive à germes encapsulés. Les patients aspléniques doivent bénéficier : 1) Vaccinations spécifiques (pneumocoque conjugué + polyosidique, méningocoque ACWY conjugué + B, Haemophilus, grippe annuelle) ; 2) Antibioprophylaxie continue par phénoxyméthylpénicilline (chez l'enfant), à discuter chez l'adulte ; 3) Carte d'asplénie à porter, antibiothérapie d'urgence à débuter au moindre signe infectieux. Diagnostic d'asplénie : recherche de corps de Howell-Jolly sur frottis sanguin, échographie ou TDM abdominale, scintigraphie au technétium colloïdal en cas de doute. Contre-exemple : une splénomégalie isolée sans hyperfonctionnement ne prédispose pas aux infections — au contraire, c'est l'hypofonctionnement splénique qui pose problème."},D:{v:false,t:"FAUX. L'exploration virologique systématique (VIH, VHC, CMV, EBV) n'est pas pertinente devant des méningites bactériennes récidivantes. Le VIH peut effectivement entraîner des infections opportunistes (cryptococcose, tuberculose) mais pas des méningites bactériennes communautaires récidivantes. La sérologie VIH doit cependant être proposée systématiquement chez tout adulte présentant une infection grave (recommandation générale de dépistage). Le VHC, CMV, EBV n'ont aucun lien avec une prédisposition aux méningites bactériennes encapsulées récidivantes. Contre-exemple : si la suspicion clinique avait été une méningite virale récidivante (méningite de Mollaret par HSV-2 par exemple), l'exploration virologique avec PCR HSV répétées dans le LCS aurait été pertinente — mais on serait dans une autre catégorie d'étiologie."},E:{v:false,t:"FAUX. Le myélogramme systématique n'est pas indiqué devant des méningites bactériennes récidivantes en première intention. Il serait éventuellement discuté si la NFS montre des anomalies évocatrices (cytopénies, blastes circulants, dysmorphies cellulaires) ou si une hémopathie sous-jacente est suspectée cliniquement (myélome multiple avec hypogammaglobulinémie monoclonale, leucémie lymphoïde chronique avec hypogammaglobulinémie associée). Sans signe d'orientation hématologique, le myélogramme n'apporte rien et expose à un geste invasif inutile. Contre-exemple : devant des infections invasives récidivantes associées à une hypogammaglobulinémie polyclonale chez un adulte de plus de 60 ans, le myélogramme deviendrait alors indispensable pour rechercher un myélome multiple (immunoélectrophorèse sériques préalable montrant un pic monoclonal IgG ou IgA) — exemple typique de déficit immunitaire humoral acquis."}}
      }
    ]

const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898];
const RETENTION_TARGET=0.85;
const DECAY=-0.5;
const FACTOR=19/81; // = 0.9^{1/DECAY}-1 = 0.2346 — ancrage à R=0.9 quand t=s
const LS_KEY='edn_anki_v3';
const NOTES_KEY='edn_anki_notes';
const HISTORY_KEY='edn_anki_history';
const MAX_HISTORY=50;
const PAUSE_KEY='edn_anki_paused';

// --- Stabilité initiale (W[g-1] directement, FSRS-5) ---
function initS(g){return Math.max(W[g-1],0.1);}

// --- Difficulté initiale (formule exponentielle FSRS-5) ---
function initD(g){return Math.min(Math.max(W[4]-Math.exp(W[5]*(g-1))+1,1),10);}
// g=1:7.19, g=2:6.49, g=3:5.28, g=4:3.22

// --- Mise à jour difficulté avec régression vers la moyenne ---
function nextD(d,g){
  const raw=d-W[5]*(g-3);
  const baseline=W[4]-Math.exp(W[5]*2)+1; // initD(3)=5.28
  // Régression W[7]=0.0046 (très faible → stabilité de la difficulté)
  return Math.min(Math.max(W[7]*baseline+(1-W[7])*raw,1),10);
}

// --- Retrievabilité au moment de la révision (power-law FSRS-5) ---
// R(t,s) = (1 + FACTOR*t/s)^DECAY — à t=s → R=0.9 par construction
function retrievability(s,lastReviewDate){
  if(!s||!lastReviewDate)return 1.0;
  const t=Math.max(0,(Date.now()-new Date(lastReviewDate).getTime())/86400000);
  return Math.pow(1+FACTOR*t/s,DECAY);
}

// --- Stabilité après OUBLI (grade=1) — formule FSRS-5 avec R ---
// S'_f = W[11] × D^{-W[12]} × ((S+1)^{W[13]}-1) × exp((1-R)×W[14])
function nextS_forget(d,s,R){
  return Math.max(
    W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp((1-R)*W[14]),
    0.1
  );
}

// --- Stabilité après RAPPEL RÉUSSI (grades 2-4) — formule FSRS-5 avec R ---
// S'_r = S × (exp(W[8])×(11-D)×S^{-W[9]}×(exp((1-R)×W[10])-1)×hp×eb + 1)
function nextS_recall(d,s,R,g){
  const hp=(g===2)?W[15]:1; // hard penalty
  const eb=(g===4)?W[16]:1; // easy bonus
  const growth=Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp((1-R)*W[10])-1);
  return Math.max(s*(growth*hp*eb+1),0.1);
}

// --- Intervalle depuis stabilité — formule power-law FSRS-5 correcte ---
// I = (s/FACTOR) × (r^{1/DECAY} - 1)
// À r=0.85 : I ≈ 1.60s | r=0.90 : I=s | r=0.95 : I ≈ 0.45s
function sToInterval(s){
  return Math.max(Math.round((s/FACTOR)*(Math.pow(RETENTION_TARGET,1/DECAY)-1)),1);
}

function isDue(card){
  if(!card.due)return true; // Nouvelle question = toujours due
  // Mode pause : les ancrages (reviews>0) sont gelés, pas les nouvelles
  if(localStorage.getItem(PAUSE_KEY)==='1'&&card.reviews>0)return false;
  return new Date(card.due)<=new Date();
}

function postponeCard(qid,days){
  let st=loadState();
  let c=st[qid];
  if(!c||!c.due){return;}
  let d=new Date(c.due);
  d.setDate(d.getDate()+days);
  c.due=d.toISOString().slice(0,10);
  st[qid]=c;
  saveState(st);
  render();
}

  if(isPaused()){localStorage.removeItem(PAUSE_KEY);}
  else{localStorage.setItem(PAUSE_KEY,'1');}
  render();
}

function getScoreType(selected,correct){
  let selSet=new Set(selected),corSet=new Set(correct);
  let allRight=corSet.size===selSet.size&&[...corSet].every(c=>selSet.has(c));
  if(allRight)return 'perfect';
  let anyRight=[...selSet].some(s=>corSet.has(s));
  if(anyRight&&selSet.size>0)return 'partial';
  return 'wrong';
}

function getButtonConfig(scoreType){
  if(scoreType==='perfect')return [
    {label:'Facile',cls:'easy',grade:4,mult:1.0,cap:180},
    {label:'Correct',cls:'correct',grade:3,mult:1.0,cap:120},
    {label:'Moyen',cls:'medium',grade:2,mult:1.0,cap:70},
    {label:'Faux',cls:'wrong',grade:1,mult:1.0,cap:1}
  ];
  if(scoreType==='partial')return [
    {label:'Correct',cls:'correct',grade:3,mult:0.7,cap:60},
    {label:'Moyen',cls:'medium',grade:2,mult:0.7,cap:30},
    {label:'Faux',cls:'wrong',grade:1,mult:0.7,cap:1}
  ];
  return [
    {label:'Moyen',cls:'medium',grade:2,mult:0.5,cap:30},
    {label:'Faux',cls:'wrong',grade:1,mult:0.3,cap:1}
  ];
}

// ================================================================
// CALCUL INTERVALLE FINAL
// ================================================================
function computeNextInterval(card,grade,mult,cap){
  let s=card.s,d=card.d,reviews=card.reviews,dynCoeff=card.dynCoeff||1.0;
  const today=new Date().toISOString().slice(0,10);

  if(s===null){
    // Première révision — init directe FSRS-5
    s=initS(grade);
    d=initD(grade);
    if(grade===1)dynCoeff=0.9; // Amélioration : premier oubli → pénalité de départ
  } else {
    // Révisions suivantes : calculer R exacte au moment de la révision
    const R=retrievability(s,card.lastReviewDate);
    if(grade===1)s=nextS_forget(d,s,R);
    else s=nextS_recall(d,s,R,grade);
    d=nextD(d,grade);
  }

  // Étape 1 : intervalle brut FSRS-5
  let raw=sToInterval(s);
  // Étape 2 : multiplicateur score QCM
  let interval=raw*mult;
  // Étape 3 : coefficient dynamique (activé après 4 révisions)
  if(reviews>=4){
    if(grade===4)dynCoeff=Math.min(dynCoeff*1.02,1.1);
    else if(grade===3)dynCoeff=Math.min(dynCoeff*1.0055,1.1);
    else if(grade===2)dynCoeff=Math.max(dynCoeff*0.97,0.8);
    else dynCoeff=Math.max(dynCoeff*0.95,0.8);
    // Pénalité retard > 300% de l'intervalle prévu
    if(card.due&&grade!==1){
      const daysLate=Math.max(0,(Date.now()-new Date(card.due).getTime())/86400000);
      if(daysLate>3*raw)dynCoeff=Math.max(dynCoeff*0.98,0.8);
    }
  }
  interval=interval*dynCoeff;
  // Étape 4 : plafond
  interval=Math.min(interval,cap);
  // Étape 5 : plancher
  interval=Math.max(Math.round(interval),1);
  // Fuzzing ±5% si > 5 jours
  if(interval>5){
    const fuzz=Math.round(interval*0.05);
    interval+=Math.floor(Math.random()*(2*fuzz+1))-fuzz;
    interval=Math.max(interval,1);
  }
  const due=new Date();due.setDate(due.getDate()+interval);
  return {s,d,due:due.toISOString().slice(0,10),interval,reviews:reviews+1,dynCoeff,lastGrade:grade,lastReviewDate:today};
}

function startTimer(){
  timerStart=Date.now();
  timerInterval=setInterval(()=>{
    let s=Math.floor((Date.now()-timerStart)/1000);
    let m=Math.floor(s/60);s=s%60;
    document.getElementById('timerDisplay').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  },1000);
}
function stopTimer(){clearInterval(timerInterval);}

function shuffleArray(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function goHome(){
  stopTimer();
  // Archiver si session en cours non terminée mais avec réponses (sauf mode practice)
  if(!viewingArchive&&!practiceMode&&phase!=='home'&&phase!=='session-complete'){archiveCurrentSession();}
  viewingArchive=false;
  practiceMode=false;
  phase="home";currentItem=null;currentQ=0;
  sessionAnswers={};selected=[];
  render();
}

function practiceNext(){
  let q=currentItem._dueQ[currentQ];
  if(sessionAnswers[q.id])sessionAnswers[q.id].graded=true;
  currentQ++;selected=[];phase="quiz";
  render();
}

function startItem(id,mode){
  currentItem=ITEMS.find(i=>i.id===id);
  if(!currentItem)return;
  let st=loadState();
  currentItem.questions.forEach(q=>{q._shuffled=null;});
  // Filtrer selon le mode
  let qs;
  if(mode==='ancrages'){
    qs=currentItem.questions.filter(q=>{let c=getCard(st,q.id);return c.reviews>0&&isDue(c);});
    practiceMode=false;
  } else if(mode==='nouvelles'){
    qs=currentItem.questions.filter(q=>getCard(st,q.id).reviews===0);
    practiceMode=false;
  } else if(mode==='refaire'){
    qs=currentItem.questions.filter(q=>getCard(st,q.id).reviews>0);
    practiceMode=true;
  } else if(mode==='toutes'){
    qs=[...currentItem.questions];
    practiceMode=true;
  } else {
    qs=currentItem.questions.filter(q=>isDue(getCard(st,q.id)));
    practiceMode=false;
  }
  if(qs.length===0){alert('Aucune question disponible dans ce mode.');return;}
  // Ordre séquentiel pour les NOUVELLES cartes DP/KFP uniquement (reviews=0)
  let newDp=qs.filter(q=>q.isDp&&getCard(st,q.id).reviews===0).sort((a,b)=>a.id.localeCompare(b.id));
  let newKfp=qs.filter(q=>q.isKfp&&getCard(st,q.id).reviews===0).sort((a,b)=>a.id.localeCompare(b.id));
  let newIds=new Set([...newDp,...newKfp].map(q=>q.id));
  let others=qs.filter(q=>!newIds.has(q.id));
  currentItem._dueQ=[...newDp,...newKfp,...shuffleArray(others)];
  sessionAnswers={};
  currentQ=0;phase="quiz";selected=[];
  startTimer();
  render();
}

function jumpTo(i){
  // Verrouillage : carte DP/KFP NOUVELLE accessible seulement si la précédente DP/KFP de la série est répondue
  if(isCardLocked(i))return;
  // Sauvegarder l'état actuel avant de naviguer
  if(currentItem&&currentItem._dueQ[currentQ]){
    let qCur=currentItem._dueQ[currentQ];
    if(phase==='quiz'&&selected.length>0&&!sessionAnswers[qCur.id]){
      sessionAnswers[qCur.id]={selected:[...selected],isRevealed:false,graded:false};
    }
  }
  currentQ=i;
  let q=currentItem._dueQ[i];
  let saved=sessionAnswers[q.id];
  if(saved){
    selected=[...saved.selected];
    phase=saved.isRevealed?'revealed':'quiz';
  } else {
    selected=[];phase='quiz';
  }
  render();
}

function isCardLocked(i){
  let q=currentItem._dueQ[i];
  if(!q||(!q.isDp&&!q.isKfp))return false;
  let st=loadState();
  if(getCard(st,q.id).reviews>0)return false; // Révision = accès libre
  // Chercher la DP/KFP NOUVELLE précédente dans la même série
  for(let j=i-1;j>=0;j--){
    let prev=currentItem._dueQ[j];
    if((prev.isDp&&q.isDp)||(prev.isKfp&&q.isKfp)){
      if(getCard(st,prev.id).reviews===0){
        let prevAns=sessionAnswers[prev.id];
        return !prevAns||!prevAns.isRevealed;
      }
      return false;
    }
  }
  return false;
}

function renderQuiz(){
  if(!currentItem||currentQ>=currentItem._dueQ.length){phase="session-complete";render();return;}
  let q=currentItem._dueQ[currentQ];
  let st=loadState();
  let notes=loadNotes();

  // Shuffle avec réétiquetage A→E à l'affichage (stocké par carte pour la durée de la session)
  if(!q._shuffled){
    let shuffled=shuffleArray(q.choices);
    const LABELS=['A','B','C','D','E','F','G','H','I','J','K','L'];
    q._shuffled=shuffled.map((c,i)=>({...c,displayId:LABELS[i]}));
  }
  let choices=q._shuffled;

  // Restaurer l'état depuis sessionAnswers si la carte a déjà été touchée
  let saved=sessionAnswers[q.id];
  let displaySelected,isRevealed;
  if(saved){
    displaySelected=saved.selected;
    isRevealed=saved.isRevealed;
    if(phase==='quiz'&&isRevealed){phase='revealed';}
  } else {
    displaySelected=selected;
    isRevealed=phase==='revealed';
  }

  let html=`<div class="qi-banner">${q.id}</div>`;
  // Vignette persistante pour DP et KFP
  if(q.vignette){
    let isKfp=q.isKfp||false;
    let boxCls=isKfp?'kfp-vignette-box':'dp-vignette-box';
    let badgeCls=isKfp?'kfp-badge':'dp-badge';
    let badgeTxt=isKfp?'KFP — Vignette clinique':'Dossier Progressif — Vignette';
    html+=`<div class="${boxCls}"><div class="${badgeCls}">${badgeTxt}</div><div class="dp-vignette-text">${q.vignette}</div></div>`;
  }
  html+=`<div class="question-card">`;
  let typeLabel=q.type==='QCU'?'Question à choix unique':q.type==='KFP'||q.choices.length>5?'Question à nombre de réponses précisé XL':'Question à choix multiple';
  html+=`<div class="question-type">Question ${currentQ+1} - ${typeLabel} ${choices.length} propositions de réponse</div>`;
  if(q.type==='QCU'){html+=`<div class="question-meta">une seule réponse attendue</div>`;}
  else{html+=`<div class="question-meta">une ou plusieurs réponses exactes</div>`;}
  html+=`<div class="question-stem">${q.stem}</div>`;
  html+=`<div class="propositions">`;

  choices.forEach(c=>{
    let isSelected=displaySelected.includes(c.id);
    let cls='prop-block';
    if(isRevealed){
      let isCorrect=q.correct.includes(c.id);
      if(isCorrect&&isSelected)cls+=' correct-yes';
      else if(isCorrect&&!isSelected)cls+=' missed';
      else if(!isCorrect&&isSelected)cls+=' correct-no';
    } else if(isSelected){
      cls+=' selected';
    }
    let disabled=isRevealed?'disabled':'';
    let checked=isSelected?'checked':'';
    html+=`<div class="${cls}" ${isRevealed?'':`onclick="toggleChoice('${c.id}')"`}>`;
    html+=`<div class="prop-header"><input type="checkbox" ${checked} ${disabled} tabindex="-1"> Proposition ${c.displayId}</div>`;
    html+=`<div class="prop-body">${c.text}</div>`;
    if(isRevealed&&q.explanations[c.id]){
      let exp=q.explanations[c.id];
      let vClass=exp.v?'true':'false';
      let originalLabel=c.displayId!==c.id?` <span style="color:#888;font-weight:normal;font-size:12px;">(= Proposition ${c.id} d'origine)</span>`:'';
      html+=`<div class="correction-text"><span class="verdict ${vClass}">Proposition ${c.displayId}${originalLabel} — ${exp.v?'VRAI':'FAUX'}.</span> ${exp.t.replace(/^(VRAI|FAUX)\.\s*/,'')}</div>`;
    }
    html+=`</div>`;
  });
  html+=`</div>`;

  if(!isRevealed){
    html+=`<button class="btn-validate" onclick="validateAnswer()" ${displaySelected.length===0?'disabled':''}>Valider la réponse</button>`;
  } else {
    let scoreType=getScoreType(displaySelected,q.correct);
    let scoreText=scoreType==='perfect'?'Tout bon !':scoreType==='partial'?'Partiellement correct':'Incorrect';
    let scoreColor=scoreType==='perfect'?'#2ecc71':scoreType==='partial'?'#f39c12':'#e74c3c';
    let nGood=displaySelected.filter(s=>q.correct.includes(s)).length;
    html+=`<div class="score-display"><div class="score-value" style="color:${scoreColor}">${nGood}/${q.correct.length}</div><div class="score-label">${scoreText}</div></div>`;
    // FSRS buttons - uniquement si pas encore gradée dans cette session ET pas en mode entraînement
    if(practiceMode){
      html+=`<div style="margin-top:18px;text-align:center;"><button class="btn-validate" onclick="practiceNext()">Question suivante \u2192</button></div>`;
    } else if(!saved||!saved.graded){
      let buttons=getButtonConfig(scoreType);
      let card=getCard(st,q.id);
      html+=`<div class="fsrs-buttons">`;
      buttons.forEach(b=>{
        let preview=computeNextInterval({...card},b.grade,b.mult,b.cap);
        let ivl=preview.interval;
        let ivlText=ivl===1?'1 jour':ivl<30?ivl+' jours':ivl<365?Math.round(ivl/30)+' mois':Math.round(ivl/365)+' an(s)';
        html+=`<button class="fsrs-btn ${b.cls}" onclick="gradeCard('${q.id}',${b.grade},${b.mult},${b.cap})">${b.label}<span class="fsrs-interval">${ivlText}</span></button>`;
      });
      html+=`</div>`;
    } else {
      html+=`<div class="graded-status">✓ Question gradée — Navigation libre via la sidebar</div>`;
    }
    // Notes — bouton style EDN sobre
    let noteKey=q.id;
    let existingNote=notes[noteKey]||'';
    let noteIcon=`<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>`;
    html+=`<button class="note-toggle" onclick="document.getElementById('noteEditor').classList.toggle('open')">${noteIcon}${existingNote?"Modifier l'annotation":'Annoter'}</button>`;
    html+=`<div class="note-editor ${existingNote?'open':''}" id="noteEditor">`;
    html+=`<textarea id="noteText" placeholder="Annotation personnelle...">${existingNote}</textarea>`;
    html+=`<div class="note-actions"><button class="btn-validate" style="padding:8px 20px;font-size:13px;" onclick="saveNote('${noteKey}')">Enregistrer</button></div>`;
    html+=`</div>`;
    if(existingNote){
      html+=`<div class="note-saved">${existingNote}</div>`;
    }
  }

  html+=`</div>`;
  document.getElementById('contentArea').innerHTML=html;
  renderSidebar();
}

function toggleChoice(id){
  let q=currentItem._dueQ[currentQ];
  if(q.type==='QCU'){selected=[id];}
  else{
    let idx=selected.indexOf(id);
    if(idx>=0)selected.splice(idx,1);else selected.push(id);
  }
  // Sauvegarder dans sessionAnswers
  sessionAnswers[q.id]={selected:[...selected],isRevealed:false,graded:false};
  render();
}

function validateAnswer(){
  let q=currentItem._dueQ[currentQ];
  sessionAnswers[q.id]={selected:[...selected],isRevealed:true,graded:false};
  phase='revealed';
  render();
}

function gradeCard(qid,grade,mult,cap){
  let st=loadState();
  let card=getCard(st,qid);
  let result=computeNextInterval(card,grade,mult,cap);
  st[qid]={s:result.s,d:result.d,due:result.due,reviews:result.reviews,dynCoeff:result.dynCoeff,lastGrade:result.lastGrade,lastReviewDate:result.lastReviewDate};
  saveState(st);
  // Marquer comme gradée dans sessionAnswers
  if(sessionAnswers[qid])sessionAnswers[qid].graded=true;
  // Avancer
  currentQ++;selected=[];phase="quiz";
  render();
}

function saveNote(key){
  let notes=loadNotes();
  let text=document.getElementById('noteText').value.trim();
  if(text)notes[key]=text;else delete notes[key];
  saveNotes(notes);
  render();
}

// ================================================================
// FIN DE SESSION + MODE REVOIR LA SESSION
// ================================================================
function renderSessionComplete(){
  stopTimer();
  archiveCurrentSession(); // Sauvegarder dans l'historique
  let gradedCount=Object.values(sessionAnswers).filter(a=>a.graded).length;
  let totalQ=currentItem._dueQ.length;
  let totalScore=Object.entries(sessionAnswers).filter(([_,a])=>a.graded).reduce((sum,[qid,a])=>{
    let q=currentItem._dueQ.find(x=>x.id===qid);
    if(!q)return sum;
    let st=getScoreType(a.selected,q.correct);
    return sum+(st==='perfect'?1:st==='partial'?0.5:0);
  },0);
  let html=`<div class="done-screen">
    <h2>Session terminée</h2>
    <p>Vous avez gradé ${gradedCount}/${totalQ} questions dans cette session.</p>
    <p style="font-size:14px;color:#888;margin-top:8px;">Score : ${totalScore.toFixed(1)} / ${gradedCount} (${gradedCount>0?Math.round(totalScore/gradedCount*100):0}% de réussite)</p>
    <div class="session-actions">
      <button class="btn-home" onclick="startReview()">Revoir la session</button>
      <button class="btn-secondary" onclick="goHome()">Retour à l'accueil</button>
    </div>
  </div>`;
  document.getElementById('contentArea').innerHTML=html;
  document.getElementById('sidebarArea').innerHTML='';
  document.getElementById('progressPill').textContent=`Progression : 100%`;
}

function startReview(){
  phase="review";
  currentQ=0;
  render();
}

function renderReview(){
  // Trouver les cartes répondues seulement
  let answeredQs=currentItem._dueQ.filter(q=>sessionAnswers[q.id]&&sessionAnswers[q.id].isRevealed);
  if(answeredQs.length===0){
    let html=`<div class="done-screen"><h2>Aucune question à revoir</h2><button class="btn-home" onclick="goHome()">Retour à l'accueil</button></div>`;
    document.getElementById('contentArea').innerHTML=html;
    document.getElementById('sidebarArea').innerHTML='';
    return;
  }
  if(currentQ>=answeredQs.length){
    let html=`<div class="done-screen"><h2>Fin de la révision</h2><p>Toutes les questions de la session ont été parcourues.</p><button class="btn-home" onclick="goHome()">Retour à l'accueil</button></div>`;
    document.getElementById('contentArea').innerHTML=html;
    document.getElementById('sidebarArea').innerHTML='';
    return;
  }
  let q=answeredQs[currentQ];
  let saved=sessionAnswers[q.id];
  let choices=q._shuffled||q.choices;
  let displaySelected=saved.selected;

  let html=`<div class="qi-banner">${q.id} — Révision (${currentQ+1}/${answeredQs.length})</div>`;
  if(q.vignette){
    let isKfp=q.isKfp||false;
    let boxCls=isKfp?'kfp-vignette-box':'dp-vignette-box';
    let badgeCls=isKfp?'kfp-badge':'dp-badge';
    let badgeTxt=isKfp?'KFP — Vignette clinique':'Dossier Progressif — Vignette';
    html+=`<div class="${boxCls}"><div class="${badgeCls}">${badgeTxt}</div><div class="dp-vignette-text">${q.vignette}</div></div>`;
  }
  html+=`<div class="question-card">`;
  let typeLabel=q.type==='QCU'?'Question à choix unique':q.type==='KFP'||q.choices.length>5?'Question à nombre de réponses précisé XL':'Question à choix multiple';
  html+=`<div class="question-type">Question ${currentQ+1} - ${typeLabel}</div>`;
  html+=`<div class="question-stem">${q.stem}</div>`;
  html+=`<div class="propositions">`;
  choices.forEach(c=>{
    let isSelected=displaySelected.includes(c.id);
    let isCorrect=q.correct.includes(c.id);
    let cls='prop-block';
    if(isCorrect&&isSelected)cls+=' correct-yes';
    else if(isCorrect&&!isSelected)cls+=' missed';
    else if(!isCorrect&&isSelected)cls+=' correct-no';
    html+=`<div class="${cls}">`;
    html+=`<div class="prop-header"><input type="checkbox" ${isSelected?'checked':''} disabled tabindex="-1"> Proposition ${c.displayId||c.id}</div>`;
    html+=`<div class="prop-body">${c.text}</div>`;
    if(q.explanations[c.id]){
      let exp=q.explanations[c.id];
      let vClass=exp.v?'true':'false';
      let originalLabel=c.displayId&&c.displayId!==c.id?` <span style="color:#888;font-weight:normal;font-size:12px;">(= Proposition ${c.id} d'origine)</span>`:'';
      html+=`<div class="correction-text"><span class="verdict ${vClass}">Proposition ${c.displayId||c.id}${originalLabel} — ${exp.v?'VRAI':'FAUX'}.</span> ${exp.t.replace(/^(VRAI|FAUX)\.\s*/,'')}</div>`;
    }
    html+=`</div>`;
  });
  html+=`</div>`;
  html+=`<div class="review-nav">`;
  html+=`<button class="btn-secondary" onclick="reviewPrev()" ${currentQ===0?'disabled':''}>← Précédent</button>`;
  html+=`<button class="btn-home" onclick="reviewNext()">${currentQ===answeredQs.length-1?'Terminer la révision':'Suivant →'}</button>`;
  html+=`</div></div>`;
  document.getElementById('contentArea').innerHTML=html;
  document.getElementById('sidebarArea').innerHTML='';
}

function reviewPrev(){if(currentQ>0){currentQ--;render();}}
function reviewNext(){currentQ++;render();}

function renderDone(){
  stopTimer();
  let html=`<div class="done-screen"><h2>Session terminée</h2><p>Vous avez révisé toutes les questions dues pour cet item.</p><button class="btn-home" onclick="goHome()">Retour à l'accueil</button></div>`;
  document.getElementById('contentArea').innerHTML=html;
  document.getElementById('sidebarArea').innerHTML='';
}

function exportProgression(){
  let data={
    fsrs:JSON.parse(localStorage.getItem(LS_KEY)||'{}'),
    notes:JSON.parse(localStorage.getItem(NOTES_KEY)||'{}'),
    history:JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'),
    exported:new Date().toISOString()
  };
  let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='edn_anki_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importProgression(event){
  let file=event.target.files[0];
  if(!file)return;
  let reader=new FileReader();
  reader.onload=function(e){
    try{
      let data=JSON.parse(e.target.result);
      if(!data.fsrs&&!data.notes&&!data.history){alert('Fichier invalide.');return;}
      if(!confirm('Importer cette progression ? Cela écrasera vos données actuelles.'))return;
      if(data.fsrs)localStorage.setItem(LS_KEY,JSON.stringify(data.fsrs));
      if(data.notes)localStorage.setItem(NOTES_KEY,JSON.stringify(data.notes));
      if(data.history)localStorage.setItem(HISTORY_KEY,JSON.stringify(data.history));
      alert('Progression importée avec succès.');
      render();
    }catch(err){alert('Erreur de lecture du fichier.');}
  };
  reader.readAsText(file);
  event.target.value='';
}

function goHistory(){phase="history-list";render();}
function goResetMenu(){phase="reset-menu";render();}

function renderHistoryList(){
  let h=loadHistory();
  let html='<div style="max-width:700px;margin:20px auto;padding:0 16px;"><h2 style="font-size:22px;color:#1b2a4a;margin-bottom:20px;font-weight:700;">Historique des sessions</h2>';
  if(h.length===0){
    html+='<p style="text-align:center;color:#888;padding:40px;background:#fff;border-radius:8px;">Aucune session archivée pour le moment.</p>';
  } else {
    html+='<div class="history-grid">';
    for(let i=h.length-1;i>=0;i--){
      let s=h[i];
      let d=new Date(s.timestamp);
      let dateStr=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      let scoreRate=s.stats.answered>0?Math.round(s.stats.perfect/s.stats.answered*100):0;
      html+=`<div class="history-card"><div class="history-meta"><div class="history-date">${dateStr}</div><div class="history-item-label">${s.itemLabel} — ${s.itemTitle}</div></div><div class="history-stats"><span class="history-score">${s.stats.perfect}/${s.stats.answered}</span><span class="history-rate">${scoreRate}%</span></div><div class="history-actions"><button class="btn-history-view" onclick="viewArchivedSession(${i})">Revoir</button><button class="btn-history-del" onclick="if(confirm('Supprimer cette session ?'))deleteArchive(${i})">×</button></div></div>`;
    }
    html+='</div>';
  }
  html+='<div style="text-align:center;margin-top:32px;"><button class="btn-home" onclick="goHome()">← Retour à l’accueil</button></div></div>';
  document.getElementById('contentArea').innerHTML=html;
  document.getElementById('sidebarArea').innerHTML='';
}

function renderResetMenu(){
  let st=loadState();
  let html='<div style="max-width:700px;margin:20px auto;padding:0 16px;"><h2 style="font-size:22px;color:#1b2a4a;margin-bottom:8px;font-weight:700;">Gérer la progression</h2><p style="color:#666;font-size:13px;margin-bottom:20px;">Réinitialiser la progression d’un item supprime ses scores FSRS et son historique. Action irréversible.</p>';
  html+='<div class="history-grid">';
  ITEMS.forEach(item=>{
    let count=0;
    item.questions.forEach(q=>{if(st[q.id]&&st[q.id].reviews>0)count++;});
    html+=`<div class="history-card"><div class="history-meta"><div class="history-item-label">${item.label} — ${item.title}</div><div class="history-date">${count} question${count>1?'s':''} avec progression</div></div><div class="history-actions"><button class="btn-history-del" style="width:auto;padding:7px 14px;font-size:12px;" onclick="resetItem('${item.id}')">Réinitialiser</button></div></div>`;
  });
  html+='</div>';
  html+='<div style="text-align:center;margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"><button class="btn-reset" onclick="resetAll()">Tout réinitialiser</button><button class="btn-home" onclick="goHome()">← Retour à l’accueil</button></div></div>';
  document.getElementById('contentArea').innerHTML=html;
  document.getElementById('sidebarArea').innerHTML='';
}

function resetItem(itemId){
  let item=ITEMS.find(i=>i.id===itemId);
  if(!item)return;
  if(!confirm("Réinitialiser toute la progression de "+item.label+" ?"))return;
  if(!confirm("Êtes-vous sûr ? Cette action est irréversible."))return;
  let st=loadState();
  item.questions.forEach(q=>delete st[q.id]);
  saveState(st);
  let h=loadHistory().filter(s=>s.itemId!==itemId);
  saveHistory(h);
  render();
}

function resetAll(){
  if(!confirm("Réinitialiser TOUTE la progression de tous les items ?"))return;
  if(!confirm("Êtes-vous sûr ? Toutes vos sessions, notes et scores seront effacés."))return;
  localStorage.removeItem(LS_KEY);
  localStorage.removeItem(NOTES_KEY);
  localStorage.removeItem(HISTORY_KEY);
  render();
}

function render(){
  if(phase==="home")renderHome();
  else if(phase==="quiz"||phase==="revealed")renderQuiz();
  else if(phase==="item-menu")renderItemMenu();
  else if(phase==="session-complete")renderSessionComplete();
  else if(phase==="review")renderReview();
  else if(phase==="history-list")renderHistoryList();
  else if(phase==="reset-menu")renderResetMenu();
  else if(phase==="done")renderDone();
}
render();
</script>
