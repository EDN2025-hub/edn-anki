        explanations:{A:{v:false,t:"FAUX. Neisseria meningitidis est statistiquement le germe le plus fréquent chez le sujet jeune (adolescent, jeune adulte) en collectivité, avec un début hyperaigu sur quelques heures et un syndrome septicémique franc fréquemment accompagné de purpura. Ce patient de 66 ans, immunodéprimé sous méthotrexate, avec une évolution sur 4 jours et une atteinte du tronc cérébral (diplopie par paralysie du VI, dysphagie par atteinte des paires bulbaires) n'a aucun de ces traits. Le purpura est absent. Contre-exemple : si la vignette avait décrit un étudiant de 19 ans avec fièvre brutale en quelques heures, raideur de nuque et purpura pétéchial extensif, le méningocoque aurait été le premier diagnostic et la ceftriaxone IM aurait été administrée sur place avant tout autre geste."},B:{v:false,t:"FAUX. Streptococcus pneumoniae est le premier germe de méningite bactérienne communautaire de l'adulte tous âges confondus, mais son tableau clinique est différent : début brutal en quelques heures, syndrome méningé franc, fièvre élevée, signes de localisation neurologique fréquents (déficit moteur, paralysie de paires crâniennes par engainement) et complications neurologiques précoces. Le pneumocoque ne donne pas de tableau de rhombencéphalite spécifique avec atteinte isolée du tronc cérébral. Le terrain immunodéprimé peut favoriser un pneumocoque, mais l'évolution progressive sur 4 jours est atypique. Contre-exemple : si le patient avait été splénectomisé avec un début brutal et des signes de localisation hémisphériques, le pneumocoque aurait dominé le diagnostic différentiel."},C:{v:true,t:"VRAI. Listeria monocytogenes est le diagnostic à évoquer en priorité absolue ici. Trois éléments concordent et imposent ce diagnostic : 1) Le terrain — âge supérieur à 50 ans ET immunodépression cellulaire iatrogène par méthotrexate (anti-folate qui altère l'immunité lymphocytaire T, indispensable à la défense contre Listeria intracellulaire) ; 2) L'évolution progressive sur 4 jours, caractéristique de Listeria (par opposition au début brutal du méningocoque ou du pneumocoque) ; 3) L'atteinte du tronc cérébral — rhombencéphalite avec paralysie du VI (diplopie horizontale), atteinte des paires bulbaires IX-X (dysphagie aux liquides) et ataxie cérébelleuse — qui est la signature topographique de Listeria. Cette bactérie a un tropisme préférentiel pour le tronc cérébral via une dissémination axonale rétrograde. Contre-exemple : si l'âge avait été 25 ans sans immunodépression, Listeria aurait été extrêmement improbable malgré le tableau de rhombencéphalite — on aurait alors évoqué une encéphalite virale (HSV, VZV) ou une tuberculose neuroméningée."},D:{v:false,t:"FAUX. Haemophilus influenzae type b touche essentiellement les nourrissons non vaccinés (pic 6-18 mois). Chez l'adulte, sa survenue est rare et associée à des facteurs de risque spécifiques : asplénie, déficit en immunoglobulines, brèche ostéoméningée post-traumatique, otite chronique. Le tableau clinique ressemble plus au pneumocoque qu'à la Listeria, sans tropisme particulier pour le tronc cérébral. Contre-exemple : si le patient avait eu un antécédent de splénectomie ou un déficit en IgG documenté avec un début aigu et un syndrome méningé classique, Haemophilus aurait pu être évoqué — mais jamais en première intention devant un tableau de rhombencéphalite chez un immunodéprimé sous MTX."},E:{v:false,t:"FAUX. L'encéphalite herpétique due à HSV1 atteint préférentiellement les régions temporales internes, le système limbique et le cortex insulaire — pas le tronc cérébral. Le tableau clinique associe troubles du comportement, hallucinations olfactives ou gustatives, troubles mnésiques, crises temporales et confusion. Aucun de ces éléments n'est présent ici. De plus, l'évolution sur 4 jours est plutôt rapide pour HSV (souvent 5-10 jours avant le diagnostic) et le LCS HSV est typiquement clair, lymphocytaire, normoglycorrachique — alors que l'aspect du LCS attendu ici sera plutôt panaché ou puriforme. Contre-exemple : si le tableau avait été dominé par des troubles du comportement, hallucinations olfactives et crises temporales avec confusion, l'aciclovir IV aurait été débuté immédiatement avant même l'IRM, sans attendre."}}
      },
      {
        id:"151-dp02",type:"QCU",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.",
        stem:"Concernant la réalisation de la ponction lombaire chez ce patient, quelle proposition est correcte ?",
        choices:[{id:"A",text:"La PL peut être réalisée immédiatement car le Glasgow est supérieur à 12"},{id:"B",text:"La PL est définitivement contre-indiquée en raison des signes de souffrance du tronc cérébral"},{id:"C",text:"Le scanner cérébral doit précéder la PL, mais l'antibiothérapie doit être débutée immédiatement sans attendre aucun résultat"},{id:"D",text:"Il faut attendre les résultats du scanner cérébral avant de débuter tout traitement antibiotique"},{id:"E",text:"La PL est contre-indiquée en raison du traitement par méthotrexate"}],
        correct:["C"],
        explanations:{A:{v:false,t:"FAUX. Le score de Glasgow supérieur à 12 (ici 13) n'est qu'un des nombreux critères neurologiques pour évaluer la faisabilité de la PL. Les CI neurologiques à la PL d'emblée incluent également : tout signe de focalisation neurologique, toute suspicion de processus expansif intracrânien, et — surtout dans ce contexte — la présence de signes de souffrance du tronc cérébral (diplopie par paralysie d'une paire crânienne, dysphagie, instabilité ataxique). Ce patient présente une diplopie binoculaire (VI), une dysphagie aux liquides (IX-X) et une ataxie — autant de signes témoignant d'une atteinte du tronc cérébral qui rend la PL immédiate dangereuse par risque d'engagement. Contre-exemple : si le patient avait eu un Glasgow à 13 sans aucun signe de focalisation ni d'atteinte des paires crâniennes (simple confusion fébrile), la PL aurait pu être réalisée d'emblée après simples hémocultures."},B:{v:false,t:"FAUX. La contre-indication n'est pas définitive — elle est temporaire et levée dès que les signes neurologiques de souffrance du tronc cérébral sont évalués par imagerie. Le scanner cérébral en urgence permet d'éliminer un processus expansif (abcès, empyème, hydrocéphalie obstructive). Si le scanner est rassurant, la PL est réalisée immédiatement après. La pire erreur serait de renoncer définitivement au diagnostic microbiologique alors qu'il est indispensable pour adapter l'antibiothérapie (Listeria sensible à amoxicilline mais résistante aux C3G). Contre-exemple : si le scanner avait montré un volumineux abcès cérébral avec effet de masse et hydrocéphalie, la PL serait restée contre-indiquée durablement et le diagnostic se ferait par hémocultures et ponction de l'abcès."},C:{v:true,t:"VRAI. C'est l'algorithme exact recommandé devant une suspicion de méningite bactérienne avec CI neurologique à la PL. Séquence stricte en 4 temps simultanés : 1) Hémocultures (2 paires) immédiates avant antibiothérapie pour ne pas négativer les cultures ; 2) Dexaméthasone IV — indiquée systématiquement en cas de CI à la PL d'emblée car on présume une méningite bactérienne avec LCS trouble ; 3) Antibiothérapie probabiliste immédiate adaptée au terrain (C3G + amoxicilline + gentamicine ici, du fait du contexte Listeria suspectée) ; 4) Scanner cérébral en urgence pour évaluer la faisabilité ultérieure de la PL. Le principe fondamental est qu'aucun examen ne doit retarder l'antibiothérapie : chaque heure perdue augmente la mortalité de plusieurs pourcents et le risque de séquelles neurologiques. Contre-exemple : si le patient n'avait eu aucune CI neurologique (Glasgow 15, pas de focalisation), la séquence aurait été inversée — PL d'abord puis antibiothérapie immédiatement après, l'antibiothérapie n'étant retardée que de 15-20 minutes."},D:{v:false,t:"FAUX. Attendre les résultats du scanner avant de débuter l'antibiothérapie constitue une faute thérapeutique majeure dans la méningite bactérienne. Le délai d'obtention d'un scanner peut atteindre 30 à 60 minutes selon les centres, et chaque heure de retard d'antibiothérapie augmente la mortalité de l'ordre de 10-15% dans la méningite à pneumocoque, et plus encore dans la méningite à Listeria du sujet âgé immunodéprimé. La règle est sans équivoque : antibiothérapie après hémocultures, indépendamment et sans attendre tout autre examen. Contre-exemple : si la question portait sur le moment de réalisation de la PL après scanner normal, alors oui, attendre les résultats du scanner serait correct — mais pour la PL, pas pour l'antibiothérapie."},E:{v:false,t:"FAUX. Le méthotrexate ne contre-indique pas la PL. Les contre-indications à la PL sont : instabilité hémodynamique, troubles de l'hémostase (anticoagulant à dose efficace, plaquettes < 50 G/L, trouble de la coagulation clinique), infection au site de ponction, et CI neurologiques (signes de focalisation, Glasgow < 12, signes de souffrance du tronc cérébral, suspicion d'engagement). Le MTX, même à dose immunosuppressive, n'altère pas l'hémostase de façon cliniquement significative et n'a aucun rapport avec les CI à la PL. Contre-exemple : si le patient avait reçu du rivaroxaban à dose curative en plus du MTX, alors oui la PL aurait été CI — mais c'est l'anticoagulant qui contre-indique, pas le MTX."}}
      },
      {
        id:"151-dp03",type:"QRM",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.\n\nLe scanner cérébral est normal. La ponction lombaire est immédiatement réalisée : aspect trouble, leucocytes 340/mm³ (65% polynucléaires, 35% lymphocytes), protéinorachie 2,1 g/L, glycorachie 1,6 mmol/L pour une glycémie simultanée à 7,2 mmol/L. Examen direct : bacille à Gram positif.",
        stem:"Quelles sont les 3 molécules de votre traitement initial ? (trois réponses attendues)",
        choices:[{id:"A",text:"Amoxicilline IV à forte dose"},{id:"B",text:"Gentamicine IV"},{id:"C",text:"Dexaméthasone IV"},{id:"D",text:"Ceftriaxone IV à forte dose"},{id:"E",text:"Vancomycine IV"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. L'amoxicilline IV à forte dose (200 mg/kg/j en perfusion continue ou en 4 à 6 administrations) est le traitement de référence de la listériose neuroméningée. Mécanisme : Listeria monocytogenes est une bactérie intracellulaire facultative, et l'amoxicilline pénètre dans les macrophages où elle persiste. Aucune céphalosporine (y compris les C3G de dernière génération) n'a d'activité clinique sur Listeria — résistance naturelle par défaut d'affinité de PLP3. La présence du bacille à Gram positif à l'examen direct, sur ce terrain typique, confirme le diagnostic et impose l'amoxicilline. Durée recommandée : 21 jours minimum. Contre-exemple : si l'examen direct avait montré des cocci à Gram positif (pneumocoque probable), l'amoxicilline aurait été tout aussi indiquée mais sans gentamicine et sans dexaméthasone immédiate (la dexaméthasone serait indiquée mais avec d'autres considérations)."},B:{v:true,t:"VRAI. La gentamicine IV (3-5 mg/kg/j) est associée à l'amoxicilline pour son effet synergique bactéricide sur Listeria. Mécanisme : la gentamicine seule n'a pas d'efficacité clinique sur Listeria (résistance bactériostatique) mais en association avec l'amoxicilline, elle permet un effet bactéricide rapide et améliore le pronostic. Cette synergie est démontrée in vitro et confirmée par les recommandations pour les méningites à Listeria, les endocardites à Listeria et la listériose néonatale. La durée d'association est limitée aux 7 à 14 premiers jours pour réduire la néphrotoxicité et l'ototoxicité. Contre-exemple : si le germe avait été un entérocoque ou un streptocoque résistant aux pénicillines, la gentamicine en synergie aurait été également indiquée — c'est le mécanisme classique de la synergie bêta-lactamine + aminoside sur les Gram positifs avec PLP altérées."},C:{v:true,t:"VRAI. La dexaméthasone IV (10 mg toutes les 6 heures pendant 4 jours) est indiquée car deux critères sont remplis : examen direct positif (bacille Gram+) ET LCS trouble (340 éléments/mm³, hyperprotéinorachie, hypoglycorrachie). Mécanisme : la dexaméthasone réduit la réaction inflammatoire méningée intense provoquée par la lyse bactérienne sous antibiothérapie, qui aggrave l'œdème cérébral, augmente la pression intracrânienne et favorise les séquelles neurologiques (surdité de perception notamment). L'administration doit être faite avant ou simultanément à la première dose d'antibiotique. La discussion concernant l'efficacité de la dexaméthasone spécifiquement sur Listeria reste ouverte (efficacité prouvée surtout pour pneumocoque), mais en pratique elle est instaurée devant tout LCS trouble. Contre-exemple : si le LCS avait été clair avec lymphocytose et normoglycorrachie (méningite virale probable), la dexaméthasone aurait été contre-indiquée."},D:{v:false,t:"FAUX. La ceftriaxone (ou toute autre C3G) n'a pas d'activité clinique sur Listeria monocytogenes — résistance naturelle. Conserver une C3G dans le traitement documenté d'une méningite à Listeria constitue un sur-traitement inutile, expose aux effets indésirables (cholestase pour la ceftriaxone, troubles digestifs) et favorise la sélection de bactéries résistantes (notamment entérobactéries productrices de bêta-lactamases à spectre élargi). Une fois le diagnostic Listeria confirmé par le direct, la C3G est arrêtée. Contre-exemple : si l'examen direct avait été négatif (germe non identifié) en attente des cultures sur ce terrain immunodéprimé > 50 ans, la triple association C3G + amoxicilline + gentamicine aurait été poursuivie en probabiliste — la C3G aurait alors été légitime."},E:{v:false,t:"FAUX. La vancomycine n'a pas d'indication dans la méningite à Listeria. Mécanisme : Listeria est sensible à la vancomycine in vitro, mais cette dernière a une mauvaise diffusion méningée et n'a jamais fait la preuve de son efficacité clinique sur Listeria. Aucune recommandation française ni internationale ne propose la vancomycine pour Listeria. Elle est indiquée dans la méningite bactérienne uniquement en cas de pneumocoque de haut niveau de résistance aux C3G (CMI ceftriaxone > 0.5 mg/L) en France, situation exceptionnelle. Contre-exemple : si l'examen direct avait montré des cocci à Gram positif chez un patient de retour des États-Unis (où le pneumocoque de haut niveau de résistance est plus fréquent), la vancomycine aurait été ajoutée temporairement en attendant l'antibiogramme."}}
      },
      {
        id:"151-dp04",type:"QRM",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.\n\nLe scanner cérébral est normal. La ponction lombaire est immédiatement réalisée : aspect trouble, leucocytes 340/mm³ (65% polynucléaires, 35% lymphocytes), protéinorachie 2,1 g/L, glycorachie 1,6 mmol/L pour une glycémie simultanée à 7,2 mmol/L. Examen direct : bacille à Gram positif.\n\nÀ J2, les cultures du LCS confirment Listeria monocytogenes, sensible à l'amoxicilline. Votre traitement antibiotique est adapté en conséquence.",
        stem:"Parmi les éléments suivants, lesquels constituent des facteurs favorisants de méningite à Listeria chez ce patient ?",
        choices:[{id:"A",text:"Le traitement par méthotrexate"},{id:"B",text:"L'âge de 66 ans"},{id:"C",text:"La polyarthrite rhumatoïde en elle-même, indépendamment du traitement"},{id:"D",text:"Le sexe masculin"},{id:"E",text:"Une hypertension artérielle traitée"}],
        correct:["A","B"],
        explanations:{A:{v:true,t:"VRAI. Le méthotrexate est un facteur favorisant majeur de listériose invasive. Mécanisme : le MTX est un antifolate qui inhibe la dihydrofolate réductase, bloquant la synthèse des purines et donc la prolifération cellulaire. Il altère préférentiellement l'immunité cellulaire T (lymphocytes T helper et cytotoxiques) et la fonction macrophagique — exactement les bras immunitaires nécessaires pour contrôler les bactéries intracellulaires comme Listeria monocytogenes. L'immunodépression cellulaire iatrogène (MTX, corticoïdes, anti-TNF, inhibiteurs de calcineurine) est la première cause de listériose chez l'adulte de moins de 65 ans en France. Contre-exemple : si le patient avait été sous un anti-TNF (étanercept, infliximab) sans MTX, le risque de listériose aurait été comparable — c'est l'immunodépression cellulaire le mécanisme, peu importe la molécule responsable."},B:{v:true,t:"VRAI. L'âge supérieur à 50 ans est explicitement un facteur favorisant de listériose, indépendamment de toute immunodépression iatrogène. Mécanisme : avec l'âge, on observe une immunosénescence physiologique avec diminution de la fonction lymphocytaire T, baisse de l'efficacité de la présentation antigénique et altération de l'immunité innée. Le seuil de 50 ans est officiel dans les recommandations françaises et conditionne l'ajout systématique d'amoxicilline à la C3G dans l'antibiothérapie probabiliste de toute méningite bactérienne du sujet > 50 ans, même sans autre facteur de risque. Contre-exemple : si le patient avait eu 35 ans sans aucune immunodépression, l'antibiothérapie probabiliste devant un LCS trouble avec direct négatif aurait été simplement C3G + dexaméthasone, sans amoxicilline ni gentamicine."},C:{v:false,t:"FAUX. La polyarthrite rhumatoïde en elle-même, sans traitement immunosuppresseur, n'est pas listée comme facteur favorisant de listériose. Le risque est essentiellement lié au traitement (MTX, anti-TNF, anti-IL6, JAK inhibiteurs, corticoïdes au long cours) qui altère l'immunité cellulaire. La maladie auto-immune en soi entraîne plutôt un dérèglement immunitaire que vrai déficit. Cette nuance est testable : il faut distinguer la maladie inflammatoire et son traitement. Contre-exemple : si le patient avait été un cas exceptionnel de polyarthrite rhumatoïde non traitée (refus de traitement par exemple), seul l'âge > 50 ans serait resté facteur favorisant — pas la PR elle-même."},D:{v:false,t:"FAUX. Le sexe masculin n'est pas un facteur favorisant de listériose listé dans les recommandations. La répartition épidémiologique est proche du 1:1 hommes/femmes, à l'exception de la listériose maternofœtale qui par définition concerne les femmes enceintes (facteur favorisant majeur par immunodépression physiologique gestationnelle). En dehors de ce contexte obstétrical, le genre n'a pas d'impact sur le risque. Contre-exemple : si la patiente avait été une femme enceinte de 30 semaines, la grossesse aurait été le facteur favorisant principal et l'amoxicilline aurait été le traitement par excellence (sans gentamicine si possible pour limiter l'ototoxicité fœtale, ou très brève association)."},E:{v:false,t:"FAUX. L'hypertension artérielle traitée n'altère pas l'immunité antiinfectieuse et n'est pas un facteur favorisant de listériose. Les FDR officiels sont : âge > 50 ans, immunodépression iatrogène (corticoïdes, immunosuppresseurs, biothérapies), pathologies altérant l'immunité cellulaire (VIH avec CD4 bas, hémopathies lymphoïdes, transplantation), grossesse, éthylisme chronique, dénutrition sévère, diabète très déséquilibré. Contre-exemple : si le patient avait été en hémodialyse avec greffe rénale sous ciclosporine, c'est la combinaison transplantation + immunosuppresseur qui aurait été pertinente, pas l'HTA résiduelle."}}
      },
      {
        id:"151-dp05",type:"QCU",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.\n\nLe scanner cérébral est normal. La ponction lombaire est immédiatement réalisée : aspect trouble, leucocytes 340/mm³ (65% polynucléaires, 35% lymphocytes), protéinorachie 2,1 g/L, glycorachie 1,6 mmol/L pour une glycémie simultanée à 7,2 mmol/L. Examen direct : bacille à Gram positif.\n\nÀ J2, les cultures du LCS confirment Listeria monocytogenes, sensible à l'amoxicilline. Votre traitement antibiotique est adapté en conséquence.\n\nÀ J10, l'évolution est favorable : apyrexie depuis J5, régression franche de la raideur de nuque, amélioration de la diplopie. Le syndrome inflammatoire biologique est en cours de normalisation.",
        stem:"Quel examen est systématiquement indiqué avant la sortie d'hospitalisation dans le cadre de cette méningite bactérienne ?",
        choices:[{id:"A",text:"IRM cérébrale de contrôle"},{id:"B",text:"Audiométrie"},{id:"C",text:"Électroencéphalogramme"},{id:"D",text:"Fond d'œil"},{id:"E",text:"Électromyogramme"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. L'IRM cérébrale de contrôle n'est pas systématique avant la sortie d'une méningite bactérienne d'évolution favorable. Elle est indiquée en cas de complication suspectée cliniquement ou biologiquement : signes neurologiques persistants ou nouveaux (hydrocéphalie, abcès, empyème sous-dural, vascularite, thrombophlébite cérébrale), évolution clinique défavorable, fièvre persistante au-delà du 5e jour d'antibiothérapie adaptée. Sa réalisation systématique entraînerait des coûts et des examens inutiles chez des patients d'évolution favorable. Contre-exemple : si le patient avait présenté une fièvre persistante au-delà de J7 d'antibiothérapie, ou un signe neurologique nouveau (déficit moteur, troubles de conscience récidivants), l'IRM aurait été indiquée pour rechercher une complication."},B:{v:true,t:"VRAI. L'audiométrie est systématiquement réalisée avant la sortie d'hospitalisation après toute méningite bactérienne. Mécanisme : la surdité de perception est la complication séquellaire la plus fréquente, touchant 5 à 30% des patients selon le germe (jusqu'à 30% pour le pneumocoque, 5-10% pour le méningocoque, 10-20% pour Listeria). Elle est due à l'invasion bactérienne du labyrinthe par voie cochléaire (canal cochléaire-méningé) avec destruction des cellules ciliées de l'organe de Corti. Cette surdité peut être unilatérale ou bilatérale, partielle ou totale, parfois différée de plusieurs jours/semaines. Une détection précoce permet une réhabilitation rapide (prothèse auditive, implant cochléaire) — la fenêtre thérapeutique de l'implant cochléaire post-méningite se ferme rapidement du fait de l'ossification labyrinthique secondaire à l'inflammation. Contre-exemple : si la méningite avait été virale (méningite à entérovirus chez un adulte jeune), l'audiométrie systématique n'aurait pas été indiquée — les méningites virales ne donnent pas de surdité séquellaire."},C:{v:false,t:"FAUX. L'EEG n'est pas systématique avant la sortie. Il est indiqué en cas de crises convulsives persistantes après la phase aiguë, de suspicion d'état de mal infraclinique, ou d'évaluation d'une épilepsie séquellaire. Une méningite bactérienne d'évolution favorable sans crises convulsives ne justifie pas d'EEG systématique. Contre-exemple : si le patient avait présenté une crise convulsive tonico-clonique à J3 d'évolution avec confusion post-critique prolongée, un EEG serait indiqué pour rechercher un état de mal infraclinique persistant ou évaluer le risque d'épilepsie séquellaire."},D:{v:false,t:"FAUX. Le fond d'œil n'est pas un examen systématique de sortie de méningite bactérienne. Il peut être utile en aigu si suspicion d'hypertension intracrânienne ou contre-indication relative à la PL, ou en cas de symptômes visuels (baisse d'acuité, troubles oculomoteurs persistants). Mais avant une sortie d'évolution favorable, sans plainte visuelle, il n'apporte rien. Contre-exemple : si le patient avait présenté une baisse d'acuité visuelle persistante ou des céphalées d'allure HIC après antibiothérapie efficace, le FO et l'IRM auraient été indiqués pour rechercher une thrombose des sinus veineux cérébraux ou une névrite optique post-infectieuse."},E:{v:false,t:"FAUX. L'électromyogramme n'a aucune indication systématique dans le suivi d'une méningite bactérienne. Les méningites bactériennes ne causent pas de neuropathies périphériques de manière directe. Une atteinte radiculaire pourrait théoriquement compliquer une méningite tuberculeuse (radiculite spinale) ou une neuroborréliose (radiculonévrite de Bannwarth), mais pas une méningite bactérienne aiguë classique. Contre-exemple : si la méningite avait été une neuroborréliose de stade II avec radiculite, l'EMG aurait pu être utile pour quantifier l'atteinte radiculaire — mais le traitement (ceftriaxone IV 14-21 jours) et le pronostic auraient été distincts."}}
      },
      {
        id:"151-dp06",type:"QCU",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.\n\nLe scanner cérébral est normal. La ponction lombaire est immédiatement réalisée : aspect trouble, leucocytes 340/mm³ (65% polynucléaires, 35% lymphocytes), protéinorachie 2,1 g/L, glycorachie 1,6 mmol/L pour une glycémie simultanée à 7,2 mmol/L. Examen direct : bacille à Gram positif.\n\nÀ J2, les cultures du LCS confirment Listeria monocytogenes, sensible à l'amoxicilline. Votre traitement antibiotique est adapté en conséquence.\n\nÀ J10, l'évolution est favorable : apyrexie depuis J5, régression franche de la raideur de nuque, amélioration de la diplopie. Le syndrome inflammatoire biologique est en cours de normalisation.\n\nLe diagnostic de méningite à Listeria monocytogenes est définitivement confirmé. Vous souhaitez informer l'entourage du patient des mesures à prendre.",
        stem:"Concernant les mesures de santé publique vis-à-vis de l'entourage, quelle proposition est exacte ?",
        choices:[{id:"A",text:"Une déclaration obligatoire nominative à l'ARS est requise"},{id:"B",text:"Des précautions complémentaires type gouttelettes sont maintenues 24 heures après le début de l'ATB"},{id:"C",text:"Une antibioprophylaxie des contacts rapprochés est indiquée, identique à celle du méningocoque"},{id:"D",text:"Aucune mesure de prophylaxie des contacts ni déclaration obligatoire n'est requise pour Listeria"},{id:"E",text:"Une vaccination des contacts rapprochés contre Listeria est recommandée dans les 10 jours"}],
        correct:["D"],
        explanations:{A:{v:false,t:"FAUX. La listériose neuroméningée est effectivement une infection à déclaration obligatoire en France (toute listériose invasive doit être déclarée à Santé Publique France) — mais cette DO n'a pas pour but de mettre en place des mesures de prophylaxie auprès des contacts. Elle sert uniquement à la surveillance épidémiologique et à l'identification de potentielles épidémies alimentaires (cluster de cas) pour rechercher la source contaminante (charcuterie, fromages au lait cru, poisson fumé). Aucune mesure individuelle vis-à-vis des contacts n'en découle. Contre-exemple : si la méningite avait été à méningocoque, la DO aurait également été obligatoire, mais elle aurait déclenché en plus une enquête sanitaire avec antibioprophylaxie systématique des contacts rapprochés — différence fondamentale liée à la transmissibilité interhumaine du méningocoque, absente pour Listeria."},B:{v:false,t:"FAUX. Les précautions complémentaires de type gouttelettes sont réservées aux infections respiratoires transmissibles d'humain à humain par voie aérienne sur particules de plus de 5 μm — typiquement méningocoque, grippe, coqueluche, infections invasives à streptocoque A et streptocoque pneumoniae en formes pulmonaires. Listeria monocytogenes n'est pas transmissible d'homme à homme par voie aérienne ; sa transmission est exclusivement alimentaire (aliments contaminés crus ou peu cuits) et, secondairement, materno-fœtale. Aucune précaution complémentaire respiratoire n'est nécessaire. Contre-exemple : si le germe avait été Neisseria meningitidis, les précautions gouttelettes auraient été obligatoires à l'admission et levées seulement après 24 heures d'antibiothérapie efficace par C3G."},C:{v:false,t:"FAUX. C'est l'erreur classique que le jury teste systématiquement. L'antibioprophylaxie des contacts rapprochés (par rifampicine 600 mg x2/j pendant 2 jours chez l'adulte, ou ciprofloxacine monodose, ou ceftriaxone 250 mg IM en cas de grossesse) est strictement spécifique à la méningite à méningocoque. Listeria n'étant pas transmissible interhumaine, aucune antibioprophylaxie des contacts n'est indiquée. Étendre cette mesure à Listeria reviendrait à exposer des sujets sains aux effets indésirables des antibiotiques sans aucun bénéfice. Contre-exemple : si le germe avait été Neisseria meningitidis, l'antibioprophylaxie aurait été immédiate pour tous les contacts intimes des 10 jours précédents — colocataires, conjoints, partenaires sexuels, soignants exposés aux sécrétions oropharyngées sans masque."},D:{v:true,t:"VRAI. Pour Listeria monocytogenes, aucune mesure de prophylaxie n'est indiquée vis-à-vis des contacts intra-hospitaliers ou familiaux. Mécanisme : la transmission est strictement alimentaire (aliments à risque : charcuterie, fromages au lait cru à pâte molle, poissons fumés, certains pâtés végétaux, etc.). Il n'y a pas de transmission interhumaine documentée en dehors du contexte materno-fœtal in utero. En conséquence : pas d'antibioprophylaxie, pas de précautions complémentaires gouttelettes, pas de vaccination. La déclaration obligatoire reste due mais à visée épidémiologique uniquement. La prévention individuelle passe par les conseils alimentaires aux sujets à risque (femmes enceintes, immunodéprimés, sujets âgés). Contre-exemple : si la patiente avait été une femme enceinte avec listériose, les conseils auraient été élargis à toute la famille pour rechercher une source alimentaire commune et éviter une recontamination — mais sans antibioprophylaxie pour autant."},E:{v:false,t:"FAUX. Il n'existe aucun vaccin disponible contre Listeria monocytogenes en pratique courante. La prévention repose exclusivement sur des mesures hygiéno-diététiques individuelles pour les populations à risque (femmes enceintes, sujets > 65 ans, immunodéprimés) : éviter les fromages au lait cru à pâte molle, charcuterie crue, poissons fumés, graines germées crues, et bien cuire les viandes. La vaccination des contacts est une mesure efficace dans certaines méningites (méningocoque ACWY, Haemophilus, pneumocoque) mais pas pour Listeria. Contre-exemple : si la méningite avait été à méningocoque C, une vaccination méningococcique C conjuguée aurait été proposée aux contacts non immunisés en complément de l'antibioprophylaxie, dans une stratégie de couverture vaccinale individuelle et collective."}}
      },
      {
        id:"151-kfp01",type:"QCU",isKfp:true,
        vignette:"Un homme de 22 ans est amené par les pompiers en salle de déchocage. Son colocataire rapporte une fièvre brutale à 40°C et des céphalées intenses apparues 2 heures auparavant. À l'arrivée, vous constatez un purpura pétéchial initialement localisé aux membres inférieurs, désormais extensif avec 4 éléments nécrotiques de plus de 3 mm sur les membres et le tronc, apparus depuis le domicile. Pression artérielle : 78/44 mmHg. Fréquence cardiaque : 134/min. Température : 40,1°C. Saturation : 94% en air ambiant. Score de Glasgow : 13. Raideur de nuque. Vous reconnaissez immédiatement un purpura fulminans.",
        stem:"Vous reconnaissez immédiatement un purpura fulminans. Quelle est la première mesure thérapeutique à réaliser sur place ? (une seule réponse attendue)",
        choices:[{id:"A",text:"Poser une voie veineuse périphérique et prélever des hémocultures"},{id:"B",text:"Réaliser une ponction lombaire en urgence avant tout traitement"},{id:"C",text:"Injecter la ceftriaxone 1 g IV ou IM immédiatement, sur place"},{id:"D",text:"Appeler le réanimateur pour intubation orotrachéale"},{id:"E",text:"Administrer la dexaméthasone IV en priorité"},{id:"F",text:"Réaliser un scanner cérébral en urgence"},{id:"G",text:"Débuter un remplissage vasculaire avant tout antibiotique"},{id:"H",text:"Attendre les résultats des hémocultures avant toute ATB"},{id:"I",text:"Administrer de l'amoxicilline 3 g IV immédiatement"},{id:"J",text:"Effectuer un bilan de coagulation avant tout traitement"}],
        correct:["C"],
        explanations:{A:{v:false,t:"FAUX. Poser une voie veineuse et prélever des hémocultures sont des gestes nécessaires mais ils ne constituent pas la première mesure thérapeutique. Le piège classique : croire qu'il faut systématiquement obtenir les hémocultures avant l'antibiotique. Dans le purpura fulminans, c'est exactement l'inverse — l'antibiothérapie est administrée immédiatement, même si elle doit retarder ou compromettre les hémocultures. Mécanisme : chaque heure de retard d'antibiothérapie dans un purpura fulminans augmente la mortalité de 5 à 10%. La VVP et les hémocultures se font dans les 5 minutes qui suivent l'injection, pas avant. Contre-exemple : dans un sepsis sévère sans purpura ni méningite suspectée (par exemple sepsis urinaire à bacille Gram négatif), les hémocultures avant antibiotique sont effectivement la règle — leur délai d'obtention reste compatible avec l'urgence."},B:{v:false,t:"FAUX. La ponction lombaire est formellement contre-indiquée en urgence dans le purpura fulminans. Mécanisme : 1) Le patient est en état de choc septique (PA 78/44, FC 134) — l'instabilité hémodynamique est une CI absolue à la PL ; 2) Le purpura traduit une coagulation intravasculaire disséminée naissante avec consommation des facteurs de coagulation — risque hémorragique majeur ; 3) La PL retarderait l'antibiothérapie de 15-30 minutes, ce qui est interdit ; 4) La PL n'apporte aucune information utile à la décision thérapeutique — le diagnostic est clinique (purpura nécrotique fébrile = méningococcémie jusqu'à preuve du contraire). Contre-exemple : si le patient avait présenté un simple syndrome méningé fébrile sans purpura ni instabilité hémodynamique, la PL aurait été réalisée immédiatement après les hémocultures et avant l'antibiothérapie."},C:{v:true,t:"VRAI. L'injection IMMÉDIATE de ceftriaxone 1 g IV ou IM (à défaut, céfotaxime 1 g) est la première mesure thérapeutique du purpura fulminans, à réaliser sur place dès la reconnaissance clinique, y compris en pré-hospitalier par tout médecin. Mécanisme : la méningococcémie évolue en heures vers le choc septique réfractaire et la nécrose tissulaire ischémique (gangrène distale, syndrome de Waterhouse-Friderichsen par nécrose surrénalienne). Chaque minute compte. La ceftriaxone diffuse rapidement, traverse la barrière hémato-méningée et a une activité bactéricide rapide sur Neisseria meningitidis. Cette injection précède tout autre geste : hémocultures, remplissage, transport médicalisé, déchocage. C'est la conduite à tenir la mieux retenue par les jurys EDN/ECNi car elle teste à la fois la reconnaissance clinique et la hiérarchisation thérapeutique. Contre-exemple : si le diagnostic suspecté avait été un choc septique d'origine indéterminée sans purpura, la séquence aurait été : hémocultures + remplissage initial puis antibiothérapie large spectre (pipéracilline-tazobactam ou carbapénème) — l'urgence aurait été moindre."},D:{v:false,t:"FAUX. L'intubation et l'appel du réanimateur sont des mesures nécessaires si l'état neurologique se dégrade (Glasgow < 9) ou en cas de défaillance respiratoire, mais ce n'est pas la PREMIÈRE mesure. Le patient a un Glasgow à 13 et une saturation correcte. Mécanisme : prioriser l'intubation sur l'antibiothérapie reviendrait à traiter un symptôme (trouble de conscience modéré, transitoire et lié à la sepsis) au lieu de la cause (méningococcémie tueuse). Contre-exemple : si le patient avait été en arrêt cardio-respiratoire ou en coma profond Glasgow 5 avec menace de protection des voies aériennes, l'intubation aurait été simultanée à l'antibiothérapie — mais jamais avant."},E:{v:false,t:"FAUX. La dexaméthasone n'est pas la priorité dans le purpura fulminans. Elle peut être discutée dans la prise en charge ultérieure (notamment en cas de méningite confirmée sur la PL différée), mais elle ne précède jamais l'antibiothérapie et ne constitue pas une mesure d'urgence vitale. De plus, dans le purpura fulminans avec choc septique, l'hydrocortisone (50 mg x4/j) peut être indiquée en cas de choc réfractaire aux catécholamines — pas la dexaméthasone à dose méningée. Contre-exemple : dans une méningite à pneumocoque confirmée avec direct positif sur la PL, la dexaméthasone serait débutée simultanément à l'antibiothérapie (parmi les premières mesures, en même temps que la C3G), pas en isolé sans antibiotique."},F:{v:false,t:"FAUX. Le scanner cérébral n'a aucune place en urgence dans le purpura fulminans. Il ne modifie pas la prise en charge immédiate et son obtention retarderait l'antibiothérapie. La PL étant CI (instabilité, CIVD), un scanner pour préparer la PL serait absurde. Le scanner ne sert ni à confirmer ni à infirmer le diagnostic clinique. Contre-exemple : si la suspicion avait été une encéphalite herpétique avec confusion fébrile sans purpura ni instabilité hémodynamique, le scanner ou l'IRM aurait été utile pour rechercher une atteinte temporale — mais sans retarder l'aciclovir."},G:{v:false,t:"FAUX. Le remplissage vasculaire est INDISPENSABLE et concomitant à l'antibiothérapie chez ce patient en choc septique (PA 78/44, FC 134), mais il n'est pas la PREMIÈRE mesure. La séquence stricte est : antibiothérapie immédiate (geste de quelques secondes) puis remplissage vasculaire 30 ml/kg de cristalloïde dans la première heure. Le piège est de croire que stabiliser l'hémodynamique avant l'antibiothérapie protégerait mieux le patient ; en réalité, c'est l'antibiotique qui stoppe la lyse bactérienne et la cascade inflammatoire responsable du choc. Contre-exemple : dans un choc hypovolémique pur (hémorragie active sans sepsis), le remplissage et le contrôle de la source hémorragique seraient absolument prioritaires sur tout autre geste."},H:{v:false,t:"FAUX. Attendre les résultats d'hémocultures avant antibiothérapie dans un purpura fulminans constitue une faute thérapeutique grave avec perte de chance majeure (mortalité augmentée de 30 à 50% pour chaque heure de retard). Les hémocultures se réalisent simultanément ou juste après l'antibiothérapie. Mécanisme : l'antibiotique ne négative pas immédiatement les hémocultures (sensibilité reste élevée dans la première heure post-injection), et même si elles devenaient négatives, le diagnostic clinique suffit et la PCR Neisseria meningitidis sur sang reste positive plusieurs heures après. Contre-exemple : dans une endocardite stable sans choc, attendre 3 paires d'hémocultures à 1 heure d'intervalle avant antibiothérapie est la règle — l'urgence est moindre et la précision microbiologique est primordiale pour adapter l'antibiothérapie au long cours."},I:{v:false,t:"FAUX. L'amoxicilline 3 g IV n'est pas le traitement de référence du purpura fulminans. Mécanisme : si certaines souches de méningocoque sont sensibles à l'amoxicilline, on observe une augmentation des souches de sensibilité diminuée à la pénicilline G (CMI > 0.064 mg/L), ce qui rend la couverture moins fiable. La ceftriaxone (ou céfotaxime) couvre 100% des souches de méningocoque actuelles, traverse la BHM même en cas de méningite associée, et a une demi-vie longue permettant une administration unique en urgence. Elle est donc la molécule de choix recommandée par toutes les sociétés savantes (SPILF, ESCMID, IDSA). Contre-exemple : dans une méningite à Listeria documentée (bacille Gram+), l'amoxicilline IV serait au contraire le traitement de référence, avec ajout de gentamicine en synergie."},J:{v:false,t:"FAUX. Le bilan de coagulation (TP, TCA, fibrinogène, D-dimères) est INDISPENSABLE pour évaluer la CIVD potentielle, mais il n'est pas la première mesure thérapeutique. Il est réalisé après l'injection d'antibiotique, dans les minutes qui suivent. Mécanisme : la CIVD du purpura fulminans est due à la consommation des facteurs par activation pathologique de la coagulation par les endotoxines bactériennes ; sa correction (transfusion de plasma frais congelé, fibrinogène) ne précède jamais l'antibiothérapie qui en est la véritable cause. Contre-exemple : dans une hémorragie active avec choc hémorragique et CIVD secondaire (rupture d'anévrysme, hémorragie obstétricale grave), la transfusion massive et la correction de l'hémostase seraient les premières mesures avec contrôle simultané de la source hémorragique."}}
      },
      {
        id:"151-kfp02",type:"QRM",isKfp:true,
        vignette:"Un homme de 22 ans est amené par les pompiers en salle de déchocage. Son colocataire rapporte une fièvre brutale à 40°C et des céphalées intenses apparues 2 heures auparavant. À l'arrivée, vous constatez un purpura pétéchial initialement localisé aux membres inférieurs, désormais extensif avec 4 éléments nécrotiques de plus de 3 mm sur les membres et le tronc, apparus depuis le domicile. Pression artérielle : 78/44 mmHg. Fréquence cardiaque : 134/min. Température : 40,1°C. Saturation : 94% en air ambiant. Score de Glasgow : 13. Raideur de nuque. Vous reconnaissez immédiatement un purpura fulminans.\n\nVous avez injecté immédiatement la ceftriaxone 1 g IV.",
        stem:"Parmi les mesures suivantes, quelles sont les 4 que vous réalisez dans les 30 premières minutes ? (quatre réponses attendues)",
        choices:[{id:"A",text:"Hémocultures sur veine périphérique (2 paires)"},{id:"B",text:"Ponction lombaire immédiate"},{id:"C",text:"Bilan de coagulation : TP, TCA, fibrinogène, D-dimères"},{id:"D",text:"Remplissage vasculaire par cristalloïdes en débit libre"},{id:"E",text:"Mise en place de précautions complémentaires respiratoires type gouttelettes"},{id:"F",text:"Scanner cérébral en urgence"},{id:"G",text:"Myélogramme pour évaluation médullaire"},{id:"H",text:"Électroencéphalogramme"},{id:"I",text:"Appel du 15 SAMU pour transport médicalisé"},{id:"J",text:"Prophylaxie antibiotique des contacts immédiats"},{id:"K",text:"Radiographie thoracique de face"},{id:"L",text:"Pose d'une sonde urinaire pour surveillance diurèse"}],
        correct:["A","C","D","E"],
        explanations:{A:{v:true,t:"VRAI. Les hémocultures (2 paires sur veine périphérique avant ou immédiatement après l'antibiothérapie) sont indispensables. Mécanisme : elles permettent d'identifier le germe (Neisseria meningitidis attendu ici), de réaliser l'antibiogramme (vérification de la sensibilité aux C3G, dépistage des rares souches de sensibilité diminuée), et de typer le sérogroupe (B, C, Y, W) pour adapter les mesures de santé publique et la vaccination des contacts. Elles restent positives plusieurs heures après l'antibiothérapie initiale (sensibilité ~70-80% jusqu'à 1-2h post-antibiotique). La PCR Neisseria meningitidis sur sang complète utilement en cas de négativité bactériologique. Contre-exemple : si les hémocultures avaient été remplacées par une simple PCR sang Neisseria, elles auraient apporté une information moindre — la PCR ne donne pas l'antibiogramme."},B:{v:false,t:"FAUX. La ponction lombaire est CONTRE-INDIQUÉE dans cette situation pour deux raisons absolues : 1) Instabilité hémodynamique (PA 78/44, FC 134) — toute PL en état de choc majore le risque d'engagement cérébral par modification rapide de la pression intracrânienne ; 2) Trouble de l'hémostase suspecté — la CIVD du purpura fulminans contre-indique formellement le geste invasif sur la moelle épinière. De plus, la PL n'apporte rien à la décision thérapeutique. Elle pourra être réalisée à distance, après stabilisation hémodynamique et correction de l'hémostase, si l'évolution le justifie. Contre-exemple : si le patient avait été stable hémodynamiquement (PA 130/80) sans CIVD et sans purpura, mais avec un syndrome méningé fébrile, la PL aurait été réalisée sans délai après les hémocultures."},C:{v:true,t:"VRAI. Le bilan de coagulation complet (TP, TCA, fibrinogène, D-dimères, plaquettes) est indispensable pour évaluer la CIVD. Mécanisme : la CIVD complique fréquemment le purpura fulminans (50-70% des cas) — activation pathologique de la coagulation par les endotoxines (LPS, lipo-oligo-saccharide du méningocoque) avec consommation des facteurs (TP < 50%, TCA allongé, fibrinogène < 1 g/L), élévation des D-dimères, thrombopénie de consommation. Cette CIVD aggrave le pronostic par les saignements (purpura extensif, hémorragies digestives, intracrâniennes) et les microthromboses (ischémie distale avec gangrène, défaillance multiviscérale). Sa connaissance conditionne les mesures de soutien : transfusion de plasma frais congelé si TP < 50%, fibrinogène concentré si < 1.5 g/L, plaquettes si < 50 G/L en contexte hémorragique. Contre-exemple : dans un sepsis non méningococcique sans purpura (pyélonéphrite par exemple), le bilan de coagulation systématique serait moins urgent — la CIVD y est moins fréquente et moins sévère."},D:{v:true,t:"VRAI. Le remplissage vasculaire par cristalloïdes (sérum salé isotonique 0.9% ou Ringer lactate) en débit libre, 30 ml/kg dans la première heure, est indispensable pour ce patient en choc septique (PA 78/44, FC 134, hyperlactatémie attendue). Mécanisme : la sepsis méningococcique provoque une vasodilatation systémique massive avec fuite capillaire, hypovolémie relative et baisse du retour veineux. Le remplissage corrige cette hypovolémie et restaure une précharge ventriculaire suffisante pour maintenir un débit cardiaque adéquat. Si après 30 ml/kg le patient reste hypotendu (Pression artérielle moyenne < 65 mmHg), introduction de noradrénaline en première intention. Contre-exemple : dans un choc cardiogénique pur (post-IDM massif), le remplissage vasculaire à haut débit serait au contraire dangereux — il aggraverait l'œdème pulmonaire en surchargeant un cœur défaillant ; l'inotropie positive serait privilégiée."},E:{v:true,t:"VRAI. Les précautions complémentaires respiratoires de type gouttelettes doivent être mises en place dès l'admission, sans attendre la confirmation microbiologique. Mécanisme : le méningocoque se transmet par gouttelettes oro-nasopharyngées de plus de 5 μm projetées lors de la toux, de l'éternuement ou de la parole — protection par masque chirurgical à 1 mètre, chambre individuelle si possible. Les précautions seront levées 24 heures après le début d'une antibiothérapie efficace par C3G, suffisantes pour éradiquer le portage rhinopharyngé. Cette mesure protège les soignants et les autres patients du service. Contre-exemple : dans une listériose neuroméningée confirmée, aucune précaution complémentaire respiratoire ne serait nécessaire — la transmission étant exclusivement alimentaire."},F:{v:false,t:"FAUX. Le scanner cérébral n'a pas sa place dans les 30 premières minutes. Le diagnostic est clinique (purpura nécrotique fébrile = méningococcémie), la PL est CI (instabilité, CIVD), donc le scanner pour préparer la PL est inutile. Réaliser un scanner à un patient en choc septique l'expose à des risques (transport, décubitus, retard à la réanimation) sans bénéfice. Contre-exemple : si le patient avait présenté un syndrome méningé fébrile sans purpura mais avec Glasgow 12 et asymétrie pupillaire, le scanner aurait été indispensable pour rechercher un engagement cérébral et autoriser ou non la PL ultérieure."},G:{v:false,t:"FAUX. Le myélogramme n'a aucune indication en urgence dans le purpura fulminans. Il serait éventuellement discuté à distance si l'on suspectait une hémopathie maligne sous-jacente comme facteur favorisant — situation rare. Le purpura ici est lié à la CIVD et à la nécrose vasculaire, pas à une atteinte médullaire. Contre-exemple : si le patient avait présenté un purpura thrombopénique fébrile avec pancytopénie, blastes circulants et fièvre, le myélogramme aurait été en effet une urgence diagnostique pour identifier une leucémie aiguë."},H:{v:false,t:"FAUX. L'EEG n'a aucune indication dans les 30 premières minutes d'un purpura fulminans. Le patient a un Glasgow à 13 sans crise convulsive documentée. L'EEG retarderait inutilement les mesures de réanimation. Contre-exemple : dans une encéphalite herpétique avec confusion fébrile et crises temporales pluriquotidiennes, l'EEG aurait orienté vers le diagnostic (pointes-ondes temporales) et permis de débuter l'aciclovir IV plus rapidement."},I:{v:false,t:"FAUX. L'appel du 15 SAMU pour transport médicalisé est pertinent en pré-hospitalier (médecin de ville, cabinet), pas dans cette situation où le patient est DÉJÀ aux urgences à l'hôpital. La mesure équivalente en intra-hospitalier serait l'appel du réanimateur pour transfert en réanimation après stabilisation initiale — ce qui est différent du 15. Contre-exemple : si la scène s'était passée dans le cabinet d'un médecin généraliste, l'appel du 15 aurait été la deuxième mesure immédiatement après l'injection IM de ceftriaxone."},J:{v:false,t:"FAUX. La prophylaxie antibiotique des contacts ne fait pas partie des mesures des 30 premières minutes pour le patient lui-même. Elle est mise en place secondairement, dans les 24-48 heures, après identification du germe et du sérogroupe, et concerne uniquement les sujets contacts intimes des 10 jours précédents. Contre-exemple : si la question avait porté sur les mesures à mettre en place vis-à-vis du colocataire du patient dans la journée qui suit, l'antibioprophylaxie aurait été indiquée (rifampicine 600 mg x2/j pendant 2 jours)."},K:{v:false,t:"FAUX. La radiographie thoracique n'est pas prioritaire dans les 30 premières minutes du purpura fulminans. Elle pourra être réalisée secondairement si suspicion de complication pulmonaire (SDRA, foyer pulmonaire associé), mais elle ne modifie pas la prise en charge immédiate. Contre-exemple : si le patient avait présenté une dyspnée majeure avec désaturation et crépitants bilatéraux, la radiographie thoracique en lit aurait été immédiate pour confirmer un SDRA débutant et adapter la ventilation."},L:{v:false,t:"FAUX. La pose d'une sonde urinaire pour surveillance de la diurèse n'est pas la priorité des 30 premières minutes. Elle est utile dans la prise en charge ultérieure du choc septique pour évaluer la perfusion rénale (objectif diurèse > 0.5 ml/kg/h), mais ne précède pas l'antibiothérapie, les hémocultures, le remplissage et les précautions complémentaires. Contre-exemple : si la question avait porté sur la surveillance après la première heure de réanimation, la sonde urinaire aurait été indispensable pour guider le remplissage et détecter une insuffisance rénale aiguë débutante."}}
      },
      {
        id:"151-kfp03",type:"QRM",isKfp:true,
        vignette:"Un homme de 22 ans est amené par les pompiers en salle de déchocage. Son colocataire rapporte une fièvre brutale à 40°C et des céphalées intenses apparues 2 heures auparavant. À l'arrivée, vous constatez un purpura pétéchial initialement localisé aux membres inférieurs, désormais extensif avec 4 éléments nécrotiques de plus de 3 mm sur les membres et le tronc, apparus depuis le domicile. Pression artérielle : 78/44 mmHg. Fréquence cardiaque : 134/min. Température : 40,1°C. Saturation : 94% en air ambiant. Score de Glasgow : 13. Raideur de nuque. Vous reconnaissez immédiatement un purpura fulminans.\n\nLa ceftriaxone a été administrée immédiatement et la prise en charge initiale a permis de stabiliser le patient. 48 heures plus tard, l'agent pathogène est identifié : Neisseria meningitidis sérogroupe C. Son colocataire (25 ans, en parfaite santé) et sa sœur (20 ans, enceinte de 14 semaines) sont identifiés comme cas contacts proches.",
        stem:"Parmi les mesures suivantes, lesquelles sont indiquées ? (deux réponses attendues)",
        choices:[{id:"A",text:"Rifampicine per os 600 mg x2/j pendant 2 jours pour le colocataire"},{id:"B",text:"Ciprofloxacine 500 mg monodose per os pour la sœur enceinte"},{id:"C",text:"Ceftriaxone 250 mg IM monodose pour la sœur enceinte"},{id:"D",text:"Aucune antibioprophylaxie car le patient a déjà reçu de la ceftriaxone"},{id:"E",text:"Antibioprophylaxie réservée aux contacts ayant partagé un repas"},{id:"F",text:"Vaccination méningococcique C recommandée pour les contacts"},{id:"G",text:"Déclaration obligatoire à l'ARS avant toute autre mesure"},{id:"H",text:"Vancomycine monodose pour la sœur enceinte"},{id:"I",text:"Rifampicine contre-indiquée chez la sœur enceinte au 2e trimestre"},{id:"J",text:"Prophylaxie uniquement pour les contacts vivant sous le même toit"}],
        correct:["A","C"],
        explanations:{A:{v:true,t:"VRAI. La rifampicine per os 600 mg x2/j pendant 2 jours chez l'adulte (10 mg/kg x2/j chez l'enfant > 1 mois, max 600 mg/dose) est l'antibioprophylaxie de référence des contacts d'un cas de méningococcie invasive. Mécanisme : la rifampicine pénètre efficacement les sécrétions oro-nasopharyngées et éradique le portage de Neisseria meningitidis en 48 heures, prévenant ainsi le développement d'une méningococcie chez le contact. Elle doit être administrée dans les 10 jours suivant l'exposition au cas index, idéalement dans les 48 heures. Effets indésirables à signaler : coloration orange des urines, larmes et lentilles de contact ; interactions médicamenteuses majeures (inducteur enzymatique CYP3A4) — diminue l'efficacité des contraceptifs oraux, AVK, immunosuppresseurs, antirétroviraux. Contre-exemple : si le contact avait été un cas particulier de patient sous tacrolimus pour transplantation, la rifampicine aurait été contre-indiquée pour interaction majeure ; la ciprofloxacine ou la ceftriaxone IM auraient été préférées."},B:{v:false,t:"FAUX. La ciprofloxacine 500 mg en monodose per os est une alternative valable à la rifampicine pour l'antibioprophylaxie méningococcique CHEZ L'ADULTE NON ENCEINTE NI ALLAITANTE. Chez la sœur enceinte de 14 semaines, les fluoroquinolones sont contre-indiquées en raison du risque toxique sur le développement du cartilage fœtal et des tendons (risque démontré chez l'animal, hypothétique chez l'humain mais le principe de précaution s'applique). Le piège est de proposer la ciprofloxacine par facilité (monodose) sans tenir compte du terrain. Contre-exemple : si la sœur n'avait pas été enceinte, la ciprofloxacine 500 mg monodose aurait été parfaitement acceptable, voire préférée à la rifampicine pour sa simplicité d'administration et l'absence d'interactions médicamenteuses majeures."},C:{v:true,t:"VRAI. La ceftriaxone 250 mg IM en monodose (125 mg chez l'enfant < 12 ans) est l'antibioprophylaxie recommandée chez la femme enceinte exposée à un cas de méningococcie invasive. Mécanisme : elle éradique efficacement le portage rhinopharyngé en une seule injection ; sa sécurité a été démontrée pendant la grossesse à tous les trimestres (pas de tératogénicité, large utilisation clinique pendant des décennies). Elle est également l'alternative recommandée en cas d'allergie à la rifampicine et de contre-indication à la ciprofloxacine, ou en cas d'interaction médicamenteuse majeure avec la rifampicine. Contre-exemple : si la sœur avait été allergique aux bêta-lactamines en plus d'être enceinte, on aurait dû recourir à une alternative encore moins courante (azithromycine éventuellement, après avis spécialisé) — situation rare."},D:{v:false,t:"FAUX. Le fait que le patient ait reçu de la ceftriaxone éradique le portage rhinopharyngé chez le PATIENT lui-même, mais cela n'a aucune action sur les CONTACTS qui peuvent avoir acquis le germe avant le diagnostic. Mécanisme : la transmission du méningocoque se fait par gouttelettes dans les jours/semaines précédant l'apparition des symptômes du cas index. Les contacts intimes des 10 jours précédents sont potentiellement porteurs et doivent recevoir une antibioprophylaxie pour éradiquer ce portage avant qu'il ne se transforme en méningococcie invasive. Contre-exemple : si le contact avait été identifié comme certainement vacciné contre le sérogroupe en cause (par exemple sérogroupe C avec vaccination antérieure documentée dans les 5 ans), l'antibioprophylaxie aurait quand même été indiquée car elle vise à éradiquer le portage, pas à compléter l'immunité."},E:{v:false,t:"FAUX. La définition du contact intime n'est pas limitée aux repas partagés. Sont considérés comme contacts à risque tous les sujets ayant eu, dans les 10 jours précédant l'hospitalisation du cas index : 1) Un contact à moins d'un mètre prolongé (> 1 heure) avec le sujet (membres du foyer, partenaires sexuels, camarades de chambre, voisins de salle de classe ou de transport) ; 2) Un contact direct avec les sécrétions oro-pharyngées (bouche-à-bouche, baisers, partage de couverts, brosse à dents, cigarette). Les repas partagés font partie des situations à risque mais pas exclusivement. Contre-exemple : si un soignant avait été en contact prolongé avec les sécrétions du patient sans masque (intubation, aspiration trachéale), il aurait été considéré comme contact à risque et aurait reçu une antibioprophylaxie au même titre que le colocataire."},F:{v:false,t:"FAUX. La vaccination méningococcique C des contacts est une mesure utile mais ne fait pas partie des DEUX réponses attendues ici (qui concernent l'antibioprophylaxie). Elle est proposée en complément de l'antibioprophylaxie aux contacts non antérieurement vaccinés, lorsque le sérogroupe en cause est couvert par un vaccin (A, C, Y, W ; pas pour le B sauf situation épidémique spécifique). Elle complète l'antibioprophylaxie en apportant une immunité durable. Contre-exemple : si la question avait été 'parmi ces mesures, lesquelles sont indiquées dans la prise en charge globale des contacts' avec 3 réponses attendues, la vaccination C aurait été incluse."},G:{v:false,t:"FAUX. La déclaration obligatoire à l'ARS est une mesure réglementaire obligatoire mais administrative, non une mesure thérapeutique vis-à-vis des contacts. Elle déclenche la mise en place des mesures par l'ARS (recherche des contacts, antibioprophylaxie, vaccination si pertinent), mais en pratique l'antibioprophylaxie aux contacts identifiés peut être prescrite immédiatement par le médecin déclarant sans attendre la réponse de l'ARS. La DO et l'antibioprophylaxie se font en parallèle. Contre-exemple : si la question avait porté sur les obligations légales du médecin face à un cas de méningococcie, la DO aurait évidemment été la mesure principale."},H:{v:false,t:"FAUX. La vancomycine n'a aucune indication dans l'antibioprophylaxie méningococcique. Mécanisme : la vancomycine est un antibiotique glycopeptidique inactif sur les bactéries à Gram négatif comme Neisseria meningitidis (incapacité à pénétrer la paroi externe). Son utilisation ici serait totalement inefficace. Contre-exemple : la vancomycine serait utilisée en méningite à pneumocoque de haut niveau de résistance aux C3G (CMI > 0.5 mg/L) en association avec la ceftriaxone, pour le traitement curatif — jamais en prophylaxie."},I:{v:false,t:"FAUX. La rifampicine n'est pas formellement contre-indiquée pendant la grossesse mais elle est déconseillée surtout au premier trimestre (risque tératogène faible mais non nul à doses élevées chez l'animal, hépatotoxicité majoré pendant la grossesse). Au 2e trimestre, elle pourrait être utilisée en cas de nécessité (tuberculose maternelle par exemple), mais POUR L'ANTIBIOPROPHYLAXIE méningococcique chez la femme enceinte, on lui préfère la ceftriaxone 250 mg IM monodose qui a un meilleur rapport bénéfice/risque et une administration plus simple. Contre-exemple : si la sœur avait été en post-partum immédiat avec allaitement, la rifampicine aurait pu être utilisée (passage dans le lait limité, sans effet documenté sur le nourrisson) — la ceftriaxone IM resterait toutefois l'option de choix."},J:{v:false,t:"FAUX. L'antibioprophylaxie ne se limite pas aux contacts vivant sous le même toit (cohabitants). Elle s'étend à tous les contacts intimes des 10 jours précédents, quel que soit leur lieu de vie : partenaires sexuels, amis très proches, collègues de bureau partageant le même espace de travail prolongé, soignants exposés sans masque, voisins immédiats en avion sur long-courrier, etc. La définition est large car le portage rhinopharyngé asymptomatique peut être contaminant. Contre-exemple : si la question avait porté sur les mesures dans une école élémentaire, l'antibioprophylaxie aurait été étendue à toute la classe et au personnel encadrant ayant été en contact rapproché — bien au-delà des seuls cohabitants."}}
      },

      {
        id:"151-qi01",type:"QCU",
        stem:"Vous êtes médecin de garde dans un cabinet de médecine générale. Un homme de 19 ans se présente pour fièvre à 40°C et céphalées intenses depuis 2 heures. En l'examinant, vous constatez un purpura pétéchial apparu depuis 30 minutes sur les membres inférieurs avec 2 éléments ecchymotiques évolutifs. Le patient est conscient et stable. Quelle est votre première mesure thérapeutique ?",
        choices:[{id:"A",text:"Appeler le 15 SAMU pour demander le transfert"},{id:"B",text:"Injecter la ceftriaxone 1 g IV ou IM immédiatement, sur place"},{id:"C",text:"Réaliser une ponction lombaire avant de débuter tout traitement"},{id:"D",text:"Adresser en urgence aux Urgences sans administrer de traitement"},{id:"E",text:"Réaliser des hémocultures puis débuter l'antibiothérapie"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. L'appel du 15 est INDISPENSABLE mais il intervient APRÈS l'injection de ceftriaxone, jamais avant. Mécanisme : dans le purpura fulminans, la mortalité augmente de l'ordre de 10% par heure de retard à l'antibiothérapie. Téléphoner au SAMU peut prendre 2 à 5 minutes (recherche d'un téléphone, attente, dialogue avec le régulateur) — temps pendant lequel la bactériémie progresse, la CIVD s'aggrave et le choc se constitue. Ces minutes peuvent coûter la vie du patient ou des membres (gangrène ischémique). La séquence correcte est : 1) Reconnaissance clinique du purpura fulminans, 2) Injection immédiate de ceftriaxone IM (ou IV si VVP en place), 3) Appel du 15 pour transport médicalisé. Contre-exemple : devant une suspicion d'IDM avec douleur thoracique typique sans signe de gravité immédiate, l'appel du 15 serait au contraire prioritaire pour acheminer rapidement le patient en salle de coronarographie — la prise en charge cardiologique requérant un plateau technique."},B:{v:true,t:"VRAI. C'est LE réflexe absolu de l'item méningite et du chapitre urgences vitales. L'injection IM (ou IV si possible) immédiate de ceftriaxone 1 g (céfotaxime 1 g en alternative) sur place dès la reconnaissance clinique du purpura fulminans est la mesure salvatrice qui prime sur tout autre geste. Mécanisme : la ceftriaxone diffuse en quelques minutes dans la circulation systémique, atteint des concentrations bactéricides sur Neisseria meningitidis dans les 15-30 minutes, traverse rapidement la BHM. Sa demi-vie longue (8h) permet une protection thérapeutique adéquate jusqu'à l'arrivée à l'hôpital. Cette injection est légalement autorisée à tout médecin, y compris en cabinet libéral. Voie IM acceptée si pas de VVP rapidement disponible — l'injection ne doit jamais attendre la pose d'une perfusion. Contre-exemple : si le patient avait présenté un syndrome méningé fébrile sans purpura ni signe de choc, l'urgence aurait été moins absolue — l'antibiothérapie aurait pu attendre l'arrivée aux urgences hospitalières (15-30 minutes en milieu urbain) pour permettre des prélèvements optimaux."},C:{v:false,t:"FAUX. La ponction lombaire en cabinet de médecine générale n'est ni faisable techniquement (asepsie, matériel) ni indiquée (CI dans le purpura fulminans). Réaliser une PL avant antibiotique dans cette situation expose à : 1) Engagement cérébral si HIC associée, 2) Hémorragie majeure si CIVD débutante, 3) Retard catastrophique de l'antibiothérapie. La PL n'est pas indispensable au diagnostic du purpura fulminans qui est CLINIQUE — purpura nécrotique fébrile = méningococcémie jusqu'à preuve du contraire. Contre-exemple : si le patient n'avait présenté qu'un syndrome méningé fébrile isolé sans purpura, dans un service d'urgence hospitalier, la PL aurait été indiquée après hémocultures et avant antibiothérapie."},D:{v:false,t:"FAUX. Adresser le patient sans avoir injecté l'antibiotique constitue une perte de chance majeure et une faute médicale caractérisée. Le délai de transport (15 minutes à 1 heure selon la distance) sans couverture antibiotique laisse la maladie progresser. Cette attitude était courante avant les recommandations actuelles ; elle est désormais formellement proscrite par toutes les sociétés savantes françaises et internationales. La règle absolue est : tout médecin (généraliste, urgentiste, pédiatre, gynécologue de garde, médecin militaire) DOIT avoir de la ceftriaxone disponible et l'injecter avant tout transfert. Contre-exemple : devant un patient en cabinet présentant un AVC ischémique de moins de 4h30, le transfert sans traitement préalable (par contre l'appel du 15 immédiat) serait correct — la thrombolyse nécessite un plateau technique d'imagerie hospitalier indispensable."},E:{v:false,t:"FAUX. Faire les hémocultures avant la ceftriaxone n'est pas faisable en pratique courante au cabinet (pas de flacons d'hémocultures, pas d'asepsie suffisante pour des prélèvements valables), et n'est de toute façon pas prioritaire. Mécanisme : la priorité absolue est la survie immédiate du patient. Les hémocultures de qualité seront prélevées à l'arrivée à l'hôpital ; elles peuvent rester positives jusqu'à 1-2h après l'antibiothérapie (sensibilité ~70-80%). De plus, la PCR Neisseria meningitidis sur sang reste positive bien plus longtemps même sous antibiotique (jusqu'à 24h voire plus). Contre-exemple : en milieu hospitalier avec accès aux flacons d'hémocultures, le prélèvement est réalisé en parallèle ou juste avant l'antibiothérapie — sans retarder cette dernière de plus de 5 minutes."}}
      },
      {
        id:"151-qi02",type:"QRM",
        stem:"Une femme de 52 ans est hospitalisée pour fièvre à 39,5°C, céphalées intenses et raideur de nuque. Elle est traitée par rivaroxaban 20 mg/j pour une fibrillation atriale et par aspirine 100 mg/j pour une coronaropathie. La NFS retrouve des plaquettes à 38 G/L. Il n'existe pas de lésion cutanée au site potentiel de ponction. Le score de Glasgow est à 14. Il n'existe pas de signe de focalisation neurologique. Parmi les éléments suivants, lequel ou lesquels constitue ou constituent une contre-indication à la réalisation immédiate de la PL ?",
        choices:[{id:"A",text:"La prise d'aspirine 100 mg/j"},{id:"B",text:"La prise de rivaroxaban 20 mg/j à dose curative"},{id:"C",text:"Les plaquettes à 38 G/L"},{id:"D",text:"Le score de Glasgow à 14"},{id:"E",text:"L'absence de signe de focalisation neurologique"}],
        correct:["B","C"],
        explanations:{A:{v:false,t:"FAUX. L'aspirine à dose antiagrégante (75-300 mg/j) n'est PAS une contre-indication à la PL. Mécanisme : l'aspirine inhibe l'agrégation plaquettaire (COX-1) mais n'altère ni le nombre de plaquettes ni la coagulation plasmatique. Le risque hémorragique réel d'une PL chez un patient sous aspirine seule est très faible (études prospectives < 0.1% d'hématome épidural spinal cliniquement significatif). Le piège est de croire que tout antiagrégant constitue une CI — ce n'est pas le cas. La règle française et internationale est claire : les antiagrégants seuls (aspirine, clopidogrel, ticagrelor) ne contre-indiquent pas la PL si elle est urgente. Contre-exemple : si la patiente avait été sous bithérapie antiagrégante post-stent coronaire (aspirine + clopidogrel) à doses thérapeutiques pleines, la CI relative aurait été discutée selon le contexte d'urgence ; en cas de méningite bactérienne suspectée, la PL aurait quand même été réalisée."},B:{v:true,t:"VRAI. Le rivaroxaban à dose curative (20 mg/j pour FA) est une contre-indication absolue à la PL d'emblée. Mécanisme : le rivaroxaban est un anticoagulant oral direct (anti-Xa) à dose efficace, atteignant des concentrations plasmatiques anticoagulantes maximales 2-4h après la prise. Le risque hémorragique majeur est l'hématome épidural spinal compressif, complication potentiellement paralysante (paraplégie définitive). Avant toute PL chez un patient sous AOD, il faut soit attendre l'élimination de la molécule (au moins 24h post-dernière prise pour le rivaroxaban avec fonction rénale normale, plus long si insuffisance rénale), soit utiliser un agent réversible (andexanet alfa pour rivaroxaban/apixaban). Dans l'urgence d'une méningite, la stratégie est : hémocultures + dexaméthasone + antibiothérapie immédiates, PL différée. Contre-exemple : si le patient avait été sous rivaroxaban à dose prophylactique (10 mg/j en post-chirurgie orthopédique par exemple), la CI aurait été relative et discutée selon le délai écoulé depuis la dernière prise."},C:{v:true,t:"VRAI. Les plaquettes à 38 G/L constituent une CI à la PL d'emblée par trouble de l'hémostase primaire suspecté. Mécanisme : sous le seuil de 50 G/L, le risque hémorragique au point de ponction et surtout d'hématome épidural spinal devient significatif. La règle classique en hématologie pour les gestes invasifs intermédiaires comme la PL est de transfuser des concentrés plaquettaires pour atteindre > 50 G/L avant le geste (objectif > 80-100 G/L pour neurochirurgie). En cas d'urgence absolue (suspicion de méningite bactérienne fulminante), la transfusion plaquettaire peut être faite en simultané du geste. Contre-exemple : si les plaquettes avaient été à 75 G/L, la PL aurait été réalisable sans transfusion préalable — le seuil de 50 G/L est le repère."},D:{v:false,t:"FAUX. Un score de Glasgow à 14 n'est pas une contre-indication à la PL. Le seuil neurologique est Glasgow < 12 (parfois 11 selon les recommandations). Mécanisme : le Glasgow évalue le niveau de conscience et son altération peut traduire un processus expansif intracrânien avec hypertension intracrânienne (HIC), or la PL en cas d'HIC majeure expose à un engagement cérébral. À Glasgow 14 (légère désorientation ou confusion mineure), le risque est négligeable. Contre-exemple : si le patient avait eu un Glasgow à 10 (avec ouverture des yeux à la douleur seulement), la PL aurait été contre-indiquée d'emblée — il aurait fallu un scanner cérébral préalable pour éliminer un engagement."},E:{v:false,t:"FAUX. L'absence de signe de focalisation neurologique est au contraire un argument FAVORABLE à la réalisation immédiate de la PL — elle élimine une CI neurologique majeure. C'est la PRÉSENCE de signes de focalisation (déficit moteur, paralysie de paires crâniennes, asymétrie pupillaire, ataxie cérébelleuse) qui contre-indique la PL d'emblée et impose un scanner préalable. La proposition inverse la logique. Contre-exemple : si la patiente avait présenté une hémiparésie droite associée au syndrome méningé fébrile, la PL aurait été contre-indiquée et le scanner cérébral aurait précédé la PL."}}
      },
      {
        id:"151-qi03",type:"QRM",
        stem:"Vous interprétez le résultat d'une PL chez un patient de 58 ans hospitalisé pour syndrome méningé fébrile à 39,8°C. Le LCS est d'aspect trouble. Résultats : leucocytes 8 400/mm³, 92% polynucléaires neutrophiles, protéinorachie 3,2 g/L, glycorachie 1,2 mmol/L pour une glycémie à 6,8 mmol/L, lactatorachie 4,9 mmol/L. Parmi les propositions suivantes concernant l'interprétation de ce LCS, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La pléiocytose à 8 400/mm³ est en faveur d'une méningite bactérienne"},{id:"B",text:"La prédominance des polynucléaires neutrophiles à 92% oriente vers une méningite bactérienne"},{id:"C",text:"Le rapport glycorachie/glycémie à 0,18 est en faveur d'une méningite bactérienne"},{id:"D",text:"La lactatorachie à 4,9 mmol/L est en faveur d'une méningite bactérienne"},{id:"E",text:"Un LCS clair d'emblée exclut définitivement une méningite bactérienne"}],
        correct:["A","B","C","D"],
        explanations:{A:{v:true,t:"VRAI. Une pléiocytose à 8 400 leucocytes/mm³ oriente fortement vers une méningite bactérienne. Mécanisme : la réponse cellulaire intense traduit l'infiltration massive du LCS par des polynucléaires neutrophiles attirés par les bactéries et leurs produits (chimiokines, complément activé). Repères classiques : LCS normal < 5/mm³, méningite virale habituellement 50-500/mm³, méningite bactérienne typiquement > 1000/mm³ voire > 5000/mm³, méningite tuberculeuse et fongique 100-500/mm³ avec prédominance lymphocytaire. À 8 400, on est dans la zone classique bactérienne. Contre-exemple : une pléiocytose à 350/mm³ aurait orienté préférentiellement vers une méningite virale (entérovirus, HSV2 méningé) si la formule était lymphocytaire — la pléiocytose seule n'est pas suffisante, il faut l'associer à la formule et aux autres marqueurs."},B:{v:true,t:"VRAI. Une prédominance neutrophile à 92% est typique d'une méningite bactérienne. Mécanisme : les polynucléaires neutrophiles sont les cellules de la phagocytose en phase aiguë de l'inflammation infectieuse bactérienne. Ils sont attirés massivement par le complément activé (C5a) et les chimiokines (IL-8) en réponse à la présence de bactéries dans le LCS. Repère : > 50% de neutrophiles oriente vers bactérien, > 80% est très évocateur. Piège classique : une méningite virale précoce (premières heures) peut transitoirement avoir une formule à prédominance neutrophile avant le 'switch' lymphocytaire ; la répétition de la PL à 24h peut alors aider au diagnostic. Contre-exemple : si la formule avait été 70% lymphocytes + 30% neutrophiles (formule mixte), l'orientation aurait été en faveur d'une méningite tuberculeuse, listérienne ou virale décapitée par antibiothérapie préalable."},C:{v:true,t:"VRAI. Le rapport glycorachie/glycémie à 0.18 (1.2/6.8) est très en faveur d'une méningite bactérienne. Mécanisme : la consommation de glucose par les bactéries et les polynucléaires neutrophiles très actifs métaboliquement entraîne une hypoglycorrachie marquée. Le rapport glycorachie/glycémie (rapporté à la glycémie capillaire simultanée) est plus fiable que la glycorachie isolée car il s'affranchit des variations glycémiques (diabète, jeûne). Repères : rapport < 0.4 = bactérien ou tuberculeux ; > 0.5 = viral ou normal. À 0.18, on est franchement bactérien. Contre-exemple : si la glycorachie avait été à 3.2 mmol/L pour une glycémie à 5.0 mmol/L (rapport 0.64), l'orientation aurait été en faveur d'une étiologie virale — la conservation de la glycorachie étant un argument fort contre le bactérien."},D:{v:true,t:"VRAI. La lactatorachie à 4.9 mmol/L est très en faveur d'une méningite bactérienne. Mécanisme : la production massive de lactate dans le LCS résulte du métabolisme anaérobie des bactéries et des polynucléaires neutrophiles en environnement hypoxique inflammatoire. La lactatorachie est un marqueur particulièrement utile car indépendant de la glycémie systémique et performant pour distinguer rapidement bactérien vs viral. Repères : lactatorachie normale < 2.1 mmol/L ; bactérien > 3.2 mmol/L (sensibilité 96%, spécificité 100% selon méta-analyse). À 4.9, l'orientation est franche. Contre-exemple : si la lactatorachie avait été à 2.0 mmol/L (normale), cela aurait été un argument fort contre l'origine bactérienne — utile dans les méningites décapitées par antibiothérapie préalable où les autres marqueurs peuvent être modifiés."},E:{v:false,t:"FAUX. C'est exactement le piège que le jury tend régulièrement. Un LCS clair d'emblée n'exclut JAMAIS une méningite bactérienne. Mécanisme : 1) Au tout début de l'évolution (premières heures avant que la pléiocytose massive ne trouble le LCS), le LCS peut être macroscopiquement clair ; 2) Certaines méningites bactériennes ont par nature un LCS clair ou peu trouble : méningite à Listeria (panaché souvent), méningite décapitée par antibiothérapie préalable ; 3) Les méningites bactériennes à pneumocoque très précoces peuvent débuter avec un LCS encore peu modifié. La règle est : tout syndrome méningé fébrile impose une PL même si la macroscopie semble rassurante. C'est l'analyse cytochimique qui tranche, pas l'aspect macroscopique. Contre-exemple : si le LCS avait été 'eau de roche' (parfaitement clair) avec < 10 leucocytes/mm³ et normoglycorrachique chez un patient sans aucun signe de gravité, on aurait pu surseoir à l'antibiothérapie probabiliste après contrôle clinique strict — situation cependant rare car le jury teste plutôt l'inverse."}}
      },
      {
        id:"151-qi04",type:"QRM",
        stem:"Un homme de 45 ans est hospitalisé pour un tableau de méningite bactérienne aiguë. Parmi les situations suivantes, dans laquelle ou lesquelles la dexaméthasone doit-elle être associée à l'antibiothérapie selon la LiSA ?",
        choices:[{id:"A",text:"LCS d'aspect trouble à la PL"},{id:"B",text:"Examen direct positif à cocci à Gram positif (pneumocoque probable)"},{id:"C",text:"Examen direct positif à cocci à Gram négatif (méningocoque probable)"},{id:"D",text:"LCS clair avec cellularité lymphocytaire prédominante et glycorachie normale"},{id:"E",text:"Contre-indication neurologique à la PL d'emblée"}],
        correct:["A","B","C","E"],
