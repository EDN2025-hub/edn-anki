ule, déclenchant des symptômes pénibles : flush facial, céphalées, tachycardie, hypotension, nausées-vomissements, palpitations. Les symptômes apparaissent 10-30 min après ingestion d'alcool et durent plusieurs heures. Recommandations : éviter strictement l'alcool pendant et 48 heures après le traitement. Le patient doit être averti systématiquement à la prescription. Contre-exemple : le céfamandole et la latamoxef (céphalosporines anciennes) ont aussi un effet antabuse similaire par mécanisme proche — souvent oublié des prescripteurs."},D:{v:false,t:"FAUX. Le métronidazole n'est PAS actif sur Actinomyces (voir aussi proposition B). Mécanisme : Actinomyces est un bacille Gram+ filamenteux anaérobie facultatif (mais résiste partiellement à l'oxygène par catalase) — sa membrane et ses caractéristiques métaboliques le rendent peu sensible à l'activation du métronidazole. Le traitement de l'actinomycose nécessite des bêta-lactamines (amoxicilline, pénicilline G) à fortes doses sur des durées prolongées (3-6 mois ou plus pour les formes profondes). Diagnostic souvent retardé en raison de la présentation atypique simulant néoplasie ou tuberculose. Contre-exemple : pour une infection à Fusobacterium necrophorum (syndrome de Lemierre, abcès cérébraux d'origine ORL), le métronidazole serait au contraire totalement actif — anaérobie Gram-négatif typique."},E:{v:true,t:"VRAI. Le métronidazole potentialise l'effet des AVK (warfarine, acénocoumarol, fluindione). Mécanisme : le métronidazole inhibe le métabolisme hépatique des AVK (inhibition partielle du CYP2C9 pour la warfarine) — augmentation de leur concentration plasmatique et de leur effet anticoagulant. Risque hémorragique majoré. Surveillance étroite de l'INR pendant le traitement (contrôle 48-72h après introduction du métronidazole), avec réduction de dose de l'AVK si nécessaire. Lorsque c'est possible, préférer une autre molécule antibiotique chez le patient sous AVK. Contre-exemple : la pristinamycine (alternative possible pour certaines infections cutanées superficielles) ne présente pas d'interaction significative avec les AVK — meilleure tolérance pour le patient sous anticoagulant."}}
      },
      {
        id:"177-14",type:"QRM",
        stem:"Une femme de 34 ans découvre sa séropositivité VIH lors d'un bilan pré-nuptial. Elle est asymptomatique. La biologie retrouve des CD4 à 540/mm³ et une charge virale plasmatique à 18 000 copies/mL. Elle n'a aucune co-infection. Parmi les propositions suivantes concernant le traitement antirétroviral, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le traitement ARV est recommandé uniquement si les CD4 descendent sous 350/mm³"},{id:"B",text:"Le traitement ARV doit être instauré immédiatement"},{id:"C",text:"L'objectif virologique est d'obtenir une charge virale inférieure à 50 copies/mL"},{id:"D",text:"Une charge virale indétectable supprime le risque de transmission sexuelle du VIH"},{id:"E",text:"Le traitement ARV permettra d'éliminer le virus des réservoirs lymphocytaires"}],
        correct:["B","C","D"],
        explanations:{A:{v:false,t:"FAUX. Le traitement ARV n'est plus conditionné par un seuil de CD4. Mécanisme : depuis 2015 (recommandations OMS, puis recommandations françaises), le traitement antirétroviral est recommandé pour TOUS les patients VIH+ DÈS LE DIAGNOSTIC, quel que soit le taux de CD4. Bénéfices : 1) Réduction de la mortalité et de la morbidité liées au VIH ; 2) Prévention de la transmission du virus (TasP : Treatment as Prevention) ; 3) Restauration immunologique d'autant plus complète que le traitement est précoce. Le seuil de 350 CD4/mm³ était l'ancien seuil utilisé jusqu'en 2013-2014. Contre-exemple : si le patient avait été asymptomatique sans aucun signe d'infection opportuniste avec CD4 > 500 et CV faible, le traitement aurait quand même été indiqué — la stratégie 'wait and watch' n'a plus cours."},B:{v:true,t:"VRAI. Le traitement ARV doit être instauré immédiatement (dans les jours suivant le diagnostic, idéalement < 7 jours). Mécanisme : 1) Bénéfice individuel — restauration immunologique précoce, prévention des infections opportunistes, amélioration de la qualité de vie ; 2) Bénéfice collectif — une charge virale indétectable supprime le risque de transmission sexuelle (concept TasP) ; 3) Prévention de la résistance — le traitement précoce limite l'évolution virale et l'émergence de mutations résistantes. Initiation rapide (RAPID ART) : le traitement peut même être démarré le jour du diagnostic en attendant le bilan complet, sous surveillance étroite. Le traitement de référence en première intention est une trithérapie : 2 INTI + 1 INNTI ou 1 IP/r ou 1 INI (inhibiteur d'intégrase). Contre-exemple : devant une cryptococcose neuroméningée concomitante au diagnostic VIH, l'instauration du traitement ARV est différée de 2-4 semaines après le début du traitement antifongique pour réduire le risque de syndrome de reconstitution immunitaire (IRIS) — exception au principe d'instauration immédiate."},C:{v:true,t:"VRAI. L'objectif virologique est d'obtenir une charge virale indétectable (< 50 copies/mL en pratique courante, parfois < 20 copies/mL avec les tests les plus sensibles). Mécanisme : la suppression virologique complète est le marqueur d'efficacité du traitement ARV. Elle permet : 1) La restauration immunologique avec remontée des CD4 ; 2) La prévention de la transmission sexuelle (TasP — risque de transmission nul si CV indétectable pendant > 6 mois avec bonne observance) ; 3) La prévention de l'émergence de résistances (la suppression virale empêche la réplication virale et donc les mutations) ; 4) La prévention des complications non infectieuses du VIH (cardiovasculaires, oncologiques, neurocognitives). Suivi par CV plasmatique tous les 3-6 mois une fois la suppression obtenue. Contre-exemple : un patient avec CV à 150 copies/mL persistante malgré un traitement bien conduit (blip) imposerait une recherche de cause (mauvaise observance, interactions médicamenteuses) — la persistance d'une virémie de bas niveau favorise les résistances secondaires."},D:{v:true,t:"VRAI. Une charge virale indétectable supprime le risque de transmission sexuelle du VIH (concept TasP — Treatment as Prevention, ou U=U : Undetectable = Untransmittable). Mécanisme : démontré par plusieurs études (HPTN 052, PARTNER 1 et 2, Opposites Attract) : aucune transmission sexuelle du VIH n'a été documentée lorsque le partenaire séropositif a une charge virale indétectable depuis au moins 6 mois avec bonne observance. Cette information révolutionne la prévention et l'accompagnement des couples sérodifférents. Elle ne supprime cependant pas le risque de transmission par le sang (partage de seringues chez UDIV) ni le risque de transmission materno-fœtale (la prophylaxie reste indispensable). Contre-exemple : un patient avec CV à 200 copies/mL n'est pas considéré comme indétectable au sens TasP — le risque de transmission reste théoriquement présent, même s'il est très faible."},E:{v:false,t:"FAUX. Le traitement ARV NE PERMET PAS d'éliminer le virus des réservoirs lymphocytaires. Mécanisme : le VIH-1 s'intègre dans le génome des lymphocytes T CD4 mémoires en phase de quiescence, formant des réservoirs viraux latents inaccessibles aux antirétroviraux (qui agissent sur la réplication virale active uniquement). Ces réservoirs sont la cause principale de la persistance virale et l'obstacle majeur à la guérison du VIH. C'est pourquoi le traitement doit être maintenu à vie — l'arrêt entraîne une réémergence virale en quelques semaines (rebond viral). Les stratégies actuelles de recherche visent à éliminer ces réservoirs ('cure' fonctionnelle) par approches diverses (latency reversing agents, immunothérapie, broadly neutralizing antibodies, CRISPR). Contre-exemple : pour le VHC (virus de l'hépatite C), le traitement par antiviraux à action directe (sofosbuvir, glécaprévir, etc.) permet une guérison virologique soutenue — l'éradication virale est possible car le VHC ne s'intègre pas au génome de l'hôte."}}
      },
      {
        id:"177-15",type:"QRM",
        stem:"Une femme de 33 ans est hospitalisée à J10 d'une chimiothérapie aplasiante (FOLFOX) pour un cancer colorectal. Elle présente une fièvre à 40,2°C avec frissons. La NFS retrouve des polynucléaires neutrophiles à 0,15 G/L. Elle a quelques brûlures mictionnelles et une douleur lombaire gauche. La pression artérielle est à 115/70 mmHg. Quels sont les deux éléments à mettre en œuvre sans délai ?",
        choices:[{id:"A",text:"Prescription d'un antipyrétique seul en attendant les résultats"},{id:"B",text:"Prélèvement d'hémocultures aérobies et anaérobies"},{id:"C",text:"Antibiothérapie probabiliste IV à large spectre active sur les bacilles à Gram négatif"},{id:"D",text:"Attente des résultats de l'ECBU avant de débuter l'antibiothérapie"},{id:"E",text:"Myélogramme en urgence pour évaluation de la moelle"}],
        correct:["B","C"],
        explanations:{A:{v:false,t:"FAUX. La prescription d'un antipyrétique seul devant une fièvre chez un patient neutropénique constitue une faute grave — c'est une urgence vitale. Mécanisme : la neutropénie fébrile (PNN < 0.5 G/L et fièvre > 38.3°C ou > 38°C persistante > 1h) est une urgence absolue avec risque de sepsis foudroyant. La mortalité atteint 20-30% sans antibiothérapie probabiliste précoce. Les bactéries (essentiellement entérobactéries — E. coli, Klebsiella, Pseudomonas, mais aussi cocci Gram+ — staphylocoques, streptocoques) peuvent provoquer un sepsis grave en quelques heures. Le délai d'administration de l'antibiotique probabiliste doit être < 1 heure après l'arrivée. Contre-exemple : devant une fièvre isolée chez un patient immunocompétent sans facteur de gravité (jeune adulte, syndrome viral typique), un antipyrétique en surveillance peut être effectivement la seule mesure — situation totalement différente."},B:{v:true,t:"VRAI. Le prélèvement d'hémocultures aérobies et anaérobies (2 paires minimum, idéalement 3 paires en 30 minutes) est INDISPENSABLE avant l'antibiothérapie. Mécanisme : la documentation microbiologique est essentielle pour : 1) Identifier le germe et adapter secondairement l'antibiothérapie ; 2) Détecter les bactériémies (présentes dans 25-30% des neutropénies fébriles) ; 3) Évaluer la durée nécessaire du traitement antibiotique selon la documentation. Important : les prélèvements ne doivent jamais retarder l'antibiothérapie de plus de 30-45 minutes. Si une voie veineuse centrale est en place, prélever également une paire d'hémocultures sur cathéter pour comparer le délai de positivité (différentiel > 2 heures évoquant une infection liée au cathéter). Contre-exemple : pour une infection urinaire basse simple chez une femme jeune apyrétique, les hémocultures ne sont pas systématiques — ECBU seul suffit."},C:{v:true,t:"VRAI. L'antibiothérapie probabiliste IV à large spectre active sur les bacilles à Gram négatif (en particulier Pseudomonas aeruginosa) doit être débutée immédiatement après les hémocultures. Mécanisme : les recommandations actuelles (IDSA, ESCMID, SPILF) préconisent : 1) Pipéracilline-tazobactam IV (4 g x4/j) en première intention ; 2) Céfépime IV (2 g x3/j) en alternative ; 3) Méropénème (1 g x3/j) en cas de facteurs de risque (allergie pénicilline, BLSE connue, sepsis grave). Si suspicion d'infection à cocci Gram+ (suspicion infection sur cathéter, mucite sévère, hémocultures positives à Gram+, instabilité hémodynamique), ajout de vancomycine. Désescalade ensuite selon documentation. Contre-exemple : pour une fièvre chez un patient immunocompétent avec syndrome viral typique, l'antibiothérapie probabiliste serait disproportionnée — surveillance + antipyrétique suffirait."},D:{v:false,t:"FAUX. Attendre les résultats de l'ECBU avant de débuter l'antibiothérapie est une faute grave dans la neutropénie fébrile. Mécanisme : le délai d'obtention de l'ECBU (24-48h) est totalement incompatible avec l'urgence d'une neutropénie fébrile où chaque heure compte. De plus, l'ECBU peut être stérile chez un patient neutropénique infecté (absence de pyurie réactive par défaut de polynucléaires neutrophiles — c'est un piège classique : l'ECBU peut sembler normal alors qu'il y a une PNA chez le neutropénique). Le diagnostic d'infection chez le neutropénique nécessite une approche probabiliste large. Contre-exemple : devant une suspicion de cystite simple chez une femme jeune apyrétique sans signe de gravité, attendre l'ECBU avant antibiothérapie est en revanche acceptable — 24h sans gravité."},E:{v:false,t:"FAUX. Le myélogramme n'est pas indiqué en urgence dans la neutropénie fébrile chimio-induite — l'origine de la neutropénie est connue (post-chimiothérapie cytotoxique). Le myélogramme serait inutile à ce stade et ne modifierait pas la prise en charge thérapeutique. Il pourrait être discuté en différé en cas de neutropénie prolongée inattendue, suspicion de récidive de la maladie sous-jacente, ou aplasie médullaire toxique secondaire. Mais en aigu, dans le contexte d'une neutropénie fébrile post-chimio prévisible, il est inutile. Contre-exemple : devant une pancytopénie fébrile chez un patient sans contexte de chimiothérapie ni d'infection évidente, le myélogramme deviendrait urgent pour rechercher une hémopathie maligne aiguë (leucémie aiguë, aplasie médullaire idiopathique, syndrome myélodysplasique avancé)."}}
      },
      {
        id:"177-16",type:"QCU",
        stem:"Un homme de 52 ans consulte pour des brûlures mictionnelles, une pollakiurie et une fièvre à 39,1°C depuis 48 heures. Il décrit des douleurs périnéales intenses et un inconfort à la défécation. Le toucher rectal retrouve une prostate tendue et exquisément douloureuse. La bandelette urinaire est positive pour leucocytes et nitrites. L'ECBU est prélevé. Quelle antibiothérapie probabiliste prescrivez-vous en première intention ? (une seule réponse attendue)",
        choices:[{id:"A",text:"Amoxicilline per os"},{id:"B",text:"Cotrimoxazole per os"},{id:"C",text:"Ciprofloxacine per os"},{id:"D",text:"Ceftriaxone IV"},{id:"E",text:"Amoxicilline-acide clavulanique per os"}],
        correct:["C"],
        explanations:{A:{v:false,t:"FAUX. L'amoxicilline per os n'est pas adaptée en probabiliste pour une prostatite aiguë. Mécanisme : E. coli (germe le plus fréquent des prostatites, 80%) présente une résistance à l'amoxicilline d'environ 40-50% en France. De plus, l'amoxicilline a une diffusion prostatique médiocre (la prostate est un sanctuaire pharmacologique difficile à atteindre). En probabiliste, la voie per os doit être réservée aux antibiotiques à excellente diffusion prostatique. Contre-exemple : pour une prostatite à entérocoque documentée sur ECBU (rare mais possible), l'amoxicilline per os à forte dose pourrait être utilisée — l'entérocoque étant naturellement sensible à l'amoxicilline et l'entérocoque ayant moins besoin de diffusion intensive."},B:{v:false,t:"FAUX. Le cotrimoxazole per os n'est pas recommandé en probabiliste pour la prostatite aiguë. Mécanisme : taux de résistance d'E. coli au triméthoprime > 20% en France — trop élevé pour usage probabiliste fiable. Néanmoins, le cotrimoxazole a une excellente diffusion prostatique et peut être utilisé en traitement documenté après antibiogramme confirmant la sensibilité (relais de la fluoroquinolone IV par exemple). Contre-exemple : pour une prostatite à E. coli sensible au cotrimoxazole confirmé par antibiogramme, le relais per os par cotrimoxazole serait une excellente option en alternative aux fluoroquinolones — bonne diffusion prostatique, coût modéré, moins d'effets indésirables au long cours."},C:{v:true,t:"VRAI. La ciprofloxacine per os est le traitement probabiliste de référence de la prostatite aiguë communautaire. Mécanisme : 1) Excellente diffusion prostatique des fluoroquinolones (concentrations prostatiques élevées, > CMI sur E. coli) ; 2) Biodisponibilité orale excellente (>70%) ; 3) Activité sur la majorité des E. coli communautaires (résistance ~10-15%) ; 4) Praticité (administration per os même en hospitalisation). Posologie : 500 mg x2/j pendant 14 jours (forme simple) ou 21 jours (forme compliquée). Surveillance : effets indésirables tendineux, neuropsychiques, allongement QT. Désescalade éventuelle après antibiogramme. Contre-exemple : si le patient avait été allergique aux fluoroquinolones ou avait des CI (tendinopathie antérieure, épilepsie), une C3G injectable initiale (ceftriaxone) suivie d'un relais per os par antibiotique adapté à l'antibiogramme aurait été l'alternative."},D:{v:false,t:"FAUX. La ceftriaxone IV n'est pas le traitement de PREMIÈRE intention de la prostatite aiguë SIMPLE non hospitalisée. Mécanisme : 1) La voie IV n'est pas nécessaire en l'absence de signe de gravité ; 2) La ceftriaxone a une bonne diffusion prostatique mais moindre que les fluoroquinolones ; 3) Coût et lourdeur de la voie IV en ambulatoire. Elle reste l'option de référence en cas de : prostatite avec signes de sepsis (hyperthermie élevée, marbrures, hypotension), suspicion d'EBLSE, CI aux fluoroquinolones, hospitalisation. Contre-exemple : pour une prostatite aiguë avec sepsis grave (T° 40°C, marbrures, hypotension, hyperlactatémie) en hospitalisation, la ceftriaxone IV deviendrait au contraire le traitement de première intention — éventuellement associée à un aminoside en synergie."},E:{v:false,t:"FAUX. L'amoxicilline-acide clavulanique per os n'est pas le traitement de première intention de la prostatite aiguë communautaire. Mécanisme : 1) Diffusion prostatique modeste comparée aux fluoroquinolones ; 2) Activité sur ~70-80% des E. coli communautaires (moins fiable que ciprofloxacine en probabiliste pour cette indication) ; 3) Pas de couverture des EBLSE. Le rapport bénéfice-risque-praticité est moins bon que la ciprofloxacine. Contre-exemple : pour une infection urinaire avec entérocoque suspecté (par exemple chez un patient porteur de sonde urinaire), l'amoxicilline-acide clavulanique aurait une activité sur l'entérocoque que les fluoroquinolones n'ont pas (résistance naturelle à plusieurs souches d'entérocoques)."}}
      },
      {
        id:"177-17",type:"QRM",
        stem:"Les parents d'un garçon de 3 ans vous consultent. Il présente depuis 48 heures une rhinorrhée mucopurulente, une fièvre à 38,4°C et une toux. L'otoscopie est normale. L'état général est conservé. Les parents vous montrent l'ordonnance de leur médecin de ville prescrivant de l'amoxicilline 80 mg/kg/j et demandent votre avis. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La rhinopharyngite aiguë justifie une antibiothérapie"},{id:"B",text:"Cette prescription d'amoxicilline n'est pas justifiée dans cette situation"},{id:"C",text:"Les antibiotiques sont inefficaces sur les infections virales"},{id:"D",text:"Cette antibiothérapie expose cet enfant à une perturbation de son microbiote"},{id:"E",text:"La persistance de la fièvre à 48 heures impose une antibiothérapie systématique"}],
        correct:["B","C","D"],
        explanations:{A:{v:false,t:"FAUX. La rhinopharyngite aiguë NE JUSTIFIE PAS d'antibiothérapie. Mécanisme : la rhinopharyngite aiguë est une infection virale dans 95-99% des cas chez l'enfant (rhinovirus, coronavirus, virus respiratoire syncytial, adénovirus, influenzae). Elle évolue spontanément vers la guérison en 5-10 jours. Le traitement est purement symptomatique : antalgique/antipyrétique (paracétamol), lavages de nez au sérum physiologique chez le nourrisson, hydratation, repos. La prescription d'antibiotique constitue : 1) Une mauvaise pratique sans bénéfice clinique ; 2) Une exposition aux effets indésirables (allergie, troubles digestifs) ; 3) Une contribution à l'émergence de résistances bactériennes ; 4) Une perturbation du microbiote. Contre-exemple : pour une otite moyenne aiguë purulente compliquée chez un nourrisson de moins de 2 ans, l'antibiothérapie serait au contraire indiquée — amoxicilline en première intention."},B:{v:true,t:"VRAI. Cette prescription d'amoxicilline n'est pas justifiée dans cette situation de rhinopharyngite virale. Mécanisme : c'est exactement la situation que le campagne 'Les antibiotiques c'est pas automatique' cherche à corriger en France depuis 2002. Prescrire un antibiotique pour une virose : 1) Aucun bénéfice clinique (les antibiotiques sont inefficaces sur les virus) ; 2) Effets indésirables (allergie, troubles digestifs, perturbation microbiote, candidoses) ; 3) Sélection de résistances bactériennes ; 4) Coût économique injustifié ; 5) Risque médicolégal en cas d'effet indésirable grave. L'attitude correcte est l'explication claire à la famille de la nature virale de l'infection et des mesures symptomatiques. Contre-exemple : devant un syndrome inflammatoire majeur biologique (CRP > 100 mg/L, hyperleucocytose neutrophile > 15 G/L) chez le même enfant avec persistance fébrile > 5 jours, l'antibiothérapie pourrait être discutée — recherche d'une surinfection bactérienne secondaire (otite, sinusite)."},C:{v:true,t:"VRAI. Les antibiotiques sont par définition inefficaces sur les infections virales. Mécanisme : les antibiotiques (bactéricides ou bactériostatiques) ciblent des structures bactériennes spécifiques : paroi (bêta-lactamines, glycopeptides), membrane (polymyxines), synthèse protéique (aminosides, macrolides, tétracyclines, oxazolidinones), synthèse d'ADN (fluoroquinolones), métabolisme (sulfamides). Les virus, dépourvus de ces structures, sont insensibles aux antibiotiques. Le traitement antiviral nécessite des antiviraux spécifiques (aciclovir, oseltamivir, ARV pour le VIH, etc.). Cette notion est fondamentale en pédagogie médicale et en éducation thérapeutique des familles. Contre-exemple : la primo-infection herpétique sévère (gingivostomatite herpétique du jeune enfant avec déshydratation) bénéficie de l'aciclovir per os — antiviral et non antibiotique."},D:{v:true,t:"VRAI. Cette antibiothérapie injustifiée expose l'enfant à une perturbation de son microbiote. Mécanisme : l'amoxicilline a un spectre large, touchant non seulement les éventuels pathogènes mais aussi le microbiote intestinal et cutané commensal. Conséquences chez l'enfant : 1) Dysbiose intestinale (diminution de la diversité microbienne, sélection de Clostridioides) ; 2) Risque de diarrhée à C. difficile post-antibiotique (rare chez l'enfant mais possible) ; 3) Modifications immunologiques au long terme (suspicion de lien avec asthme, allergies, MICI, obésité dans certaines études épidémiologiques). Plus la perturbation est précoce dans la vie, plus son impact peut être durable. Contre-exemple : un traitement antibiotique justifié et court (5-7 jours) pour une infection bactérienne avérée a un impact transitoire et acceptable sur le microbiote — c'est le rapport bénéfice/risque qui justifie la prescription."},E:{v:false,t:"FAUX. La persistance de la fièvre à 48 heures N'IMPOSE PAS l'antibiothérapie systématique dans une rhinopharyngite virale. Mécanisme : la fièvre peut durer 3 à 5 jours dans une rhinopharyngite virale banale, sans signifier une surinfection bactérienne. La conduite à tenir devant une fièvre persistante > 48-72h chez l'enfant est plutôt : 1) Réévaluation clinique pour rechercher un point d'appel (otite, sinusite, pneumonie, infection urinaire) ; 2) Bilan biologique minimal si signes inquiétants (NFS, CRP, BU) ; 3) Recherche d'une cause virale spécifique éventuelle (grippe en saison épidémique → oseltamivir si dans les 48h). Une antibiothérapie n'est justifiée que si point d'appel bactérien identifié. Contre-exemple : devant une otite moyenne aiguë purulente persistante avec membrane tympanique bombée congestive, l'antibiothérapie deviendrait justifiée par amoxicilline — point d'appel bactérien identifié."}}
      },
      {
        id:"177-18",type:"QRM",
        stem:"Un homme de 62 ans traité par méthotrexate 10 mg/semaine pour une polyarthrite rhumatoïde et par acénocoumarol pour une FA non valvulaire (INR cible 2-3) consulte pour une infection urinaire basse documentée à E. coli sensible au cotrimoxazole, à la fosfomycine et au pivmécillinam. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'association cotrimoxazole-méthotrexate expose à une majoration de la toxicité hématologique"},{id:"B",text:"Le cotrimoxazole inhibe la sécrétion tubulaire rénale du méthotrexate"},{id:"C",text:"L'association cotrimoxazole-acénocoumarol est sans risque chez ce patient"},{id:"D",text:"La fosfomycine trométamol monodose est une alternative à envisager dans cette situation"},{id:"E",text:"Le cotrimoxazole peut être prescrit sans précaution particulière chez ce patient"}],
        correct:["A","B","D"],
        explanations:{A:{v:true,t:"VRAI. L'association cotrimoxazole-méthotrexate expose à une majoration grave de la toxicité hématologique. Mécanisme : double effet : 1) Le triméthoprime, comme le méthotrexate (MTX), est un inhibiteur de la dihydrofolate réductase (DHFR) — synergie d'action sur le métabolisme des folates avec déplétion sévère, conséquences sur les cellules en division rapide (moelle osseuse, muqueuses) ; 2) Le sulfaméthoxazole inhibe la sécrétion tubulaire rénale du MTX, augmentant ses concentrations plasmatiques (cf. proposition B). Cumul : risque de pancytopénie sévère (neutropénie, thrombopénie, anémie macrocytaire mégaloblastique), mucites buccales et digestives, atteinte hépatique. Des cas mortels ont été rapportés. L'association est donc CONTRE-INDIQUÉE chez les patients sous MTX (polyarthrite rhumatoïde, lupus, dermatologie). Contre-exemple : pour un patient traité par MTX qui nécessiterait une antibiothérapie urgente pour pneumonie communautaire, l'amoxicilline (en l'absence d'allergie) serait préférable au cotrimoxazole — interaction nulle avec le MTX."},B:{v:true,t:"VRAI. Le cotrimoxazole inhibe la sécrétion tubulaire rénale du méthotrexate. Mécanisme : le triméthoprime et le sulfaméthoxazole entrent en compétition avec le MTX au niveau des transporteurs tubulaires rénaux (OAT — organic anion transporters), réduisant l'élimination rénale du MTX. Conséquence : augmentation des concentrations plasmatiques du MTX et de sa toxicité. Cet effet s'ajoute à la synergie pharmacodynamique sur le métabolisme des folates (cf. proposition A). C'est pourquoi l'association est contre-indiquée — multipliant les mécanismes de toxicité. Contre-exemple : la pénicilline et la probénécide (uricosurique) entrent aussi en compétition pour les OAT — la probénécide a été historiquement utilisée pour augmenter les concentrations de pénicilline (effet bénéfique recherché à l'époque), démontrant le même mécanisme transporteur que l'inhibition du MTX par le cotrimoxazole."},C:{v:false,t:"FAUX. L'association cotrimoxazole-acénocoumarol n'est PAS sans risque. Mécanisme : le sulfaméthoxazole, par son action sur le CYP2C9, inhibe le métabolisme des AVK (acénocoumarol, warfarine, fluindione moins) — augmentation de l'effet anticoagulant avec risque hémorragique majeur. De plus, le cotrimoxazole peut altérer la flore intestinale qui produit la vitamine K, réduisant indirectement l'effet vitamine K dépendant. La surveillance INR doit être renforcée si l'association est inévitable (contrôle 48-72h après introduction, adaptation posologique). Contre-exemple : la dabigatran (AOD inhibant directement la thrombine) présente moins d'interactions avec le cotrimoxazole — la stabilité de son effet est meilleure dans ce contexte d'antibiothérapie, mais d'autres précautions s'imposent (insuffisance rénale)."},D:{v:true,t:"VRAI. La fosfomycine trométamol monodose est une alternative à envisager dans cette situation (suspicion de cystite simple non récidivante). Mécanisme : la fosfomycine est un antibiotique bactéricide à mécanisme d'action unique (inhibition de la synthèse du peptidoglycane par blocage de l'enzyme MurA). Spectre étroit, essentiellement sur E. coli (95% de souches sensibles, y compris EBLSE pour la majorité d'entre elles), Klebsiella, Staphylococcus saprophyticus. Posologie : 3 g per os en sachet unique. Avantages : 1) Pas d'interaction avec le MTX ni les AVK ; 2) Monodose (excellente observance) ; 3) Très peu d'effets indésirables ; 4) Excellente diffusion urinaire mais limitée au tractus urinaire bas. Indication exclusive : cystite aiguë simple chez la femme. Contre-exemple : pour une pyélonéphrite aiguë chez la même patiente, la fosfomycine monodose serait insuffisante — il faudrait une C3G injectable ou une fluoroquinolone selon les CI."},E:{v:false,t:"FAUX. Le cotrimoxazole NE PEUT PAS être prescrit sans précaution particulière chez ce patient. Compte tenu des deux propositions A et B vraies (toxicité hématologique majorée par interaction pharmacodynamique et pharmacocinétique avec le MTX), l'association est contre-indiquée ou très fortement déconseillée. La règle est : éviter toute association cotrimoxazole-MTX et préférer une alternative antibiotique adaptée. Cette situation est un classique des interactions médicamenteuses iatrogènes à éviter. Contre-exemple : chez un patient sans MTX et sans AVK, le cotrimoxazole pourrait être prescrit selon ses indications classiques (cystite, prostatite documentée, prophylaxie pneumocystose VIH) avec les précautions habituelles (recherche déficit G6PD, vérification fonction rénale)."}}
      },
      {
        id:"177-19",type:"QRM",
        stem:"Une femme de 35 ans, sans allergie, vous consulte avant un séjour professionnel de 6 semaines au Cameroun. Elle n'est pas enceinte. Les seules chimioprophylaxies disponibles sont l'atovaquone-proguanil et la doxycycline. Pour des raisons financières, vous lui prescrivez la doxycycline. Parmi les informations suivantes à transmettre à la patiente, lesquelles sont exactes ?",
        choices:[{id:"A",text:"Prise quotidienne"},{id:"B",text:"À débuter 1 mois avant le départ"},{id:"C",text:"À poursuivre 4 semaines après le retour"},{id:"D",text:"À arrêter si survenue d'une grossesse"},{id:"E",text:"À associer à la méfloquine du fait du séjour prolongé"}],
        correct:["A","C","D"],
        explanations:{A:{v:true,t:"VRAI. La doxycycline en prophylaxie antipaludique se prend en monoprise quotidienne. Mécanisme : la doxycycline (200 mg/j en zone d'endémie chloroquino-résistante de niveau 3) est un schizonticide érythrocytaire actif sur Plasmodium falciparum, P. vivax, P. ovale et P. malariae. Sa demi-vie longue (18-22h) permet une administration en une prise unique journalière, à prendre au cours d'un repas pour limiter les troubles digestifs et avec un grand verre d'eau (risque d'œsophagite si prise en position couchée). L'observance est cruciale — un oubli expose au risque infectieux. Contre-exemple : la prophylaxie par méfloquine se prend en une prise HEBDOMADAIRE (et non quotidienne) — modalité différente liée à sa demi-vie très longue de 2-3 semaines."},B:{v:false,t:"FAUX. La doxycycline doit être débutée 24-48 heures AVANT le départ (et non 1 mois avant). Mécanisme : il est nécessaire d'avoir des concentrations plasmatiques actives dès l'entrée en zone d'endémie. La méfloquine, elle, doit être débutée 2-3 semaines avant le départ pour évaluer la tolérance neuropsychique (effets indésirables psychiatriques possibles : cauchemars, anxiété, dépression, idées suicidaires rares) et avoir des concentrations plasmatiques actives à l'arrivée. L'atovaquone-proguanil (Malarone) peut être débutée 24-48h avant le départ comme la doxycycline. Contre-exemple : si la chimioprophylaxie avait été la méfloquine, le délai pré-départ aurait été d'au moins 2-3 semaines pour évaluer la tolérance neuropsychique."},C:{v:true,t:"VRAI. La doxycycline en prophylaxie antipaludique doit être poursuivie 4 SEMAINES (28 jours) après le retour de la zone d'endémie. Mécanisme : les schizonticides érythrocytaires (chloroquine, méfloquine, doxycycline) sont actifs sur les formes sanguines mais pas sur les formes pré-érythrocytaires (sporozoïtes intra-hépatocytaires) ni hypnozoïtes (formes dormantes intra-hépatocytaires de P. vivax et P. ovale). Il faut donc continuer la prophylaxie après le retour pour couvrir la période d'incubation potentielle (jusqu'à 4 semaines pour P. falciparum, plus pour les autres espèces) et éliminer les parasites dès leur émergence hépatique. Contre-exemple : l'atovaquone-proguanil (Malarone), du fait de son action également sur les formes pré-érythrocytaires hépatiques, peut être arrêtée plus tôt — 1 semaine seulement après le retour."},D:{v:true,t:"VRAI. La doxycycline doit être arrêtée immédiatement en cas de survenue de grossesse. Mécanisme : les tétracyclines (doxycycline, tétracycline, lymécycline) sont CONTRE-INDIQUÉES pendant la grossesse à partir du 2e trimestre (en pratique souvent considéré CI tout au long de la grossesse). Effets délétères : 1) Dyschromie dentaire jaune-brun définitive sur les dents définitives et lactéales si exposition pendant la formation dentaire ; 2) Hypoplasie de l'émail ; 3) Inhibition de la croissance osseuse fœtale par fixation sur les os en formation (chélation du calcium). En cas de grossesse survenant sous doxycycline, conseil pharmacovigilance et adaptation de la prophylaxie (méfloquine, atovaquone-proguanil selon CI et compatibilités). Contre-exemple : pour une grossesse en zone d'endémie, la méfloquine est compatible avec la grossesse (sans CI absolue) et est une alternative à la doxycycline — la prophylaxie reste indispensable car le paludisme aggrave les complications gravidiques."},E:{v:false,t:"FAUX. La doxycycline ne s'associe PAS à la méfloquine pour la chimioprophylaxie. Mécanisme : les chimioprophylaxies antipaludiques sont des MONOTHÉRAPIES — on choisit une molécule selon les facteurs (zone, durée du séjour, CI, terrain) et on la prend en monothérapie. L'association de deux antipaludiques en prophylaxie n'a pas d'indication, expose à des effets indésirables cumulés et à un coût inutile. Les associations existent pour le TRAITEMENT du paludisme (atovaquone-proguanil, artéméther-luméfantrine), pas pour la prophylaxie. Contre-exemple : pour le TRAITEMENT d'un accès palustre à P. falciparum non compliqué, l'association artéméther-luméfantrine (Riamet) est au contraire la référence — bithérapie pour limiter l'émergence de résistances."}}
      },
      {
        id:"177-20",type:"QRM",
        stem:"Une femme de 82 ans, grabataire et démente, est hospitalisée pour une diarrhée profuse. La recherche de toxines A et B de Clostridioides difficile dans les selles est positive. Elle occupe une chambre double. Parmi les propositions suivantes concernant la prévention de la transmission croisée, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Une friction hydro-alcoolique seule est suffisante pour l'hygiène des mains"},{id:"B",text:"Un lavage des mains à l'eau et au savon est requis après tout soin"},{id:"C",text:"Les précautions complémentaires de type « contact » doivent être mises en place"},{id:"D",text:"Une chambre en pression négative est indispensable"},{id:"E",text:"Le port de gants est recommandé dès l'entrée dans la chambre"}],
        correct:["B","C","E"],
        explanations:{A:{v:false,t:"FAUX. Devant un patient en précautions complémentaires CONTACT (suspecté d'infection à Clostridioides difficile), une friction hydro-alcoolique seule N'EST PAS SUFFISANTE. Mécanisme : les solutions hydro-alcooliques (SHA) sont efficaces sur la majorité des bactéries et virus en forme végétative, mais pas sur les SPORES de C. difficile (formes de résistance bactérienne). Le mécanisme physique du lavage à l'eau et au savon (élimination mécanique par friction et rinçage) est requis pour évacuer les spores. C'est une exception majeure aux règles habituelles d'hygiène des mains. Contre-exemple : pour les précautions standard ou les précautions complémentaires de type contact pour SARM, ERV (bactéries hautement résistantes émergentes), la friction hydro-alcoolique reste la méthode de référence — recommandée car plus rapide et plus efficace que le lavage classique sur la flore végétative."},B:{v:true,t:"VRAI. Un lavage des mains à l'eau et au savon est REQUIS après tout soin chez un patient avec suspicion ou diagnostic d'infection à C. difficile. Mécanisme : seul le lavage à l'eau et au savon (durée minimale 30-60 secondes avec friction de toutes les surfaces des mains) permet d'éliminer mécaniquement les spores de C. difficile, résistantes aux SHA. L'enchaînement recommandé est : lavage à l'eau et au savon → rinçage → séchage avec essuie-mains à usage unique → puis éventuellement friction SHA (pour la flore végétative résiduelle). Cette mesure complète les autres mesures d'hygiène (gants, surblouse, désinfection de l'environnement avec produits sporicides type eau de Javel). Contre-exemple : pour un patient avec infection à virus respiratoire (grippe), la friction SHA classique suffit — les virus enveloppés sont efficacement inactivés par l'éthanol."},C:{v:true,t:"VRAI. Les précautions complémentaires de type 'contact' doivent être mises en place pour un patient infecté à C. difficile. Mécanisme : la transmission de C. difficile se fait essentiellement par voie féco-orale via l'environnement contaminé (mains des soignants, surfaces de la chambre, matériel médical). Les précautions contact comprennent : 1) Chambre individuelle (idéalement) ; 2) Port de gants pour tout contact avec le patient ou l'environnement ; 3) Surblouse pour les soins rapprochés ou en cas de contact prolongé ; 4) Matériel dédié au patient (stéthoscope, tensiomètre, thermomètre) ; 5) Lavage des mains à l'eau et au savon (comme proposition B) ; 6) Nettoyage de l'environnement avec produits sporicides (eau de Javel, peroxyde d'hydrogène). Levée des précautions : 48h après la fin de la diarrhée. Contre-exemple : pour la grippe ou la coqueluche, ce sont des précautions GOUTTELETTES qui s'appliquent (masque chirurgical, pas SHA seul) — pas les précautions contact."},D:{v:false,t:"FAUX. Une chambre en pression négative n'est pas nécessaire pour C. difficile. Mécanisme : C. difficile se transmet par voie féco-orale (contact direct ou indirect via l'environnement contaminé), pas par voie aérienne. La chambre en pression négative est indispensable pour les précautions complémentaires AIR (tuberculose pulmonaire bacillifère, rougeole, varicelle, zona disséminé chez immunodéprimé, SARS-CoV-2 lors de gestes générateurs d'aérosols) — pour éviter la dissémination des aérosols infectieux dans l'environnement. Pour C. difficile, une chambre individuelle classique suffit. Contre-exemple : pour un patient avec tuberculose pulmonaire à examen direct positif sur expectoration, la chambre en pression négative serait au contraire INDISPENSABLE pour protéger les autres patients et le personnel — précautions AIR strictes avec masque FFP2."},E:{v:true,t:"VRAI. Le port de gants est recommandé dès l'entrée dans la chambre du patient infecté à C. difficile. Mécanisme : les gants protègent les mains du soignant de la contamination directe par les spores. Ils doivent être : 1) Mis avant l'entrée dans la chambre ; 2) Retirés dans la chambre avant la sortie ; 3) Suivis d'un lavage des mains à l'eau et au savon (les gants ne dispensent pas de l'hygiène des mains — peuvent percer ou être contaminés à la dépose). L'association gants + lavage à l'eau et au savon réduit significativement la transmission de C. difficile dans les services hospitaliers. Contre-exemple : pour les précautions standard (toute prise en charge en milieu hospitalier), les gants ne sont indiqués qu'en cas de contact avec sang, liquides biologiques, muqueuses ou peau lésée — pas systématiquement à l'entrée dans la chambre."}}
      },
      {
        id:"177-21",type:"QCU",
        stem:"Une femme de 28 ans, sans antécédent médical, consulte en médecine générale pour des brûlures mictionnelles et une pollakiurie depuis 24 heures. Elle n'a pas de fièvre. Elle n'a pas de douleur lombaire. Sa contraception est par pilule oestroprogestative. La bandelette urinaire réalisée au cabinet est positive pour leucocytes et nitrites. Que prescrivez-vous en première intention ? (une seule réponse attendue)",
        choices:[{id:"A",text:"Amoxicilline-acide clavulanique per os"},{id:"B",text:"Fosfomycine trométamol monodose"},{id:"C",text:"Pivmécillinam per os 5 jours"},{id:"D",text:"Ciprofloxacine per os"},{id:"E",text:"Ceftriaxone IV"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. L'amoxicilline-acide clavulanique per os n'est pas le traitement de première intention de la cystite aiguë simple chez la femme jeune. Mécanisme : 1) Activité sur ~70-80% des E. coli communautaires — fiable mais pas optimal en probabiliste pour cette indication ; 2) Effets indésirables digestifs (diarrhée, troubles intestinaux) fréquents ; 3) Spectre large pouvant perturber le microbiote vaginal et intestinal ; 4) Le bon usage des antibiotiques privilégie des molécules à spectre étroit pour les infections urinaires basses simples. L'AAC reste cependant une option en deuxième ou troisième intention. Contre-exemple : pour une pyélonéphrite aiguë non compliquée chez la même patiente, l'amoxicilline-acide clavulanique deviendrait une option ambulatoire acceptable — la situation est différente, justifiant un spectre plus large."},B:{v:true,t:"VRAI. La fosfomycine trométamol monodose (3 g per os) est le traitement de PREMIÈRE INTENTION de la cystite aiguë simple chez la femme jeune sans facteur de risque. Mécanisme : 1) Excellente activité sur E. coli (95% de sensibilité, y compris la plupart des EBLSE) et sur Staphylococcus saprophyticus (germe fréquent chez la femme jeune) ; 2) Concentration urinaire très élevée et prolongée (concentrations supra-inhibitrices pendant > 48h) ; 3) Monodose = excellente observance, simplicité ; 4) Très peu d'effets indésirables (troubles digestifs mineurs occasionnels) ; 5) Spectre étroit limitant l'impact écologique. Recommandation officielle française (SPILF, HAS) en première intention. Contre-exemple : pour une cystite chez la femme enceinte, le pivmécillinam est privilégié — la fosfomycine est utilisable mais moins de données chez la femme enceinte, et le pivmécillinam est mieux étudié dans cette indication."},C:{v:false,t:"FAUX. Le pivmécillinam (Selexid®) per os pendant 5 jours est une alternative de DEUXIÈME intention à la fosfomycine pour la cystite aiguë simple, mais pas le traitement de première intention. Mécanisme : 1) Pénicilline du groupe des amidinopénicillines (mécanisme original — affinité pour la PLP2), activité sur E. coli et autres entérobactéries ; 2) Posologie : 400 mg x3/j pendant 5 jours ; 3) Excellente diffusion urinaire ; 4) Indication particulièrement intéressante chez la femme enceinte (alternative plus sûre que les fluoroquinolones et cotrimoxazole CI au 1er trimestre). C'est une excellente option en cas de CI ou intolérance à la fosfomycine. Contre-exemple : pour une cystite aiguë chez la femme enceinte au 1er trimestre, le pivmécillinam deviendrait au contraire le traitement de référence — la fosfomycine reste utilisable mais le pivmécillinam est mieux étudié."},D:{v:false,t:"FAUX. La ciprofloxacine per os n'est PAS le traitement de première intention de la cystite aiguë simple. Mécanisme : la SPILF (2017, recommandations actualisées) recommande de RÉSERVER les fluoroquinolones aux infections urinaires hautes (PNA, prostatite) et aux situations où il n'y a pas d'autre alternative. Raisons : 1) Effets indésirables potentiellement graves (tendinopathies, neuropsychiques, allongement QT) ; 2) Spectre large favorisant les résistances ; 3) Émergence de souches résistantes en lien avec usage massif antérieur. L'utilisation pour cystite simple est jugée disproportionnée. Contre-exemple : pour une pyélonéphrite aiguë non compliquée avec contre-indication aux C3G, la ciprofloxacine per os deviendrait une option valable — diffusion rénale excellente et adaptation à l'urgence."},E:{v:false,t:"FAUX. La ceftriaxone IV n'est pas le traitement de la cystite aiguë simple. Mécanisme : 1) Voie IV non justifiée pour une infection urinaire basse sans signe de gravité ; 2) Spectre trop large pour une indication aussi simple ; 3) Coût et lourdeur du traitement (consultation infirmière à domicile ou hospitalisation) ; 4) Effets indésirables (allergie, troubles digestifs, biliaire avec sludge à fortes doses). La voie IV avec ceftriaxone est réservée aux pyélonéphrites avec signes de gravité ou aux situations particulières (allergie, EBLSE). Contre-exemple : pour une pyélonéphrite aiguë chez une femme enceinte (CI fluoroquinolones), la ceftriaxone IV serait au contraire le traitement de référence — diffusion urinaire excellente, sécurité fœtale."}}
      },
      {
        id:"177-22",type:"QRM",
        stem:"Un patient de 48 ans porteur d'une prothèse valvulaire mitrale mécanique, anticoagulé par acénocoumarol, consulte son chirurgien-dentiste pour une extraction de la dent 46. Il n'a aucune allergie médicamenteuse connue. Parmi les propositions suivantes concernant la prophylaxie de l'endocardite infectieuse, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Ce patient est à haut risque d'endocardite infectieuse"},{id:"B",text:"Une prophylaxie antibiotique est indiquée avant ce geste"},{id:"C",text:"L'amoxicilline 2 g per os 30 à 60 minutes avant le geste est le traitement de référence"},{id:"D",text:"La prophylaxie est contre-indiquée en présence d'un traitement anticoagulant"},{id:"E",text:"La prophylaxie antibiotique est indiquée pour tous les gestes dentaires y compris la radiographie"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. Ce patient est à HAUT RISQUE d'endocardite infectieuse (EI). Mécanisme : les patients à haut risque d'EI (selon ESC 2015, HAS 2021) sont ceux porteurs de : 1) Prothèse valvulaire (mécanique ou bioprothèse, y compris transcatheter) ; 2) Antécédent personnel d'endocardite infectieuse ; 3) Cardiopathie congénitale cyanogène non opérée ou opérée avec dérivation palliative ; 4) Cardiopathie congénitale opérée avec matériel prothétique dans les 6 premiers mois post-opératoires ; 5) Réparation cardiaque congénitale avec défaut résiduel adjacent à un matériel prothétique. Chez ces patients, l'antibioprophylaxie est recommandée avant certains gestes invasifs (essentiellement dentaires à risque hémorragique). Contre-exemple : un patient avec prolapsus de la valve mitrale sans insuffisance significative serait à risque intermédiaire — l'antibioprophylaxie ne lui serait PAS recommandée selon les recommandations actuelles, qui ont restreint les indications par rapport aux anciennes (avant 2009)."},B:{v:true,t:"VRAI. Une antibioprophylaxie est indiquée avant ce geste dentaire à risque hémorragique chez ce patient à haut risque d'EI. Mécanisme : les gestes dentaires à risque hémorragique (extraction dentaire, soins parodontaux profonds, implant) provoquent une bactériémie transitoire par streptocoques de la flore buccale (Streptococcus viridans, S. mitis, S. sanguinis, etc.). Chez les patients à haut risque d'EI, cette bactériémie peut coloniser une végétation valvulaire et déclencher une endocardite. L'antibioprophylaxie réduit la bactériémie post-geste et donc le risque infectieux. Recommandation : administration unique 30-60 minutes avant le geste. Contre-exemple : pour un détartrage dentaire simple sans saignement chez le même patient, l'antibioprophylaxie n'est plus recommandée selon les recommandations actuelles — gestes peu invasifs sont sortis des indications."},C:{v:true,t:"VRAI. L'amoxicilline 2 g per os 30 à 60 minutes avant le geste est le traitement de référence de l'antibioprophylaxie de l'endocardite avant geste dentaire. Mécanisme : l'amoxicilline a une excellente activité sur les streptocoques de la flore buccale (Streptococcus viridans), une bonne biodisponibilité orale, et un délai d'action rapide après prise orale. Posologie : 2 g chez l'adulte (50 mg/kg chez l'enfant) en monodose 30-60 minutes avant le geste. Alternative en cas d'allergie : clindamycine 600 mg per os (15 mg/kg chez l'enfant). Pas de seconde dose. Contre-exemple : si le patient avait été hospitalisé sous antibiothérapie au long cours (par exemple sous prophylaxie de réinfection rhumatismale par phénoxyméthylpénicilline), une autre molécule serait à utiliser pour la prophylaxie EI — la clindamycine étant la plus simple alternative."},D:{v:false,t:"FAUX. L'antibioprophylaxie n'est PAS contre-indiquée en présence d'un traitement anticoagulant. Mécanisme : l'AVK (warfarine, fluindione, acénocoumarol) et les AOD (rivaroxaban, apixaban, dabigatran) n'interagissent pas significativement avec l'amoxicilline en prise unique de 2 g — pas d'effet sur l'INR pour les AVK ou sur les concentrations des AOD. Ces patients sous anticoagulants à haut risque d'EI nécessitent souvent les deux mesures simultanément (anticoagulant pour leur pathologie cardiaque + antibioprophylaxie pour prévenir l'EI). La gestion peri-procédurale de l'anticoagulation est un autre sujet (pause éventuelle selon INR cible, relais HBPM). Contre-exemple : si le patient avait été sous AVK avec INR > 3.5, le geste dentaire à risque hémorragique devrait être différé pour réduire l'INR à la cible thérapeutique (2-3) — c'est l'anticoagulation excessive qui contre-indique le geste, pas l'antibioprophylaxie."},E:{v:false,t:"FAUX. L'antibioprophylaxie n'est PAS indiquée pour TOUS les gestes dentaires. Mécanisme : seuls les gestes dentaires À RISQUE HÉMORRAGIQUE nécessitent l'antibioprophylaxie chez les patients à haut risque d'EI : extraction dentaire, chirurgie parodontale, implantologie, manipulation gingivale, traitement endodontique avec instrumentation au-delà de l'apex. Sont EXCLUS : radiographie dentaire (aucun risque infectieux), anesthésie locale (sans manipulation gingivale), retrait de fils de suture, pose de prothèse dentaire amovible, fluoration topique, prise d'empreinte. Cette distinction est essentielle pour ne pas sur-prescrire d'antibiotique. Contre-exemple : un soin conservateur simple (carie sans extraction) chez ce patient ne nécessiterait PAS d'antibioprophylaxie — risque hémorragique faible et bactériémie négligeable."}}
      },
      {
        id:"177-23",type:"QRM",
        stem:"Un nouveau-né est prématuré à 32 semaines d'aménorrhée, pèse 1 650 g. À 48 heures de vie, il présente un ictère avec bilirubinémie totale à 192 µmol/L. Une infection bactérienne précoce est suspectée. Le néonatologiste discute du choix antibiotique. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La ceftriaxone est déconseillée chez ce prématuré présentant un ictère"},{id:"B",text:"La ceftriaxone est contre-indiquée chez tous les nouveau-nés de moins de 28 jours"},{id:"C",text:"L'élimination biliaire de la ceftriaxone expose au risque de déplacement de la bilirubine de l'albumine"},{id:"D",text:"Le céfotaxime est une alternative adaptée à la place de la ceftriaxone dans cette situation"},{id:"E",text:"Ce risque est spécifique à la prématurité et ne s'applique pas en cas d'ictère chez un nouveau-né à terme"}],
        correct:["A","C","D"],
        explanations:{A:{v:true,t:"VRAI. La ceftriaxone est déconseillée chez ce prématuré présentant un ictère. Mécanisme : la ceftriaxone, par sa forte liaison à l'albumine, entre en compétition avec la bilirubine non conjuguée pour les sites de liaison à l'albumine sérique. Conséquence : déplacement de la bilirubine, augmentation de la fraction libre, augmentation du risque d'ICTÈRE NUCLÉAIRE (encéphalopathie bilirubinique avec atteinte irréversible des noyaux gris centraux). Risque particulièrement élevé chez : prématurés (immaturité hépatique, albuminémie basse), nouveau-nés ictériques, nourrissons à risque d'hyperbilirubinémie. C'est une CI relative qui justifie le recours au céfotaxime, qui ne présente pas ce problème. Contre-exemple : chez un nouveau-né à terme sans ictère et albuminémie normale, la ceftriaxone peut être utilisée avec précaution si l'indication est forte — toutefois le céfotaxime reste préféré en pédiatrie néonatale par principe."},B:{v:false,t:"FAUX. La ceftriaxone n'est pas contre-indiquée chez TOUS les nouveau-nés de moins de 28 jours. Mécanisme : la CI est restreinte aux situations à risque : 1) Prématurité avec ictère ; 2) Nouveau-né < 28 jours présentant un ictère ; 3) Nouveau-né recevant simultanément des solutés calciques IV (risque de précipitation calcium-ceftriaxone avec embolies pulmonaires fatales décrites). Un nouveau-né à terme sans ictère et sans solutés calciques peut recevoir de la ceftriaxone si nécessaire, bien que le céfotaxime soit préféré par principe en pédiatrie néonatale. La nuance est importante en pratique. Contre-exemple : si le nouveau-né est à terme, sans ictère, sans solutés calciques IV et nécessite une C3G pour une infection grave, la ceftriaxone peut être utilisée — le céfotaxime restant préféré par habitude."},C:{v:true,t:"VRAI. L'élimination biliaire de la ceftriaxone est associée à un risque de déplacement de la bilirubine de l'albumine — confirme le mécanisme de la proposition A. Mécanisme : la ceftriaxone se lie à 85-95% à l'albumine sérique et utilise pour son élimination la voie biliaire à 40-60% (conjugaison hépatique partielle, excrétion biliaire). Cette liaison forte entre en compétition avec la bilirubine non conjuguée pour les sites de liaison à l'albumine. Conséquence : augmentation de la bilirubine libre non liée, capable de traverser la barrière hématoencéphalique et de se déposer dans les noyaux gris centraux (ictère nucléaire ou kernicterus). C'est pourquoi la ceftriaxone est déconseillée chez le prématuré ictérique et le nouveau-né < 28 jours présentant un ictère. Contre-exemple : la cefotaxime a une élimination essentiellement rénale et n'a pas cette interaction avec la bilirubine — c'est l'alternative recommandée."},D:{v:true,t:"VRAI. Le céfotaxime est une alternative adaptée à la place de la ceftriaxone dans cette situation. Mécanisme : le céfotaxime est une C3G de la même classe que la ceftriaxone, avec spectre antibactérien équivalent (pneumocoque, méningocoque, Haemophilus, entérobactéries). Différences pharmacologiques importantes : 1) Élimination essentiellement rénale (95%) — pas d'élimination biliaire significative ; 2) Liaison à l'albumine plus faible (~40%) — pas de compétition significative avec la bilirubine ; 3) Pas de précipitation avec le calcium IV. C'est l'alternative de choix en pédiatrie néonatale, notamment chez le prématuré ictérique. Posologie : 50-100 mg/kg/j en 2-3 administrations selon l'âge. Contre-exemple : pour un nourrisson de 6 mois avec méningite à pneumocoque, la ceftriaxone est tout à fait acceptable — l'ictère néonatal n'est plus un problème à cet âge."},E:{v:false,t:"FAUX. Le risque n'est PAS spécifique à la prématurité — il s'applique aussi en cas d'ictère chez un nouveau-né à terme. Mécanisme : la prématurité augmente le risque par immaturité hépatique (conjugaison plus lente, albuminémie plus basse). Mais le risque existe également chez le nouveau-né à terme présentant un ictère significatif, par les mêmes mécanismes biochimiques (compétition pour l'albumine). La règle est : éviter la ceftriaxone chez TOUT nouveau-né < 28 jours présentant un ictère significatif, qu'il soit prématuré ou à terme. Contre-exemple : chez un grand prématuré (< 32 SA) sans ictère, le risque de kernicterus est moindre que chez un nouveau-né à terme avec ictère à 250 µmol/L — c'est l'ictère qui est le facteur de risque principal, pas seulement la prématurité."}}
      },
      {
        id:"177-24",type:"QRM",
        stem:"Un homme de 22 ans est hospitalisé pour méningite à Neisseria meningitidis sérogroupe C confirmée par la biologie. Sa petite amie, enceinte de 10 semaines, et son colocataire sont identifiés comme cas contacts proches. Parmi les propositions suivantes concernant l'antibioprophylaxie des cas contacts, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La rifampicine per os est l'antibiotique de référence pour la prophylaxie"},{id:"B",text:"La ciprofloxacine monodose per os est une alternative validée à la rifampicine"},{id:"C",text:"La prophylaxie doit être débutée dans les 24 à 48 heures suivant le diagnostic"},{id:"D",text:"La ciprofloxacine est le traitement de choix chez la petite amie enceinte de 10 semaines"},{id:"E",text:"La prophylaxie est réservée aux sujets ayant partagé un repas avec le cas index"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. La rifampicine per os est l'antibiotique de référence pour l'antibioprophylaxie des contacts de méningococcie invasive. Posologie : adulte 600 mg x2/j pendant 2 jours ; enfant > 1 mois 10 mg/kg x2/j (max 600 mg/dose) pendant 2 jours ; nourrisson < 1 mois 5 mg/kg x2/j pendant 2 jours. Mécanisme : la rifampicine pénètre efficacement dans les sécrétions oro-nasopharyngées et éradique le portage de Neisseria meningitidis en 48 heures. C'est le traitement de référence par défaut. À signaler aux patients : 1) Coloration orange-rouge des urines, larmes, lentilles de contact (réversible) ; 2) Inducteur enzymatique puissant CYP3A4 — diminue l'efficacité des contraceptifs oraux (préservatif obligatoire pendant traitement et 7 jours après), AVK, immunosuppresseurs, antirétroviraux ; 3) Contre-indiquée chez la femme enceinte au 1er trimestre (alternative : ceftriaxone IM). Contre-exemple : pour un contact intime sous tacrolimus pour transplantation rénale, la rifampicine serait contre-indiquée (interaction majeure avec effondrement des concentrations de tacrolimus, risque de rejet de greffe) — la ciprofloxacine ou la ceftriaxone IM seraient préférées."},B:{v:true,t:"VRAI. La ciprofloxacine en monodose per os est une alternative validée à la rifampicine pour l'antibioprophylaxie méningococcique CHEZ L'ADULTE NON ENCEINTE NI ALLAITANTE. Posologie : 500 mg per os en monodose unique chez l'adulte. Mécanisme : la ciprofloxacine éradique le portage rhinopharyngé en monodose. Avantages : 1) Praticité (monodose vs 2 jours de rifampicine) ; 2) Pas d'interactions médicamenteuses majeures avec contraceptifs ; 3) Pas de coloration des liquides corporels. Inconvénients : CI chez la femme enceinte, allaitement (passage dans le lait, atteinte cartilagineuse théorique), enfant < 15 ans (CI relative — risque de toxicité cartilagineuse). Contre-exemple : pour un contact enceinte au 2e trimestre, la ciprofloxacine serait contre-indiquée — la ceftriaxone 250 mg IM monodose serait l'option de choix."},C:{v:true,t:"VRAI. La prophylaxie doit être débutée dans les 24 à 48 heures suivant le diagnostic du cas index, idéalement dans les 10 jours après l'exposition. Mécanisme : 1) Plus la prophylaxie est précoce, plus elle est efficace pour éradiquer le portage rhinopharyngé chez les contacts ; 2) Au-delà de 10 jours après l'exposition, la prophylaxie devient peu utile (le portage s'éteint généralement spontanément, et l'infection se serait déjà déclarée le cas échéant). Coordination avec l'ARS pour l'identification et le suivi des contacts. Cibles : contacts intimes des 10 jours précédant l'hospitalisation du cas index. Contre-exemple : pour un contact identifié 3 semaines après le diagnostic du cas index, la prophylaxie ne serait plus utile (au-delà de la fenêtre de 10 jours) — surveillance clinique pour quelques jours encore au cas où, sans antibioprophylaxie."},D:{v:false,t:"FAUX. La ciprofloxacine n'est PAS le traitement de choix chez la petite amie enceinte de 10 semaines. Mécanisme : les fluoroquinolones sont CONTRE-INDIQUÉES pendant la grossesse en raison du risque toxique sur le développement cartilagineux et tendineux fœtal (risque démontré chez l'animal, théorique chez l'humain mais principe de précaution). Le traitement de choix chez la femme enceinte est la ceftriaxone 250 mg IM en monodose — sécurité démontrée pendant la grossesse à tous les trimestres, efficacité prouvée sur l'éradication du portage. Contre-exemple : pour une contact non enceinte, la ciprofloxacine en monodose serait au contraire l'option pratique de choix — simplicité maximale, pas d'interaction."},E:{v:false,t:"FAUX. La prophylaxie n'est PAS réservée aux sujets ayant partagé un repas avec le cas index. La définition des contacts à risque est plus large : tous les sujets ayant eu, dans les 10 jours précédant l'hospitalisation du cas index, un contact rapproché et prolongé avec lui — cohabitants, partenaires sexuels, baisers profonds, partage de couverts/brosse à dents/cigarette, soignants exposés aux sécrétions oro-pharyngées sans masque, camarades de classe en internat ou de chambre, voisins immédiats en avion long-courrier. Les repas partagés sont une situation à risque parmi d'autres, mais la définition est globalement celle d'une exposition aux sécrétions oro-pharyngées sur durée prolongée. Contre-exemple : si un soignant des urgences avait été en contact étroit avec les sécrétions du patient lors d'une intubation sans masque, il aurait été considéré comme contact à risque et aurait reçu l'antibioprophylaxie au même titre que les cohabitants — l'exposition compte, pas la nature du repas partagé."}}
      },
      {
        id:"177-25",type:"QRM",
        stem:"Un homme de 58 ans, diabétique de type 2 traité par metformine, reçoit depuis 10 jours de la lévofloxacine pour une prostatite chronique documentée. Il consulte pour des douleurs des deux talons apparues à J7, une photosensibilisation cutanée nette et des épisodes de confusion nocturne. L'ECG retrouve un QTc à 492 ms. Parmi les propositions suivantes concernant les effets indésirables des fluoroquinolones, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Les tendinopathies avec risque de rupture tendineuse sont un effet indésirable de classe"},{id:"B",text:"Les troubles neuropsychiques incluant la confusion sont possibles, notamment chez le diabétique"},{id:"C",text:"La phototoxicité impose une protection solaire stricte pendant le traitement"},{id:"D",text:"L'allongement de l'intervalle QT expose au risque de torsades de pointes"},{id:"E",text:"La néphrotoxicité tubulaire directe est l'effet rénal principal des fluoroquinolones"}],
        correct:["A","B","C","D"],
        explanations:{A:{v:true,t:"VRAI. Les tendinopathies avec risque de rupture tendineuse (tendon d'Achille en particulier) sont un effet indésirable de classe des fluoroquinolones. Mécanisme : les fluoroquinolones inhibent la synthèse du collagène tendineux et exercent une cytotoxicité directe sur les tendinoblastes par chélation des ions magnésium (cofacteurs des enzymes de synthèse du collagène). Risque majoré chez : sujet > 60 ans, sportifs intensifs, traitement par corticoïdes concomitants, insuffisance rénale, diabète, antécédent de tendinopathie. Le risque persiste plusieurs semaines à mois après l'arrêt. Conduite à tenir : informer le patient des signes d'alerte (douleur tendineuse, gonflement, sensation d'arrachement), CI au sport intensif pendant et après le traitement. En cas de symptômes, arrêt immédiat et CI à vie aux fluoroquinolones. Contre-exemple : avant prescription chez un coureur de marathon de 65 ans diabétique sous corticoïdes, il faut rechercher activement les facteurs cumulés et discuter d'une alternative thérapeutique non quinolone si possible."},B:{v:true,t:"VRAI. Les troubles neuropsychiques (confusion, agitation, hallucinations, troubles du sommeil, idées suicidaires, convulsions) sont des effets indésirables des fluoroquinolones, particulièrement chez le sujet âgé, le diabétique et l'insuffisant rénal. Mécanisme : les fluoroquinolones traversent la barrière hématoencéphalique et ont une activité GABA-antagoniste — elles inhibent la liaison du GABA à ses récepteurs neuronaux, abaissant le seuil épileptogène et altérant l'équilibre neurotransmetteur central. Chez le diabétique, sont aussi possibles des troubles glycémiques (hypoglycémies surtout, parfois hyperglycémies) qui peuvent contribuer à la confusion. CI absolue chez les épileptiques. Surveillance étroite chez personnes âgées et patients à risque. Contre-exemple : chez un adulte jeune sans antécédent neurologique ni psychiatrique, le risque de troubles neuropsychiques sous fluoroquinolone est faible — la précaution est moindre."},C:{v:true,t:"VRAI. La phototoxicité impose une protection solaire stricte pendant le traitement par fluoroquinolone. Mécanisme : les fluoroquinolones absorbent les UVA et UVB et génèrent des espèces réactives de l'oxygène cutanées, provoquant des réactions phototoxiques de type 'coup de soleil exagéré' (érythème, œdème, brûlure) sur les zones exposées. Particulièrement fréquent avec la lomefloxacine (rare en France) et la sparfloxacine (retirée du marché). Modéré avec la ciprofloxacine et la lévofloxacine. Recommandations : éviter exposition solaire directe, crème solaire indice 50+, vêtements couvrants, chapeau. Le risque persiste plusieurs jours après l'arrêt (demi-vie d'élimination tissulaire). Contre-exemple : pour les autres antibiotiques également photosensibilisants comme les tétracyclines (doxycycline) — même précaution solaire à appliquer."},D:{v:true,t:"VRAI. L'allongement de l'intervalle QT expose au risque de torsades de pointes. Mécanisme : les fluoroquinolones bloquent les canaux potassiques hERG cardiaques, prolongeant la repolarisation ventriculaire et allongeant le QT corrigé (QTc). Risque torsadogène à craindre, particulièrement avec moxifloxacine > lévofloxacine > ciprofloxacine. Facteurs aggravants cumulables : hypokaliémie, hypomagnésémie, bradycardie, IC, IDM récent, QT long congénital, co-prescription d'autres médicaments allongeant le QT (antiarythmiques classe IA et III, neuroleptiques, certains antidépresseurs, ondansétron, macrolides). Surveillance ECG recommandée si facteurs de risque. Contre-exemple : chez un patient avec un QTc à 510 ms sous citalopram, l'introduction de moxifloxacine serait contre-indiquée — risque torsadogène trop élevé, alternative à choisir (par exemple ciprofloxacine, moins à risque, ou autre classe antibiotique)."},E:{v:false,t:"FAUX. La néphrotoxicité tubulaire directe n'est PAS l'effet rénal principal des fluoroquinolones. Mécanisme : les fluoroquinolones ne sont pas des néphrotoxiques directs significatifs. Elles peuvent occasionnellement provoquer : 1) Néphrite tubulo-interstitielle aiguë immuno-allergique (rare) ; 2) Cristallurie (précipitation médicamenteuse alcaline) si urines alcalines et concentrations élevées. Mais ces effets sont marginaux et bien moins fréquents que la néphrotoxicité tubulaire des aminosides, du cidofovir ou des produits de contraste iodés. L'effet indésirable principal des fluoroquinolones est tendineux, neuropsychique et cardiaque (QT), pas rénal. Contre-exemple : les aminosides (gentamicine, amikacine) sont au contraire des néphrotoxiques tubulaires directs majeurs — accumulation dans les cellules tubulaires proximales avec nécrose tubulaire aiguë typique."}}
      },
      {
        id:"177-26",type:"QRM",
        stem:"Un interne de garde vous présente plusieurs patients pour validation de ses prescriptions de ceftriaxone IV. Parmi les situations cliniques suivantes, laquelle ou lesquelles constitue ou constituent une indication validée des céphalosporines de 3e génération injectables ?",
        choices:[{id:"A",text:"Homme de 23 ans, purpura pétéchial fébrile avec extension rapide des lésions en moins d'une heure"},{id:"B",text:"Patient de 55 ans, sepsis sur obstacle urologique, ECBU positif à Klebsiella pneumoniae"},{id:"C",text:"Homme de 40 ans, maladie de Lyme avec paralysie faciale périphérique isolée confirmée"},{id:"D",text:"Femme de 30 ans, cystite aiguë simple, apyrétique, bandelette positive, aucun signe de gravité"},{id:"E",text:"Enfant de 7 ans, J5 d'une chimiothérapie, fièvre à 39,5°C, polynucléaires neutrophiles à 0,12 G/L"}],
        correct:["A","B","C","E"],
        explanations:{A:{v:true,t:"VRAI. Un homme de 23 ans avec purpura pétéchial fébrile et extension rapide en moins d'une heure correspond à un PURPURA FULMINANS — méningococcémie probable, urgence vitale absolue. Mécanisme : la combinaison purpura nécrotique fébrile + extension rapide signe Neisseria meningitidis avec sepsis et CIVD. Mortalité majeure si retard à l'antibiothérapie (10% de mortalité par heure de retard). Conduite à tenir IMMÉDIATE : ceftriaxone 1 g IM ou IV sur place, sans aucun examen préalable, puis appel du 15 pour transfert médicalisé en réanimation. Cette situation est l'archétype de l'urgence où l'antibiotique précède tous les autres gestes. Contre-exemple : un purpura vasculaire isolé sans fièvre ni signes systémiques chez un adulte (rhumatoïde, lupus, capillarites cutanées) ne serait pas une urgence à antibiothérapie immédiate — étiologie auto-immune, prise en charge totalement différente."},B:{v:true,t:"VRAI. Un patient de 55 ans avec sepsis sur obstacle urologique et ECBU positif à Klebsiella pneumoniae nécessite une antibiothérapie IV IMMÉDIATE. Mécanisme : sepsis = urgence vitale ; obstacle urologique = aggravation par défaut de drainage ; Klebsiella pneumoniae = souvent productrice de bêta-lactamases (résistance à l'amoxicilline, parfois EBLSE). Conduite à tenir : antibiothérapie probabiliste large spectre IV (C3G + aminoside, ou pipéracilline-tazobactam, ou carbapénème selon facteurs de risque d'EBLSE), drainage urologique en urgence (sonde JJ, néphrostomie percutanée), réanimation hydro-électrolytique. Contre-exemple : pour une cystite simple à Klebsiella chez une femme jeune apyrétique, la voie per os (fosfomycine si sensible, sinon selon antibiogramme) serait suffisante — pas d'urgence vitale, pas d'IV nécessaire."},C:{v:true,t:"VRAI. Un homme de 40 ans avec maladie de Lyme et paralysie faciale périphérique isolée justifie une antibiothérapie. Mécanisme : la neuroborréliose de stade II (atteinte neurologique, dont paralysie faciale périphérique, méningoradiculite, méningite à liquide clair) requiert une antibiothérapie pour : 1) Améliorer la récupération de la paralysie faciale ; 2) Prévenir l'évolution vers un stade tertiaire (acrodermatite chronique atrophiante, atteinte articulaire). Traitement : ceftriaxone IV 2 g/j pendant 14-21 jours OU doxycycline per os 200 mg/j pendant 21 jours. Diagnostic confirmé par sérologie Lyme avec confirmation par Western Blot. Surveillance évolutive de la paralysie faciale. Contre-exemple : une paralysie faciale a frigore (paralysie de Bell idiopathique) ne justifie pas d'antibiothérapie — étiologie virale ou idiopathique probable, traitement par corticoïdes oraux brève durée (prednisolone 1 mg/kg/j 7-10 jours)."},D:{v:false,t:"FAUX. Une femme de 30 ans avec cystite aiguë SIMPLE apyrétique sans signe de gravité ne nécessite pas d'antibiothérapie IV ni en urgence — c'est précisément l'indication parfaite de la fosfomycine trométamol monodose per os (3 g en sachet unique). Mécanisme : la cystite simple chez la femme jeune sans facteur de risque ni signe de gravité est une infection urinaire basse banale, traitable en ambulatoire avec un traitement court oral. L'antibiothérapie IV serait disproportionnée. Contre-exemple : devant une cystite chez une femme enceinte avec contractions utérines, on serait dans une situation potentiellement à risque de PNA gravidique — une C3G IV (ceftriaxone) pourrait alors être préférée par sécurité."},E:{v:true,t:"VRAI. Un enfant de 7 ans en J5 de chimiothérapie avec fièvre 39.5°C et PNN à 0.12 G/L correspond à une NEUTROPÉNIE FÉBRILE — urgence vitale. Mécanisme : PNN < 0.5 G/L + fièvre = neutropénie fébrile. Risque de sepsis foudroyant à entérobactéries (Pseudomonas, Klebsiella, E. coli) en quelques heures, mortalité 20-30% si antibiothérapie retardée. Conduite à tenir : hospitalisation immédiate, hémocultures (2 paires) + bilans (NFS, CRP, créatinine, ionogramme, lactates), antibiothérapie probabiliste large spectre IV dans l'heure (pipéracilline-tazobactam ou méropénème + vancomycine si cathéter central ou suspicion d'infection à cocci Gram+). Contre-exemple : pour un enfant immunocompétent de 7 ans avec fièvre virale typique et PNN normaux à 4 G/L, surveillance et symptomatique suffisent — pas d'antibiothérapie nécessaire."}}
      },
      {
        id:"177-27",type:"QRM",
        stem:"Un homme de 62 ans est traité par amikacine IV en association à la pipéracilline-tazobactam pour une pneumonie sévère à bacille Gram négatif documentée. Son DFG de base est à 72 mL/min. L'interne vous demande quels éléments de surveillance sont nécessaires pendant ce traitement. Parmi les propositions suivantes concernant la surveillance d'un patient sous aminoside, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La créatinine et la clairance rénale doivent être dosées régulièrement"},{id:"B",text:"Le dosage de la concentration résiduelle plasmatique est indiqué pour évaluer le risque de toxicité"},{id:"C",text:"Les signes vestibulaires (vertiges, instabilité à la marche) doivent être recherchés"},{id:"D",text:"L'association aux AINS ou à la ciclosporine majore le risque de néphrotoxicité"},{id:"E",text:"Un audiogramme de contrôle est recommandé en cas de traitement prolongé ou d'antécédent de surdité"}],
        correct:["A","B","C","D","E"],
        explanations:{A:{v:true,t:"VRAI. La créatinine et la clairance rénale doivent être dosées régulièrement pendant un traitement par aminoside (gentamicine, amikacine, tobramycine). Mécanisme : les aminosides sont néphrotoxiques par accumulation dans les cellules tubulaires proximales (transport actif par mégaline-cubiline) avec nécrose tubulaire aiguë progressive. Surveillance : créatinine et clairance avant traitement, puis tous les 2-3 jours pour traitements > 5 jours. Une élévation de la créatinine de > 25% par rapport au baseline impose une réévaluation : adaptation posologique (espacement des doses), surveillance des dosages plasmatiques (résiduelle), recherche d'autres néphrotoxiques à arrêter si possible (AINS, ciclosporine, produit de contraste iodé). La néphrotoxicité est généralement réversible à l'arrêt. Contre-exemple : pour un traitement d'antibiotique non néphrotoxique (amoxicilline), la surveillance régulière de la créatinine n'est pas systématique — sauf chez patients à risque (sujets âgés, IRC préexistante)."},B:{v:true,t:"VRAI. Le dosage de la concentration résiduelle plasmatique est indiqué pour évaluer le risque de toxicité des aminosides. Mécanisme : la toxicité rénale et auditive des aminosides est conditionnée par le temps d'exposition aux concentrations sub-thérapeutiques (résiduelle, Cmin). Cibles thérapeutiques pour la gentamicine en DUJ : résiduelle < 1 mg/L (objectif sécurité rénale), pic 16-24 mg/L (efficacité Cmax/CMI > 8). Un dosage avant la prochaine administration (résiduelle) permet d'identifier une accumulation et de retarder ou réduire la prochaine dose. Indiqué systématiquement pour traitements > 5 jours, patients à risque (insuffisant rénal, sujets âgés, traitement prolongé), nourrissons. Contre-exemple : pour les bêta-lactamines (pénicilline, C3G), les dosages plasmatiques ne sont pas systématiques en routine — sauf situations particulières (méningite, endocardite avec souche de sensibilité diminuée)."},C:{v:true,t:"VRAI. Les signes vestibulaires (vertiges, instabilité à la marche, oscillopsie, dysmétrie) doivent être recherchés activement pendant et après un traitement par aminoside. Mécanisme : les aminosides s'accumulent dans les cellules sensorielles vestibulaires et cochléaires, où ils provoquent une apoptose cellulaire irréversible. L'atteinte vestibulaire bilatérale entraîne une instabilité posturale chronique (oscillopsie — flou visuel pendant le mouvement de la tête), un signe de Romberg positif, des difficultés de marche dans l'obscurité. L'atteinte cochléaire entraîne une surdité de perception bilatérale, débutant sur les hautes fréquences. Recherche clinique : interrogatoire ciblé, examen neurologique simple (Romberg, marche les yeux fermés, manœuvres oculomotrices). Audiogramme si traitement prolongé. Contre-exemple : pour les fluoroquinolones, la recherche de signes vestibulaires n'est pas systématique — les effets indésirables principaux sont tendineux et neuropsychiques, pas otovestibulaires."},D:{v:true,t:"VRAI. L'association aux AINS ou à la ciclosporine majore le risque de néphrotoxicité des aminosides. Mécanisme : 1) Les AINS (ibuprofène, kétoprofène, naproxène, célécoxib) inhibent la synthèse des prostaglandines rénales protectrices de la perfusion glomérulaire — vasoconstriction des artérioles afférentes du glomérule, baisse de la perfusion rénale et majoration de la toxicité tubulaire des aminosides ; 2) La ciclosporine (et le tacrolimus) sont eux-mêmes néphrotoxiques par vasoconstriction préglomérulaire — cumul d'agressions rénales. Les autres médicaments à risque cumulé : produits de contraste iodés, amphotéricine B, cisplatine, foscarnet, vancomycine. Règle pratique : éviter l'association des aminosides avec d'autres néphrotoxiques sauf nécessité absolue, et surveillance rapprochée si association inévitable. Contre-exemple : l'association aminoside + bêta-lactamine (amoxicilline, C3G) n'expose pas à une majoration de néphrotoxicité — au contraire, c'est une synergie classique sans risque cumulé rénal."},E:{v:true,t:"VRAI. Un audiogramme de contrôle est recommandé en cas de traitement prolongé ou d'antécédent de surdité. Mécanisme : la toxicité cochléaire des aminosides débute sur les hautes fréquences (8-20 kHz, au-delà de la zone vocale normale 250-8000 Hz). Un audiogramme classique peut donc être encore normal alors qu'une atteinte initiale est en cours. Un audiogramme spécifique aux hautes fréquences (audiogramme étendu) est plus sensible. La surveillance est particulièrement importante chez : traitements > 7 jours, doses cumulées élevées, sujets âgés, insuffisants rénaux, antécédents personnels ou familiaux de surdité (mutation m.1555A>G augmentant la susceptibilité aux aminosides à 1/200 sujets). Au moindre symptôme (acouphène, baisse d'audition), arrêt et audiogramme. Contre-exemple : pour un traitement court par aminoside (3-5 jours en synergie sur endocardite à entérocoque par exemple) chez un patient jeune sans antécédent ORL, l'audiogramme systématique n'est pas obligatoire — surveillance clinique seule peut suffire."}}
      }
    ]
  }

  {
    id:"151",label:"Item 151",title:"Méningites / Méningoencéphalites / Abcès cérébral",subtitle:"Adulte, enfant, nouveau-né",
    questions:[
      {
        id:"151-dp01",type:"QCU",isDp:true,
        vignette:"Un homme de 66 ans, traité par méthotrexate 15 mg/semaine pour une polyarthrite rhumatoïde, est hospitalisé pour une fièvre à 38,7°C évoluant progressivement depuis 4 jours, associée à des céphalées intenses et une confusion apparue le matin même. À l'examen : raideur de nuque franche, diplopie binoculaire horizontale (atteinte du VI gauche), dysphagie aux liquides et instabilité à la marche. Pression artérielle : 126/74 mmHg. Fréquence cardiaque : 91/min. Score de Glasgow : 13. Pas de purpura. Pas de lésion cutanée infectée au site potentiel de ponction.",
        stem:"Quel germe évoquez-vous en priorité devant ce tableau de rhombencéphalite chez un patient immunodéprimé ?",
        choices:[{id:"A",text:"Neisseria meningitidis"},{id:"B",text:"Streptococcus pneumoniae"},{id:"C",text:"Listeria monocytogenes"},{id:"D",text:"Haemophilus influenzae"},{id:"E",text:"Herpes simplex virus 1"}],
        correct:["C"],
