        explanations:{A:{v:true,t:"VRAI. Un LCS trouble (purulent à l'œil nu) impose la dexaméthasone immédiatement, avant ou avec la première dose d'antibiotique. Mécanisme : un LCS trouble traduit une pléiocytose massive (> 1000 leucocytes/mm³ avec prédominance neutrophile) hautement évocatrice de méningite bactérienne. La dexaméthasone (10 mg toutes les 6h pendant 4 jours) module la réaction inflammatoire méningée intense qui suit la lyse bactérienne sous antibiothérapie. Elle réduit la mortalité de 6% (étude de Beek, NEJM 2002) et le risque de séquelles auditives de 50% dans la méningite à pneumocoque de l'adulte. L'administration doit être préalable ou simultanée à la C3G pour bloquer le pic inflammatoire post-lyse bactérienne. Contre-exemple : si la dexaméthasone était administrée 6 heures après l'antibiothérapie (après le pic inflammatoire), son efficacité serait nulle voire péjorative — la fenêtre thérapeutique est étroite."},B:{v:true,t:"VRAI. Un examen direct positif à cocci à Gram positif (pneumocoque le plus probable) est l'indication la mieux validée de la dexaméthasone. Mécanisme : c'est dans la méningite à pneumocoque que la dexaméthasone a démontré son efficacité avec le plus haut niveau de preuve. Le pneumocoque, par sa paroi épaisse riche en peptidoglycane et acide téichoïque, déclenche une réponse inflammatoire particulièrement intense lors de sa lyse par les bêta-lactamines. C'est cette inflammation explosive qui cause l'œdème cérébral, l'HIC et la destruction des cellules ciliées labyrinthiques responsable de la surdité séquellaire. Contre-exemple : si l'examen direct avait montré des cocci Gram + en chaînettes (streptocoque non pneumococcique), la dexaméthasone aurait également été indiquée par extrapolation."},C:{v:true,t:"VRAI. Un examen direct positif à cocci à Gram négatif (méningocoque probable) est aussi une indication de dexaméthasone. Mécanisme : bien que les preuves d'efficacité soient moins solides dans la méningococcie que dans la pneumococcie, les recommandations françaises (SPILF) maintiennent l'indication de dexaméthasone en cas d'ED positif quelle que soit la morphologie bactérienne. La logique est anti-inflammatoire et préventive des séquelles neurologiques. Note importante : dans le purpura fulminans avec méningite, la dexaméthasone à dose méningée peut être utilisée mais avec surveillance des effets sur l'évolution du choc septique (potentiel risque cardiovasculaire en début d'évolution). Contre-exemple : dans une méningococcie sans méningite associée (sepsis pur sans atteinte du LCS confirmée), la dexaméthasone à dose méningée ne serait pas indiquée — l'hydrocortisone à dose substitutive pourrait l'être en cas de choc réfractaire."},D:{v:false,t:"FAUX. Un LCS clair avec lymphocytose et normoglycorrachie oriente vers une méningite virale (entérovirus, oreillons, HSV2 méningé, VZV). La dexaméthasone n'est PAS indiquée et serait même contre-productive : 1) Pas d'efficacité démontrée dans les méningites virales ; 2) Risque d'aggraver une éventuelle co-infection ou de masquer une étiologie atypique ; 3) Effets indésirables des corticoïdes (hyperglycémie, immunosuppression secondaire, troubles psychiatriques). La méningite virale se traite symptomatiquement (antalgiques, antiémétiques, surveillance). Contre-exemple : si l'étiologie virale s'avérait être une méningoencéphalite herpétique sévère, l'aciclovir IV serait débuté immédiatement — toujours sans dexaméthasone (qui n'a pas d'AMM ni de bénéfice démontré dans HSV)."},E:{v:true,t:"VRAI. En cas de CI neurologique à la PL d'emblée (signes de focalisation, Glasgow < 12, signes de souffrance tronculaire), la dexaméthasone est administrée empiriquement avec l'antibiothérapie sans attendre le résultat du LCS (car PL différée). Mécanisme : on présume une méningite bactérienne devant un syndrome méningé fébrile avec CI à la PL ; le bénéfice attendu de la dexaméthasone justifie son administration empirique. La dexaméthasone sera maintenue 4 jours puis réévaluée selon les résultats microbiologiques différés (si méningite virale finalement, arrêt ; si bactérienne confirmée, poursuite jusqu'à 4 jours total). Contre-exemple : si la suspicion clinique avait été une méningite virale (LCS clair anticipé, contexte épidémique d'entérovirus, pas de signes de gravité), la dexaméthasone n'aurait pas été indiquée même en cas de CI temporaire à la PL."}}
      },
      {
        id:"151-qi05",type:"QCU",
        stem:"Un homme de 38 ans est traité depuis 48 heures par céfotaxime IV pour une méningite bactérienne. L'antibiogramme est disponible : Streptococcus pneumoniae, sensible à la pénicilline G (CMI oxacilline disc ≥ 5 mm, CMI pénicilline G < 0,064 mg/L), sensible à toutes les bêtalactamines testées. L'évolution clinique est favorable à J2. Quel traitement prescrivez-vous à partir de ce résultat ?",
        choices:[{id:"A",text:"Maintien du céfotaxime aux mêmes doses jusqu'à la fin du traitement"},{id:"B",text:"Ajout de vancomycine au céfotaxime"},{id:"C",text:"Désescalade vers l'amoxicilline IV à forte dose"},{id:"D",text:"Relais per os par amoxicilline-acide clavulanique"},{id:"E",text:"Maintien du céfotaxime et ajout de rifampicine en synergie"}],
        correct:["C"],
        explanations:{A:{v:false,t:"FAUX. Le maintien du céfotaxime aux mêmes doses jusqu'à la fin du traitement n'est pas optimal en termes de bon usage des antibiotiques. Mécanisme : la désescalade antibiotique est un principe fondamental dès qu'une documentation microbiologique le permet — réduire le spectre antibactérien pour limiter la sélection de résistances et préserver l'écologie hospitalière. Le céfotaxime, C3G à large spectre, est nécessaire en probabiliste mais peut être remplacé par une molécule plus étroite et moins écologiquement coûteuse une fois le germe identifié et sensible. Maintenir le céfotaxime sans nécessité expose aux effets indésirables (allergie, troubles digestifs) et augmente le coût. Contre-exemple : si l'antibiogramme avait montré un pneumocoque de sensibilité diminuée à la pénicilline (CMI pénicilline G > 0.5 mg/L), le maintien du céfotaxime aurait été indispensable car l'amoxicilline serait inefficace."},B:{v:false,t:"FAUX. L'ajout de vancomycine au céfotaxime n'a aucune justification dans cette situation. La souche est sensible à toutes les bêta-lactamines (incluant pénicilline G, amoxicilline, céfotaxime, ceftriaxone). Mécanisme : la vancomycine est indiquée dans les méningites à pneumocoque uniquement en cas de pneumocoque de haut niveau de résistance aux C3G (CMI ceftriaxone > 0.5 mg/L), situation devenue exceptionnelle en France (< 1% des souches). Ajouter de la vancomycine ici exposerait à des effets indésirables (toxicité rénale, red man syndrome) sans aucun bénéfice antibactérien. Contre-exemple : si le pneumocoque avait été de sensibilité diminuée à toutes les bêta-lactamines (PSDP avec CMI ceftriaxone > 0.5 mg/L, situation très rare nécessitant un séjour à l'étranger), la vancomycine aurait été ajoutée au céfotaxime en attendant l'évaluation de la sensibilité au céfépime ou au méropénème."},C:{v:true,t:"VRAI. La désescalade vers l'amoxicilline IV à forte dose (200 mg/kg/j en 4 à 6 administrations ou perfusion continue) est la stratégie recommandée pour un pneumocoque sensible à la pénicilline. Mécanisme : 1) L'amoxicilline IV à forte dose obtient des concentrations méningées suffisantes (passage BHM amélioré par l'inflammation méningée) ; 2) Elle a un spectre plus étroit que le céfotaxime — limite la sélection de résistances ; 3) Coût moindre ; 4) Elle est mieux tolérée à long terme (moins de risque de cholestase qu'avec la ceftriaxone). C'est l'application directe du principe de désescalade dès documentation microbiologique. Durée totale du traitement : 10 à 14 jours en cas de pneumocoque sensible. Contre-exemple : si le pneumocoque avait été de sensibilité diminuée à la pénicilline (CMI pénicilline G > 0.064 mg/L), la désescalade vers l'amoxicilline n'aurait pas été possible — maintien obligatoire du céfotaxime."},D:{v:false,t:"FAUX. Le relais per os par amoxicilline-acide clavulanique n'est pas adapté à la méningite bactérienne pour deux raisons : 1) La voie per os ne permet pas d'atteindre des concentrations méningées bactéricides suffisantes (faible biodisponibilité méningée des bêta-lactamines per os) ; 2) L'acide clavulanique (inhibiteur de bêta-lactamase) n'apporte rien sur un pneumocoque qui ne produit pas de bêta-lactamase. Le traitement de la méningite bactérienne reste IV pendant toute la durée. Contre-exemple : pour une otite moyenne aiguë à pneumocoque chez l'enfant, l'amoxicilline-clavulanique per os serait au contraire un traitement de référence — le contexte tissulaire est différent."},E:{v:false,t:"FAUX. L'ajout de rifampicine au céfotaxime n'a pas de bénéfice démontré dans la méningite à pneumocoque sensible. Mécanisme : la rifampicine a une excellente diffusion méningée et une activité sur le pneumocoque, mais son association avec une bêta-lactamine ne fait pas la preuve d'une supériorité en cas de pneumocoque sensible. Elle peut être discutée dans les cas de méningite à pneumocoque de très haute résistance (synergie potentielle avec la vancomycine ou avec la C3G) ou dans certains abcès cérébraux à staphylocoque, mais pas en routine pour un pneumocoque sensible. Contre-exemple : dans une endocardite à staphylocoque doré méticillino-sensible sur valve prothétique, l'ajout de rifampicine à la cloxacilline est en revanche une recommandation forte pour potentialiser l'action bactéricide."}}
      },
      {
        id:"151-qi06",type:"QRM",
        stem:"Un homme de 52 ans est hospitalisé pour fièvre à 38,5°C, céphalées intenses, confusion et une crise convulsive tonico-clonique survenue 2 heures avant l'admission. L'examen retrouve un syndrome méningé, des troubles mnésiques récents et des hallucinations olfactives. La PL montre un LCS clair, leucocytes 280/mm³ (85% lymphocytes), protéinorachie 0,9 g/L, glycorachie normale. Concernant la prise en charge immédiate, laquelle ou lesquelles des propositions est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'aciclovir IV doit être débuté immédiatement sans attendre le résultat de l'IRM cérébrale"},{id:"B",text:"L'IRM cérébrale doit être réalisée avant de débuter l'aciclovir afin de confirmer l'atteinte temporale"},{id:"C",text:"La PCR HSV dans le LCS permettra de confirmer le diagnostic"},{id:"D",text:"L'IRM cérébrale retrouvera typiquement un hypersignal T2 des régions temporales internes et insulaires"},{id:"E",text:"Une antibiothérapie probabiliste par C3G doit être débutée d'emblée car le LCS est inflammatoire"}],
        correct:["A","C","D"],
        explanations:{A:{v:true,t:"VRAI. L'aciclovir IV doit être débuté IMMÉDIATEMENT dès la suspicion clinique d'encéphalite herpétique, sans attendre les résultats de l'IRM. Mécanisme : l'encéphalite à HSV est une urgence neurologique majeure — la mortalité non traitée est de 70%, et même traitée elle est de 20-30% avec souvent des séquelles neurocognitives. Chaque heure de retard à l'aciclovir augmente le risque de séquelles. Posologie : 10-15 mg/kg toutes les 8 heures pendant 14 à 21 jours. La fenêtre d'efficacité optimale est de moins de 4-6 jours après le début des symptômes. Devant un tableau évocateur (fièvre, syndrome confusionnel, crises convulsives partielles temporales, hallucinations olfactives), l'aciclovir est débuté immédiatement, en parallèle des prélèvements (LCS avec PCR HSV, hémocultures) et de l'imagerie. Contre-exemple : si le tableau avait été clairement une méningite bactérienne (purpura, LCS trouble à direct positif), l'aciclovir n'aurait pas été indiqué — c'est la C3G qui aurait été immédiate."},B:{v:false,t:"FAUX. L'IRM avant l'aciclovir constitue une faute thérapeutique avec retard à un traitement vital. Mécanisme : l'attente de l'IRM (parfois 1 à 4 heures selon la disponibilité du service de neuroradiologie, parfois plus la nuit) laisse l'infection HSV progresser dans le parenchyme cérébral avec destruction neuronale irréversible. L'IRM est utile au diagnostic (hypersignal T2-FLAIR temporal interne et insulaire) mais ne doit JAMAIS retarder l'aciclovir. La règle stricte est : suspicion clinique → aciclovir IV immédiat → puis imagerie + PL pour PCR HSV. Contre-exemple : devant un infarctus cérébral aigu de moins de 4h30, l'IRM serait au contraire indispensable AVANT thrombolyse — pour confirmer l'ischémie et éliminer l'hémorragie."},C:{v:true,t:"VRAI. La PCR HSV (HSV-1 le plus souvent, HSV-2 dans le contexte de méningite à liquide clair non encéphalitique) dans le LCS est l'examen de confirmation du diagnostic. Mécanisme : la PCR détecte le génome viral dans le LCS avec une sensibilité de 95-100% et une spécificité proche de 100% entre J2 et J10 d'évolution. Avant J2 et après J10, la sensibilité diminue (10-30% de faux négatifs en très précoce ou en très tardif). Si la PCR initiale est négative et la suspicion clinique forte, l'aciclovir est maintenu et la PL est répétée à J3-J5 pour nouvelle PCR. La PCR HSV est devenue le gold standard, remplaçant la biopsie cérébrale réservée aux cas exceptionnels. Contre-exemple : pour le diagnostic d'une rougeole avec encéphalite, ce n'est pas la PCR rougeole LCS qui est utile mais la sérologie avec recherche d'IgM rougeole et augmentation des IgG sur deux prélèvements à 15 jours d'intervalle — chaque agent infectieux a son outil diagnostique propre."},D:{v:true,t:"VRAI. L'IRM cérébrale retrouve un hypersignal T2-FLAIR caractéristique des régions temporales internes (hippocampe, amygdale, gyrus parahippocampique), insulaires et du gyrus cingulaire, typiquement asymétrique (atteinte d'un côté plus marquée que l'autre, sans pour autant être unilatérale stricte). Mécanisme : HSV1 a un tropisme préférentiel pour le système limbique par migration axonale rétrograde depuis le ganglion trigéminé (où il fait une latence chronique). L'atteinte temporale est associée à des hémorragies pétéchiales corticales (signal mixte) et à un œdème vasogénique étendu. L'IRM avec séquence de diffusion peut montrer également une restriction de diffusion dans les zones atteintes en phase aiguë. Contre-exemple : si l'IRM avait montré une atteinte des noyaux gris centraux bilatérale et symétrique avec hypersignal T2, on aurait évoqué une encéphalite à Flavivirus (virus West Nile, virus Japonais) ou une encéphalite démyélinisante post-infectieuse — pas HSV."},E:{v:false,t:"FAUX. Le tableau clinique (confusion, crises convulsives, hallucinations olfactives, troubles mnésiques) avec un LCS clair lymphocytaire normoglycorrachique oriente très fortement vers une encéphalite virale, en premier lieu herpétique. Une méningite bactérienne aurait donné un LCS trouble avec pléiocytose neutrophile, hyperprotéinorachie franche et hypoglycorrachie — totalement absent ici. L'antibiothérapie probabiliste par C3G dans cette situation serait à la fois inutile (pas de bactérie suspectée) et délétère (retard ou compétition de prescription avec l'aciclovir). Contre-exemple : si le LCS avait été à 800 éléments/mm³ avec 60% PN et hyperprotéinorachie à 2 g/L, on aurait été dans une méningite bactérienne probable — la C3G aurait été ajoutée à l'aciclovir en attendant les résultats microbiologiques (couverture des deux étiologies possibles : encéphalite herpétique et méningite bactérienne)."}}
      },
      {
        id:"151-qi07",type:"QRM",
        stem:"Un nourrisson de 8 mois est amené aux urgences pour une fièvre à 39,8°C depuis 12 heures, avec pleurs incessants et refus du biberon. À l'examen : fontanelle antérieure bombante et tendue à la palpation, hypotonie axiale globale, regard fixe. Parmi les propositions suivantes concernant la sémiologie méningée chez le nourrisson, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"La raideur de nuque est typiquement absente ou peu marquée chez le nourrisson de moins de 12 mois"},{id:"B",text:"Le bombement de la fontanelle antérieure est un signe d'hypertension intracrânienne évocateur de méningite"},{id:"C",text:"L'hypotonie axiale peut orienter vers une méningite chez le nourrisson"},{id:"D",text:"La photophobie est le signe cardinal et toujours présent avant l'âge de 1 an"},{id:"E",text:"La raideur de nuque est obligatoire pour poser le diagnostic de méningite chez le nourrisson"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. La raideur de nuque est typiquement absente ou peu marquée chez le nourrisson de moins de 12 mois. Mécanisme : la cause de cette particularité sémiologique est anatomique et neurodéveloppementale — chez le nourrisson, la fontanelle antérieure est encore ouverte et constitue un amortisseur de pression intracrânienne, ce qui réduit la tension méningée et donc la composante méningée du syndrome. De plus, le tonus axial cervical est immature et la coordination musculaire imparfaite. Recourir aux signes de Kernig et Brudzinski (positifs chez l'adulte) est trompeur chez le nourrisson car peu sensibles et difficiles à apprécier. La règle est donc : devant tout nourrisson fébrile avec altération de l'état général, mauvaise tolérance alimentaire ou bombement de fontanelle, on évoque une méningite — PL au moindre doute, indépendamment de la présence ou non de raideur de nuque. Contre-exemple : chez un adolescent ou un adulte, l'absence de raideur de nuque rendrait le diagnostic de méningite bactérienne très improbable — la sémiologie classique étant à ces âges quasi constante."},B:{v:true,t:"VRAI. Le bombement de la fontanelle antérieure est un signe majeur d'hypertension intracrânienne (HIC) chez le nourrisson, évocateur de méningite (ou d'autre cause d'HIC : tumeur, hématome, hydrocéphalie). Mécanisme : la fontanelle antérieure (losangique, à la jonction des sutures sagittale, coronales et métopique) reste ouverte jusqu'à 18-24 mois et constitue une fenêtre clinique sur la pression intracrânienne. Normalement souple et plane, son bombement traduit une HIC. À noter : la position du nourrisson influence l'examen — il faut l'examiner calme, en position assise pour limiter la tension liée aux pleurs. Une fontanelle tendue chez un nourrisson fébrile impose une PL après scanner si signes de focalisation. Contre-exemple : un bombement de fontanelle isolé sans fièvre chez un nourrisson qui pleure intensément peut être physiologique et transitoire — il faut réévaluer au calme avant de conclure à un signe pathologique."},C:{v:true,t:"VRAI. L'hypotonie axiale globale chez un nourrisson fébrile oriente vers une méningite (ou méningoencéphalite). Mécanisme : la sepsis bactérienne et la méningite altèrent l'éveil et le tonus musculaire chez le nourrisson, qui peut paraître 'mou', sans tenue de la tête, sans interaction avec son environnement. Cette hypotonie est généralement associée à d'autres signes : refus du biberon, gémissement plaintif (cri méningé), regard fixe, troubles vasomoteurs (marbrures), parfois convulsions. Au moindre doute, PL après bilan d'imagerie si signes de focalisation. Contre-exemple : une hypotonie axiale isolée et persistante depuis la naissance sans fièvre n'évoque pas une méningite mais des pathologies neuromusculaires congénitales (amyotrophie spinale infantile, myopathies congénitales, maladies métaboliques)."},D:{v:false,t:"FAUX. La photophobie n'est ni constante ni cardinale chez le nourrisson. Premièrement, son évaluation est difficile chez un enfant qui ne verbalise pas. Deuxièmement, elle peut être absente ou trompeuse. Les signes cardinaux du nourrisson sont : altération de l'état général avec mauvaise tolérance alimentaire, fièvre, troubles vasomoteurs (marbrures), bombement de la fontanelle, hypotonie ou irritabilité, et chez le plus grand, possibles vomissements en jet. La photophobie peut être présente mais n'est pas le critère principal. Contre-exemple : la photophobie est en revanche cardinale chez l'enfant plus grand (>3-4 ans) et l'adulte — partie de la triade méningée classique (céphalées, photophobie, raideur de nuque)."},E:{v:false,t:"FAUX. La raideur de nuque n'est PAS obligatoire pour poser le diagnostic de méningite chez le nourrisson — c'est même l'inverse : elle est souvent absente. Considérer la raideur de nuque comme requise conduit à des sous-diagnostics catastrophiques avec retard à la PL. La règle pédiatrique est : devant tout nourrisson fébrile avec un comportement anormal (mauvaise tolérance alimentaire, hypotonie, bombement de fontanelle, troubles de conscience même modérés), PL au moindre doute. Contre-exemple : chez un adolescent ou un adulte jeune, la raideur de nuque devient quasi obligatoire — son absence rend la méningite très improbable et conduit à d'autres diagnostics différentiels (céphalée primaire, fièvre virale non méningée, sinusite, etc.)."}}
      },
      {
        id:"151-qi08",type:"QRM",
        stem:"Une femme de 24 ans est hospitalisée pour méningite à Neisseria meningitidis sérogroupe C confirmée. Son compagnon (26 ans), son colocataire (28 ans) et sa mère (52 ans) sont identifiés comme cas contacts proches. Parmi les mesures suivantes, laquelle ou lesquelles doivent être systématiquement mises en place ?",
        choices:[{id:"A",text:"Déclaration obligatoire nominative à l'Agence Régionale de Santé"},{id:"B",text:"Précautions complémentaires respiratoires de type gouttelettes pendant les 24 premières heures d'antibiothérapie efficace"},{id:"C",text:"Antibioprophylaxie des cas contacts rapprochés par rifampicine ou ciprofloxacine"},{id:"D",text:"Vaccination des contacts par vaccin méningococcique conjugué C"},{id:"E",text:"Isolement du patient en chambre à flux laminaire jusqu'à la guérison"}],
        correct:["A","B","C","D"],
        explanations:{A:{v:true,t:"VRAI. La déclaration obligatoire nominative à l'ARS dans les 24 heures est requise pour toute infection invasive à méningocoque (méningite, méningococcémie, purpura fulminans). Mécanisme : la DO permet la mise en place rapide des mesures de santé publique — identification et antibioprophylaxie des cas contacts, vaccination quand pertinente, surveillance épidémiologique du sérogroupe pour adapter la couverture vaccinale nationale. La déclaration est nominative et urgente (téléphone ou télédéclaration), contrairement à d'autres DO non urgentes. La diffusion d'information au médecin scolaire/professionnel/référent du cas index est essentielle. Contre-exemple : pour une méningite à Listeria, la DO est obligatoire à visée épidémiologique uniquement (surveillance des intoxications alimentaires) — pas pour mettre en place une antibioprophylaxie qui n'existe pas dans cette indication."},B:{v:true,t:"VRAI. Les précautions complémentaires gouttelettes sont à mettre en place dès l'admission et maintenues pendant les 24 premières heures d'antibiothérapie efficace. Mécanisme : Neisseria meningitidis se transmet par gouttelettes oro-nasopharyngées > 5 μm projetées lors de la toux, éternuements, parole. Protection : masque chirurgical pour tout entrant à moins d'un mètre, chambre individuelle si possible, gants pour les soins. La ceftriaxone à dose méningée éradique le portage rhinopharyngé en moins de 24 heures, ce qui justifie la levée des précautions à H+24. Contre-exemple : dans une listériose, aucune précaution complémentaire respiratoire n'est nécessaire — transmission strictement alimentaire."},C:{v:true,t:"VRAI. L'antibioprophylaxie des cas contacts rapprochés est obligatoire dans les méningococcies invasives. Molécules : rifampicine 600 mg x2/j x 2 jours (chez l'adulte non enceinte), ou ciprofloxacine 500 mg monodose (chez l'adulte non enceinte), ou ceftriaxone 250 mg IM monodose (chez la femme enceinte). Cibles : contacts intimes des 10 jours précédant l'hospitalisation du cas index — cohabitants, partenaires sexuels, camarades de chambre, soignants exposés sans masque, etc. Mécanisme : éradiquer le portage rhinopharyngé asymptomatique chez les contacts pour prévenir l'apparition d'une méningococcie secondaire dans les 10 jours suivants. Contre-exemple : pour une méningite à Haemophilus influenzae type b chez l'enfant, l'antibioprophylaxie des contacts (rifampicine) est également recommandée pour les sujets non vaccinés exposés — mais cette pratique a diminué avec la généralisation de la vaccination."},D:{v:true,t:"VRAI. La vaccination méningococcique du sérogroupe en cause (ici C, mais aussi A, Y, W si concerné) est recommandée pour les contacts non antérieurement vaccinés. Mécanisme : la vaccination conjuguée induit une immunité durable (au moins 5 ans) et complète l'effet temporaire de l'antibioprophylaxie. Pour le sérogroupe C : vaccin méningococcique C conjugué. Pour A, C, Y, W : vaccins quadrivalents conjugués (Menveo, Nimenrix). Pour le sérogroupe B : vaccin disponible (Bexsero) mais discuté au cas par cas en situation de contact. La vaccination des contacts complète mais ne remplace pas l'antibioprophylaxie immédiate. Contre-exemple : pour un sérogroupe B sans contexte épidémique particulier, la vaccination Bexsero des contacts n'est pas systématique — l'antibioprophylaxie seule peut suffire."},E:{v:false,t:"FAUX. La chambre à flux laminaire est totalement disproportionnée et n'a pas sa place ici. Elle est réservée aux patients EXTREMEMENT IMMUNODÉPRIMÉS (aplasie chimio-induite avec polynucléaires < 100/mm³, transplantation médullaire en aplasie, immunodéficience combinée sévère) pour LES PROTÉGER des micro-organismes environnementaux. Elle a pour objectif d'éviter les infections, pas d'isoler une infection contagieuse. Pour un patient méningococcique, la chambre individuelle simple avec précautions gouttelettes suffit. Contre-exemple : un patient en aplasie post-allogreffe de moelle avec polynucléaires à 0 et fièvre nécessiterait au contraire la chambre à flux laminaire pour le protéger des aspergillus environnementaux — situation totalement différente."}}
      },
      {
        id:"151-qi09",type:"QRM",
        stem:"Un homme de 43 ans est hospitalisé pour céphalées progressives depuis 3 semaines, fièvre à 38,2°C et hémiparésie droite apparue depuis 48 heures. L'IRM cérébrale montre une lésion arrondie de 3 cm en région frontale gauche, avec un centre nécrotique hyposignal T1, une paroi épaisse réhaussée en anneau après injection de gadolinium, et un œdème périlésionnel en T2. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Ce tableau est évocateur d'un abcès cérébral (image en cocarde)"},{id:"B",text:"Une infection dentaire ou une origine ORL est la porte d'entrée la plus fréquente des abcès cérébraux"},{id:"C",text:"Les streptocoques oraux et les anaérobies sont les principaux germes impliqués dans les abcès d'origine dentaire ou ORL"},{id:"D",text:"Le scanner cérébral est l'examen de référence pour le diagnostic d'abcès cérébral"},{id:"E",text:"L'antibiothérapie seule sans drainage constitue le traitement de référence dans cette situation"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. L'image en cocarde à l'IRM cérébrale (centre nécrotique en hyposignal T1 avec rehaussement annulaire après gadolinium, paroi épaisse régulière de 2-5 mm, œdème périlésionnel important en T2 et FLAIR) est typique d'un abcès cérébral en phase capsulaire. Mécanisme : la lésion débute par une cérébrite (3-15 jours, prise de contraste inhomogène), puis se forme une cavité nécrotique entourée d'une capsule fibreuse de néovaisseaux et de macrophages (capsule formée à partir du 15e jour). C'est cette capsule qui se rehausse de manière annulaire. La diffusion (DWI) est un argument supplémentaire — l'abcès montre une restriction marquée du centre en raison de la viscosité du pus (cf. distinction avec une tumeur nécrotique en cocarde où la diffusion est généralement libre). Contre-exemple : une image en cocarde sans diffusion restreinte, avec une capsule épaisse et irrégulière chez un patient sans fièvre ni syndrome inflammatoire évoquerait plutôt une métastase nécrotique ou un glioblastome — décision thérapeutique radicalement différente (chirurgie d'exérèse + RT + chimio, pas drainage + antibiotique)."},B:{v:true,t:"VRAI. Les infections dentaires (granulome apical, parodontite, abcès dentaire) et ORL (sinusite frontale, ethmoïdite, mastoïdite, otite chronique) sont la première cause d'abcès cérébral chez l'adulte immunocompétent, par contiguïté ou par voie hématogène. Mécanisme : la proximité anatomique entre les sinus paranasaux/cellules mastoïdiennes et la dure-mère permet une propagation infectieuse par thrombophlébite cérébrale septique ou par effraction de la lame criblée. Les abcès frontaux sont caractéristiques des sinusites frontales, les abcès temporo-occipitaux des otites chroniques cholestéatomateuses. Il faut systématiquement rechercher et traiter la porte d'entrée. Contre-exemple : si le patient avait été immunodéprimé (VIH avec CD4 bas, transplantation), les principales étiologies auraient inclus toxoplasmose cérébrale, lymphome cérébral primitif, aspergillose ou nocardiose — autres pathogènes, autres traitements."},C:{v:true,t:"VRAI. Les germes responsables des abcès d'origine dentaire ou ORL sont majoritairement des streptocoques oraux (groupe Milleri : S. anginosus, S. constellatus, S. intermedius) et des anaérobies (Fusobacterium, Bacteroides, Prevotella, Peptostreptococcus). Ces germes sont souvent en infection polymicrobienne. Mécanisme : la flore oropharyngée commensale, naturellement polymicrobienne aérobie/anaérobie, est l'origine de l'inoculum. L'antibiothérapie probabiliste couvre ce spectre : ceftriaxone (couvre streptocoques + entérobactéries) + métronidazole (couvre anaérobies) + parfois vancomycine si suspicion de staphylocoque doré (rare en contexte ORL/dentaire). Contre-exemple : un abcès cérébral hématogène à partir d'une endocardite infectieuse à staphylocoque doré aurait un germe unique (S. aureus) — antibiothérapie ciblée par cloxacilline (ou vancomycine si MRSA)."},D:{v:false,t:"FAUX. C'est l'inverse : l'IRM cérébrale est l'examen de référence pour le diagnostic d'abcès cérébral, supérieure au scanner. Mécanisme : 1) Meilleure résolution spatiale pour les petits abcès (< 1 cm) ; 2) Séquences de diffusion (DWI) qui distinguent l'abcès (restriction de diffusion par viscosité du pus) des tumeurs nécrotiques (diffusion libre) avec une fiabilité de 90% ; 3) Meilleure visualisation de la capsule et de l'œdème périlésionnel ; 4) Possibilité de l'IRM avec spectroscopie pour détecter les acides aminés et lipides typiques d'un abcès ; 5) Excellente exploration des structures profondes (fosse postérieure, tronc cérébral). Le scanner reste utile en première intention pour son accessibilité et la détection des effets de masse, mais l'IRM est l'examen de référence diagnostique. Contre-exemple : pour le suivi d'un abcès cérébral traité avec drainage chirurgical et antibiothérapie, le scanner peut suffire pour la surveillance évolutive régulière, l'IRM étant alors complémentaire en cas de stagnation ou d'aggravation."},E:{v:false,t:"FAUX. L'antibiothérapie seule, sans drainage, n'est pas le traitement de référence des abcès cérébraux > 2.5 cm avec effet de masse ou en pré-rupture. Mécanisme : un abcès volumineux est protégé par sa capsule qui limite la pénétration antibiotique au centre nécrotique ; le drainage chirurgical (par aspiration stéréotaxique ou exérèse selon le cas) permet : 1) Décompression mécanique de l'effet de masse ; 2) Réduction de la charge bactérienne ; 3) Documentation microbiologique précise par culture du pus. L'antibiothérapie seule peut être proposée pour les petits abcès (< 2.5 cm), les abcès multiples non accessibles, ou les abcès profonds à haut risque chirurgical, sous couvert d'une surveillance rapprochée par IRM. Contre-exemple : un abcès cérébral de 1 cm sans effet de masse chez un patient en bon état général pourrait être traité par antibiothérapie IV prolongée seule (6-8 semaines) avec surveillance IRM hebdomadaire les premières semaines."}}
      },
      {
        id:"151-qi10",type:"QRM",
        stem:"Un nouveau-né de 4 jours présente une fièvre à 38,4°C, des apnées et une mauvaise tolérance alimentaire. La ponction lombaire confirme une méningite bactérienne. Parmi les germes suivants, lesquels sont les plus fréquemment impliqués dans les méningites bactériennes néonatales précoces (< 7 jours de vie) ?",
        choices:[{id:"A",text:"Streptococcus agalactiae (streptocoque du groupe B)"},{id:"B",text:"Escherichia coli (notamment souche K1)"},{id:"C",text:"Neisseria meningitidis"},{id:"D",text:"Streptococcus pneumoniae"},{id:"E",text:"Staphylococcus aureus"}],
        correct:["A","B"],
        explanations:{A:{v:true,t:"VRAI. Streptococcus agalactiae (streptocoque du groupe B, SGB) est le germe le plus fréquent des méningites néonatales précoces (<7 jours) en France. Mécanisme : le SGB colonise le tractus génital de 10-30% des femmes enceintes ; la contamination du nouveau-né se fait pendant l'accouchement par voie ascendante après rupture des membranes ou lors du passage de la filière génitale. La prévention repose sur le dépistage systématique par prélèvement vaginal à 35-37 SA et l'antibioprophylaxie peropératoire par pénicilline G ou amoxicilline IV chez la mère porteuse. Malgré ces mesures, le SGB reste responsable de 30-40% des méningites néonatales précoces. Tableau clinique : sepsis sévère, défaillance respiratoire, méningite avec ou sans signes méningés. Antibiothérapie : amoxicilline + gentamicine en synergie pendant 14-21 jours. Contre-exemple : pour une méningite tardive (>7 jours et <3 mois), bien que le SGB reste fréquent, on observe également Listeria monocytogenes et E. coli — élargissement du spectre."},B:{v:true,t:"VRAI. Escherichia coli, en particulier la souche à capsule K1, est le second germe le plus fréquent des méningites néonatales précoces. Mécanisme : E. coli K1 a un tropisme particulier pour les méninges du nouveau-né du fait de la similitude de sa capsule polysaccharidique (acide N-acétylneuraminique) avec des antigènes de surface des cellules endothéliales cérébrales — ce mimétisme facilite l'adhésion et l'invasion. La contamination est materno-fœtale, par ascension de la flore vaginale colonisée par E. coli (souvent issu du tractus digestif). Antibiothérapie : céfotaxime + gentamicine ou amoxicilline + gentamicine selon les protocoles. Contre-exemple : chez un enfant plus grand (>3 mois), les entérobactéries comme E. coli sont rares dans les méningites communautaires sauf contexte particulier (immunodépression, brèche méningée, post-neurochirurgie)."},C:{v:false,t:"FAUX. Neisseria meningitidis est rare en période néonatale précoce. Le portage rhinopharyngé maternel n'est pas particulièrement contagieux pour le nouveau-né, et la barrière placentaire transmet des anticorps maternels protecteurs durant les premiers mois de vie. La méningite à méningocoque devient fréquente à partir de 6 mois (déclin des anticorps maternels) et culmine chez l'enfant et l'adolescent. Contre-exemple : à 8 mois d'âge, le méningocoque devient au contraire un des germes les plus fréquents — d'où la vaccination méningococcique C recommandée chez le nourrisson de 12 mois en France."},D:{v:false,t:"FAUX. Streptococcus pneumoniae est exceptionnel en période néonatale précoce. Comme pour le méningocoque, les anticorps maternels transmis par le placenta protègent le nouveau-né durant les premiers mois. Le pneumocoque devient pathogène chez le nourrisson de plus de 3 mois. La vaccination antipneumococcique conjuguée (13-valente) est recommandée dès 2 mois en France pour prévenir les infections invasives pneumococciques du nourrisson. Contre-exemple : à 18 mois, le pneumocoque devient le germe le plus fréquent des méningites bactériennes chez l'enfant non vacciné — d'où l'importance majeure du calendrier vaccinal pédiatrique."},E:{v:false,t:"FAUX. Staphylococcus aureus n'est pas un germe classique des méningites néonatales communautaires. Il peut être responsable de méningites néonatales dans des contextes particuliers : 1) Infection nosocomiale (cathéter veineux ombilical, dispositifs invasifs) ; 2) Brèche méningée traumatique post-procédurale ; 3) Sepsis cutané avec dissémination hématogène. Mais en tant que germe communautaire d'une méningite néonatale primaire, il est rare. Contre-exemple : dans une méningite post-neurochirurgicale (dérivation ventriculo-péritonéale, neurochirurgie), Staphylococcus aureus (et S. epidermidis) seraient les premiers germes à évoquer — antibiothérapie probabiliste par vancomycine + ceftazidime ou méropénème."}}
      },
      {
        id:"151-qi11",type:"QCU",
        stem:"Un patient de 34 ans est hospitalisé pendant 14 jours pour une méningite à pneumocoque traitée efficacement. À J14, l'évolution est favorable : apyrexie, régression du syndrome méningé, bilan normal. Il est asymptomatique et prêt à sortir. Quel examen doit être systématiquement réalisé avant la sortie selon les recommandations ?",
        choices:[{id:"A",text:"IRM cérébrale avec injection de gadolinium"},{id:"B",text:"Audiométrie"},{id:"C",text:"Électroencéphalogramme de veille"},{id:"D",text:"Bilan immunologique complet"},{id:"E",text:"Fond d'œil bilatéral"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. L'IRM cérébrale n'est pas systématique avant la sortie d'une méningite bactérienne d'évolution favorable sans signes neurologiques de complication. Elle serait indiquée en cas de fièvre persistante au-delà du 5e jour d'antibiothérapie adaptée, signes neurologiques résiduels ou nouveaux, suspicion d'abcès, empyème, thrombose veineuse cérébrale ou vascularite cérébrale post-infectieuse. Contre-exemple : un patient ayant présenté un signe focal transitoire à l'admission (hémiparésie régressive) bénéficierait d'une IRM systématique avant la sortie pour s'assurer de l'absence de complication anatomique (infarctus dans le territoire d'une artère cérébrale, vascularite post-infectieuse)."},B:{v:true,t:"VRAI. L'audiométrie est systématiquement réalisée avant la sortie d'hospitalisation après toute méningite bactérienne. Mécanisme : la surdité de perception est la complication séquellaire la plus fréquente (5 à 30% selon le germe : 5-15% pour méningocoque, 10-30% pour pneumocoque, 10-20% pour Listeria, plus fréquente chez l'enfant). Elle est due à l'invasion bactérienne du labyrinthe (canal cochléo-méningé) avec destruction des cellules ciliées de l'organe de Corti. Cette surdité peut être unilatérale ou bilatérale, partielle ou totale, parfois différée de plusieurs semaines après la guérison. La détection précoce est cruciale car une fenêtre thérapeutique étroite existe pour l'implantation cochléaire — l'ossification labyrinthique post-inflammatoire peut compliquer voire empêcher l'implant si délais > 6-12 mois. Chez l'enfant, la surdité non détectée a un impact catastrophique sur le développement du langage. Contre-exemple : après une méningite virale à entérovirus, l'audiométrie systématique n'est pas indiquée — les méningites virales ne causent pas de surdité séquellaire."},C:{v:false,t:"FAUX. L'EEG n'est pas systématique avant la sortie. Il est indiqué uniquement en cas de crises convulsives observées pendant l'hospitalisation, suspicion d'état de mal infraclinique avec confusion persistante, ou risque d'épilepsie séquellaire à dépister. Un patient sans crise convulsive d'évolution favorable n'en a pas besoin. Contre-exemple : si le patient avait présenté une crise tonico-clonique généralisée à J3 avec confusion post-critique prolongée, l'EEG aurait été indiqué pour rechercher un état de mal non convulsif persistant ou évaluer le risque d'épilepsie post-méningitique nécessitant un traitement antiépileptique prophylactique."},D:{v:false,t:"FAUX. Le bilan immunologique complet (dosage du complément CH50, C3, C4, immunoglobulines IgG/IgA/IgM, recherche d'asplénie) n'est pas systématique après un premier épisode de méningite bactérienne chez un adulte sans terrain particulier. Il est indiqué chez l'enfant (premier épisode justifie déjà la recherche d'asplénie et déficit du complément si pneumocoque), ou en cas de méningites récidivantes, méningites à germes encapsulés à répétition, ou tableau d'immunodéficience clinique. Contre-exemple : devant un deuxième épisode de méningite à pneumocoque chez le même patient, le bilan immunologique deviendrait obligatoire (CH50, dosage des immunoglobulines, recherche d'asplénie) — environ 30% de ces patients ont un déficit immunitaire identifiable."},E:{v:false,t:"FAUX. Le fond d'œil n'est pas un examen systématique de sortie. Il peut être utile à l'admission pour évaluer une HIC (œdème papillaire) ou en cas de symptômes ophtalmologiques (baisse d'acuité, troubles oculomoteurs persistants), mais n'apporte rien chez un patient asymptomatique avant la sortie. Contre-exemple : devant une méningite tuberculeuse avec atteinte des paires crâniennes, le fond d'œil serait répété systématiquement à la recherche de tubercules choroïdiens — pathognomoniques de la dissémination miliaire tuberculeuse."}}
      },
      {
        id:"151-qi12",type:"QRM",
        stem:"Un jeune homme de 22 ans est hospitalisé pour fièvre à 38,8°C, céphalées et raideur de nuque. La PL montre : LCS clair, leucocytes 360/mm³ (80% lymphocytes), protéinorachie 0,7 g/L, glycorachie 2,8 mmol/L pour une glycémie à 5,4 mmol/L. CRP 22 mg/L. Examen direct négatif. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Ce profil cytochimique est compatible avec une méningite d'origine virale"},{id:"B",text:"Une antibiothérapie probabiliste par C3G doit être débutée immédiatement"},{id:"C",text:"Le rapport glycorachie/glycémie à 0,52 n'oriente pas vers une méningite bactérienne"},{id:"D",text:"La prédominance lymphocytaire oriente vers une étiologie virale ou une méningite tuberculeuse"},{id:"E",text:"Une protéinorachie à 0,7 g/L est incompatible avec une méningite virale"}],
        correct:["A","C","D"],
        explanations:{A:{v:true,t:"VRAI. Ce profil cytochimique du LCS — clair, 360 leucocytes/mm³ avec 80% de lymphocytes, protéinorachie modérée 0.7 g/L, glycorachie normale 2.8 mmol/L (rapport 0.52) — est typique d'une méningite virale. Mécanisme : les virus (entérovirus, oreillons, HSV2 méningé, VZV, primo-infection VIH, etc.) déclenchent une réponse immunitaire lymphocytaire avec pléiocytose modérée (50-500 éléments/mm³), prédominance lymphocytaire (>50%), hyperprotéinorachie modérée (généralement <1 g/L) et normoglycorrachie (les virus ne consomment pas le glucose). Le LCS reste macroscopiquement clair. L'étiologie virale la plus fréquente est l'entérovirus (jusqu'à 80% des méningites virales en saison estivale). Contre-exemple : un LCS avec pléiocytose à 3000 leucocytes/mm³, 90% PN, hypoglycorrachie franche et hyperprotéinorachie à 3 g/L serait incompatible avec une étiologie virale — orientation bactérienne franche."},B:{v:false,t:"FAUX. L'antibiothérapie probabiliste par C3G n'est PAS indiquée devant ce profil typiquement viral. L'instaurer reviendrait à : 1) Sur-traiter inutilement avec exposition aux effets indésirables des C3G ; 2) Contribuer à la sélection de résistances bactériennes ; 3) Coût injustifié. Le traitement de la méningite virale est symptomatique : antalgiques (paracétamol +/- anti-inflammatoires si pas de CI), antiémétiques, hydratation, surveillance. La PL est généralement curative (effet décompressif). Si le tableau clinique inclut des éléments d'encéphalite (crise convulsive, confusion, signes de focalisation), l'aciclovir doit être ajouté en attendant la PCR HSV. Contre-exemple : si le LCS avait été à 800 leucocytes/mm³ avec 60% PN, glycorachie 1.5 mmol/L et protéinorachie 1.8 g/L, l'antibiothérapie probabiliste par C3G aurait été indiquée — profil mixte ou plutôt bactérien."},C:{v:true,t:"VRAI. Le rapport glycorachie/glycémie à 0.52 (2.8/5.4) n'oriente pas vers une étiologie bactérienne. Mécanisme : le seuil discriminant est 0.4 — en dessous on évoque une étiologie bactérienne ou tuberculeuse (consommation de glucose par les bactéries et les polynucléaires neutrophiles), au-dessus on est dans le territoire viral ou normal. À 0.52, la glycorachie est conservée — argument fort contre l'origine bactérienne. La normoglycorrachie associée à la prédominance lymphocytaire et à l'aspect clair du LCS rend le diagnostic de méningite virale extrêmement probable. Contre-exemple : si le rapport avait été à 0.30 avec lymphocytose, on aurait évoqué une méningite tuberculeuse, une méningite à Listeria décapitée ou une méningite à champignon (cryptocoque) — l'hypoglycorrachie persiste dans ces étiologies à liquide clair."},D:{v:true,t:"VRAI. La prédominance lymphocytaire (>50%) oriente principalement vers une étiologie virale, mais également tuberculeuse (caractéristique des méningites à liquide clair à pléiocytose lymphocytaire), listériose décapitée par antibiothérapie préalable, neuroborréliose, ou méningite cryptococcique. Le contexte clinique et les autres paramètres (glycorachie, protéinorachie, lactatorachie) aident à différencier. Mécanisme : les virus induisent une réponse immunitaire à médiation cellulaire lymphocytaire ; la tuberculose induit une réaction granulomateuse lymphocytaire ; la cryptococcose chez l'immunodéprimé entraîne une réponse cellulaire lente. Contre-exemple : si la pléiocytose lymphocytaire avait été associée à une hypoglycorrachie franche (<0.4) chez un patient VIH+ avec CD4 < 100, l'orientation aurait été en faveur d'une cryptococcose ou tuberculose neuroméningée — bien plus que viral."},E:{v:false,t:"FAUX. Une protéinorachie à 0.7 g/L (modérée) est tout à fait compatible avec une méningite virale. Mécanisme : les méningites virales s'accompagnent généralement d'une hyperprotéinorachie modérée (<1 g/L), liée à l'augmentation de la perméabilité de la BHM par l'inflammation. Ce n'est qu'au-delà de 1.5 g/L (et a fortiori 2-3 g/L) que la protéinorachie devient suspecte d'étiologie bactérienne, tuberculeuse ou décapitée. À 0.7 g/L, on reste dans le spectre habituel des méningites virales. Contre-exemple : si la protéinorachie avait été à 4 g/L avec aspect xanthochromique du LCS, on aurait évoqué une méningite à liquide clair de type tuberculeux (hyperprotéinorachie majeure) ou un blocage spinal (syndrome de Froin) — toujours pas viral."}}
      },
      {
        id:"151-qi13",type:"QRM",
        stem:"Un homme de 72 ans, sous prednisone 20 mg/j pour une vascularite, est hospitalisé pour syndrome méningé fébrile. La PL retrouve un LCS trouble. L'examen direct est négatif. Quelles sont les 3 molécules de l'antibiothérapie probabiliste que vous prescrivez ? (trois réponses attendues)",
        choices:[{id:"A",text:"Céfotaxime ou ceftriaxone IV à forte dose"},{id:"B",text:"Amoxicilline IV à forte dose"},{id:"C",text:"Gentamicine IV"},{id:"D",text:"Vancomycine IV"},{id:"E",text:"Métronidazole IV"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. Une C3G injectable (céfotaxime 200-300 mg/kg/j ou ceftriaxone 2g x2/j) est la base de l'antibiothérapie probabiliste de toute méningite bactérienne présumée. Mécanisme : la C3G couvre les principaux germes communautaires (pneumocoque, méningocoque, Haemophilus, entérobactéries) avec une excellente diffusion méningée et une bactéricidie rapide. Elle est l'antibiotique de référence depuis 30 ans, validée par toutes les recommandations françaises et internationales. Contre-exemple : si le patient avait été allergique sévère à toutes les bêta-lactamines (anaphylaxie documentée), on aurait recouru au méropénème (qui partage une faible réactivité croisée avec les pénicillines) ou à la combinaison vancomycine + ciprofloxacine + amoxicilline IV — option dégradée mais nécessaire."},B:{v:true,t:"VRAI. L'amoxicilline IV à forte dose (200 mg/kg/j en perfusion continue ou 4-6 administrations) est INDISPENSABLE devant tout terrain immunodéprimé pour couvrir Listeria monocytogenes. Mécanisme : Listeria est intrinsèquement résistante à toutes les céphalosporines (résistance naturelle par défaut d'affinité de PLP3), c'est-à-dire qu'aucune C3G ne couvre Listeria. Or chez l'immunodéprimé (corticothérapie >10 mg/j d'équivalent prednisone, MTX, anti-TNF, transplanté, VIH avec CD4 bas, sujet >50 ans), Listeria est une étiologie à couvrir systématiquement en probabiliste. L'amoxicilline atteint des concentrations méningées suffisantes à forte dose et a une excellente activité sur Listeria. Contre-exemple : chez un patient jeune (25 ans) immunocompétent sans aucun facteur de risque Listeria, l'amoxicilline en probabiliste ne serait pas indiquée — la C3G suffirait."},C:{v:true,t:"VRAI. La gentamicine IV (3-5 mg/kg/j en une administration quotidienne) est associée à l'amoxicilline pour son effet synergique bactéricide sur Listeria. Mécanisme : la gentamicine seule a une activité bactériostatique limitée sur Listeria (la bactérie est intracellulaire et la gentamicine pénètre mal les macrophages), mais l'association amoxicilline + gentamicine permet une bactéricidie rapide via la synergie classique des bêta-lactamines avec les aminosides. La durée d'association est limitée aux 7-14 premiers jours pour limiter la néphrotoxicité et ototoxicité. Contre-exemple : si le terrain n'avait pas été immunodéprimé, la gentamicine n'aurait pas été nécessaire — la C3G seule (sans amoxicilline ni gentamicine) suffirait pour couvrir le pneumocoque et le méningocoque."},D:{v:false,t:"FAUX. La vancomycine n'est pas indiquée en probabiliste standard pour une méningite bactérienne communautaire. Mécanisme : elle est réservée aux situations spécifiques : 1) Pneumocoque de haut niveau de résistance aux C3G (CMI ceftriaxone > 0.5 mg/L, situation exceptionnelle en France < 1% des souches) ; 2) Suspicion de méningite à staphylocoque doré méticillino-résistant (MRSA) en contexte post-neurochirurgical ou nosocomial ; 3) Allergie sévère aux bêta-lactamines (alternative dégradée). Dans la méningite communautaire chez l'immunodéprimé, la vancomycine n'apporte rien par rapport à l'association C3G + amoxicilline + gentamicine. Contre-exemple : dans une méningite post-neurochirurgicale (drainage ventriculo-péritonéal infecté), la vancomycine serait au contraire indispensable en probabiliste pour couvrir le staphylocoque coagulase négative et MRSA."},E:{v:false,t:"FAUX. Le métronidazole couvre les anaérobies (Bacteroides, Fusobacterium, Peptostreptococcus, Clostridium) mais n'a pas d'indication dans la méningite bactérienne communautaire. Mécanisme : les méningites communautaires sont essentiellement dues à des germes aérobies (pneumocoque, méningocoque, Haemophilus, Listeria, entérobactéries). Les anaérobies ne sont impliqués que dans des situations spécifiques : abcès cérébraux d'origine ORL/dentaire, sinusites compliquées avec extension intracrânienne, post-traumatisme crânien avec brèche. Contre-exemple : devant un abcès cérébral d'origine dentaire chez ce même patient, l'antibiothérapie probabiliste aurait inclus ceftriaxone + métronidazole pour couvrir les streptocoques oraux et les anaérobies de la flore buccale."}}
      },
      {
        id:"151-qi14",type:"QCU",
        stem:"Un homme de 28 ans est hospitalisé en service de maladies infectieuses pour méningite à Neisseria meningitidis sérogroupe B confirmée par hémocultures et culture du LCS. Il a reçu une première injection de ceftriaxone 2 g IV à l'admission, poursuivie à raison de 2 g toutes les 12 heures. À H+24 de la première injection, l'évolution clinique est favorable : apyrexie obtenue, régression du syndrome méningé, hémodynamique stable. Les précautions complémentaires respiratoires de type gouttelettes ont été instaurées dès l'admission. Concernant la levée de ces précautions, quelle proposition est exacte ?",
        choices:[{id:"A",text:"Les précautions sont maintenues jusqu'à la guérison clinique complète, soit en pratique 7 à 10 jours d'antibiothérapie"},{id:"B",text:"Les précautions peuvent être levées dès H+24 de l'antibiothérapie efficace"},{id:"C",text:"Les précautions sont automatiquement levées dès l'instauration de l'antibiothérapie efficace, sans délai supplémentaire"},{id:"D",text:"Les précautions doivent être renforcées en précautions aériennes (masque FFP2, chambre en pression négative) jusqu'à la guérison"},{id:"E",text:"Les précautions sont levées 48 heures après l'obtention de l'apyrexie"}],
        correct:["B"],
        explanations:{A:{v:false,t:"FAUX. Le critère de levée des précautions gouttelettes n'est pas la guérison clinique mais la durée d'antibiothérapie efficace. Une C3G injectable à dose méningée éradique le portage nasopharyngé de Neisseria meningitidis en moins de 24 heures par sa concentration tissulaire élevée. Au-delà de cette fenêtre, le patient n'est plus contagieux par voie aérienne — même s'il reste fébrile, douloureux ou symptomatique. Maintenir l'isolement 7 à 10 jours serait une utilisation inappropriée des chambres d'isolement et alourdirait inutilement la prise en charge soignante. Contre-exemple : si la question avait porté sur l'isolement d'un patient atteint de tuberculose pulmonaire bacillifère, la réponse aurait été vraie — les précautions aériennes y sont maintenues jusqu'à négativation des examens microbiologiques, soit en pratique 15 jours minimum d'antituberculeux efficaces."},B:{v:true,t:"VRAI. Les précautions complémentaires respiratoires de type gouttelettes peuvent être levées après 24 heures d'antibiothérapie efficace par C3G injectable (ceftriaxone ou céfotaxime à dose méningée). Mécanisme : la ceftriaxone diffuse rapidement dans les sécrétions rhinopharyngées et éradique Neisseria meningitidis du portage nasopharyngé en moins de 24 heures. Au-delà, la transmission interhumaine par gouttelettes oro-nasopharyngées de plus de 5 μm devient impossible — le patient n'est plus à risque contagieux pour son entourage soignant ou familial. Point important souvent oublié : avant la sortie d'hospitalisation, le patient doit recevoir une dose d'antibiotique éradiquant le portage rhinopharyngé (rifampicine ou ceftriaxone IM monodose) car la C3G IV en traitement méningé ne garantit pas toujours une éradication complète à long terme du portage rhinopharyngé asymptomatique. Contre-exemple : si la question avait porté sur la levée des précautions chez un patient traité par amoxicilline seule, la réponse aurait été plus nuancée — l'amoxicilline n'éradique pas systématiquement le portage rhinopharyngé, et une fenêtre plus longue ou une éradication active par rifampicine serait préférable avant la levée."},C:{v:false,t:"FAUX. L'instauration de l'antibiothérapie ne dispense pas des précautions gouttelettes pendant les premières 24 heures. Le piège est subtil : ce n'est pas la prescription qui compte, mais la durée écoulée depuis l'injection efficace. Pendant les premières heures qui suivent la première dose, le portage nasopharyngé reste actif et le patient demeure contagieux. Lever les précautions immédiatement exposerait les soignants, les visiteurs et les autres patients hospitalisés à un risque résiduel de transmission par gouttelettes — particulièrement préoccupant chez les personnes immunodéprimées ou les nourrissons éventuellement présents dans le service. Contre-exemple : si la question avait été formulée 'les précautions peuvent être levées 24 heures après l'instauration d'une antibiothérapie efficace', elle aurait été vraie. La nuance entre 'à l'instauration' (immédiatement) et '24 heures après l'instauration' (délai de 24h) est exactement ce que teste le jury — vigilance absolue sur la temporalité dans les questions de précautions complémentaires."},D:{v:false,t:"FAUX. Les précautions aériennes (chambre individuelle en pression négative, masque FFP2 pour tout entrant) sont réservées aux infections à transmission aéroportée sur particules fines de moins de 5 μm en suspension dans l'air, c'est-à-dire : tuberculose pulmonaire bacillifère, rougeole, varicelle, zona disséminé ou ophtalmique, certaines fièvres hémorragiques virales, et en contexte épidémique le SARS-CoV-2 ou le SRAS lors d'aérosolisation. Neisseria meningitidis se transmet exclusivement par gouttelettes respiratoires de plus de 5 μm qui sédimentent à moins d'un mètre du patient — un masque chirurgical à distance suffit. Renforcer en précautions aériennes constituerait un sur-isolement disproportionné et inutile, mobilisant des ressources critiques (chambres en pression négative limitées) au détriment de patients qui en ont réellement besoin. Contre-exemple : si le patient avait développé concomitamment une pneumonie tuberculeuse bacillifère, les précautions aériennes (FFP2 + pression négative) auraient été indiquées pendant 15 jours minimum, indépendamment de la prise en charge du méningocoque."},E:{v:false,t:"FAUX. L'apyrexie n'est pas un critère décisionnel pour la levée des précautions gouttelettes dans la méningite à méningocoque. Le critère unique est la durée d'antibiothérapie efficace (24 heures). Mécanisme : la fièvre traduit la réponse inflammatoire systémique de l'hôte à l'infection, pas l'activité bactérienne dans le rhinopharynx. Un patient peut rester fébrile pendant 48-72 heures malgré une éradication efficace du portage (réponse inflammatoire prolongée) — il n'est plus contagieux pour autant. Inversement, un patient en apyrexie précoce après antipyrétiques pourrait théoriquement rester contagieux si l'ATB n'a pas encore eu le temps d'agir sur le portage rhinopharyngé. Contre-exemple : si la question avait porté sur la sortie d'hospitalisation, la résolution clinique complète (apyrexie stable, absence de syndrome méningé, syndrome inflammatoire en régression) serait évidemment requise — mais ces critères concernent l'évolution de la maladie, pas la transmissibilité de la bactérie qui est éradiquée bien avant la guérison clinique complète."}}
      },
      {
        id:"151-qi15",type:"QRM",
        stem:"Une femme de 46 ans est hospitalisée pour fièvre à 38,4°C, céphalées, confusion progressive et une crise convulsive partielle temporale survenue à domicile. L'examen retrouve des hallucinations olfactives, des troubles de la mémoire récente et un syndrome frontal. La PL montre : LCS clair, lymphocytes 240/mm³, protéinorachie 0,8 g/L, glycorachie normale. Concernant l'imagerie cérébrale indiquée dans cette situation, laquelle ou lesquelles des propositions est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"L'IRM cérébrale est l'examen de référence devant ce tableau d'encéphalite"},{id:"B",text:"L'IRM retrouvera un hypersignal T2-FLAIR des régions temporales internes, insulaires et du gyrus cingulaire"},{id:"C",text:"Le scanner cérébral sans injection est l'examen de première intention devant une suspicion d'encéphalite herpétique"},{id:"D",text:"L'IRM doit être réalisée avant de débuter l'aciclovir afin de guider la décision thérapeutique"},{id:"E",text:"Un scanner cérébral normal exclut formellement une encéphalite herpétique"}],
        correct:["A","B"],
        explanations:{A:{v:true,t:"VRAI. L'IRM cérébrale est l'examen de référence pour le diagnostic d'encéphalite herpétique. Mécanisme : 1) Détection précoce des anomalies (dès J1-J2 alors que le scanner est souvent normal) ; 2) Hypersignal T2-FLAIR caractéristique des régions temporales internes, insulaires et du gyrus cingulaire ; 3) Restriction de diffusion (DWI) en phase aiguë par œdème cytotoxique ; 4) Détection des hémorragies pétéchiales corticales (gradient écho, susceptibilité magnétique) ; 5) Différenciation avec d'autres encéphalites (autoimmune, paranéoplasique, métaboliques). L'IRM est aussi utile au suivi évolutif et au pronostic (étendue des lésions séquellaires). Toutefois — règle d'or — l'IRM ne doit JAMAIS retarder l'aciclovir IV qui est débuté immédiatement à la suspicion clinique. Contre-exemple : pour le diagnostic d'une méningite virale simple sans encéphalite associée (LCS clair, lymphocytaire, normoglycorrachique, sans signes neurologiques focaux), l'IRM serait totalement inutile — le diagnostic est porté par la PL et l'évolution clinique."},B:{v:true,t:"VRAI. L'IRM retrouve typiquement un hypersignal T2-FLAIR des régions temporales internes (hippocampe, amygdale, gyrus parahippocampique), du cortex insulaire et du gyrus cingulaire, avec atteinte fréquemment bilatérale mais asymétrique. Mécanisme : HSV1 a un tropisme particulier pour le système limbique et le cortex orbito-frontal/insulaire par migration axonale rétrograde depuis le ganglion trigéminé où le virus fait une latence chronique. L'inflammation focale entraîne œdème vasogénique et cytotoxique, hémorragies pétéchiales corticales (signature pathognomonique en gradient écho), parfois nécrose hémorragique parenchymateuse. Cette topographie est si caractéristique qu'elle est quasi pathognomonique chez l'adulte. Contre-exemple : si l'IRM avait montré un hypersignal T2 bilatéral et symétrique des noyaux gris centraux et du thalamus, on aurait évoqué une encéphalite à Flavivirus (West Nile, Japonais, à tique) ou une encéphalite autoimmune (anti-NMDAR) — orientation diagnostique radicalement différente."},C:{v:false,t:"FAUX. Le scanner cérébral n'est pas l'examen de référence pour l'encéphalite herpétique. Mécanisme : 1) Sensibilité faible en phase précoce (souvent normal dans les premières 48h) — il peut donc faussement rassurer ; 2) Mauvaise visualisation des structures temporales internes profondes ; 3) Pas de séquence de diffusion pour détecter les anomalies cytotoxiques précoces ; 4) Ne détecte pas les petites hémorragies pétéchiales. Il garde un intérêt en première intention pour son accessibilité et la détection des effets de masse ou complications hémorragiques majeures, mais l'IRM est nettement supérieure et doit être réalisée dès que possible. Contre-exemple : pour le suivi d'un patient encéphalite herpétique stabilisé à 1 mois de traitement, le scanner peut suffire pour vérifier l'absence de complication évolutive (hémorragie tardive, hydrocéphalie), l'IRM restant l'examen de référence pour évaluer les séquelles."},D:{v:false,t:"FAUX. C'est exactement le piège fondamental. L'IRM ne doit JAMAIS retarder le début de l'aciclovir IV. Mécanisme : à la suspicion clinique d'encéphalite herpétique (fièvre + syndrome confusionnel + crises convulsives partielles temporales + hallucinations olfactives + LCS lymphocytaire à liquide clair), l'aciclovir IV (15 mg/kg/8h) est administré IMMÉDIATEMENT — la mortalité de l'encéphalite herpétique non traitée est de 70%, et même avec aciclovir précoce elle est de 20-30% avec souvent des séquelles cognitives majeures. Chaque heure perdue augmente le risque. L'IRM est faite après l'instauration de l'aciclovir, en parallèle de la prise en charge thérapeutique. Contre-exemple : pour un AVC ischémique de moins de 4h30, l'IRM serait au contraire indispensable AVANT thrombolyse — pour confirmer l'ischémie et éliminer l'hémorragie, la décision thérapeutique étant strictement conditionnée par l'imagerie."},E:{v:false,t:"FAUX. Un scanner cérébral normal n'exclut JAMAIS une encéphalite herpétique. Mécanisme : dans les 48 premières heures, le scanner peut être strictement normal alors que l'IRM avec séquence FLAIR et diffusion montre déjà les anomalies temporales typiques. Croire qu'un scanner rassurant permet d'arrêter l'aciclovir constitue une faute majeure. La règle est : suspicion clinique = aciclovir + PCR HSV LCS, IRM pour confirmer et préciser, scanner inutile dans cette décision. Contre-exemple : pour le diagnostic d'une encéphalopathie hépatique chez un cirrhotique avec confusion fébrile, un scanner normal sans anomalie inflammatoire serait au contraire un argument supplémentaire en faveur du diagnostic métabolique (associé à hyperammoniémie, signes cliniques d'IHC)."}}
      },
      {
        id:"151-qi16",type:"QRM",
        stem:"Un homme de 38 ans, originaire du Mali, est hospitalisé pour altération de l'état général progressive depuis 3 semaines, fièvre modérée à 38,2°C et céphalées. Il est séropositif pour le VIH avec CD4 à 65/mm³ non traité. La PL retrouve : leucocytes 140/mm³ (90% lymphocytes), protéinorachie 1,1 g/L, glycorachie 1,9 mmol/L/glycémie 5,8 mmol/L, lactatorachie 3,5 mmol/L. Parmi les propositions suivantes, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le profil cytochimique du LCS est compatible avec une méningite tuberculeuse"},{id:"B",text:"Une méningite cryptococcique doit être évoquée dans ce contexte"},{id:"C",text:"Une PCR Mycobacterium tuberculosis dans le LCS doit être demandée"},{id:"D",text:"La corticothérapie est systématiquement contre-indiquée dans la méningite tuberculeuse"},{id:"E",text:"Un traitement probabiliste par quadrithérapie antituberculeuse doit être débuté immédiatement avant tout résultat"}],
        correct:["A","B","C"],
        explanations:{A:{v:true,t:"VRAI. Le profil du LCS — pléiocytose à 140/mm³ à 90% lymphocytes, hyperprotéinorachie 1.1 g/L, hypoglycorrachie (rapport 0.33 < 0.4), hyperlactatorachie 3.5 mmol/L — est compatible avec une méningite tuberculeuse. Mécanisme : Mycobacterium tuberculosis dans les méninges induit une réaction granulomateuse à médiation cellulaire lymphocytaire avec exsudat épais riche en protéines (xanthochromie possible), consommation modérée de glucose par les granulomes et les lymphocytes activés. Le tableau évolue lentement sur 2-4 semaines, contrairement à l'agressivité aiguë du pneumocoque. L'imagerie cérébrale peut montrer des prises de contraste basales (granulomes), une hydrocéphalie (par adhérences méningées), des infarctus secondaires à une vascularite tuberculeuse. Diagnostic : recherche directe BAAR (Ziehl) et culture mycobactéries (longue, 4-8 semaines), PCR M. tuberculosis (réponse rapide en quelques heures, sensibilité 60-90% selon la charge bactérienne). Contre-exemple : si le LCS avait été à 5000 leucocytes/mm³ avec 90% PN, hypoglycorrachie franche et hyperprotéinorachie majeure à 4 g/L, on aurait été dans une méningite bactérienne aiguë — pas tuberculeuse."},B:{v:true,t:"VRAI. La méningite cryptococcique doit être évoquée systématiquement chez tout patient VIH+ avec CD4 < 100/mm³ présentant un tableau de méningite à liquide clair. Mécanisme : Cryptococcus neoformans est une levure encapsulée environnementale (présente dans les fientes de pigeons et certains sols) qui devient pathogène uniquement chez les immunodéprimés profonds. Elle entre par voie respiratoire et dissémine ensuite aux méninges. Tableau clinique : céphalées progressives, fièvre modérée, parfois confusion, sans syndrome méningé franc. LCS : pléiocytose lymphocytaire modérée (10-300/mm³), hyperprotéinorachie, hypoglycorrachie, mise en évidence des levures par coloration à l'encre de Chine (montre la capsule comme un halo), antigène cryptococcique dans le LCS et le sérum (test rapide diagnostique de référence). Traitement : amphotéricine B liposomale + flucytosine, puis fluconazole en relais. Contre-exemple : chez un patient immunocompétent avec CD4 normaux, la cryptococcose neuroméningée est exceptionnelle — exclure d'autres étiologies de méningite à liquide clair en première intention."},C:{v:true,t:"VRAI. La PCR Mycobacterium tuberculosis dans le LCS doit être demandée systématiquement devant ce profil. Mécanisme : la PCR (technique GeneXpert MTB/Rif ou similaires) détecte le génome de M. tuberculosis avec une sensibilité de 60-90% et une spécificité proche de 100%. Elle est rapide (résultats en 2-4 heures) contrairement à la culture qui prend 4-8 semaines. Avantage majeur : détecte également la résistance à la rifampicine (mutation du gène rpoB) par GeneXpert, ce qui oriente vers une tuberculose multirésistante (TB-MR) si présente. Contre-exemple : pour le diagnostic d'une méningite cryptococcique, on demanderait à la place l'antigène cryptococcique (sang et LCS), l'encre de Chine sur LCS et la culture mycologique — chaque agent pathogène a son outil diagnostique propre."},D:{v:false,t:"FAUX. C'est EXACTEMENT L'INVERSE. La corticothérapie (dexaméthasone) est RECOMMANDÉE dans la méningite tuberculeuse avec atteinte cérébrale (stade II ou III selon British Medical Research Council), pas contre-indiquée. Mécanisme : la dexaméthasone réduit la réaction inflammatoire méningée granulomateuse qui aggrave l'œdème cérébral, l'HIC et les complications vasculitaires (infarctus cérébraux). Les études randomisées ont démontré une réduction de mortalité et de séquelles neurologiques sévères avec adjonction de dexaméthasone aux antituberculeux. Posologie : 0.4 mg/kg/j IV décroissant sur 6-8 semaines. Contre-exemple : dans une méningite cryptococcique du VIH, la dexaméthasone est au contraire péjorative (augmentation de la mortalité dans certains essais) — la corticothérapie n'est utile QUE dans la tuberculose et certaines méningites bactériennes (pneumocoque), pas dans toutes les méningites infectieuses."},E:{v:false,t:"FAUX. Débuter immédiatement une quadrithérapie antituberculeuse sans aucun résultat est une stratégie inappropriée pour deux raisons : 1) La méningite cryptococcique (très probable ici aussi) nécessite un traitement totalement différent (amphotéricine + flucytosine) et le retard à son traitement est péjoratif ; 2) Les antituberculeux ne sont pas dénués d'effets indésirables (hépatotoxicité, troubles digestifs, polynévrite). La stratégie correcte est : prélèvements LCS et sang complets (recherche BAAR, PCR M. tuberculosis, antigène cryptococcique, encre de Chine, cultures), bilan radiologique (IRM cérébrale, scanner thoracique), puis traitement adapté selon orientation diagnostique. Contre-exemple : devant une méningite à pneumocoque suspectée cliniquement (LCS trouble, syndrome méningé brutal), l'antibiothérapie probabiliste par C3G est débutée IMMÉDIATEMENT sans attendre — l'urgence vitale ne tolère pas le délai d'attente des résultats microbiologiques."}}
      },
      {
        id:"151-qi17",type:"QRM",
        stem:"Un étudiant de 20 ans, non vacciné contre le méningocoque, est hospitalisé pour fièvre à 40,2°C d'installation brutale, céphalées intenses, vomissements et raideur de nuque. À l'examen, un purpura pétéchial des membres inférieurs est présent. Parmi les propositions suivantes concernant les caractéristiques de la méningite à méningocoque, laquelle ou lesquelles est ou sont exacte ou exactes ?",
        choices:[{id:"A",text:"Le méningocoque est un diplocoque à Gram négatif encapsulé"},{id:"B",text:"L'homme est le seul réservoir du méningocoque"},{id:"C",text:"Des signes de localisation neurologique focaux sont fréquents dans la méningite à méningocoque"},{id:"D",text:"Le début clinique est typiquement brutal avec syndrome septicémique associé au syndrome méningé"},{id:"E",text:"La méningite à méningocoque survient préférentiellement chez le sujet jeune non immunisé"}],
        correct:["A","B","D","E"],
        explanations:{A:{v:true,t:"VRAI. Neisseria meningitidis est un diplocoque à Gram négatif encapsulé. Mécanisme morphologique : à l'examen direct du LCS, il apparaît sous forme de cocci en grains de café accolés deux à deux, à coloration rose au Gram (négatif). La capsule polysaccharidique est le déterminant antigénique majeur définissant le sérogroupe (A, B, C, X, Y, W-135 essentiellement) — c'est cette capsule qui constitue la cible des vaccins méningococciques (vaccins conjugués pour A/C/Y/W et vaccin protéique multicomposant pour le B, qui cible des protéines de surface car la capsule B est faiblement immunogène par similitude avec l'acide polysialique humain). Contre-exemple : Streptococcus pneumoniae est un diplocoque à Gram POSITIF en chaînettes courtes — distinction morphologique fondamentale au direct qui oriente immédiatement l'antibiothérapie."},B:{v:true,t:"VRAI. L'homme est le seul réservoir naturel connu de Neisseria meningitidis. Mécanisme : la bactérie colonise asymptomatiquement le rhinopharynx de 5 à 30% des sujets sains (portage asymptomatique), avec des pics chez les adolescents et jeunes adultes. La transmission est strictement interhumaine par voie aérienne (gouttelettes oro-nasopharyngées). Cette caractéristique épidémiologique explique : 1) Les épidémies en collectivité (étudiants, casernes, pèlerinages) ; 2) L'importance de l'antibioprophylaxie des contacts (rifampicine, ciprofloxacine, ceftriaxone IM) pour éradiquer le portage rhinopharyngé ; 3) L'absence de mesures vétérinaires ou environnementales (par opposition aux zoonoses ou aux infections d'origine alimentaire). Contre-exemple : Listeria monocytogenes a au contraire un réservoir environnemental (sol, eau, animaux d'élevage) et la transmission est essentiellement alimentaire — d'où des stratégies de prévention totalement différentes (mesures alimentaires, surveillance vétérinaire, contrôle des chaînes de production agroalimentaire)."},C:{v:false,t:"FAUX. Les signes de localisation neurologique focaux sont au contraire RARES dans la méningite à méningocoque (sauf complication tardive comme une thrombose veineuse cérébrale). Ils sont FRÉQUENTS dans la méningite à pneumocoque (Streptococcus pneumoniae) — atteinte des paires crâniennes (III, IV, VI, VII, VIII), déficit moteur, crises convulsives focales. C'est un point distinctif majeur que le jury teste régulièrement. Le tableau de la méningite à méningocoque est plutôt celui d'une méningite pure avec syndrome méningé franc + syndrome septicémique, avec ou sans purpura, sans signe de localisation. Contre-exemple : si le patient avait présenté une paralysie du VI gauche (diplopie horizontale) associée au syndrome méningé fébrile, on aurait évoqué en priorité une méningite à pneumocoque ou une méningite à Listeria avec rhombencéphalite — pas méningocoque."},D:{v:true,t:"VRAI. Le début clinique de la méningite à méningocoque est typiquement BRUTAL en quelques heures, avec un syndrome septicémique très bruyant (fièvre élevée à 40°C, frissons solennels, altération franche de l'état général, vomissements en jet) associé au syndrome méningé. Mécanisme : la rapidité d'évolution est liée à la virulence de la bactérie qui se multiplie rapidement dans le sang (méningococcémie) avant ou en même temps que la dissémination méningée. Cette présentation explosive contraste avec : 1) Le début progressif de la méningite à Listeria (4-7 jours) ; 2) Le début généralement subaigu (1-3 jours) de la méningite à pneumocoque ; 3) Le début insidieux (1-4 semaines) de la méningite tuberculeuse ; 4) Le début sur quelques jours des méningites virales. Contre-exemple : un patient présentant une fièvre modérée évoluant depuis 5 jours avec apparition progressive de céphalées orienterait plutôt vers une méningite à Listeria ou tuberculeuse — pas méningocoque."},E:{v:true,t:"VRAI. La méningite à méningocoque survient préférentiellement chez les sujets jeunes (adolescents, jeunes adultes 15-25 ans, nourrissons de 6-24 mois) non immunisés (absence de vaccination antérieure du sérogroupe en cause, absence d'immunité naturelle acquise par portage antérieur). Mécanisme : 1) Les sujets jeunes en collectivité (étudiants, casernes, internats) sont des cibles préférentielles par densité de contacts intimes et portage rhinopharyngé fréquent ; 2) Chez le nourrisson, le déclin des anticorps maternels transmis par voie transplacentaire vers 6-12 mois crée une fenêtre de vulnérabilité ; 3) Les adultes plus âgés sont généralement protégés par des anticorps acquis par portage antérieur asymptomatique. Les déficits immunitaires en complément terminal (C5-C9) prédisposent spécifiquement aux infections récidivantes à méningocoque. Contre-exemple : la méningite à Listeria touche au contraire préférentiellement les sujets âgés (>50 ans), les immunodéprimés et les femmes enceintes — population totalement différente, avec un mécanisme et une prise en charge antibiotique distincts."}}
      },
      {
        id:"151-qi18",type:"QRM",
        stem:"Un patient de 28 ans a été hospitalisé 3 mois auparavant pour une méningite à pneumocoque traitée efficacement. Il revient en consultation de suivi neurologique. Parmi les complications suivantes, lesquelles peuvent survenir dans les suites d'une méningite bactérienne ?",
        choices:[{id:"A",text:"Surdité de perception irréversible"},{id:"B",text:"Hydrocéphalie communicante ou obstructive"},{id:"C",text:"Épilepsie séquellaire"},{id:"D",text:"Troubles cognitifs et des apprentissages"},{id:"E",text:"Sclérose en plaques secondaire à l'inflammation méningée"}],
        correct:["A","B","C","D"],
        explanations:{A:{v:true,t:"VRAI. La surdité de perception irréversible est la complication séquellaire la plus fréquente des méningites bactériennes : 5-15% pour le méningocoque, 10-30% pour le pneumocoque, 10-20% pour Listeria. Mécanisme : l'invasion bactérienne du labyrinthe par voie du canal cochléo-méningé entraîne une labyrinthite avec destruction des cellules ciliées de l'organe de Corti. Cette atteinte est généralement bilatérale et irréversible (les cellules ciliées ne se régénèrent pas chez l'humain). Elle peut apparaître précocement ou être différée de plusieurs semaines. C'est pour cela que l'audiométrie systématique avant la sortie est cruciale — détection précoce, fenêtre thérapeutique étroite pour l'implant cochléaire (l'ossification labyrinthique post-inflammatoire complique le geste si délai > 6-12 mois). Contre-exemple : la surdité de transmission (atteinte de l'oreille moyenne) n'est pas une complication classique des méningites — elle relève d'autres pathologies (otites moyennes chroniques, otospongiose, traumatismes ossiculaires)."},B:{v:true,t:"VRAI. L'hydrocéphalie peut compliquer une méningite bactérienne par deux mécanismes : 1) Hydrocéphalie communicante par obstruction inflammatoire des villosités arachnoïdiennes (résorption du LCS perturbée) — la plus fréquente ; 2) Hydrocéphalie obstructive par adhérences arachnoïdiennes basales bloquant les voies de circulation du LCS (4e ventricule, trous de Magendie/Luschka, aqueduc de Sylvius). L'hydrocéphalie peut être aiguë (décompensation par HIC majeure nécessitant dérivation en urgence) ou subaiguë/chronique (céphalées progressives, troubles de la marche, troubles cognitifs sphincter — triade de Hakim et Adams). Diagnostic par IRM montrant une dilatation ventriculaire. Traitement : ponctions évacuatrices répétées, dérivation ventriculaire externe en aigu, dérivation ventriculo-péritonéale en définitive. Contre-exemple : une méningite virale d'évolution simple ne donne quasiment jamais d'h
